name: Confirm public access candidates
on:
  push:
    branches: [diagnostics/access-options-20260914]
    paths: [diagnostics/confirm_access.py, .github/workflows/access-confirm.yml]
permissions:
  contents: read
jobs:
  confirm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            sample: win1
          - os: windows-2025
            sample: win2
          - os: ubuntu-24.04
            sample: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - shell: bash
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 playwright==1.57.0
      - shell: bash
        run: python -m py_compile diagnostics/confirm_access.py
      - shell: bash
        run: python -m playwright install --with-deps chromium
      - shell: bash
        run: python diagnostics/confirm_access.py
      - if: runner.os == 'Linux'
        shell: bash
        run: python diagnostics/tls_trust_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: access-confirm-${{ matrix.sample }}-${{ github.run_id }}
          path: |
            confirm-output/
            trust-output/
            diagnostics/confirm_access.py
          retention-days: 7
          if-no-files-found: warn
