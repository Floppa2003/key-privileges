name: Review public Selection catalogues
on:
  push:
    branches: [loyalty/selection-catalog]
    paths: [loyalty/**, .github/workflows/selection-review.yml]
permissions:
  contents: read
concurrency:
  group: selection-catalog-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Capture public evidence only
        run: |
          mkdir -p selection-review
          python - <<'PY'
          import asyncio,json,sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from playwright.async_api import async_playwright
          OUT=Path('selection-review')
          def clean(raw):
              soup=BeautifulSoup(raw,'html.parser')
              for n in soup.select('script,style,input,textarea,form'):n.decompose()
              return str(soup.body or soup)
          async def one(browser,key,url):
              report={'source':key,'url':url,'cards':[],'errors':[]}
              try:
                  async with asyncio.timeout(180):
                      async with PublicSource(browser,url) as c:
                          await c.robots();await c.read(url,render=True);await c.page.wait_for_timeout(1600)
                          (OUT/f'{key}-page.html').write_text(clean(await c.page.content()),encoding='utf8')
                          if key.startswith('selection'):
                              cards=c.page.locator('.loyalty-short-offers-offer-card');count=await cards.count()
                              for i in range(min(count,20)):
                                  card=cards.nth(i);label=await card.inner_text()
                                  try:
                                      await card.click();popup=c.page.locator('[data-element="Popup"]').filter(has=c.page.locator('.more-offer-info-popup'))
                                      await popup.wait_for(state='visible',timeout=5000)
                                      (OUT/f'{key}-card-{i}.html').write_text(clean(await popup.inner_html()),encoding='utf8')
                                      report['cards'].append({'index':i,'label':label})
                                      await popup.locator('[data-element="PopupClose"]').click();await popup.wait_for(state='hidden',timeout=3000)
                                  except Exception as exc:
                                      report['errors'].append({'index':i,'type':type(exc).__name__});break
                          report['status']='read'
              except Exception as exc:report['status']='failed';report['error']=str(exc)[:180] if isinstance(exc,RuntimeError) else type(exc).__name__
              print(json.dumps(report,ensure_ascii=False),flush=True);return report
          async def main():
              targets=[('selection-msk','https://msk.t2.ru/bolshe/selection'),('selection-spb','https://spb.t2.ru/bolshe/selection'),('utair-tiers','https://media.utair.ru/status'),('ural-tiers','https://www.uralairlines.ru/wings_rules/')]
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:results=[await one(browser,k,u) for k,u in targets]
                  finally:await browser.close()
              (OUT/'report.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: selection-review-${{ github.run_id }}
          path: selection-review/
          retention-days: 7
          if-no-files-found: warn
