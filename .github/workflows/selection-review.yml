name: Review public Selection catalogues
on:
  push:
    branches: [loyalty/selection-catalog]
    paths: [loyalty/**, .github/workflows/selection-review.yml]
permissions:
  contents: read
concurrency:
  group: selection-catalog-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: python -m playwright install --with-deps chromium
      - name: Read anonymous public catalogue content
        run: |
          mkdir -p selection-review
          python - <<'PY'
          import asyncio,json,re,sys
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from playwright.async_api import async_playwright
          OUT=Path('selection-review')
          TARGETS=[('msk-selection','https://msk.t2.ru/bolshe/selection'),('spb-selection','https://spb.t2.ru/bolshe/selection'),('greatlist','https://t2selection.greatlist.ru/')]
          async def probe(browser,key,url):
              report={'source':key,'url':url,'network':[],'catalog_payloads':0};tasks=[]
              try:
                  async with asyncio.timeout(150):
                      async with PublicSource(browser,url) as c:
                          async def capture(resp):
                              u=urlsplit(resp.url)
                              if u.hostname!=c.host or resp.request.method!='GET' or resp.request.resource_type not in ('xhr','fetch'):
                                  return
                              report['network'].append({'path':u.path,'status':resp.status})
                              if resp.status!=200 or not re.search('loyalty|selection|privileg|offers',u.path,re.I):return
                              try:
                                  obj=await resp.json()
                                  encoded=json.dumps(obj,ensure_ascii=False)
                                  if len(encoded)>2500000 or not re.search('"(?:offers|privileges|partners|restaurants)"',encoded):return
                                  if re.search('"(?:access_token|refresh_token|password|sessionId|phoneNumber)"',encoded):return
                                  n=report['catalog_payloads'];report['catalog_payloads']+=1
                                  (OUT/f'{key}-catalog-{n}.json').write_text(encoded,encoding='utf8')
                              except Exception:pass
                          c.page.on('response',lambda r:tasks.append(asyncio.create_task(capture(r))))
                          await c.robots();raw=await c.read(url,render=True);await c.page.wait_for_timeout(4000)
                          if tasks:await asyncio.gather(*tasks,return_exceptions=True)
                          soup=BeautifulSoup(await c.page.content(),'html.parser')
                          report['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                          report['scripts']=[s.get('src') for s in soup.select('script[src]')]
                          for node in soup.select('script,style,input,textarea,form'):node.decompose()
                          body=soup.body or soup
                          (OUT/f'{key}.html').write_text(str(body),encoding='utf8')
                          report['status']='read';report['text_length']=len(body.get_text())
              except Exception as exc:
                  report['status']='failed';report['error']=str(exc)[:180] if isinstance(exc,RuntimeError) else type(exc).__name__
              print(json.dumps(report,ensure_ascii=False),flush=True)
              return report
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:results=[await probe(browser,k,u) for k,u in TARGETS]
                  finally:await browser.close()
              (OUT/'report.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: selection-review-${{ github.run_id }}
          path: selection-review/
          retention-days: 7
          if-no-files-found: warn
