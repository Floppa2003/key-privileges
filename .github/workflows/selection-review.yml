name: Review public Selection catalogues
on:
  push:
    branches: [loyalty/selection-catalog]
    paths: [loyalty/**, .github/workflows/selection-review.yml]
permissions:
  contents: read
concurrency:
  group: selection-catalog-review
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.retain.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Register checksum-verified code delta
        run: |
          if test -f loyalty/register_public_tiers.py; then python loyalty/register_public_tiers.py; fi
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Retain only reviewed registration
        id: retain
        run: |
          if test -f loyalty/register_public_tiers.py; then
            git add -- loyalty/normalized.py loyalty/collect_normalized.py loyalty/sources_normalized.json
            git rm -- loyalty/register_public_tiers.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: register public Selection previews and airline tiers'
            git push origin HEAD:refs/heads/loyalty/selection-catalog
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  collect:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.test.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect through the actual production dispatcher
        run: |
          mkdir -p selection-review
          git archive --format=tar --output=selection-review/code.tar HEAD
          python - <<'PY'
          import asyncio,json,os,sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from playwright.async_api import async_playwright
          from collect_normalized import one
          from sheets_normalized import prepare
          async def main():
              cfgs=[c for c in json.loads(Path('loyalty/sources_normalized.json').read_text()) if c['id'] in ('t2_selection_public','utair_tiers','ural_tiers')]
              now=datetime.now(timezone.utc).isoformat();results=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      for cfg in cfgs:results.append(await one(browser,cfg,now,500))
                  finally:await browser.close()
              bundle={'schema_version':2,'run_id':os.environ['GITHUB_RUN_ID']+':1','observed_at':now,'sources':[r for r,_ in results],'records':[r for _,rs in results for r in rs]}
              prepare(bundle)
              Path('selection-review/normalized.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2),encoding='utf8')
              if not bundle['records']:raise SystemExit(2)
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: selection-review-${{ github.run_id }}
          path: selection-review/
          retention-days: 7
          if-no-files-found: warn
