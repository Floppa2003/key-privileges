name: Review public Selection catalogues
on:
  push:
    branches: [loyalty/selection-catalog]
    paths: [loyalty/**, .github/workflows/selection-review.yml]
permissions:
  contents: read
concurrency:
  group: selection-catalog-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read tier panels after ordinary tab clicks
        run: |
          mkdir -p selection-review
          python - <<'PY'
          import asyncio,json,sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from playwright.async_api import async_playwright
          OUT=Path('selection-review')
          async def main():
              rows=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      async with PublicSource(browser,'https://media.utair.ru/status') as c:
                          await c.robots();await c.read('https://media.utair.ru/status',render=True)
                          nav=c.page.locator('#rec759374982')
                          await nav.scroll_into_view_if_needed();await c.page.wait_for_timeout(500)
                          headers=await nav.locator('.t396__elem[data-elem-type="text"]').evaluate_all('(els)=>els.map(e=>({text:e.innerText.trim(),left:Number(e.getAttribute("data-field-left-value")),top:Number(e.getAttribute("data-field-top-value")),id:e.getAttribute("data-elem-id")}))')
                          (OUT/'utair-header.json').write_text(json.dumps(headers,ensure_ascii=False,indent=2))
                          for name in ['Start','Basic','Bronze','Silver','Gold','Platinum']:
                              label=nav.get_by_text(name,exact=True);box=await label.bounding_box()
                              if not box:raise RuntimeError('tier label is not visible')
                              await c.page.mouse.click(box['x']+box['width']/2,box['y']+box['height']/2)
                              await c.page.wait_for_timeout(350)
                              active=c.page.locator('.t-rec.description.active')
                              if await active.count()!=1:raise RuntimeError('active panel is ambiguous')
                              raw=await active.evaluate('(e)=>e.outerHTML')
                              soup=BeautifulSoup(raw,'html.parser')
                              for n in soup.select('script,style,input,textarea,form'):n.decompose()
                              for a in soup.select('a[href]'):
                                  if any(x in a['href'].lower() for x in ('signature=','accesskeyid=','token=')):del a['href']
                              (OUT/f'utair-{name}.html').write_text(str(soup),encoding='utf8')
                              rows.append({'tier':name,'active_panel':await active.get_attribute('id'),'text':await active.inner_text()})
                          (OUT/'utair-ui-mapping.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf8')
                  finally:await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: selection-review-${{ github.run_id }}
          path: selection-review/
          retention-days: 7
          if-no-files-found: warn
