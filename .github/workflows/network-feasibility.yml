name: Loyalty network feasibility experiment
on:
  push:
    branches: [loyalty/network-feasibility]
    paths: [loyalty/diagnostics/**, loyalty/tests/test_network_diagnostic.py, .github/workflows/network-feasibility.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loyalty-network-experiment
  cancel-in-progress: false
jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
        trial: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -p test_network_diagnostic.py -v
      - run: python -m playwright install --with-deps chromium
      - name: Diagnose public read-only canaries without Google credentials
        env:
          PROBE_TRIAL: ${{ matrix.trial }}
        run: python loyalty/diagnostics/network_probe.py
      - name: Save isolated public diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-${{ matrix.os }}-${{ matrix.trial }}-${{ github.run_id }}
          path: network-output/
          retention-days: 7
          if-no-files-found: warn
