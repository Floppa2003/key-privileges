name: DeepSeek additional capacity verification
on:
  push:
    branches: [loyalty/deepseek-capacity-20261028]
    paths: [.github/workflows/deepseek-capacity-20261028.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deepseek-capacity-verification-20261028
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install diagnostic runtime
        run: |
          python -m pip install requests==2.32.5 jsonschema==4.26.0 Pillow==12.3.0
          python -m py_compile diagnostics/deepseek_live_capacity_20261028.py
          mkdir -p capacity-check
          git rev-parse HEAD > capacity-check/commit.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '40637272596'
          artifact-ids: '12794924142'
          github-token: ${{ github.token }}
          path: archived
          merge-multiple: true
      - name: Probe complete archived inputs; free routes and verified free credits only
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: python diagnostics/deepseek_live_capacity_20261028.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deepseek-capacity-${{ github.run_id }}
          path: capacity-check/
          retention-days: 30
          if-no-files-found: error
