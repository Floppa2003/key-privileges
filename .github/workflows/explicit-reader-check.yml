name: Explicit reader URL inspection
on:
  push:
    branches: [loyalty/explicit-reader-check]
    paths: [.github/workflows/explicit-reader-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - name: Inspect two fixed URLs only, no link discovery or private state
        run: |
          mkdir -p reader-output
          python - <<'PY'
          import requests,json,time,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          from bs4 import BeautifulSoup
          targets=[('ekp','https://ekp.spb.ru/capabilities/loyalty/tiles?region=78'),('nordwind','https://nordwindairlines.ru/ru/club/partnerlist')]
          out=Path('reader-output');report={'observed_at':datetime.now(timezone.utc).isoformat(),'scope':'two_user_referenced_public_URLs_not_recursive_crawl','results':[]}
          for key,url in targets:
              r={'source':key,'source_url':url,'retriever':'anonymous_jina_reader','cache_requested':'disabled','optional_robots_header':False}
              try:
                  response=requests.get('https://r.jina.ai/'+url,headers={'Accept':'application/json','X-Respond-With':'html','X-No-Cache':'true'},timeout=80)
                  r['reader_status']=response.status_code
                  if len(response.content)>6000000:raise ValueError('response_too_large')
                  if response.status_code==200:
                      envelope=response.json();data=envelope.get('data') or {}
                      r.update(origin_status=data.get('httpStatus'),title=data.get('title'),warning=data.get('warning'),returned_url=data.get('url'))
                      html=data.get('html','');soup=BeautifulSoup(html,'html.parser')
                      for tag in soup.select('script,form,input,textarea'):tag.decompose()
                      clean=str(soup);path=out/(key+'.html');path.write_text(clean,encoding='utf8')
                      r.update(file=path.name,bytes=len(clean.encode()),sha256=hashlib.sha256(clean.encode()).hexdigest(),text_excerpt=soup.get_text(' ',strip=True)[:800])
                  else:r['error_excerpt']=response.text[:300]
              except Exception as exc:r['error']=type(exc).__name__
              report['results'].append(r)
              if r.get('reader_status') in (401,402,429):break
              time.sleep(5)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: explicit-reader-${{ github.run_id }}
          path: reader-output/
          retention-days: 7
