name: Mantera lifecycle release check
on:
  push:
    branches: ["loyalty/mantera-lifecycle-20260922"]
    paths: [".github/workflows/mantera-lifecycle-check.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full regression on the complete repository
        shell: bash
        run: |
          set -o pipefail
          mkdir -p lifecycle-evidence
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee lifecycle-evidence/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee lifecycle-evidence/key-tests.log
      - run: python -m playwright install --with-deps chromium
      - name: Fresh public Mantera collection without publication
        run: xvfb-run -a python loyalty/collect_normalized.py --limit 500 --sources mantera_moments
      - name: Actual health, publication validation and reader replay
        run: |
          python loyalty/source_lifecycle.py --input loyalty-output/normalized.json --sources mantera_moments
          python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path[:0]=['loyalty','loyalty/tests']
          from source_lifecycle import health_summary,reconcile_rows,validate_inventories
          from sheets_normalized import prepare,SCHEMAS
          from test_lifecycle_pipeline import reader
          b=json.loads(Path('loyalty-output/normalized.json').read_text())
          h=health_summary(b,expected_sources=['mantera_moments'])
          assert len(h)==1 and h[0]['healthy'],h
          rows=prepare(b)['parser_offers']
          assert rows and reconcile_rows(b,[SCHEMAS['parser_offers']]+rows,rows)==rows
          assert len(validate_inventories(b)['mantera_moments']['record_ids'])==len([r for r in b['records'] if r['details']['public_reward_evidence'].get('kind')=='public_partner'])
          for row in rows:
              view,reason=reader(row,b['observed_at'][:10])
              assert view and reason is None,(row[0],reason)
          Path('lifecycle-evidence/acceptance.json').write_text(json.dumps({'source_health':h,'actual_records':len(rows),'same_payload_reconciliation':'unchanged','reader_replays':len(rows),'observed_at':b['observed_at']},ensure_ascii=False,indent=2))
          PY
      - name: Preserve only public source and test evidence
        if: always()
        run: |
          mkdir -p lifecycle-evidence
          cp -r loyalty-output lifecycle-evidence/ 2>/dev/null || true
          git rev-parse HEAD > lifecycle-evidence/commit.txt
          tar -cf lifecycle-evidence/changed-code.tar loyalty/source_lifecycle.py loyalty/mantera_lifecycle.py loyalty/tests/test_mantera_lifecycle.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mantera-lifecycle-${{ github.run_id }}
          path: lifecycle-evidence/
          retention-days: 1
