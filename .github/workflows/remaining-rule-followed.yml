name: Follow reviewed public rule redirects
on:
  push:
    branches: ['loyalty/remaining-rule-access-20260917']
    paths: [.github/workflows/remaining-rule-followed.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Inspect final public targets without credentials, OCR or publication
        run: |
          python - <<'PY'
          import sys,json,re,time
          from pathlib import Path
          from urllib.parse import urlsplit
          sys.path.insert(0,'loyalty')
          from remaining_rule_access_probe import read,sha,now,BOT
          from ekp_linked_rules import clean_html
          from document_text import extract_pdf
          from protego import Protego
          import requests
          hosts={'stoletov.ru','parkingsvo.ru','parking.svo.aero','parking.svo.su'}
          urls=['https://stoletov.ru/catalog/extra/spiski-tovarov/tovary-bez-skidok/','https://parking.svo.aero/storage/2023/11/08/37eb5856e547162527fd77ebb56af2b836c79d8e.pdf']
          session=requests.Session();session.trust_env=False
          out=Path('followed-rules');out.mkdir()
          report={'kind':'diagnostic_only','requests':[],'results':[],'provider_credits':0,'source_accounts_used':False}
          def follow(url,policy=False):
              seen=set()
              for _ in range(5):
                  u=urlsplit(url)
                  if u.scheme!='https' or u.netloc not in hosts or u.query or u.fragment or url in seen:raise ValueError('unreviewed_redirect')
                  if policy and u.path!='/robots.txt':raise ValueError('foreign_policy_path')
                  seen.add(url);receipt,data=read(session,url);report['requests'].append(receipt)
                  if receipt.get('status') in (301,302,303,307,308):
                      loc=receipt.get('redirect',{})
                      if loc.get('has_query') or loc.get('has_fragment'):raise ValueError('private_redirect')
                      url=loc['url_without_query'];time.sleep(3);continue
                  return receipt,data
              raise ValueError('redirect_limit')
          for url in urls:
              item={'url':url};report['results'].append(item)
              try:
                  pr,raw=follow('https://'+urlsplit(url).netloc+'/robots.txt',True)
                  if pr.get('status') in (404,410):rules=Protego.parse('User-agent: *\nAllow: /')
                  elif raw and b'<html' not in raw.lower() and re.search(br'^\s*User-agent:',raw,re.I|re.M):rules=Protego.parse(raw.decode('utf8'))
                  else:raise ValueError('policy_unavailable')
                  if not rules.can_fetch(url,BOT):raise ValueError('policy_disallow')
                  rate=rules.request_rate(BOT);delay=max(3,rules.crawl_delay(BOT) or 0,rate.seconds/rate.requests if rate else 0)
                  if delay>20:raise ValueError('delay_bound')
                  time.sleep(delay);receipt,data=follow(url)
                  if data is None:raise ValueError('no_target_bytes')
                  item['receipt']=receipt
                  if data.startswith(b'%PDF-'):
                      name=sha(url.encode())+'.pdf';(out/name).write_bytes(data);item['file']=name
                      doc=extract_pdf(data,allow_ocr=False);(out/(name+'.text.json')).write_text(json.dumps(doc,ensure_ascii=False))
                      item['page_count']=doc['page_count'];item['errors']=doc['errors']
                  else:
                      clean=clean_html(data);name=sha(url.encode())+'.html';(out/name).write_text(clean);item['file']=name
              except Exception as exc:item['error']=str(exc) if isinstance(exc,ValueError) else type(exc).__name__
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: followed-rules-${{ github.run_id }}
          path: followed-rules/
          retention-days: 7
