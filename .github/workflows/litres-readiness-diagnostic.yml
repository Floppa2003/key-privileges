name: Litres readiness diagnostic
on:
  push:
    branches: [fix/litres-readiness-20261023]
    paths: [.github/workflows/litres-readiness-diagnostic.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r loyalty/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Capture original read and same-navigation settled DOM
        run: |
          mkdir -p litres-output
          git rev-parse HEAD > litres-output/commit.txt
          PYTHONPATH=loyalty python - <<'PY'
          import asyncio,json,time
          from pathlib import Path
          from datetime import datetime,timezone
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          from public_transport import PublicSource,CONTENT_READY_JS,check_response
          from source_diagnostics import error_record
          from partner_pages import CONFIG
          from adapters import extract
          cfg=CONFIG['ekp_litres']; out=Path('litres-output'); states=[]
          def save(stage,raw,elapsed):
              soup=BeautifulSoup(raw,'html.parser')
              for n in soup.select('script,style,noscript,iframe,input'):n.decompose()
              (out/(stage+'.html')).write_text(str(soup),encoding='utf-8')
              row={'stage':stage,'seconds':elapsed,'selectors':{s:len(soup.select(s)) for s in cfg['selectors']},'title':soup.title.get_text(' ',strip=True) if soup.title else ''}
              try:
                  rows=extract('ekp_litres',raw,cfg['url'],datetime.now(timezone.utc).isoformat())
                  row['records']=len(rows)
                  (out/(stage+'-records.json')).write_text(json.dumps(rows,ensure_ascii=False,indent=2))
              except Exception as exc:row['error']=error_record(exc,'extraction',cfg['url'])
              states.append(row)
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      async with PublicSource(browser,cfg['url']) as c:
                          await c.robots(); responses=[]
                          def record(r):
                              if r.request.is_navigation_request() and r.request.frame==c.page.main_frame:responses.append(r)
                          c.page.on('response',record)
                          start=time.monotonic()
                          raw=await c.read(cfg['url'],render=True)
                          save('initial',raw,time.monotonic()-start)
                          try:
                              await c.page.wait_for_function(CONTENT_READY_JS,arg=cfg['selectors'],timeout=10000)
                          except Exception as exc:states.append({'stage':'wait','error':error_record(exc,'readiness',cfg['url'])})
                          c.check_url(c.page.url)
                          raw=await c.page.content()
                          check_response(responses[-1].status,raw)
                          save('settled',raw,time.monotonic()-start)
                          states.append({'stage':'navigation','statuses':[r.status for r in responses],'same_url':c.page.url==cfg['url'],'robots':c.robots_info})
                          c.page.remove_listener('response',record)
                  finally:await browser.close()
          try:asyncio.run(main())
          except Exception as exc:states.append({'stage':'capture','error':error_record(exc,'capture',cfg['url'])})
          (out/'states.json').write_text(json.dumps(states,ensure_ascii=False,indent=2))
          print(json.dumps(states,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: litres-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: litres-output/
          retention-days: 14
