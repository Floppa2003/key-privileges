name: Apply tested loyalty v2.2 code
on:
  push:
    branches: [loyalty/finish-catalogs]
    paths: [loyalty/transport_v22/**, .github/workflows/loyalty-apply-v22.yml]
permissions:
  contents: read
concurrency:
  group: loyalty-apply-v22
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/loyalty/finish-catalogs'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check and apply public-code-only patch
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path('loyalty/transport_v22')
          data=''.join((root/f'{i:02}.b64').read_text().strip() for i in range(3))
          decoder=lzma.LZMADecompressor(memlimit=268435456)
          patch=decoder.decompress(base64.b64decode(data,validate=True),max_length=1000000)
          assert decoder.eof and len(patch)==119426
          assert hashlib.sha256(patch).hexdigest()=='49b0e0235e753c8e269f96a8a6a063523dd80cce095d11e78fcf0f92f0c8ffb9'
          manifest=json.loads((root/'manifest.json').read_text())
          assert len(manifest)==30 and all(n.startswith('loyalty/') and '..' not in pathlib.PurePosixPath(n).parts for n in manifest)
          p=pathlib.Path('/tmp/public-loyalty-v22.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          for name,expected in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          subprocess.run(['git','add','--',*manifest],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(changed)==set(manifest),changed
          print('All 30 code/test/document files match the tested SHA256 manifest.')
          PY
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Commit only tested code and remove transport fragments
        run: |
          git rm -r -- loyalty/transport_v22
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: normalize public T2 offers and restore complete RGO conditions'
          git push origin HEAD:refs/heads/loyalty/finish-catalogs
          echo "Tested code commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
