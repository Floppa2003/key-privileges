name: EKP linked public conditions
on:
  push:
    branches: [main, 'loyalty/ekp-linked-conditions-20260917']
    paths:
      - .github/workflows/ekp-linked-conditions.yml
      - loyalty/ekp_linked_rules.py
      - loyalty/tests/test_ekp_linked_rules.py
      - loyalty/tests/test_linked_read_regressions.py
      - loyalty/tests/test_ekp_html_stability.py
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * 2'
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Complete regressions and preserve exact executed code
        run: |
          mkdir -p ekp-linked-tests
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee ekp-linked-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee ekp-linked-tests/key-tests.log
          tar -cf ekp-linked-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-linked-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-linked-tests/
          retention-days: 7
  collect:
    needs: regression
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus
      - name: Locate recent successful EKP discovery without changing parent dates
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          repo=os.environ['GITHUB_REPOSITORY']
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/ekp-api.yml/runs?branch=main&status=success&per_page=1']))
          run=data['workflow_runs'][0]
          assert run['head_branch']=='main' and run['conclusion']=='success'
          assert 0<=(datetime.now(timezone.utc)-datetime.fromisoformat(run['updated_at'].replace('Z','+00:00'))).total_seconds()<604800
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run_id={run['id']}\nname=ekp-public-{run['id']}-{run['run_attempt']}\n")
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.upstream.outputs.run_id }}
          name: ${{ steps.upstream.outputs.name }}
          path: ekp-upstream
      - name: Read public rules under the existing Free budget without Google credentials
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python loyalty/ekp_linked_rules.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-linked-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-linked-output/
          retention-days: 7
  publish:
    needs: collect
    if: >-
      needs.collect.result == 'success' && github.repository == 'Floppa2003/key-privileges' &&
      github.ref == 'refs/heads/main' && vars.LOYALTY_SHEETS_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ekp-linked-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-linked-source
      - name: Reconstruct evidence before destination authorization without repeating OCR
        run: |
          python - <<'PY'
          import os,sys
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from ekp_linked_rules import validate_bundle
          validate_bundle('ekp-linked-source',os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],os.environ['GITHUB_SHA'],datetime.now(timezone.utc))
          PY
          python loyalty/sheets_normalized.py --input ekp-linked-source/normalized.json
      - name: Existing short-lived authorization for the original destination
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Upsert source rows and verify unified destination after the last write
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DISCOUNTS_SPREADSHEET_ID: ${{ secrets.DISCOUNTS_SPREADSHEET_ID }}
        run: |
          python loyalty/sheets_normalized.py --input ekp-linked-source/normalized.json --publish
          python loyalty/unified_publish.py --publish
