name: EKP linked public conditions
on:
  push:
    branches: ['loyalty/ekp-linked-conditions-20260917']
    paths: [.github/workflows/ekp-linked-conditions.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ekp-linked-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: loyalty/ekp-linked-conditions-20260917
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Reproduce and repair HTML roundtrip without new source requests
        run: |
          mkdir -p ekp-linked-tests
          if python -m unittest discover -s loyalty/tests -p test_ekp_html_stability.py -v > ekp-linked-tests/before-repair.log 2>&1; then
            echo 'Expected the reproduced HTML regressions before repair'; exit 1
          fi
          python loyalty/_integrate_ekp_linked_once.py
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee ekp-linked-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee ekp-linked-tests/key-tests.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/ekp_linked_rules.py
          git commit -m 'Keep sanitized HTML stable and accept source page titles when H1 is absent'
          git push origin HEAD:loyalty/ekp-linked-conditions-20260917
          tar -cf ekp-linked-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-linked-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-linked-tests/
          retention-days: 7
