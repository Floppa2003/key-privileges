name: EKP linked public conditions
on:
  push:
    branches: ['loyalty/ekp-linked-conditions-20260917']
    paths: [.github/workflows/ekp-linked-conditions.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ekp-linked-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.integrate.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: loyalty/ekp-linked-conditions-20260917
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Exact integration and full regression before any live collection
        id: integrate
        run: |
          mkdir -p ekp-linked-tests
          python -m unittest discover -s loyalty/tests -p test_ekp_linked_rules.py -v > ekp-linked-tests/before-integration.log 2>&1 && exit 1 || true
          python loyalty/_integrate_ekp_linked_once.py
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee ekp-linked-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee ekp-linked-tests/key-tests.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/ekp_linked_rules.py loyalty/normalized.py loyalty/unified_normalization.py
          git commit -m 'Register public EKP linked rules and preserve source/parent boundaries'
          git push origin HEAD:loyalty/ekp-linked-conditions-20260917
          echo "tested_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar -cf ekp-linked-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-linked-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-linked-tests/
          retention-days: 7
  collect:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.regression.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus
      - name: Locate a recent successful public EKP catalogue, without refreshing its dates
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          repo=os.environ['GITHUB_REPOSITORY']
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/ekp-api.yml/runs?branch=main&status=success&per_page=1']))
          run=data['workflow_runs'][0]
          assert run['head_branch']=='main' and run['conclusion']=='success'
          assert 0<=(datetime.now(timezone.utc)-datetime.fromisoformat(run['updated_at'].replace('Z','+00:00'))).total_seconds()<604800
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"run_id={run['id']}\nname=ekp-public-{run['id']}-{run['run_attempt']}\n")
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.upstream.outputs.run_id }}
          name: ${{ steps.upstream.outputs.name }}
          path: ekp-upstream
      - name: Read discovered public conditions under the existing Free credit budget
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          GITHUB_SHA: ${{ needs.regression.outputs.tested_sha }}
        run: python loyalty/ekp_linked_rules.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-linked-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-linked-output/
          retention-days: 7
