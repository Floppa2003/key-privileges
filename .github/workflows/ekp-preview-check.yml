name: EKP preview candidate regression checks
on:
  push:
    branches: ["loyalty/ekp-catalog-preview-20260915"]
    paths: ["loyalty/**", ".github/workflows/ekp-preview-check.yml"]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: All regression tests with pinned dependencies
        run: |
          mkdir -p ekp-check-output
          python -m unittest discover -s loyalty/tests -v > ekp-check-output/python-tests.log 2>&1
          node --test key/refresh.test.mjs > ekp-check-output/key-tests.log 2>&1
      - name: Preserve exact execution code and pure Python policy dependency
        if: always()
        run: |
          mkdir -p ekp-check-output
          git archive HEAD > ekp-check-output/code.tar
          python -m pip download --no-deps --only-binary=:all: protego==0.6.2 --dest ekp-check-output
          sha256sum ekp-check-output/*.whl ekp-check-output/code.tar > ekp-check-output/SHA256SUMS
      - name: Preserve public regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekp-check-${{ github.run_id }}
          path: ekp-check-output/
          if-no-files-found: error
          retention-days: 7
