name: Public page readiness diagnosis
on:
  push:
    branches: [fix/source-errors-20261022]
    paths: [.github/workflows/source-readiness-diagnosis.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install browser without unrelated font packages
        run: |
          python -m pip install -r loyalty/requirements.txt
          python -m playwright install chromium
      - name: Compare immediate and hydrated public DOM without login
        run: |
          mkdir -p readiness-output/dependencies
          git rev-parse HEAD > readiness-output/commit.txt
          python -m pip download --no-deps protego==0.6.2 -d readiness-output/dependencies
          python - <<'PY'
          """Read-only comparison of immediate and hydrated public T2 documents."""
          import asyncio, hashlib, json, sys
          from pathlib import Path
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0, 'loyalty')
          from public_transport import PublicSource, RobotsCache, allowed_request, check_response
          from free_access_probe import sanitized_page
          from source_diagnostics import error_record
          from t2_source import URLS, page_records
          
          OUT = Path('readiness-output')
          SELECTORS = {'t2_mixx': '.article-content',
                       't2_selection': '.tariff-detail-t2-subscription-premium-card',
                       't2_mixx_s': '.product-article', 't2_powerbank': '.product-article'}
          
          async def main():
              OUT.mkdir(exist_ok=True)
              reports = []
              now = datetime.now(timezone.utc).isoformat()
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  browser._loyalty_robots_cache = RobotsCache()
                  try:
                      for source, url in URLS.items():
                          report = {'source_id': source, 'url': url, 'snapshots': []}
                          reports.append(report)
                          try:
                              async with PublicSource(browser, url) as client:
                                  await client.robots()
                                  report['robots'] = client.robots_info
                                  status = []
                                  def response_seen(response):
                                      if response.request.is_navigation_request() and response.request.frame == client.page.main_frame:
                                          status.append((response.status, response.url))
                                  client.page.on('response', response_seen)
                                  await client.read(url, render=True)
                                  for delay in (0, 10000):
                                      if delay:
                                          await client.page.wait_for_timeout(delay)
                                      client.check_url(client.page.url)
                                      raw = await client.page.content()
                                      final_status, final_url = status[-1]
                                      if not allowed_request(final_url, client.host):
                                          raise RuntimeError('unexpected_redirect')
                                      check_response(final_status, raw)
                                      dom = BeautifulSoup(raw, 'html.parser')
                                      dom.html['data-loyalty-probe-location'] = client.page.url
                                      clean, identity = sanitized_page(str(dom), url)
                                      filename = f'{source}-{delay}.html'
                                      (OUT/filename).write_text(clean, encoding='utf8')
                                      snapshot = {'after_extra_ms': delay, 'http_status': final_status,
                                                  'selector_matches': len(dom.select(SELECTORS[source])),
                                                  'file': filename, 'sha256': hashlib.sha256(clean.encode()).hexdigest(),
                                                  **identity}
                                      try:
                                          rows = page_records(source, raw, now)
                                          snapshot.update(parser_status='ok', records=len(rows))
                                      except Exception as exc:
                                          snapshot.update(parser_status='failed', error=error_record(exc, 'parse', url))
                                      report['snapshots'].append(snapshot)
                                  client.page.remove_listener('response', response_seen)
                          except Exception as exc:
                              report['error'] = error_record(exc, 'read', url)
                          finally:
                              (OUT/'report.json').write_text(json.dumps(reports, ensure_ascii=False, indent=2))
                  finally:
                      await browser.close()
              print(json.dumps(reports, ensure_ascii=False, indent=2))
          
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-readiness-${{ github.run_id }}
          path: readiness-output/
          retention-days: 7
