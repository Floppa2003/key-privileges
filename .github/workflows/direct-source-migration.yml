name: Stage verified direct-read source blobs
on:
  push:
    branches: [fix/direct-source-reads-20261023]
    paths: [.github/workflows/direct-source-migration.yml]
permissions:
  contents: write
concurrency:
  group: direct-source-migration
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stage exact tree already tested in run 39968574637
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request,urllib.error
          from pathlib import Path
          out=Path('migration-output');out.mkdir()
          root='https://api.github.com/repos/Floppa2003/key-privileges/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def api(path,data=None):
              req=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),headers=headers,method='GET' if data is None else 'POST')
              try:
                  with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
              except urllib.error.HTTPError as exc:
                  print('Git object request failed:',exc.code,exc.read().decode()[:1000]);raise
          parts=[]
          for sha in ('691178dbac7b431e45cdf1ee2e8a267e12adee8a','d6e84b7eae725d64723307147fcd2218369ac2d4','e85ac0fc20277ae936740c1f84c29842e4c6c6ac'):
              part=base64.b64decode(api('blobs/'+sha)['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest()==sha
              parts.append(part)
          raw=lzma.decompress(base64.b64decode(b''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='bc74a6e7feb1cf511f2b46756f922333f72a9439c41ff32f1b82026d5add9193'
          edits=json.loads(raw)
          for item in edits:
              p=Path(item['path']);assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in ('.github','loyalty','diagnostics')
              old=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==item['before'],str(p)
              if item['after'] is None:p.unlink();continue
              lines=old.decode().splitlines(True) if old is not None else []
              for start,end,replacement in reversed(item['splices']):lines[start:end]=[replacement]
              new=''.join(lines).encode();assert hashlib.sha256(new).hexdigest()==item['after'],str(p)
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
          Path('.github/workflows/direct-source-migration.yml').unlink()
          subprocess.run(['git','add','--']+[e['path'] for e in edits]+['.github/workflows/direct-source-migration.yml'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='442366da98189cc2ab518bae3e8f94b2f9be59d6'
          entries=[]
          for e in edits:
              sha=None
              if e['after'] is not None:
                  data=Path(e['path']).read_bytes()
                  expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  sha=api('blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})['sha']
                  assert sha==expected
              entries.append({'path':e['path'],'mode':'100644','type':'blob','sha':sha})
              (out/'blob-manifest.json').write_text(json.dumps({'tested_run':39968574637,'tree':tree,'entries':entries,'branch_updated':False},ensure_ascii=False,indent=2))
          print('Staged',len(entries),'entries; tested tree',tree,'; no tree or branch changed')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-source-blobs-${{ github.run_id }}
          path: migration-output/
          retention-days: 14
