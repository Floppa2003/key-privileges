name: Direct public reads migration verification
on:
  push:
    branches: [fix/direct-source-reads-20261023]
    paths: [.github/workflows/direct-source-migration.yml]
permissions:
  contents: write
concurrency:
  group: direct-source-migration
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Floppa2003/key-privileges'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact locally verified edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir migration-output
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request
          from pathlib import Path
          parts=[]
          for sha in ('691178dbac7b431e45cdf1ee2e8a267e12adee8a','d6e84b7eae725d64723307147fcd2218369ac2d4','e85ac0fc20277ae936740c1f84c29842e4c6c6ac'):
              req=urllib.request.Request('https://api.github.com/repos/Floppa2003/key-privileges/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:obj=json.load(response)
              part=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest()==sha
              parts.append(part)
          raw=lzma.decompress(base64.b64decode(b''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='bc74a6e7feb1cf511f2b46756f922333f72a9439c41ff32f1b82026d5add9193'
          edits=json.loads(raw)
          for item in edits:
              p=Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in ('.github','loyalty','diagnostics')
              old=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==item['before'],str(p)
              if item['after'] is None:
                  p.unlink();continue
              lines=old.decode().splitlines(True) if old is not None else []
              for start,end,replacement in reversed(item['splices']):lines[start:end]=[replacement]
              new=''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest()==item['after'],str(p)
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(new)
          Path('.github/workflows/direct-source-migration.yml').unlink()
          subprocess.run(['git','add','--']+[e['path'] for e in edits]+['.github/workflows/direct-source-migration.yml'],check=True)
          Path('migration-output/manifest.json').write_bytes(raw)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          Path('migration-output/tree.txt').write_text(tree+'\n')
          subprocess.run(['git','archive','--format=zip','--output=migration-output/source.zip',tree],check=True)
          PY
      - name: Install test dependencies
        run: |
          python -m pip install -r loyalty/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Full tests and direct-read invariants
        run: |
          set -euo pipefail
          python -m unittest discover -s loyalty/tests -v > migration-output/tests.log 2>&1
          node --test key/refresh.test.mjs > migration-output/key-tests.log 2>&1
          python -m unittest discover -s diagnostics/tests -v > migration-output/diagnostics.log 2>&1
          python diagnostics/ekp_detail_probe.py --selfcheck > migration-output/selfchecks.log
          python diagnostics/free_residential_comparison.py --selfcheck >> migration-output/selfchecks.log
          python diagnostics/ekp_inline_batch.py --selfcheck >> migration-output/selfchecks.log
          git diff --check --cached
          git diff --exit-code
      - name: Store verified Git tree without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          edits=json.loads(Path('migration-output/manifest.json').read_text())
          entries=[]
          for e in edits:
              p=Path(e['path'])
              row={'path':e['path'],'mode':'100644','type':'blob'}
              if e['after'] is None:row['sha']=None
              else:
                  data=p.read_bytes();assert hashlib.sha256(data).hexdigest()==e['after']
                  row['content']=data.decode()
              entries.append(row)
          body={'base_tree':'e9b4eb2560b8226d315ef0784e8dda2396b1bfd3','tree':entries}
          req=urllib.request.Request('https://api.github.com/repos/Floppa2003/key-privileges/git/trees',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as response:result=json.load(response)
          expected=Path('migration-output/tree.txt').read_text().strip()
          assert result['sha']==expected,(result['sha'],expected)
          Path('migration-output/verified-tree.json').write_text(json.dumps({'sha':result['sha'],'base':'58d18751e0f637a3d168f2476b64dc8f3311b7a9','files':len(entries),'branch_updated':False},indent=2))
          print('Verified tree:',result['sha'],'; no branch updated')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-source-migration-${{ github.run_id }}
          path: migration-output/
          retention-days: 14
