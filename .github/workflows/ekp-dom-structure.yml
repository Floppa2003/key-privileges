name: EKP DOM structure and renderer control
on:
  push:
    branches: ["diagnostics/seven-routes-transport-20260915"]
    paths: ["diagnostics/ekp_dom_structure.py", ".github/workflows/ekp-dom-structure.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 curl_cffi==0.16.0 playwright==1.57.0
      - name: Preserve public DOM while testing unchanged readiness logic
        env:
          REPLICA: ${{ matrix.replica }}
        run: timeout --signal=TERM --kill-after=5s 180s xvfb-run -a python diagnostics/ekp_dom_structure.py
      - name: Preserve execution code and diagnostic evidence
        if: always()
        run: cp diagnostics/ekp_dom_structure.py renderer-control-output/
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekp-dom-${{ matrix.replica }}-${{ github.run_id }}
          path: renderer-control-output/
          if-no-files-found: error
          retention-days: 7
