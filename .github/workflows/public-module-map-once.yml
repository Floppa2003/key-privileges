name: One-time public module map
on:
  push:
    branches: [diagnostics/public-frontier-20260924]
    paths: [.github/workflows/public-module-map-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: npm install --no-audit --no-fund --ignore-scripts acorn@8.15.0
      - name: Trace public module structure, with all credential values withheld
        run: |
          node --input-type=module <<'JS'
          import * as acorn from 'acorn';
          import {createHash} from 'node:crypto';
          const origin='https://marketplace.konsierge.com';
          const url=origin+'/static/js/main.959cee1e.js';
          const report={started_at:new Date().toISOString(),credentials_used:false,source_account_used:false,client_executed:false,api_requests:0,requests:[]};
          async function get(u,max){
            const parsed=new URL(u);if(parsed.origin!==origin||!parsed.pathname.startsWith('/static/js/')||parsed.search||parsed.username||parsed.password)throw Error('asset_scope');
            const item={url:u,requested_at:new Date().toISOString()};report.requests.push(item);
            const r=await fetch(u,{redirect:'manual',signal:AbortSignal.timeout(30000),headers:{'User-Agent':'PublicLoyaltyResearch/1.0'}});item.status=r.status;item.date=r.headers.get('Date');item.age=r.headers.get('Age');
            if(r.status!==200||r.headers.has('Retry-After'))return null;
            const parts=[];let len=0;for await(const part of r.body){len+=part.length;if(len>max)throw Error('size_bound');parts.push(part);}
            const data=Buffer.concat(parts);item.bytes=data.length;item.sha256=createHash('sha256').update(data).digest('hex');item.finished_at=new Date().toISOString();return data.toString('utf8');
          }
          function nodes(root){const out=[],todo=[root];while(todo.length){const n=todo.pop();if(!n||typeof n!=='object')continue;if(n.type)out.push(n);for(const [k,v] of Object.entries(n)){if(k==='start'||k==='end')continue;if(Array.isArray(v))todo.push(...v);else if(v&&typeof v==='object')todo.push(v);}}return out;}
          const structural=new Set(['Authorization','Basic','Basic ','Bearer','Bearer ','GET','get','POST','post','Content-Type','application/json','tariff_id','rubric_id','page','per','benefits','rubrics','tariffId','GET_BENEFITS_REQUEST','GET_BENEFITS_RESPONSE','GET_BENEFITS_ERROR','GET_RUBRICS_REQUEST','GET_RUBRICS_RESPONSE','GET_RUBRICS_ERROR']);
          function redact(code,all,begin=0,end=code.length){const spans=[];for(const n of all){if(n.start<begin||n.end>end)continue;if(n.type==='Literal'&&typeof n.value==='string'&&!structural.has(n.value))spans.push([n.start,n.end]);if(n.type==='TemplateElement')spans.push([n.start,n.end]);}spans.sort((a,b)=>a[0]-b[0]);let at=begin,s='';for(const [a,b]of spans){if(a<at)continue;s+=code.slice(at,a)+'"[literal omitted]"';at=b;}return s+code.slice(at,end);}
          try{
            const code=await get(url,4000000);if(!code)throw Error('bundle_unavailable');
            const ast=acorn.parse(code,{ecmaVersion:'latest',sourceType:'script'});const all=nodes(ast);
            const arrays=all.filter(n=>n.type==='ArrayExpression'&&n.elements.filter(e=>e?.type==='FunctionExpression').length>100).sort((a,b)=>b.elements.length-a.elements.length);
            if(!arrays.length)throw Error('webpack_factory_array_not_found');
            const factories=arrays[0].elements;report.factory_count=factories.length;
            const summaries=[];const seeds=[];
            for(let id=0;id<factories.length;id++){const f=factories[id];if(!f||f.type!=='FunctionExpression')continue;const ns=nodes(f);const markers=[...new Set(ns.filter(n=>n.type==='Literal'&&typeof n.value==='string'&&/^(GET_BENEFITS|GET_RUBRICS|SET_BENEFITS|SET_ACTIVE_RUBRIC)/.test(n.value)).map(n=>n.value))];const ids=[...new Set(ns.filter(n=>n.type==='Identifier'&&/getBenefits|getRubrics|benefitsState|rubricsState/.test(n.name)).map(n=>n.name))];const imp=f.params[2]?.name;const deps=[...new Set(ns.filter(n=>n.type==='CallExpression'&&n.callee.type==='Identifier'&&n.callee.name===imp&&n.arguments.length===1&&n.arguments[0].type==='Literal'&&Number.isInteger(n.arguments[0].value)).map(n=>n.arguments[0].value))];if(markers.length||ids.length){seeds.push(id);summaries.push({id,start:f.start,end:f.end,bytes:f.end-f.start,markers,identifiers:ids,dependencies:deps});}}
            report.seed_modules=summaries;const selected=new Set(seeds);
            for(let id=0;id<factories.length;id++){const f=factories[id];if(!f||f.type!=='FunctionExpression')continue;const ns=nodes(f),imp=f.params[2]?.name;if(ns.some(n=>n.type==='CallExpression'&&n.callee.type==='Identifier'&&n.callee.name===imp&&seeds.includes(n.arguments[0]?.value)))selected.add(id);}
            report.direct_dependent_ids=[...selected].filter(id=>!seeds.includes(id));
            report.redacted_modules=[];let exported=0;
            for(const id of selected){const f=factories[id];if(f.end-f.start>65000||exported+f.end-f.start>230000){report.redacted_modules.push({id,not_exported:'size_bound',bytes:f.end-f.start});continue;}const body=redact(code,all,f.start,f.end);exported+=body.length;report.redacted_modules.push({id,start:f.start,end:f.end,code:body});}
            const match=code.match(/\/\/[#@]\s*sourceMappingURL=([^\s]+)/);report.source_map_linked=Boolean(match);
            if(match){const mapUrl=new URL(match[1],url).href;await new Promise(r=>setTimeout(r,2000));const raw=await get(mapUrl,22000000);if(raw){const map=JSON.parse(raw);report.source_map={source_count:map.sources?.length,matching_sources:(map.sources||[]).map((p,i)=>({path:p,index:i})).filter(x=>/benefit|rubric|api|request|service/i.test(x.path)&&!x.path.includes('node_modules')).map(x=>({path:x.path,index:x.index,content_present:typeof map.sourcesContent?.[x.index]==='string'}))};}}
            report.outcome='module_relationships_inspected';
          }catch(e){report.outcome='incomplete';report.error=/^[a-z_]+$/.test(e.message)?e.message:e.name;}
          report.finished_at=new Date().toISOString();console.log('MODULE_MAP_BEGIN');console.log(JSON.stringify(report));console.log('MODULE_MAP_END');
          JS
