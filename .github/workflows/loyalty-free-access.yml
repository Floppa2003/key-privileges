name: Free original-source access check
on:
  push:
    branches: [main, 'loyalty/free-api-access-20260915', 'loyalty/free-nordwind-live-20260915']
    paths: ['loyalty/free_access_probe.py', 'loyalty/tests/test_free_access_probe.py', 'loyalty/nordwind_catalog.py', 'loyalty/free_catalog_bundle.py', 'loyalty/tests/test_nordwind_catalog.py', 'loyalty/normalized.py', '.github/workflows/loyalty-free-access.yml']
  workflow_dispatch:
  schedule:
    - cron: '3 6 * * *'
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Complete regression suites, no API or Google secrets
        run: |
          mkdir -p free-access-tests
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee free-access-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee free-access-tests/key-tests.log
      - name: Read public API contract only, no account or site requests
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          import requests
          report={'api':'ScrapingAnt','authenticated':False,'target_requests':0}
          try:
              r=requests.get('https://api.scrapingant.com/openapi.json',timeout=(10,20),allow_redirects=False)
              report['http_status']=r.status_code
              if r.status_code==200 and len(r.content)<2_000_000:
                  obj=r.json();report['sha256']=hashlib.sha256(r.content).hexdigest()
                  report['paths']={path:obj.get('paths',{}).get(path) for path in ('/v2/usage','/v2/general','/v2/extended')}
          except Exception as exc:report['error_type']=type(exc).__name__
          Path('free-access-tests/api-contract.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Archive executed probe and test identity
        if: always()
        run: |
          mkdir -p free-access-tests
          cp loyalty/free_access_probe.py loyalty/tests/test_free_access_probe.py free-access-tests/
          cp loyalty/nordwind_catalog.py loyalty/free_catalog_bundle.py loyalty/tests/test_nordwind_catalog.py loyalty/normalized.py free-access-tests/
          tar -cf free-access-tests/code.tar loyalty key .github/workflows
          cp .github/workflows/loyalty-free-access.yml free-access-tests/executed-workflow.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-access-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: free-access-tests/
          retention-days: 7
  probe:
    needs: regression
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    outputs:
      has_records: ${{ steps.collect.outputs.has_records }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Collect free-source evidence and normalize supported catalogues
        id: collect
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python loyalty/free_catalog_bundle.py --collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-access-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            free-access-output/
            free-catalog-output/
          retention-days: 7
  publish:
    needs: probe
    if: >-
      needs.probe.result == 'success' && needs.probe.outputs.has_records == 'true' &&
      github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main' &&
      vars.LOYALTY_SHEETS_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: free-access-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: free-source-evidence
      - name: Validate public payload before obtaining a Google token
        run: python loyalty/sheets_normalized.py --input free-source-evidence/free-catalog-output/normalized.json
      - name: Obtain existing short-lived Sheets-scoped authorization
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Reuse bounded public upserts and private normalization with readback
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DISCOUNTS_SPREADSHEET_ID: ${{ secrets.DISCOUNTS_SPREADSHEET_ID }}
        run: |
          python loyalty/sheets_normalized.py --input free-source-evidence/free-catalog-output/normalized.json --publish
          python loyalty/unified_publish.py --publish
