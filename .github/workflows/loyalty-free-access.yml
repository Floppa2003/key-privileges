name: Free original-source access check
on:
  push:
    branches: [main, 'loyalty/free-api-access-20260915']
    paths: ['loyalty/free_access_probe.py', 'loyalty/tests/test_free_access_probe.py', '.github/workflows/loyalty-free-access.yml']
  workflow_dispatch:
  schedule:
    - cron: '3 6 * * *'
permissions:
  contents: read
concurrency:
  group: loyalty-free-access-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Complete regression suites, no API or Google secrets
        run: |
          mkdir -p free-access-tests
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee free-access-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee free-access-tests/key-tests.log
      - name: Read public API contract only, no account or site requests
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          import requests
          report={'api':'ScrapingAnt','authenticated':False,'target_requests':0}
          try:
              r=requests.get('https://api.scrapingant.com/openapi.json',timeout=(10,20),allow_redirects=False)
              report['http_status']=r.status_code
              if r.status_code==200 and len(r.content)<2_000_000:
                  obj=r.json();report['sha256']=hashlib.sha256(r.content).hexdigest()
                  report['paths']={path:obj.get('paths',{}).get(path) for path in ('/v2/usage','/v2/extended')}
          except Exception as exc:report['error_type']=type(exc).__name__
          Path('free-access-tests/api-contract.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Archive executed probe and test identity
        if: always()
        run: |
          mkdir -p free-access-tests
          cp loyalty/free_access_probe.py loyalty/tests/test_free_access_probe.py free-access-tests/
          cp .github/workflows/loyalty-free-access.yml free-access-tests/executed-workflow.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-access-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: free-access-tests/
          retention-days: 7
  probe:
    needs: regression
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Free-plan-only six-source probe; no key means no network request
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python loyalty/free_access_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-access-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: free-access-output/
          retention-days: 7
