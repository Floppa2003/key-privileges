name: Qwen converter-only thinking comparison
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-converter-thinking.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-converter-thinking
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - case: rzd_museum
            artifact: '11111500277'
          - case: lavka
            artifact: '11111745399'
          - case: nevsky
            artifact: '11111890672'
          - case: muzcomedy
            artifact: '11111592564'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact experiment and machine description
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p converter-thinking-output/code
          git rev-parse HEAD > converter-thinking-output/commit.txt
          cp loyalty/experiments/simple_thinking/* converter-thinking-output/code/
          cp loyalty/experiments/prompt_ab/prompt_ab.py loyalty/experiments/prompt_ab/practical_schema.json converter-thinking-output/code/
          cp loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh converter-thinking-output/code/
          cp .github/workflows/merchant-converter-thinking.yml converter-thinking-output/workflow.yml
          lscpu > converter-thinking-output/cpu.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36741893989'
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: source
          merge-multiple: true
      - name: Require a completed unchanged description before conversion
        id: eligible
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          source=Path('source')
          assert (source/'commit.txt').read_text().strip()=='49339414cc352907c7c3542e9dc979ad4e96a401'
          name='results/think_on/description/measurement.json'
          raw=(source/name).read_bytes()
          manifest=json.loads((source/'SHA256SUMS.json').read_text())
          assert hashlib.sha256(raw).hexdigest()==manifest[name]
          measurement=json.loads(raw)
          ready=measurement['status']=='completed'
          Path('converter-thinking-output/source-eligibility.json').write_text(json.dumps({
              'source_execution':'49339414cc352907c7c3542e9dc979ad4e96a401',
              'eligible':ready,'description_measurement':measurement,
              'conversion_skipped':not ready,'publication_allowed':False},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('ready='+str(ready).lower()+'\n')
          PY
      - name: Install pinned local model with cloud disabled
        if: steps.eligible.outputs.ready == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > converter-thinking-output/setup.log 2>&1
      - name: Compare identical converter requests differing only in thinking
        if: steps.eligible.outputs.ready == 'true'
        run: |
          set -euo pipefail
          loyalty/experiments/resolution/.venv/bin/python -m unittest discover -s loyalty/experiments/simple_thinking -p 'test_*.py' -v > converter-thinking-output/tests-probe.log 2>&1
          loyalty/experiments/resolution/.venv/bin/python -m py_compile loyalty/experiments/simple_thinking/reconvert.py
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/simple_thinking/reconvert.py --source source --case ${{ matrix.case }} --out converter-thinking-output/results --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama" > converter-thinking-output/inference.log 2>&1
      - name: Preserve diagnostics and checksums without model weights
        if: always()
        run: |
          if test -d loyalty/experiments/resolution/setup-logs; then cp -r loyalty/experiments/resolution/setup-logs converter-thinking-output/; fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('converter-thinking-output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: converter-thinking-${{ matrix.case }}-${{ github.run_id }}
          path: converter-thinking-output/
          retention-days: 14
