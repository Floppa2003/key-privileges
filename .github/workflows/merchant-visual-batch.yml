name: Merchant visual batch - capture only
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [loyalty/merchant_visual_capture.py, loyalty/experiments/visual/**, .github/workflows/merchant-visual-batch.yml]
permissions:
  contents: read
concurrency:
  group: merchant-visual-batch
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Preserve exact code
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p visual-batch
          git rev-parse HEAD > visual-batch/commit.txt
          git archive --format=tar.gz HEAD > visual-batch/source.tar.gz
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r loyalty/requirements.txt
          python -m pip install Pillow==12.3.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium
      - name: Full existing regressions and visual regressions
        run: |
          python -m unittest discover -s loyalty/tests -v > visual-batch/tests-existing.log 2>&1
          python -m unittest discover -s loyalty/experiments/visual -p 'test_*.py' -v > visual-batch/tests-visual.log 2>&1
          node --test key/refresh.test.mjs > visual-batch/tests-key.log 2>&1
      - name: Capture 18 public pages - no account, no LLM, no publishing
        run: |
          python loyalty/merchant_visual_capture.py --targets loyalty/experiments/visual/targets-20260927.json --out visual-batch/captures --concurrency 2 | tee visual-batch/capture.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-visual-batch-${{ github.run_id }}
          path: visual-batch/
          retention-days: 3
