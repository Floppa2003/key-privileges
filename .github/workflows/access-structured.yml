name: Confirm structured public access
on:
  push:
    branches: [diagnostics/access-options-20260914]
    paths: [diagnostics/structured_access.py, .github/workflows/access-structured.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - run: python -m py_compile diagnostics/structured_access.py
      - run: python diagnostics/structured_access.py
      - name: Check source evidence and public-state boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('structured-output/structured.json').read_text())['results']['loyals']
          if d.get('complete_api_collection'):
              assert d['accepted_posts']==d['api_total']==len(d['records'])
              assert len({r['native_id'] for r in d['records']})==len(d['records'])
              for r in d['records']:
                  assert r['raw']['status']=='publish' and r['raw']['content']['protected'] is False
                  assert r['source_url'].startswith('http://loyals.ru/wp-json/wp/v2/posts/')
                  assert r['source_status']=='public_http_observation_not_current_offer_verification'
                  assert 'transport_unencrypted_and_unauthenticated' in r['warnings']
                  assert all(rate['evidence'] in r['source_text'] for rate in r['rates'])
              print('Public API identity, count, evidence and trust-boundary assertions passed')
          else:
              print('API completeness not established; inspect explicit result')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: structured-access-${{ github.run_id }}
          path: |
            structured-output/
            diagnostics/structured_access.py
          retention-days: 7
          if-no-files-found: warn
