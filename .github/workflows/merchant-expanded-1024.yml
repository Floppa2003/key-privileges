name: Expanded Qwen 1024px - remaining public documents
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-expanded-1024.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-expanded-1024
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: one
            cases: academia diplomat fclm
          - shard: two
            cases: get lavka muzcomedy
          - shard: three
            cases: brawl pushkin taivas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact code and run regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p expanded-output/code
          git rev-parse HEAD > expanded-output/commit.txt
          cp loyalty/experiments/local_visual/*.py expanded-output/code/
          cp loyalty/experiments/local_visual/expanded-plan-20260928.json loyalty/experiments/local_visual/EXPANDED_1024_EVAL.md expanded-output/
          cp loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh expanded-output/code/
          cp .github/workflows/merchant-expanded-1024.yml expanded-output/workflow.yml
          lscpu > expanded-output/cpu.txt
          free -b > expanded-output/memory-before.txt
          python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
          python -m unittest discover -s loyalty/tests -v > expanded-output/tests-existing.log 2>&1
          python -m unittest discover -s loyalty/experiments/local_visual -p 'test_*.py' -v > expanded-output/tests-local.log 2>&1
          node --test key/refresh.test.mjs > expanded-output/tests-key.log 2>&1
      - name: Read exact accepted public capture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36288278400'
          artifact-ids: '10921671754'
          github-token: ${{ github.token }}
          path: source-capture
          merge-multiple: true
      - name: Record oversized document without silent truncation
        if: matrix.shard == 'one'
        run: |
          set +e
          python loyalty/experiments/local_visual/expanded_1024.py --source source-capture --out expanded-output/oversized --cases ladoga > expanded-output/oversized.log 2>&1
          result=$?
          test "$result" -eq 2
      - name: Install pinned local runtime without root or cloud API
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > expanded-output/setup.log 2>&1
      - name: Extract three complete documents at 1024px - no publication
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/local_visual/expanded_1024.py --execute --source source-capture --out expanded-output/results --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama" --cases ${{ matrix.cases }} > expanded-output/inference.log 2>&1
      - name: Preserve runtime diagnostics without model weights
        if: always()
        run: |
          if test -d loyalty/experiments/resolution/setup-logs; then cp -r loyalty/experiments/resolution/setup-logs expanded-output/; fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('expanded-output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-expanded-1024-${{ matrix.shard }}-${{ github.run_id }}
          path: expanded-output/
          retention-days: 3
