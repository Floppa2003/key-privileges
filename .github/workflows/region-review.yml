name: Verify regional catalogue expansion
on:
  push:
    branches: [loyalty/ekp-native-catalog]
    paths: [.github/workflows/region-review.yml, loyalty/register_regions_once.py]
permissions:
  contents: read
concurrency:
  group: regional-catalog-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          if test -f loyalty/register_regions_once.py; then python loyalty/register_regions_once.py; fi
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Commit verified registration only
        run: |
          if test -f loyalty/register_regions_once.py; then
            git add loyalty/t2_source.py loyalty/collect_normalized.py loyalty/normalized.py loyalty/public_transport.py
            git rm loyalty/register_regions_once.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: register tested T2 regional union'
            git push origin HEAD:refs/heads/loyalty/ekp-native-catalog
          fi
          mkdir -p region-review
          git archive --format=tar --output=region-review/code.tar HEAD
      - run: python -m playwright install --with-deps chromium
      - name: Fresh two-region collection without Google credentials
        run: |
          python - <<'PY'
          import asyncio,json,sys,os
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from playwright.async_api import async_playwright
          from collect_normalized import one
          from sheets_normalized import prepare
          async def main():
              now=datetime.now(timezone.utc).isoformat()
              cfg=next(c for c in json.loads(Path('loyalty/sources_normalized.json').read_text()) if c['id']=='t2_bolshe')
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:report,records=await one(browser,cfg,now,500)
                  finally:await browser.close()
              bundle={'schema_version':2,'run_id':os.environ['GITHUB_RUN_ID']+':1','observed_at':now,'records':records,'sources':[report]}
              prepare(bundle)
              Path('region-review/normalized.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2),encoding='utf8')
              print(json.dumps(report,ensure_ascii=False))
              if report['status']!='ok':raise RuntimeError('regional collection is incomplete')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: region-review-${{ github.run_id }}
          path: region-review/
          retention-days: 7
