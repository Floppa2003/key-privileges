name: Diagnose remaining public source boundaries
on:
  push:
    branches: ['loyalty/source-repair-20260918']
    paths: [.github/workflows/source-repair-check.yml]
permissions:
  contents: read
jobs:
  alfa-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5
      - name: HEAD only, no response body, redirect follow or account access
        run: |
          python - <<'PY'
          import hashlib,json,os,tempfile,ssl
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urljoin,urlsplit
          import requests,certifi
          now=lambda:datetime.now(timezone.utc).isoformat()
          audit={'run_id':os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],'commit':os.environ['GITHUB_SHA'],
                 'started_at':now(),'method':'HEAD','account_used':False,'activation_performed':False,'published':False,
                 'response_body_read':False,'redirect_followed':False,'prior_verified_tls_policy_redirect':'35377249536:1'}
          out=Path('source-repair-check');out.mkdir()
          try:
              url='https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt'
              with requests.get(url,timeout=(8,15),stream=True,allow_redirects=False) as r:
                  r.raise_for_status();data=r.raw.read(16385)
              digest=hashlib.sha256(data).hexdigest()
              if digest!='936a43fea6e8e525bcc0f81acd9c3d21b4fc4b9b68acea7906d698005afc6504':raise ValueError('official_root_identity_changed')
              audit['root']={'url':url,'sha256':digest}
              with tempfile.TemporaryDirectory() as td:
                  bundle=Path(td)/'bank-ca.pem';bundle.write_bytes(Path(certifi.where()).read_bytes()+b'\n'+data)
                  ctx=ssl.create_default_context(cafile=str(bundle));assert ctx.check_hostname and ctx.verify_mode==ssl.CERT_REQUIRED
                  target='https://web.alfabank.ru/partner-offers/'
                  with requests.head(target,verify=str(bundle),timeout=(8,15),allow_redirects=False,
                                     headers={'User-Agent':'LoyaltyCatalogResearchBot/1.0'}) as r:
                      audit.update(url=target,status=r.status_code,tls_verified=True,content_type=r.headers.get('content-type',''))
                      if r.is_redirect:
                          parsed=urlsplit(urljoin(target,r.headers['location']))
                          audit['redirect']={'scheme':parsed.scheme,'host':parsed.hostname,'path':parsed.path,'query_omitted':bool(parsed.query)}
                          if parsed.hostname=='private.auth.alfabank.ru':audit['access_state']='bank_authentication_redirect'
                      elif r.status_code==200:audit['access_state']='head_200_body_not_inspected'
          except Exception as exc:audit['error']=str(exc) if isinstance(exc,ValueError) else type(exc).__name__
          finally:
              audit['finished_at']=now();(out/'audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2));print(json.dumps(audit,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-repair-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-repair-check/
          retention-days: 7
