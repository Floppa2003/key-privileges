name: Diagnose remaining public source boundaries
on:
  push:
    branches: ['loyalty/source-repair-20260918']
    paths: [.github/workflows/source-repair-check.yml]
permissions:
  contents: read
jobs:
  alfa-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Verified TLS before and after explicit official trust, no accounts or system trust changes
        run: |
          python - <<'PY'
          import hashlib,json,os,re,ssl,sys,time,subprocess,tempfile
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlsplit,urljoin
          import requests,certifi
          from bs4 import BeautifulSoup
          from protego import Protego
          sys.path.insert(0,'loyalty')
          from public_transport import robots_document,check_response
          from free_access_probe import sanitized_page
          out=Path('source-repair-check');out.mkdir()
          now=lambda:datetime.now(timezone.utc).isoformat()
          sha=lambda b:hashlib.sha256(b).hexdigest()
          audit={'run_id':os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],'commit':os.environ['GITHUB_SHA'],
                 'started_at':now(),'account_used':False,'activation_performed':False,'published':False,'requests':[],'certificates':[]}
          host='web.alfabank.ru';root='https://'+host+'/partner-offers/'
          def get(url,verify=True):
              entry={'url':url,'started_at':now()};audit['requests'].append(entry)
              try:
                  with requests.get(url,verify=verify,timeout=(8,18),allow_redirects=False,stream=True,headers={'User-Agent':'LoyaltyCatalogResearchBot/1.0'}) as res:
                      data=bytearray()
                      for chunk in res.iter_content(65536):
                          data.extend(chunk)
                          if len(data)>2_000_000:raise ValueError('response_bound')
                      data=bytes(data);entry.update(status=res.status_code,bytes=len(data),sha256=sha(data),content_type=res.headers.get('content-type',''))
                      if res.headers.get('retry-after'):raise ValueError('retry_after_no_retry')
                      if res.is_redirect:
                          target=urljoin(url,res.headers.get('location',''));parts=urlsplit(target)
                          entry['redirect']={'scheme':parts.scheme,'host':parts.hostname,'path':parts.path}
                      return res.status_code,data,res.headers
              except Exception as exc:
                  entry['error']=type(exc).__name__
                  if isinstance(exc,requests.exceptions.SSLError):entry['reason']='certificate_verification_failed'
                  raise
              finally:entry['finished_at']=now()
          try:
              try:get('https://'+host+'/robots.txt')
              except requests.exceptions.SSLError:audit['default_trust_failed']=True
              except Exception as exc:audit['default_error']=type(exc).__name__
              with tempfile.TemporaryDirectory() as td:
                  bundle=Path(td)/'bank-ca.pem';pem=Path(certifi.where()).read_bytes()
                  for name in ['russian_trusted_root_ca_pem.crt','russian_trusted_sub_ca_pem.crt']:
                      url='https://gu-st.ru/content/lending/'+name
                      status,data,_=get(url)
                      if status!=200 or not data.startswith(b'-----BEGIN CERTIFICATE-----'):raise ValueError('official_certificate_not_received')
                      cert=Path(td)/name;cert.write_bytes(data)
                      info=subprocess.check_output(['openssl','x509','-in',str(cert),'-noout','-subject','-issuer','-dates','-fingerprint','-sha256'],text=True)
                      audit['certificates'].append({'url':url,'sha256':sha(data),'openssl_metadata':info})
                      pem+=b'\n'+data
                  bundle.write_bytes(pem)
                  context=ssl.create_default_context(cafile=str(bundle))
                  assert context.check_hostname and context.verify_mode==ssl.CERT_REQUIRED
                  audit['trust_scope']='temporary requests context for web.alfabank.ru only; no system/browser trust modified'
                  status,raw,headers=get('https://'+host+'/robots.txt',str(bundle))
                  body=raw.decode('utf-8-sig');rules,state=robots_document(status,body)
                  audit['policy']={'status':status,'state':state,'rules':rules}
                  policy=Protego.parse(rules)
                  if not policy.can_fetch(root,'LoyaltyCatalogResearchBot'):raise ValueError('robots_disallow')
                  delay=max(3,policy.crawl_delay('LoyaltyCatalogResearchBot') or 0)
                  if delay>30:raise ValueError('delay_exceeds_bound')
                  time.sleep(delay)
                  status,raw,headers=get(root,str(bundle))
                  if not 200<=status<300:raise ValueError('main_status_'+str(status))
                  body=raw.decode('utf-8');check_response(status,body)
                  dom=BeautifulSoup(body,'html.parser')
                  audit['public_document']={'status':status,'title':dom.title.get_text(' ',strip=True) if dom.title else '',
                    'script_paths':[urlsplit(urljoin(root,n['src'])).path for n in dom.select('script[src]')][:30],
                    'password_inputs':bool(dom.select('input[type=password]'))}
                  if dom.select('input[type=password]'):
                      audit['public_document']['state']='login_form_no_account_used'
                  else:
                      clean,identity=sanitized_page(body,root);data=clean.encode('utf8');file=sha(data)+'.html';(out/file).write_bytes(data)
                      audit['public_document'].update(identity,file=file,sha256=sha(data),body_bytes=len(data))
          except Exception as exc:
              audit['terminal_error']=str(exc) if isinstance(exc,ValueError) else type(exc).__name__
          finally:
              audit['finished_at']=now();(out/'audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2))
              print(json.dumps({'requests':len(audit['requests']),'certificates':len(audit['certificates']),'terminal_error':audit.get('terminal_error'),'public_document':audit.get('public_document')},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-repair-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-repair-check/
          retention-days: 7
