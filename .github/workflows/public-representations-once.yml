name: One-time public representations diagnostic
on:
  push:
    branches: [diagnostics/public-representations-20260923]
    paths: [.github/workflows/public-representations-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.3
      - name: Inspect source-linked public resources without executing scripts or submitting forms
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,json,time,hashlib
          from urllib.parse import urlsplit,urljoin
          from datetime import datetime,timezone
          from bs4 import BeautifulSoup
          def now():return datetime.now(timezone.utc).isoformat()
          report={'started_at':now(),'source_account_used':False,'source_credentials_used':False,'scripts_executed':False,'forms_submitted':False,'api_requests':0,'production_publication':False,'requests':[]}
          allowed={'marketplace.konsierge.com','grandkarat.com'}
          stopped=set()
          def read(url):
              u=urlsplit(url)
              if u.scheme!='https' or u.hostname not in allowed or u.username or u.password or u.port not in (None,443) or u.query or u.fragment or u.hostname in stopped:
                  raise ValueError('unapproved_public_url')
              item={'url':url,'requested_at':now()};report['requests'].append(item)
              try:
                  with requests.Session() as session:
                      session.trust_env=False
                      with session.get(url,headers={'User-Agent':'PublicLoyaltyResearch/1.0','Accept':'text/html,application/javascript'},timeout=(8,25),allow_redirects=False,stream=True) as r:
                          item.update(status=r.status_code,content_type=r.headers.get('Content-Type'),server_date=r.headers.get('Date'),cache_age=r.headers.get('Age'))
                          if r.status_code in (401,403,423,429) or r.headers.get('Retry-After'):
                              stopped.add(u.hostname);item['outcome']='source_refusal_no_retry';return None
                          if r.status_code!=200:
                              item['outcome']='non_200_not_followed';return None
                          raw=bytearray();deadline=time.monotonic()+35
                          for part in r.iter_content(65536):
                              raw.extend(part)
                              if len(raw)>4000000 or time.monotonic()>deadline:raise ValueError('response_bound')
                          data=bytes(raw);item.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),outcome='public_response_read')
                          return data.decode('utf-8',errors='replace')
              except Exception as e:
                  item.update(outcome='transport_or_bound_error',error=type(e).__name__);return None
              finally:item['finished_at']=now()
          root='https://marketplace.konsierge.com/'
          html=read(root)
          if html:
              dom=BeautifulSoup(html,'html.parser')
              report['marketplace']={'page_title':dom.title.get_text(' ',strip=True) if dom.title else None,'forms':len(dom.select('form')),'phone_input_present':bool(dom.select('input[type=tel]')),'visible_login_heading':bool(re.search(r'авторизация|введите свой номер телефона',dom.get_text(' ',strip=True),re.I)),'public_benefit_routes':[],'scripts':[],'asset_scan_complete':False}
              urls=[]
              for tag in dom.select('script[src]'):
                  url=urljoin(root,tag['src']);u=urlsplit(url)
                  if u.scheme=='https' and u.hostname=='marketplace.konsierge.com' and not u.query and not u.fragment and url not in urls:urls.append(url)
              report['marketplace']['discovered_same_origin_scripts']=len(urls)
              for url in urls[:4]:
                  time.sleep(2);body=read(url)
                  if body is None:continue
                  paths=sorted(set(v for v in re.findall(r'''["'](/[A-Za-z][A-Za-z0-9/_\-.:]{0,180})["']''',body) if re.search(r'benefit|rubric|discount|partner',v,re.I) and not re.search(r'token|secret|session|password',v,re.I)))
                  report['marketplace']['scripts'].append({'url':url,'characters':len(body),'public_read_route_literals':paths,'raw_script_saved':False})
              report['marketplace']['asset_scan_complete']=len(urls)<=4 and len(report['marketplace']['scripts'])==len(urls)
              report['marketplace']['scope']='only_scripts_linked_by_anonymous_root_not_lazy_chunks_or_server_routes'
          html=read('https://grandkarat.com/special-offer/')
          if html:
              dom=BeautifulSoup(html,'html.parser');blocks=[]
              for h in dom.find_all(['h1','h2','h3','h4']):
                  if not re.search(r'РЖД\s*Бонус',h.get_text(' ',strip=True),re.I):continue
                  for p in h.parents:
                      if p.name in ('body','html'):break
                      text=p.get_text(' ',strip=True)
                      if 200<len(text)<10000 and len(p.find_all(['h1','h2','h3','h4']))==1:
                          clone=BeautifulSoup(str(p),'html.parser')
                          for x in clone.select('script,style,form,input,textarea,iframe,img'):x.decompose()
                          for x in clone.find_all(True):
                              x.attrs={k:v for k,v in x.attrs.items() if k in ('class','id')}
                          blocks.append({'heading':h.get_text(' ',strip=True),'selector_hint':p.name+'.'+'.'.join(p.get('class',[])),'sanitized_public_offer_html':str(clone)})
                          break
              report['grandkarat']={'rzd_blocks':blocks,'page_read':True,'booking_performed':False,'all_offer_conditions_certified':False}
          report['finished_at']=now()
          print('PUBLIC_REPRESENTATIONS_BEGIN');print(json.dumps(report,ensure_ascii=False,indent=2));print('PUBLIC_REPRESENTATIONS_END')
          PY
