name: Utair public page - browser lifecycle control
on:
  push:
    branches: ["diagnostics/seven-routes-transport-20260915"]
    paths: ["diagnostics/utair_browser_lifecycle.py", ".github/workflows/utair-browser-lifecycle.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 curl_cffi==0.16.0 playwright==1.57.0
      - name: Compare same installed Chrome with fresh anonymous profiles
        run: xvfb-run -a python diagnostics/utair_browser_lifecycle.py
      - name: Preserve diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: utair-browser-lifecycle-${{ github.run_id }}
          path: utair-browser-output/
          if-no-files-found: warn
          retention-days: 7
