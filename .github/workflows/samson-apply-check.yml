name: Verify pharmacy rule extension
on:
  push:
    branches: ['loyalty/samson-linked-20260918']
    paths: [.github/workflows/samson-apply-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Reproduce omission before changing production code
        run: |
          mkdir -p samson-verification
          python - <<'PY'
          import subprocess
          from pathlib import Path
          result=subprocess.run(['python','-m','unittest','discover','-s','loyalty/tests','-p','test_samson_linked_rules.py','-v'],capture_output=True,text=True)
          Path('samson-verification/red.log').write_text(result.stdout+result.stderr)
          assert result.returncode!=0 and 'AssertionError: Lists differ: []' in result.stderr
          PY
      - name: Extend only the reviewed host route, anchor selection and owned layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          p=Path('loyalty/aeroflot_linked_rules.py');raw=p.read_bytes()
          assert blob(raw)=='9030cb3bbd3c5b4f0bf77b00eb98b5b23d20b1c0'
          s=raw.decode()
          changes=[
          ("HOSTS=('stoletov.ru','parkingsvo.ru','parking.svo.aero','parking.svo.su')", "CATALOG_HOSTS=('stoletov.ru','samson-pharma.ru')\nHOSTS=CATALOG_HOSTS+('parkingsvo.ru','parking.svo.aero','parking.svo.su')"),
          ("if u.netloc=='stoletov.ru' and path in ('/catalog/groups/',STOLETOV,STOLETOV.rstrip('/')):","if u.netloc in CATALOG_HOSTS and (path in (STOLETOV,STOLETOV.rstrip('/')) or (u.netloc=='stoletov.ru' and path=='/catalog/groups/')):"),
          ("if (a.netloc=='stoletov.ru')!=(b.netloc=='stoletov.ru'):raise ValueError('al_cross_partner_redirect')", "if (a.netloc in CATALOG_HOSTS or b.netloc in CATALOG_HOSTS) and a.netloc!=b.netloc:raise ValueError('al_cross_partner_redirect')"),
          ("            if link['field']=='partner_url' or not RULE_LABEL.search(link['label']):continue\n            item={'url':link['url'],'label':link['label'],'classification':'outside_reviewed_rule_scope'};inventory.append(item)\n            try:\n                url=checked_url(link['url'])\n                if urlsplit(url).path=='/robots.txt':continue\n            except ValueError:continue\n            item['classification']='selected_public_rules'\n", "            if link['field']=='partner_url':continue\n            item={'url':link['url'],'label':link['label'],'classification':'outside_reviewed_rule_scope'}\n            try:\n                url=checked_url(link['url'])\n                if urlsplit(url).path=='/robots.txt':continue\n            except ValueError:\n                if RULE_LABEL.search(link['label']):inventory.append(item)\n                continue\n            # A reviewed rule route can be labelled merely \"on the website\".\n            item['classification']='selected_public_rules';inventory.append(item)\n"),
          ("if u.scheme!='https' or u.netloc!='stoletov.ru' or u.fragment or u.username or u.password or (u.query and not re.fullmatch(r'page=[1-9][0-9]?',u.query)):","if u.scheme!='https' or u.netloc not in CATALOG_HOSTS or u.netloc!=urlsplit(url).netloc or u.fragment or u.username or u.password or (u.query and not re.fullmatch(r'page=[1-9][0-9]?',u.query)):"),
          ("checked_url(url);dom=BeautifulSoup(raw,'html.parser');main=dom.find('main')\n    if main is None:raise ValueError('al_catalog_structure')", "checked_url(url);host=urlsplit(url).netloc;dom=BeautifulSoup(raw,'html.parser');main=dom.find('main')\n    if host not in CATALOG_HOSTS or main is None:raise ValueError('al_catalog_structure')"),
          ("counts=main.select('.app-main-title_count');notes=main.select('[class*=\"CatalogSlugsPage_headerSubText\"]')", "counts=main.select('.app-main-title_count')\n    note_class='CatalogSlugs_bottomText' if host=='samson-pharma.ru' else 'CatalogSlugsPage_headerSubText'\n    notes=main.select('[class*=\"'+note_class+'\"]')"),
          ("if not name or u.scheme!='https' or u.netloc!='stoletov.ru' or not u.path.startswith('/catalog/') or u.query:raise ValueError('al_product_identity')", "if not name or u.scheme!='https' or u.netloc!=host or not u.path.startswith('/catalog/') or u.query or u.fragment:raise ValueError('al_product_identity')"),
          ("if urlsplit(link).netloc!='stoletov.ru' or urlsplit(link).path!=STOLETOV:raise ValueError('al_pagination_scope')", "if urlsplit(link).netloc!=host or urlsplit(link).path!=STOLETOV:raise ValueError('al_pagination_scope')"),
          ("if urlsplit(url).netloc!='stoletov.ru':raise ValueError('al_expected_parking_pdf')", "if urlsplit(url).netloc not in CATALOG_HOSTS:raise ValueError('al_expected_parking_pdf')")]
          for old,new in changes:
              assert s.count(old)==1,old
              s=s.replace(old,new)
          compile(s,str(p),'exec');p.write_text(s)
          p=Path('loyalty/normalized.py');raw=p.read_bytes()
          assert blob(raw)=='e777bf432560ca55a0f644d2267d49a93e6485bc'
          s=raw.decode();old="HOSTS['aeroflot_linked_rules']=['stoletov.ru','parkingsvo.ru','parking.svo.aero','parking.svo.su']"
          assert s.count(old)==1
          s=s.replace(old,"HOSTS['aeroflot_linked_rules']=['stoletov.ru','samson-pharma.ru','parkingsvo.ru','parking.svo.aero','parking.svo.su']")
          compile(s,str(p),'exec');p.write_text(s)
          PY
      - name: Run complete regression suites and preserve executed bytes
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee samson-verification/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee samson-verification/key-tests.log
          git diff -- loyalty/aeroflot_linked_rules.py loyalty/normalized.py > samson-verification/change.patch
          tar -cf samson-verification/code.tar loyalty key .github/workflows
      - name: Commit only the two tested Python files to this isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = 'Floppa2003/key-privileges'
          test "$GITHUB_REF" = 'refs/heads/loyalty/samson-linked-20260918'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/aeroflot_linked_rules.py loyalty/normalized.py
          git commit -m 'Read reviewed pharmacy rules despite generic link labels'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/loyalty/samson-linked-20260918
          git rev-parse HEAD > samson-verification/proposed-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: samson-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: samson-verification/
          retention-days: 7
