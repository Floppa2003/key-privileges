name: Free provider vision probes 20261024
on:
  push:
    branches: [loyalty/free-provider-eval-20261024]
    paths: [.github/workflows/free-provider-eval-20261024.yml]
permissions:
  contents: read
concurrency:
  group: free-provider-eval-20261024
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependencies before tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
      - name: Full project regression and new transport tests without secrets
        run: |
          mkdir -p output
          git rev-parse HEAD > output/commit.txt
          git archive HEAD -o output/source.zip
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual:$GITHUB_WORKSPACE/loyalty/experiments/simple_thinking"
          status=0
          for dir in loyalty/tests loyalty/experiments/cloud_json loyalty/experiments/free_providers_20261024; do
            python -m unittest discover -s "$dir" -p 'test_*.py' -v > "output/$(basename "$dir").log" 2>&1 || status=1
          done
          node --test key/refresh.test.mjs > output/key.log 2>&1 || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-regression-${{ github.run_id }}
          path: output/
          retention-days: 30
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - provider: orca
            secret: ORCAROUTER_API_KEY
          - provider: harbor
            secret: TOKENHARBOR_API_KEY
          - provider: opencode
            secret: OPENCODE_API_KEY
          - provider: openrouter
            secret: OPENROUTER_API_KEY
          - provider: vercel
            secret: AI_GATEWAY_API_KEY
          - provider: gemini
            secret: GEMINI_API_KEY
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install and test transport without credentials
        run: |
          python -m pip install requests==2.32.5 Pillow==12.3.0 jsonschema==4.26.0
          python -m unittest discover -s loyalty/experiments/free_providers_20261024 -v
          mkdir -p output/code
          cp loyalty/experiments/free_providers_20261024/*.py output/code/
          git rev-parse HEAD > output/commit.txt
      - name: One synthetic image request per exact free model, no automatic retries
        env:
          LLM_PROVIDER_KEY: ${{ secrets[matrix.secret] }}
        run: |
          python loyalty/experiments/free_providers_20261024/routes.py --provider '${{ matrix.provider }}' --out output/results
      - name: Preserve result hashes
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('output');r.mkdir(exist_ok=True)
          (r/'SHA256SUMS.json').write_text(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest()for p in r.rglob('*')if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-${{ matrix.provider }}-${{ github.run_id }}
          path: output/
          retention-days: 30
