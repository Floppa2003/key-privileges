name: Diagnose rejected public catalogue cards
on:
  push:
    branches: ["loyalty/public-catalogues-release-20260923"]
    paths: ["diagnostics/catalogue_remaining_shapes.py", ".github/workflows/catalogue-shapes-once.yml"]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Floppa2003/key-privileges'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: xvfb-run -a python diagnostics/catalogue_remaining_shapes.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: catalogue-remaining-shapes-${{ github.run_id }}
          path: catalogue-remaining-shapes/
          retention-days: 1
          if-no-files-found: error
