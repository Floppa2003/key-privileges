name: Inspect public loyalty sources
on:
  push:
    branches: [loyalty/source-expansion]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - name: Read-only diagnostics if present
        run: |
          if test -f loyalty/inspect_sources.py; then
            python -m playwright install --with-deps chromium
            python loyalty/inspect_sources.py
          fi
      - name: Snapshot public code and diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loyalty-inspection-${{ github.run_id }}
          path: |
            loyalty/*.py
            loyalty/*.json
            loyalty/*.sh
            loyalty/*.md
            loyalty/requirements.txt
            loyalty/tests/*.py
            key/*.mjs
            key/*.json
            .github/workflows/loyalty.yml
            .github/workflows/loyalty-request.yml
            inspection-output/
          include-hidden-files: true
          retention-days: 7
