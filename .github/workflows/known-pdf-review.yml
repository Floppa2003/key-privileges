name: Inspect known public PDF rules
on:
  push:
    branches: [loyalty/known-source-completion]
    paths: [.github/workflows/known-pdf-review.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Retrieve public documents using the existing bounded PDF reader
        run: |
          mkdir -p public-pdf-review
          python - <<'PY'
          import asyncio,json,hashlib,sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from playwright.async_api import async_playwright
          from public_transport import PublicSource
          URLS=[('primbank','https://www.primbank.ru/d/tariffs-aeroflot-bonus'),('finuslugi','https://assets.finuslugi.ru/sc-disclosure/293d2bf4-16c4-46c6-87a5-0a2d35d18ad8')]
          async def main():
              out=Path('public-pdf-review');reports=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      for key,url in URLS:
                          r={'id':key,'url':url,'observed_at':datetime.now(timezone.utc).isoformat()}
                          try:
                              async with asyncio.timeout(70):
                                  async with PublicSource(browser,url) as c:
                                      await c.robots()
                                      data=await c.read_pdf(url)
                                      (out/(key+'.pdf')).write_bytes(data)
                                      r.update(status='pdf_read',bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                          except Exception as exc:r.update(status='failed',reason=str(exc)[:180] if isinstance(exc,RuntimeError) else type(exc).__name__)
                          reports.append(r)
                  finally:await browser.close()
              (out/'report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding='utf8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: known-pdf-review-${{ github.run_id }}
          path: public-pdf-review/
          retention-days: 7
