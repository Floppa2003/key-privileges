name: Confirm live direct document discovery
on:
  push:
    branches: [loyalty/public-crawl-expansion]
    paths: [.github/workflows/direct-documents-confirm.yml]
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus
      - name: Regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p direct-confirm-output
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee direct-confirm-output/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee direct-confirm-output/key-tests.log
      - run: python -m playwright install --with-deps chromium
      - name: Exercise current source through production dispatcher
        shell: bash
        run: |
          python - <<'PY'
          import asyncio,hashlib,json,os,sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from collect_normalized import one
          from playwright.async_api import async_playwright
          from sheets_normalized import prepare
          async def main():
            cfg=next(c for c in json.loads(Path('loyalty/sources_normalized.json').read_text()) if c['id']=='utair_rule_documents')
            now=datetime.now(timezone.utc).isoformat()
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              try:report,rows=await one(browser,cfg,now,200)
              finally:await browser.close()
            bundle={'schema_version':2,'run_id':os.environ['GITHUB_RUN_ID']+':1','observed_at':now,'records':rows,'sources':[report]}
            prepare(bundle)
            Path('direct-confirm-output/normalized.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2))
            assert report['status']=='ok',report['errors']
            coverage=json.loads(report['coverage'])
            assert coverage['direct_links_discovered']>0
            assert coverage['links_read']==coverage['discovered_links']
            assert any(r['native_id'].startswith('direct-document:') for r in rows)
            assert all('X-Amz-' not in json.dumps(r) for r in rows)
          asyncio.run(main())
          PY
      - name: Archive actual executed code
        if: always()
        shell: bash
        run: |
          mkdir -p direct-confirm-output
          git rev-parse HEAD > direct-confirm-output/execution-commit.txt
          tar --exclude='__pycache__' -cf direct-confirm-output/code.tar loyalty key
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          hashes={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('loyalty').rglob('*') if p.is_file() and '__pycache__' not in str(p)}
          Path('direct-confirm-output/code-hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-documents-confirm-${{ github.run_id }}
          path: direct-confirm-output/
          retention-days: 7
