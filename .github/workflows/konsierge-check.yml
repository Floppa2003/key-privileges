name: Konsierge public source check
on:
  push:
    branches: ['loyalty/konsierge-public-20260919']
    paths: ['.github/workflows/konsierge-check.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read anonymous public catalogue through ordinary browser transport
        run: |
          mkdir -p konsierge-check
          python - <<'PY'
          import asyncio,hashlib,json,re,sys,time
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlsplit,urljoin
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          out=Path('konsierge-check');root='https://konsierge.com/benefits'
          report={'observed_at':datetime.now(timezone.utc).isoformat(),'bank_or_app_authentication':False,'provider_calls':0,'published':False,'network':[],'scripts':[]}
          def sanitize(raw):
              soup=BeautifulSoup(raw,'html.parser')
              for n in soup.select('script:not([src]),form,meta[name*=token],input[type=hidden]'):
                  if n.parent is not None:n.decompose()
              for n in soup.find_all(True):
                  for a in list(n.attrs):
                      if re.search('token|csrf|secret|password|authorization',a,re.I):del n.attrs[a]
              return str(soup)
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  async with PublicSource(browser,root) as c:
                      c.deadline=time.monotonic()+210
                      try:
                          await asyncio.wait_for(c.robots(),105)
                          report['robots']=c.robots_info
                          def observe(resp):
                              req=resp.request;u=urlsplit(resp.url)
                              if u.hostname=='konsierge.com' and req.resource_type in ('xhr','fetch'):
                                  report['network'].append({'path':u.path,'query':u.query if re.fullmatch(r'[A-Za-z0-9_=&,%.-]*',u.query) and not re.search('token|key|secret|auth',u.query,re.I) else '[omitted]','method':req.method,'status':resp.status})
                          c.page.on('response',observe)
                          raw=await c.read(root,render=True)
                          report['initial_sha256']=hashlib.sha256(raw.encode()).hexdigest()
                          (out/'initial.html').write_text(sanitize(raw))
                          soup=BeautifulSoup(raw,'html.parser')
                          scripts=list(dict.fromkeys(urljoin(root,x['src']) for x in soup.select('script[src]')))
                          report['script_urls']=[u for u in scripts if urlsplit(u).netloc=='konsierge.com']
                          for i,u in enumerate(report['script_urls'][:8]):
                              body=await c.read(u)
                              if len(body)>1500000:continue
                              # Only public source static code, never tokens/cookies/account data.
                              if re.search(r'(?i)(?:bearer\s+[A-Za-z0-9_.-]{15}|["\'](?:api[_-]?key|access_token|secret)["\']\s*:\s*["\'][^"\']{8})',body):
                                  report['scripts'].append({'url':u,'not_stored':'credential_like_literal'});continue
                              name=f'script-{i}.js';(out/name).write_text(body)
                              report['scripts'].append({'url':u,'file':name,'sha256':hashlib.sha256(body.encode()).hexdigest()})
                          await c.page.evaluate('window.scrollTo(0,document.body.scrollHeight)')
                          await c.page.wait_for_timeout(2500)
                          after=await c.page.content();(out/'after-scroll.html').write_text(sanitize(after))
                          report['after_sha256']=hashlib.sha256(after.encode()).hexdigest()
                          await c.page.screenshot(path=str(out/'catalogue.png'),full_page=True)
                          report['public_page_read']=True
                      except Exception as exc:
                          report['error']=str(exc) if isinstance(exc,RuntimeError) else type(exc).__name__
                          report['robots']=getattr(c,'robots_info',None)
                  await browser.close()
          asyncio.run(main())
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
          git rev-parse HEAD > konsierge-check/commit.txt
          git archive HEAD loyalty key .github/workflows > konsierge-check/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-check-${{ github.run_id }}
          path: konsierge-check/
          retention-days: 7
