name: Konsierge public source check
on:
  push:
    branches: ['loyalty/konsierge-public-20260919']
    paths: ['.github/workflows/konsierge-check.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5
      - name: Public read methods and native chunk names; no credentials retained
        run: |
          mkdir -p konsierge-check
          python - <<'PY'
          import hashlib,json,re,time
          from pathlib import Path
          from datetime import datetime,timezone
          import requests
          report={'observed_at':datetime.now(timezone.utc).isoformat(),'source_credentials_used':False,'published':False,'assets':[],'read_methods':[]}
          def get(url):
              time.sleep(.5)
              with requests.Session() as s:
                  s.trust_env=False;r=s.get(url,timeout=(6,22),allow_redirects=False)
                  report['assets'].append({'url':url,'status':r.status_code,'sha256':hashlib.sha256(r.content).hexdigest()})
                  if r.status_code!=200 or r.headers.get('Retry-After') or len(r.content)>1000000:raise RuntimeError('asset_failed')
                  return r.text
          fields={'page','per','perPage','per_page','limit','offset','rubric','rubric_id','category_id','id','title','name','offer','description','sort','order','count','total','asc','desc','/','.json','?','&','='}
          def red(m):
              v=m[0][1:-1]
              if v in fields or re.fullmatch(r'/?(?:api/)?(?:v\d/)?(?:benefits?|rubrics|categories)(?:[/?.=&a-zA-Z0-9_-]{0,60})',v):return json.dumps(v)
              return '"[omitted]"'
          def methods(body,url):
              for m in re.finditer(r'(?:getBenefits(?:Rubrics)?|getElements|onValidScroll|loadElements|loadMore|loadPage)\([^)]{0,80}\)\{',body):
                  start=m.start();pos=m.end();depth=1
                  while pos<len(body) and depth and pos-start<4000:
                      if body[pos]=='{':depth+=1
                      elif body[pos]=='}':depth-=1
                      pos+=1
                  if depth:continue
                  fragment=body[start:pos]
                  if re.search('Basic|Bearer|token|secret|credential|cookie',fragment,re.I):
                      report['read_methods'].append({'url':url,'method':m[0].split('(')[0],'omitted':'configuration_reference'});continue
                  fragment=re.sub(r'"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'',red,fragment)
                  report['read_methods'].append({'url':url,'code':fragment})
          try:
              origin='https://konsierge.com';runtime=get(origin+'/runtime.a77998f0e7d2a878d619.js')
              maps=[]
              for part in re.findall(r'\{(?:\d+:"[A-Za-z0-9_-]+",?)+\}',runtime):maps.append(dict(re.findall(r'(\d+):"([A-Za-z0-9_-]+)"',part)))
              report['native_chunk_maps']=maps
              hashes=next(m for m in maps if '8' in m and re.fullmatch('[a-f0-9]{15,64}',m['8']))
              names={k:v for m in maps for k,v in m.items() if not re.fullmatch('[a-f0-9]{15,64}',v)}
              common=origin+'/'+names.get('0','0')+'.'+hashes['0']+'.js'
              methods(get(common),common)
              main=origin+'/main.ce1ad5b7d9563083e6bc.js';methods(get(main),main)
          except Exception as e:report['error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
          Path('konsierge-check/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-methods-${{ github.run_id }}
          path: konsierge-check/
          retention-days: 7
