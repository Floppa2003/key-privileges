name: Konsierge public source check
on:
  push:
    branches: ['loyalty/konsierge-public-20260919']
    paths: ['.github/workflows/konsierge-check.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5
      - name: Static route discovery only, no accounts or embedded credential use
        run: |
          mkdir -p konsierge-check
          python - <<'PY'
          import hashlib,json,re,time
          from datetime import datetime,timezone
          from pathlib import Path
          import requests
          out=Path('konsierge-check');origin='https://konsierge.com'
          runtime=origin+'/runtime.a77998f0e7d2a878d619.js'
          report={'observed_at':datetime.now(timezone.utc).isoformat(),'source_credentials_used':False,'published':False,'assets':[]}
          def get(url):
              time.sleep(.6)
              with requests.Session() as s:
                  s.trust_env=False
                  with s.get(url,timeout=(6,25),allow_redirects=False,stream=True) as r:
                      item={'url':url,'status':r.status_code};report['assets'].append(item)
                      if r.status_code!=200 or r.headers.get('Retry-After'):raise RuntimeError('asset_http_'+str(r.status_code))
                      raw=bytearray()
                      for part in r.iter_content(65536):
                          raw.extend(part)
                          if len(raw)>1500000:raise RuntimeError('size_bound')
                      item['sha256']=hashlib.sha256(raw).hexdigest();item['bytes']=len(raw)
                      return raw.decode('utf8'),item
          try:
              raw,info=get(runtime)
              maps=re.findall(r'\{(?:\d+:"[a-f0-9]+",?)+\}',raw)
              mapping={}
              for m in maps:
                  values=dict(re.findall(r'(\d+):"([a-f0-9]{10,64})"',m))
                  if '8' in values:mapping=values;break
              # Runtime explicitly constructs numeric chunk + dot + hash + .js.
              marker=re.search(r'\+"\."\+\{(?:\d+:"[a-f0-9]+",?)+\}\[[a-zA-Z]+\]\+"\.js"',raw)
              if not mapping or not marker:raise RuntimeError('native_chunk_filename_template_not_confirmed')
              report['chunk_file_map']=mapping;report['native_template_confirmed']=True
              for ident in ('8','0','4','2','1'):
                  if ident not in mapping:continue
                  url=origin+'/'+ident+'.'+mapping[ident]+'.js';body,item=get(url)
                  literals=[]
                  for m in re.finditer(r'(["\'])([^"\'\r\n]{1,180})\1',body):
                      value=m[2]
                      if re.fullmatch(r'/?(?:api/)?(?:v\d/)?(?:benefits?|categories|rubrics|offers?|tags|details|search|page|per_page|limit|offset|description|name|title|id|benefit_id|category_id|type|cities|filters?)(?:[a-zA-Z0-9_/?.=&-]{0,100})',value,re.I):
                          literals.append(value)
                  item['public_route_and_field_literals']=sorted(set(literals))
                  item['http_call_patterns']=[]
                  for m in re.finditer(r'\.(?:get|post)\(',body):
                      fragment=body[m.start():m.start()+180]
                      # Retain only expressions composed of short identifier/path literals.
                      if re.search('auth|token|password|secret|cookie|credential|Basic|Bearer',fragment,re.I):continue
                      if re.search(r'[a-zA-Z0-9+_=-]{28,}',fragment):continue
                      if 'benefit' in fragment.lower() or 'categor' in fragment.lower():item['http_call_patterns'].append(fragment)
              report['complete']=True
          except Exception as e:report['error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
          git rev-parse HEAD > konsierge-check/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-routes-${{ github.run_id }}
          path: konsierge-check/
          retention-days: 7
