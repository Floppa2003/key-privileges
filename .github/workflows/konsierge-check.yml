name: Konsierge public source check
on:
  push:
    branches: ['loyalty/konsierge-public-20260919']
    paths: ['.github/workflows/konsierge-check.yml']
permissions: {contents: read}
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {contents: read, actions: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Remove this investigation's source-code excerpt artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          api='https://api.github.com/repos/Floppa2003/key-privileges/actions/artifacts/10588829639'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          try:
              with urllib.request.urlopen(urllib.request.Request(api,headers=headers,method='DELETE'),timeout=25) as r:status=r.status
          except urllib.error.HTTPError as e:status=e.code
          if status not in (204,404):raise RuntimeError('artifact_cleanup_failed')
          try:
              with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=25) as r:readback=r.status
          except urllib.error.HTTPError as e:readback=e.code
          assert readback==404
          print(json.dumps({'artifact_id':10588829639,'delete_status':status,'independent_readback':readback,'credential_values_not_logged':True}))
          PY
      - run: python -m pip install requests==2.32.5
      - name: Read only public policy endpoints on first-party catalogue hosts
        run: |
          mkdir -p konsierge-check
          python - <<'PY'
          import concurrent.futures,json
          from pathlib import Path
          from datetime import datetime,timezone
          import requests
          def read(url):
              row={'url':url}
              try:
                  with requests.Session() as s:
                      s.trust_env=False
                      r=s.get(url,timeout=(5,12),allow_redirects=False)
                      row['status']=r.status_code
                      if r.status_code==200 and len(r.content)<=100000:row['public_robots_text']=r.text
              except Exception as e:row['error']=type(e).__name__
              return row
          urls=['https://benefits.konsierge.com/robots.txt','https://news.konsierge.com/robots.txt']
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:rows=list(pool.map(read,urls))
          report={'observed_at':datetime.now(timezone.utc).isoformat(),'requests':rows,'source_credentials_used':False,'published':False}
          Path('konsierge-check/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-cleanup-${{ github.run_id }}
          path: konsierge-check/
          retention-days: 7
