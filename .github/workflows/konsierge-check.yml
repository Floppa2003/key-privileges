name: Konsierge public source check
on:
  push:
    branches: ['loyalty/konsierge-public-20260919']
    paths: ['.github/workflows/konsierge-check.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: One anonymous native catalogue endpoint read
        run: |
          mkdir -p konsierge-check
          python - <<'PY'
          import hashlib,json,sys,time
          from datetime import datetime,timezone
          from pathlib import Path
          import requests
          from protego import Protego
          sys.path.insert(0,'loyalty')
          from public_transport import robots_document
          origin='https://benefits.konsierge.com';url=origin+'/api/client/v1/benefits'
          report={'observed_at':datetime.now(timezone.utc).isoformat(),'url':url,'source_credentials_used':False,'cookie_replay':False,'published':False,'catalogue_complete':False}
          try:
              with requests.Session() as s:
                  s.trust_env=False;s.headers['User-Agent']='LoyaltyCatalogResearchBot/1.0'
                  r=s.get(origin+'/robots.txt',timeout=(6,15),allow_redirects=False)
                  rules,state=robots_document(r.status_code,r.text);report['robots']={'status':r.status_code,'state':state}
                  if r.headers.get('Retry-After'):raise RuntimeError('robots_retry_after')
                  if not Protego.parse(rules).can_fetch(url,'LoyaltyCatalogResearchBot'):raise RuntimeError('robots_disallow')
                  s.cookies.clear();time.sleep(.5)
                  with s.get(url,timeout=(6,20),allow_redirects=False,stream=True) as r:
                      report['status']=r.status_code;report['retry_after_present']=bool(r.headers.get('Retry-After'))
                      if r.status_code in (401,403):report['outcome']='authentication_or_access_required_no_retry'
                      elif r.status_code==200 and not report['retry_after_present']:
                          raw=bytearray()
                          for part in r.iter_content(65536):
                              raw.extend(part)
                              if len(raw)>1500000:raise RuntimeError('size_bound')
                          data=json.loads(raw);report['response_sha256']=hashlib.sha256(raw).hexdigest()
                          report['top_level_fields']=list(data) if isinstance(data,dict) else ['list']
                          items=data.get('result',[]) if isinstance(data,dict) else []
                          report['item_count']=len(items) if isinstance(items,list) else None
                          report['public_card_previews']=[{k:x[k] for k in ('id','name','offer','link') if k in x} for x in items[:12] if isinstance(x,dict)]
                          report['outcome']='json_read_not_yet_scope_verified'
                      else:report['outcome']='http_not_accepted'
          except Exception as e:report['error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
          Path('konsierge-check/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-anonymous-api-${{ github.run_id }}
          path: konsierge-check/
          retention-days: 7
