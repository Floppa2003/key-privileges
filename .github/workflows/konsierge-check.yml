name: Konsierge public source check
on:
  push:
    branches: ['loyalty/konsierge-public-20260919']
    paths: ['.github/workflows/konsierge-check.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - name: Inspect public source code without executing it or using credentials
        run: |
          mkdir -p konsierge-check
          python - <<'PY'
          import concurrent.futures,hashlib,json,re,time
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          import requests
          from bs4 import BeautifulSoup
          out=Path('konsierge-check');root='https://konsierge.com/benefits'
          script='https://konsierge.com/main.ce1ad5b7d9563083e6bc.js'
          report={'observed_at':datetime.now(timezone.utc).isoformat(),'inspection_only':True,'bank_or_app_authentication':False,'published':False,'requests':[]}
          def get(url,headers=None):
              meta={'url':url,'response_at':None}
              try:
                  with requests.Session() as s:
                      s.trust_env=False
                      with s.get(url,headers=headers or {},timeout=(6,40),allow_redirects=False,stream=True) as r:
                          meta['status']=r.status_code
                          if r.status_code==429 or r.headers.get('Retry-After'):raise RuntimeError('rate_limit_stop')
                          if r.status_code!=200:return meta,''
                          raw=bytearray()
                          for part in r.iter_content(65536):
                              raw.extend(part)
                              if len(raw)>4500000:raise RuntimeError('size_bound')
                          meta['response_at']=datetime.now(timezone.utc).isoformat();meta['sha256']=hashlib.sha256(raw).hexdigest();meta['bytes']=len(raw)
                          return meta,raw.decode('utf8')
              except Exception as e:meta['error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__;return meta,''
          def scrub(s):
              s=re.sub(r'(?i)(["\'](?:access_token|refresh_token|api[_-]?key|password|secret)["\']\s*[:=]\s*)["\'][^"\']+["\']',r'\1"[omitted]"',s)
              return re.sub(r'(?i)bearer\s+[a-z0-9_.-]{12,}','Bearer [omitted]',s)
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              futures=[pool.submit(get,script),pool.submit(get,root),pool.submit(get,'https://r.jina.ai/https://konsierge.com/robots.txt',{'Accept':'application/json','X-Return-Format':'text','X-No-Cache':'true','X-Timeout':'15'})]
              values=[f.result() for f in futures]
          for (meta,body) in values:
              report['requests'].append(meta)
              if not body:continue
              if meta['url']==script:
                  urls=[]
                  for u in re.findall(r'https?://[^\s"\'<>\\]{4,240}',body):
                      try:p=urlsplit(u)
                      except ValueError:continue
                      if p.hostname and any(v in p.hostname for v in ('konsierge','apcg','quintessentially')):urls.append(p.scheme+'://'+p.netloc+p.path)
                  report['source_owned_url_literals']=sorted(set(urls))
                  spans=[]
                  for m in list(re.finditer(r'getBenefits|getBenefit|benefits|apiUrl|baseUrl',body))[:140]:spans.append(scrub(body[max(0,m.start()-650):m.end()+1200]))
                  (out/'source-code-excerpts.json').write_text(json.dumps(spans,ensure_ascii=False,indent=2))
              elif meta['url']==root:
                  soup=BeautifulSoup(body,'html.parser');report['embedded_state_nodes']=[]
                  for n in soup.select('script[type="application/json"]'):
                      state=n.string or n.get_text();info={'id':n.get('id'),'characters':len(state)}
                      try:
                          data=json.loads(state);info['top_level_keys']=list(data)[:40] if isinstance(data,dict) else ['list']
                          if 'benefit' in state.lower() and not re.search(r'(?i)"(?:access_token|refresh_token|password|secret|csrf)"',state):
                              name='public-transfer-state.json';(out/name).write_text(state);info['stored_file']=name
                      except Exception:info['parse_error']=True
                      report['embedded_state_nodes'].append(info)
              else:
                  meta['body']=scrub(body)[:12000]
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
          git rev-parse HEAD > konsierge-check/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-check-${{ github.run_id }}
          path: konsierge-check/
          retention-days: 7
