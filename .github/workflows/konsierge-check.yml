name: Konsierge public source check
on:
  push:
    branches: ['loyalty/konsierge-public-20260919']
    paths: ['.github/workflows/konsierge-check.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5
      - name: Retain code structure and approved public paths only
        run: |
          mkdir -p konsierge-check
          python - <<'PY'
          import hashlib,json,re,time,concurrent.futures
          from datetime import datetime,timezone
          from pathlib import Path
          import requests
          out=Path('konsierge-check')
          urls=['https://konsierge.com/8.452035ef1e371fa0e22e.js','https://konsierge.com/4.a36972f331f4cbd99082.js','https://konsierge.com/0.92bdba30978f407e2edb.js']
          def scrub_literal(m):
              raw=m.group(0)
              try:v=json.loads(raw) if raw.startswith('"') else raw[1:-1]
              except Exception:return '"[omitted]"'
              fields={'page','per_page','perPage','offset','limit','count','total','title','name','id','benefitId','benefit_id','offerText','description','rubric','rubrics','category','category_id','categories','image','api','v1','v2','benefits','benefit','search','sort','order','filter','filters','list','item','data','asc','desc','GET','POST'}
              path=bool(re.fullmatch(r'/?(?:api/)?(?:v\d/)?(?:benefits?|rubrics|categories|filters?)(?:[/?.=&A-Za-z0-9_-]{0,60})',v,re.I))
              return json.dumps(v) if v in fields or path or v in ('/','?','&','=','.json') else '"[omitted]"'
          def read(url):
              row={'url':url}
              try:
                  with requests.Session() as s:
                      s.trust_env=False
                      r=s.get(url,timeout=(6,22),allow_redirects=False)
                      row['status']=r.status_code
                      if r.status_code!=200 or r.headers.get('Retry-After'):return row
                      if len(r.content)>150000:raise RuntimeError('unreviewed_large_asset')
                      row['sha256']=hashlib.sha256(r.content).hexdigest()
                      body=re.sub(r'"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'',scrub_literal,r.text)
                      # No unsanitized snippets, headers or complete bundles are persisted.
                      name=url.split('/')[-1]+'.redacted.txt';(out/name).write_text(body);row['file']=name
              except Exception as e:row['error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:rows=list(pool.map(read,urls))
          report={'observed_at':datetime.now(timezone.utc).isoformat(),'source_credentials_used':False,'published':False,'assets':rows}
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-redacted-routes-${{ github.run_id }}
          path: konsierge-check/
          retention-days: 7
