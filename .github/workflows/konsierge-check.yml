name: Konsierge public source check
on:
  push:
    branches: ['loyalty/konsierge-public-20260919']
    paths: ['.github/workflows/konsierge-check.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - name: One public-page inspection; no recursive crawl or policy override
        run: |
          mkdir -p konsierge-check
          python - <<'PY'
          import concurrent.futures,hashlib,json,re
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlsplit,urljoin
          import requests
          from bs4 import BeautifulSoup
          out=Path('konsierge-check');root='https://konsierge.com/benefits'
          report={'observed_at':datetime.now(timezone.utc).isoformat(),'inspection_only':True,'production_robots_gate_unchanged':True,'bank_or_app_authentication':False,'provider_calls':0,'published':False}
          def request(method,url):
              r={'url':url,'method':method}
              try:
                  with requests.Session() as s:
                      s.trust_env=False
                      with s.request(method,url,timeout=(6,15),allow_redirects=False,stream=True) as res:
                          r['http_status']=res.status_code
                          if res.headers.get('Retry-After'):r['retry_after_present']=True;return r
                          if res.status_code in (301,302,303,307,308):
                              u=urlsplit(urljoin(url,res.headers.get('Location','')));r['redirect']=u.scheme+'://'+u.netloc+u.path;return r
                          if method=='HEAD' or res.status_code!=200:return r
                          buf=bytearray()
                          for block in res.iter_content(65536):
                              buf.extend(block)
                              if len(buf)>3000000:raise RuntimeError('response_size_bound')
                          raw=bytes(buf).decode('utf8');r['sha256']=hashlib.sha256(bytes(buf)).hexdigest();r['bytes']=len(buf)
                          soup=BeautifulSoup(raw,'html.parser');r['title']=soup.title.get_text(' ',strip=True) if soup.title else None
                          r['script_urls']=[urljoin(root,n['src']) for n in soup.select('script[src]') if urlsplit(urljoin(root,n['src'])).netloc=='konsierge.com']
                          r['inline_public_routes']=sorted(set(re.findall(r'["\'](/[a-zA-Z0-9_/.-]*(?:benefit|privilege|ajax)[a-zA-Z0-9_/.-]*)["\']',raw,re.I)))
                          for n in soup.select('script,form,input[type=hidden],meta[name*=token]'):
                              if n.parent is not None:n.decompose()
                          for n in soup.find_all(True):
                              for a in list(n.attrs):
                                  if re.search('token|csrf|secret|password|authorization',a,re.I):del n.attrs[a]
                          (out/'public-page.html').write_text(str(soup));r['stored_file']='public-page.html'
              except Exception as exc:r['error']=str(exc) if isinstance(exc,RuntimeError) else type(exc).__name__
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              futures=[pool.submit(request,'HEAD','https://konsierge.com/robots.txt'),pool.submit(request,'GET',root)]
              report['requests']=[f.result() for f in futures]
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
          git rev-parse HEAD > konsierge-check/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-check-${{ github.run_id }}
          path: konsierge-check/
          retention-days: 7
