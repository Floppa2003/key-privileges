# Release verification: PR41 source run was cancelled before jobs by the shared pending-run queue.
name: Aeroflot public catalogue via Google import
on:
  push:
    branches: [main, 'loyalty/aeroflot-google-import-20260916', 'loyalty/airline-coverage-20260916']
    paths: [loyalty/aeroflot_import_catalog.py, loyalty/aeroflot_airlines.py, loyalty/tests/test_aeroflot_airlines.py, loyalty/unified_normalization.py, loyalty/aeroflot_import_collect.py, loyalty/tests/test_aeroflot_import.py, loyalty/normalized.py, .github/workflows/aeroflot-import.yml]
  workflow_dispatch:
    inputs:
      scope:
        description: Catalogue scope (all includes companies and airlines)
        type: choice
        options: [all, companies, airlines]
        default: all
  schedule:
    - cron: '47 8 * * 4'
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Complete regression and retain exact executed code
        run: |
          mkdir -p aeroflot-tests
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee aeroflot-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee aeroflot-tests/key-tests.log
          tar -cf aeroflot-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeroflot-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: aeroflot-tests/
          retention-days: 7
  collect:
    needs: regression
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main' && vars.LOYALTY_SHEETS_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      has_payload: ${{ steps.collect.outputs.has_payload }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Existing identity - only public staging workbook used by this reader
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Discover public Aeroflot pages and read conditions without source accounts
        id: collect
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CATALOG_SCOPE: ${{ github.event_name == 'push' && 'airlines' || inputs.scope || 'all' }}
        run: python loyalty/aeroflot_import_collect.py --scope "$CATALOG_SCOPE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeroflot-import-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: aeroflot-import-output/
          retention-days: 7
  publish:
    needs: collect
    if: >-
      needs.collect.result == 'success' && needs.collect.outputs.has_payload == 'true' &&
      github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main' &&
      vars.LOYALTY_SHEETS_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aeroflot-import-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: aeroflot-source-evidence
      - name: Reconstruct every public record before Google publication
        run: |
          python - <<'PY'
          import os,sys
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from aeroflot_import_collect import validate_bundle
          validate_bundle('aeroflot-source-evidence',run_id=os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],commit=os.environ['GITHUB_SHA'],clock=datetime.now(timezone.utc))
          print('Aeroflot public import evidence reconstructed and validated')
          PY
          python loyalty/sheets_normalized.py --input aeroflot-source-evidence/normalized.json
      - name: Existing short-lived authorization for the original destination
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Existing literal upserts and unified destination readback
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DISCOUNTS_SPREADSHEET_ID: ${{ secrets.DISCOUNTS_SPREADSHEET_ID }}
        run: |
          python loyalty/sheets_normalized.py --input aeroflot-source-evidence/normalized.json --publish
          python loyalty/unified_publish.py --publish
