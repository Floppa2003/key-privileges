name: One-time public merchant build inputs
on:
  push:
    branches: [coverage/public-alternatives-20260924]
    paths: [.github/workflows/public-merchant-build-once.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.3
      - name: Save tracked public code and exact public merchant responses
        run: |
          python - <<'PY'
          import requests,json,hashlib,time,re,subprocess,zipfile
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlsplit,urljoin
          from bs4 import BeautifulSoup
          out=Path('build-inputs');out.mkdir()
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'tracked-public-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in files:
              p=Path(name)
              if name and p.is_file() and not p.is_symlink() and p.stat().st_size<3000000:z.write(p,name)
          report={'code_commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'account_used':False,'credentials_used':False,'forms_submitted':False,'requests':[]}
          targets={
            'itc':'https://itctraining.ru/about/partnery/',
            'london':'https://online-london.com/blog/newblogs/edinaya-karta-peterburzhtsa/',
            'neva_silver':'https://neva.travel/ru/promotions/skidka-10-dlia-vladelcev-kart-serebrianyi-vozrast/',
            'books':'https://lavkapisateley.spb.ru/',
            'benefits_root':'https://benefits.konsierge.com/'}
          def now():return datetime.now(timezone.utc).isoformat()
          for name,url in targets.items():
            item={'id':name,'url':url,'requested_at':now()};report['requests'].append(item)
            try:
              with requests.Session() as s:
                s.trust_env=False
                with s.get(url,headers={'User-Agent':'PublicLoyaltyResearch/1.0'},timeout=(8,25),allow_redirects=False,stream=True) as r:
                  item.update(status=r.status_code,server_date=r.headers.get('Date'),cache_age=r.headers.get('Age'),content_type=r.headers.get('Content-Type'))
                  if r.status_code!=200 or r.headers.get('Retry-After'):
                    item['outcome']='non_200_no_retry';continue
                  data=bytearray();deadline=time.monotonic()+40
                  for part in r.iter_content(65536):
                    data.extend(part)
                    if len(data)>4000000 or time.monotonic()>deadline:raise ValueError('response_bound')
                  raw=bytes(data);item.update(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),outcome='read')
                  dom=BeautifulSoup(raw.decode('utf8',errors='replace'),'html.parser')
                  if name=='benefits_root':
                    item['title']=dom.title.get_text(' ',strip=True)[:150] if dom.title else None
                    item['scripts']=[urljoin(url,x['src']).split('?')[0] for x in dom.select('script[src]') if urlsplit(urljoin(url,x['src'])).hostname=='benefits.konsierge.com']
                    item['login_heading']=bool(re.search(r'авторизация|введите.*телефон|вход',dom.get_text(' ',strip=True),re.I))
                    item['raw_body_saved']=False
                    continue
                  for x in dom.select('script,style,form,input,textarea,iframe,object,embed,noscript'):x.decompose()
                  for x in dom.find_all(True):
                    attrs={k:v for k,v in x.attrs.items() if k in ('id','class','alt','datetime')}
                    if x.name=='a' and x.get('href'):
                      u=urlsplit(urljoin(url,x['href']))
                      if u.scheme in ('http','https') and not u.username and not u.password and not re.search(r'token|session|secret|password|authorization',u.query,re.I):attrs['href']=urljoin(url,x['href'])
                    x.attrs=attrs
                  safe=str(dom).encode();file=name+'.html';(out/file).write_bytes(safe);item.update(file=file,safe_sha256=hashlib.sha256(safe).hexdigest())
            except Exception as e:item.update(outcome='transport_or_bound_error',error=type(e).__name__)
            finally:item['finished_at']=now()
            time.sleep(2)
          report['finished_at']=now();(out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-merchant-build-inputs
          path: build-inputs/
          retention-days: 3
