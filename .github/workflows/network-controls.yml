name: Independent neutral network controls
on:
  push:
    branches: [loyalty/network-feasibility]
    paths: [.github/workflows/network-controls.yml]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Test only two neutral public HTTPS endpoints on existing probes
        run: |
          python - <<'PY'
          import requests,json,re,os,sys,time
          from datetime import datetime,timezone
          from pathlib import Path
          sys.path.insert(0,'global-network-probe')
          from probe import evidence,country_pair
          base='https://api.globalping.io/v1'
          reuse='29snBE6kOhbrf74ht000217mE'
          report={'purpose':'neutral_positive_controls_for_previous_country_comparison','reuse_measurement':reuse,'run_id':os.getenv('GITHUB_RUN_ID'),'observed_at':datetime.now(timezone.utc).isoformat(),'checks':[]}
          session=requests.Session();session.headers.update({'User-Agent':'LoyaltyNetworkResearch/0.1 (+https://github.com/Floppa2003/key-privileges)','Accept':'application/json','Accept-Encoding':'gzip'})
          try:
              for host in ['example.com','www.wikipedia.org']:
                  request={'type':'http','target':host,'locations':reuse,'measurementOptions':{'protocol':'HTTPS','port':443,'ipVersion':4,'request':{'method':'GET','path':'/'}}}
                  response=session.post(base+'/measurements',json=request,timeout=20)
                  if response.status_code!=202:raise RuntimeError('provider_http_'+str(response.status_code))
                  created=response.json();rid=created.get('id','')
                  if not re.fullmatch(r'[A-Za-z0-9_-]{1,80}',rid) or created.get('probesCount')!=2:raise RuntimeError('measurement_identity_mismatch')
                  row={'target':host,'measurement_id':rid,'request':request};report['checks'].append(row)
                  for _ in range(15):
                      response=session.get(base+'/measurements/'+rid,timeout=20)
                      if response.status_code!=200:raise RuntimeError('provider_http_'+str(response.status_code))
                      data=response.json()
                      if data.get('status')!='in-progress':break
                      time.sleep(2)
                  if data.get('status')=='in-progress':raise RuntimeError('control_timeout')
                  if not country_pair(data):raise RuntimeError('country_pair_missing')
                  row['results']=[{'probe':{k:r['probe'].get(k) for k in ('country','city','asn','network')},'result':evidence(r.get('result',{}))} for r in data['results']]
          except Exception as exc:report['error']=str(exc) if isinstance(exc,RuntimeError) else type(exc).__name__
          report['finished_at']=datetime.now(timezone.utc).isoformat()
          Path('control-output').mkdir(exist_ok=True)
          Path('control-output/neutral-controls.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neutral-network-${{ github.run_id }}
          path: control-output/
          retention-days: 7
