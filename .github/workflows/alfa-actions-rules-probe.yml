name: Probe Alfa public action-rules index
on:
  push:
    branches: ['diagnostics/alfa-actions-rules-20260918']
    paths: ['.github/workflows/alfa-actions-rules-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Read public action rules with the existing free provider
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          mkdir -p alfa-actions-probe
          python - <<'PY'
          import hashlib,json,os,re,sys
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          sys.path.insert(0,'loyalty')
          from bs4 import BeautifulSoup
          from protego import Protego
          from free_access_probe import FreeReader,ProbeError
          from public_transport import robots_document,check_response

          root='https://alfabank.ru/actions/rules/'
          reader=FreeReader(os.environ.get('SCRAPINGANT_API_KEY',''),[{'id':'alfa_actions','url':root}],max_credits=11,max_requests=2)
          report={'status':'started','root':root,'account_session_used':False,'publication':False}
          try:
            reader.preflight()
            rs,rr,rc=reader.read('https://alfabank.ru/robots.txt',browser=False)
            rules_text,state=robots_document(rs,rr); rules=Protego.parse(rules_text)
            report['robots']={'origin_status':rs,'state':state,'credits':rc}
            if not rules.can_fetch(root,'LoyaltyCatalogResearchBot'): raise ProbeError('robots_disallow')
            status,raw,credits=reader.read(root,browser=True)
            check_response(status,raw)
            soup=BeautifulSoup(raw,'html.parser')
            text=' '.join(soup.stripped_strings)
            links=[]
            for a in soup.select('a[href]'):
              u=urljoin(root,a['href'])
              p=urlsplit(u)
              if p.scheme=='https' and p.hostname in ('alfabank.servicecdn.ru','alfabank.st'):
                label=' '.join(a.stripped_strings)
                links.append({'label':label[:600],'url':u[:1000]})
            alfa_only=[x for x in links if re.search(r'Alfa\s*Only|Only\b',x['label'],re.I)]
            report.update(status='ok',origin_status=status,credits=credits,html_sha256=hashlib.sha256(raw.encode()).hexdigest(),
              bytes=len(raw.encode()),visible_text_chars=len(text),servicecdn_links=len(links),alfa_only_labeled_links=len(alfa_only),
              alfa_only_links=alfa_only[:300],title=(soup.title.get_text(' ',strip=True) if soup.title else ''))
          except Exception as exc:
            report['status']='failed';report['error']=str(exc) if isinstance(exc,(ProbeError,RuntimeError)) else ('probe_'+type(exc).__name__)
          finally:
            report['known_charged_credits']=reader.known_charged_credits
            Path('alfa-actions-probe/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if report['status']!='ok': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-actions-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-actions-probe/
          retention-days: 7
