name: Durable full collection check
on:
  push:
    branches: ["loyalty/durable-full-collection-20260923"]
    paths: ["loyalty/**", ".github/workflows/durable-collection-check.yml"]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full regression with real pinned dependencies
        run: |
          mkdir -p runtime-evidence
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee runtime-evidence/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee runtime-evidence/key-tests.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: loyalty-public-35714017362-1
          path: historical-public
          run-id: 35714017362
          github-token: ${{ github.token }}
      - name: Replay original daily evidence through the new driver, without new observations
        run: |
          python - <<'PY'
          import asyncio,copy,json,sys,time
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from collection_runtime import atomic_json,collect_batch,execution_health
          from sheets_normalized import prepare
          old=json.loads(Path('historical-public/normalized.json').read_text())
          by_source={r['source_id']:r for r in old['sources']}
          configs=[c for c in json.loads(Path('loyalty/sources_normalized.json').read_text()) if c['id'] in by_source]
          assert len(configs)==len(by_source)
          expected=prepare(old)
          saved=[]
          async def worker(cfg):
              sid=cfg['id']
              return copy.deepcopy(by_source[sid]),[copy.deepcopy(r) for r in old['records'] if r['source_id']==sid]
          def save(results,meta):
              new={**old,'sources':[r for r,_ in results],'records':[r for _,rows in results for r in rows],'collection_runtime':meta}
              atomic_json(Path('runtime-evidence/replayed.json'),new)
              saved.append(meta['completed_sources'])
          started=time.monotonic()
          asyncio.run(collect_batch(configs,worker,lambda c:30,save,old['observed_at'],run_timeout=90))
          new=json.loads(Path('runtime-evidence/replayed.json').read_text())
          assert prepare(new)==expected
          assert execution_health(new,list(by_source))['healthy']
          assert saved[-1]==len(configs)
          Path('runtime-evidence/replay-audit.json').write_text(json.dumps({'historical_run':old['run_id'],'original_observation':old['observed_at'],'sources':len(configs),'records':len(old['records']),'exact_managed_fields_unchanged':True,'checkpoint_writes':len(saved),'elapsed_seconds':time.monotonic()-started,'live_source_requests':0},indent=2))
          print(Path('runtime-evidence/replay-audit.json').read_text())
          PY
      - name: Archive exact reviewed public code
        if: always()
        run: |
          mkdir -p runtime-evidence
          git rev-parse HEAD > runtime-evidence/commit.txt
          git archive --format=tar HEAD > runtime-evidence/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: durable-collection-${{ github.run_id }}
          path: runtime-evidence/
          retention-days: 1
          if-no-files-found: error
