name: Probe public Alfa Only privilege layer
on:
  push:
    branches: ['diagnostics/alfa-public-layer-20260918']
    paths: [.github/workflows/alfa-public-layer-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: One residential-browser test of the public Alfa Only root
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          mkdir -p alfa-public-probe
          python - <<'PY'
          import base64,hashlib,json,os,re,sys
          from pathlib import Path
          import requests
          sys.path.insert(0,'loyalty')
          from bs4 import BeautifulSoup
          from protego import Protego
          from free_access_probe import FreeReader,read_policy,sanitized_page,ProbeError,free_plan
          from public_transport import robots_document,check_response

          url='https://alfabank.ru/everyday/package/premium/'
          key=os.environ.get('SCRAPINGANT_API_KEY','')
          reader=FreeReader(key,[{'id':'alfa_public_root','url':url}],max_credits=1,max_requests=1)
          report={'status':'started','url':url,'account_session_used':False,'publication':False,'proxy_type':'residential','max_credits':126}
          try:
            # Explicit free-plan preflight for the whole 126-credit diagnostic.
            payload,_=reader._request('usage',{})
            left=free_plan(payload)
            if left<126: raise ProbeError('insufficient_free_credits_for_residential_probe')
            reader.ready=True
            info={'state':'fetching'}
            rs,rr,rc=read_policy(reader,'https://alfabank.ru/robots.txt',info)
            rules,state=robots_document(rs,rr); policy=Protego.parse(rules)
            report['robots']={'origin_http_status':rs,'state':state,'credits':rc,'method':info.get('method')}
            if not policy.can_fetch(url,'LoyaltyCatalogResearchBot'): raise ProbeError('robots_disallow')
            js=base64.b64encode("await new Promise(r=>setTimeout(r,3000)); document.documentElement.setAttribute('data-loyalty-probe-location', location.href);".encode()).decode()
            params={'url':url,'browser':'true','proxy_country':'RU','proxy_type':'residential','timeout':'60','js_snippet':js,'block_resource':['image','media','font']}
            raw,meta=reader._request('general',params)
            cost=meta.get('Ant-credits-cost'); page=meta.get('Ant-page-status-code')
            if cost is None or not re.fullmatch(r'\d+',str(cost)) or int(cost)>125: raise ProbeError('residential_credit_cost_unconfirmed')
            if page is None or not re.fullmatch(r'[1-5][0-9]{2}',str(page)): raise ProbeError('origin_status_missing')
            report.update(origin_http_status=int(page),credits=int(cost),known_free_credits_before=left)
            check_response(int(page),raw)
            clean,sm=sanitized_page(raw,url)
            soup=BeautifulSoup(clean,'html.parser'); visible=' '.join(soup.stripped_strings)
            heads=[x.get_text(' ',strip=True) for x in soup.select('h1,h2,h3') if x.get_text(' ',strip=True)]
            report.update(sm);report.update(status='ok',sanitized_sha256=hashlib.sha256(clean.encode()).hexdigest(),headings=heads[:200],text_sample=visible[:25000])
            Path('alfa-public-probe/root.html').write_text(clean)
          except Exception as exc:
            report['status']='failed';report['error']=str(exc) if isinstance(exc,(ProbeError,RuntimeError)) else ('probe_'+type(exc).__name__)
          finally:
            report['datacenter_reserved_credits']=reader.reserved;report['datacenter_known_charged_credits']=reader.known_charged_credits
            Path('alfa-public-probe/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if report['status']!='ok': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-public-layer-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-public-probe/
          retention-days: 7
