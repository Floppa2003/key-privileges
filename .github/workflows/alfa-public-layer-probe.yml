name: Probe public Alfa Only privilege layer
on:
  push:
    branches: ['diagnostics/alfa-public-layer-20260918']
    paths: [.github/workflows/alfa-public-layer-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Inspect the public Alfa Only server shell for public data endpoints
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          mkdir -p alfa-public-probe
          python - <<'PY'
          import hashlib,json,os,re,sys
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          sys.path.insert(0,'loyalty')
          from bs4 import BeautifulSoup
          from protego import Protego
          from free_access_probe import FreeReader,read_policy,ProbeError,public_url
          from public_transport import robots_document,check_response

          url='https://alfabank.ru/everyday/package/premium/'
          roots=[{'id':'alfa_public_root','url':url}]
          reader=FreeReader(os.environ.get('SCRAPINGANT_API_KEY',''),roots,max_credits=2,max_requests=2)
          report={'status':'started','url':url,'account_session_used':False,'publication':False}
          try:
            reader.preflight()
            info={'state':'fetching'}
            rs,rr,rc=read_policy(reader,'https://alfabank.ru/robots.txt',info)
            rules,state=robots_document(rs,rr); policy=Protego.parse(rules)
            report['robots']={'origin_http_status':rs,'state':state,'credits':rc,'method':info.get('method')}
            if not policy.can_fetch(url,'LoyaltyCatalogResearchBot'): raise ProbeError('robots_disallow')
            status,raw,credits=reader.read(url,browser=False)
            report.update(origin_http_status=status,credits=credits,raw_sha256=hashlib.sha256(raw.encode()).hexdigest(),bytes=len(raw.encode()))
            check_response(status,raw)
            soup=BeautifulSoup(raw,'html.parser')
            scripts=[]
            for x in soup.select('script[src]'):
              u=public_url(urljoin(url,x.get('src','')))
              if u and u not in scripts: scripts.append(u)
            links=[]
            for x in soup.select('a[href]'):
              u=public_url(urljoin(url,x.get('href','')))
              if u and u not in links: links.append(u)
            candidates=[]
            for m in re.finditer(r'''(?:https?:)?//[^\"'<>\\s]+|/[A-Za-z0-9_./-]*(?:api|graphql|premium|privilege|offer|cashback)[A-Za-z0-9_?&=./-]*''',raw,re.I):
              value=m.group(0)
              if len(value)<=500 and value not in candidates: candidates.append(value)
            report.update(status='ok',title=soup.title.get_text(' ',strip=True) if soup.title else '',visible_text_chars=len(' '.join(soup.stripped_strings)),
              canonical=[x.get('href') for x in soup.select('link[rel=canonical][href]')][:3],scripts=scripts[:100],links=links[:100],endpoint_candidates=candidates[:200])
          except Exception as exc:
            report['status']='failed';report['error']=str(exc) if isinstance(exc,(ProbeError,RuntimeError)) else ('probe_'+type(exc).__name__)
          finally:
            report.update(reserved_credits=reader.reserved,known_charged_credits=reader.known_charged_credits,calls=reader.calls)
            Path('alfa-public-probe/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if report['status']!='ok': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-public-layer-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-public-probe/
          retention-days: 7
