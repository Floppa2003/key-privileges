name: Probe public Alfa Only privilege layer
on:
  push:
    branches: ['diagnostics/alfa-public-layer-20260918']
    paths: [.github/workflows/alfa-public-layer-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Read one public Alfa Only page through no-key Jina Reader after source policy check
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          mkdir -p alfa-public-probe
          python - <<'PY'
          import hashlib,json,os,re,sys,time
          from pathlib import Path
          import requests
          sys.path.insert(0,'loyalty')
          from protego import Protego
          from free_access_probe import FreeReader,read_policy,ProbeError
          from public_transport import robots_document

          target='https://alfabank.ru/everyday/package/premium/'
          reader=FreeReader(os.environ.get('SCRAPINGANT_API_KEY',''),[{'id':'alfa_public_root','url':target}],max_credits=1,max_requests=1)
          report={'status':'started','target':target,'account_session_used':False,'publication':False,'reader':'jina_no_key'}
          try:
            reader.preflight()
            info={'state':'fetching'}
            rs,rr,rc=read_policy(reader,'https://alfabank.ru/robots.txt',info)
            rules_text,state=robots_document(rs,rr); rules=Protego.parse(rules_text)
            report['robots']={'origin_http_status':rs,'state':state,'credits':rc,'method':info.get('method')}
            if not rules.can_fetch(target,'LoyaltyCatalogResearchBot'): raise ProbeError('robots_disallow')
            url='https://r.jina.ai/'+target
            with requests.get(url,headers={'Accept':'application/json','X-No-Cache':'true','User-Agent':'LoyaltyCatalogResearchBot/1.0'},timeout=(10,60),allow_redirects=False,stream=True) as r:
              if r.status_code!=200: raise ProbeError('jina_http_'+str(r.status_code))
              buf=bytearray()
              for block in r.iter_content(65536):
                buf.extend(block)
                if len(buf)>3_000_000: raise ProbeError('jina_response_bound')
            payload=json.loads(bytes(buf))
            data=payload.get('data',payload) if isinstance(payload,dict) else None
            if not isinstance(data,dict): raise ProbeError('jina_shape')
            content=str(data.get('content','')); title=str(data.get('title','')); final=str(data.get('url','') or data.get('source',''))
            if len(content)<100: raise ProbeError('jina_empty_content')
            if re.search(r'access denied|captcha|проверка безопасности|servicepipe',content[:3000],re.I): raise ProbeError('jina_access_challenge')
            report.update(status='ok',title=title,reported_url=final,content_chars=len(content),content_sha256=hashlib.sha256(content.encode()).hexdigest(),
              evidence_lines=[x.strip()[:500] for x in content.splitlines() if re.search(r'кэшбэк|скидк|РБК|Ultima|ЦУМ|ДЛТ|Альфа.?Мобайл|ресторан',x,re.I)][:120])
            Path('alfa-public-probe/root.md').write_text(content)
          except Exception as exc:
            report['status']='failed';report['error']=str(exc) if isinstance(exc,(ProbeError,RuntimeError)) else ('probe_'+type(exc).__name__)
          finally:
            report.update(scrapingant_reserved_credits=reader.reserved,scrapingant_known_charged_credits=reader.known_charged_credits)
            Path('alfa-public-probe/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if report['status']!='ok': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-public-layer-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-public-probe/
          retention-days: 7
