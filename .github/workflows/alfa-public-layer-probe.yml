name: Probe public Alfa Only privilege layer
on:
  push:
    branches: ['diagnostics/alfa-public-layer-20260918']
    paths: [.github/workflows/alfa-public-layer-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Read two reviewed public Alfa Only pages through the existing free provider
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          mkdir -p alfa-public-probe
          python - <<'PY'
          import hashlib,json,os,sys,time
          from pathlib import Path
          from urllib.parse import urlsplit
          sys.path.insert(0,'loyalty')
          from bs4 import BeautifulSoup
          from protego import Protego
          from free_access_probe import FreeReader,read_policy,sanitized_page,ProbeError
          from public_transport import robots_document,check_response

          BOT='LoyaltyCatalogResearchBot'
          urls=[
            'https://alfabank.ru/everyday/package/premium/',
            'https://alfabank.ru/everyday/package/premium/tsum/',
          ]
          roots=[{'id':'alfa_public_'+str(i),'url':u} for i,u in enumerate(urls)]
          reader=FreeReader(os.environ.get('SCRAPINGANT_API_KEY',''),roots,max_credits=25,max_requests=4)
          report={'status':'started','pages':[],'account_session_used':False,'publication':False}
          try:
            reader.preflight()
            host='alfabank.ru';info={'state':'fetching'}
            status,raw,credits=read_policy(reader,'https://'+host+'/robots.txt',info)
            rules_text,state=robots_document(status,raw)
            policy=Protego.parse(rules_text)
            report['robots']={'origin_http_status':status,'state':state,'method':info.get('method'),'credits':credits}
            for url in urls:
              item={'url':url}
              try:
                if not policy.can_fetch(url,BOT): raise ProbeError('robots_disallow')
                status,raw,credits=reader.read(url,browser=True)
                item.update(origin_http_status=status,credits=credits)
                check_response(status,raw)
                clean,meta=sanitized_page(raw,url)
                soup=BeautifulSoup(clean,'html.parser')
                visible=' '.join(soup.stripped_strings)
                heads=[x.get_text(' ',strip=True) for x in soup.select('h1,h2,h3') if x.get_text(' ',strip=True)]
                item.update(status='ok',sanitized_sha256=hashlib.sha256(clean.encode()).hexdigest(),
                  text_chars=len(visible),headings=heads[:160],text_sample=visible[:12000],**meta)
                Path('alfa-public-probe/'+('root' if url==urls[0] else 'tsum')+'.html').write_text(clean)
              except Exception as exc:
                item['status']='failed';item['error']=str(exc) if isinstance(exc,(ProbeError,RuntimeError)) else 'probe_error'
              report['pages'].append(item)
            report['status']='checked'
          except Exception as exc:
            report['status']='failed';report['error']=str(exc) if isinstance(exc,(ProbeError,RuntimeError)) else 'setup_error'
          finally:
            report.update(reserved_credits=reader.reserved,known_charged_credits=reader.known_charged_credits,calls=reader.calls)
            Path('alfa-public-probe/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if report['status']!='checked' or not any(x.get('status')=='ok' for x in report['pages']): raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-public-layer-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-public-probe/
          retention-days: 7
