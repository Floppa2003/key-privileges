name: Probe public Alfa Only privilege layer
on:
  push:
    branches: ['diagnostics/alfa-public-layer-20260918']
    paths: [.github/workflows/alfa-public-layer-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Let the public Alfa Only challenge and SPA settle before capture
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          mkdir -p alfa-public-probe
          python - <<'PY'
          import base64,hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from bs4 import BeautifulSoup
          from protego import Protego
          import free_access_probe as fp
          from public_transport import robots_document,check_response

          url='https://alfabank.ru/everyday/package/premium/'
          roots=[{'id':'alfa_public_root','url':url}]
          js="await new Promise(r=>setTimeout(r,8000)); document.documentElement.setAttribute('data-loyalty-probe-location', location.href);"
          fp.LOCATION_JS=base64.b64encode(js.encode()).decode()
          reader=fp.FreeReader(os.environ.get('SCRAPINGANT_API_KEY',''),roots,max_credits=12,max_requests=2)
          report={'status':'started','url':url,'account_session_used':False,'publication':False,'wait_ms':8000}
          try:
            reader.preflight()
            info={'state':'fetching'}
            rs,rr,rc=fp.read_policy(reader,'https://alfabank.ru/robots.txt',info)
            rules,state=robots_document(rs,rr); policy=Protego.parse(rules)
            report['robots']={'origin_http_status':rs,'state':state,'credits':rc,'method':info.get('method')}
            if not policy.can_fetch(url,'LoyaltyCatalogResearchBot'): raise fp.ProbeError('robots_disallow')
            status,raw,credits=reader.read(url,browser=True)
            report.update(origin_http_status=status,credits=credits)
            check_response(status,raw)
            clean,meta=fp.sanitized_page(raw,url)
            soup=BeautifulSoup(clean,'html.parser')
            visible=' '.join(soup.stripped_strings)
            headings=[x.get_text(' ',strip=True) for x in soup.select('h1,h2,h3') if x.get_text(' ',strip=True)]
            report.update(meta)
            report.update(status='ok',sanitized_sha256=hashlib.sha256(clean.encode()).hexdigest(),headings=headings[:160],text_sample=visible[:20000])
            Path('alfa-public-probe/root.html').write_text(clean)
          except Exception as exc:
            report['status']='failed';report['error']=str(exc) if isinstance(exc,(fp.ProbeError,RuntimeError)) else ('probe_'+type(exc).__name__)
          finally:
            report.update(reserved_credits=reader.reserved,known_charged_credits=reader.known_charged_credits,calls=reader.calls)
            Path('alfa-public-probe/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if report['status']!='ok': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-public-layer-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-public-probe/
          retention-days: 7
