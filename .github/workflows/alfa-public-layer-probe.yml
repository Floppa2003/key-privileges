name: Probe public Alfa Only privilege layer
on:
  push:
    branches: ['diagnostics/alfa-public-layer-20260918']
    paths: [.github/workflows/alfa-public-layer-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 protego==0.6.2
      - name: Read only reviewed public Alfa Only pages
        run: |
          mkdir -p alfa-public-probe
          python - <<'PY'
          import hashlib,json,re,tempfile
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          import certifi,requests
          from recovered_contract import CA_FILES
          from bs4 import BeautifulSoup
          from protego import Protego

          ROOT='https://alfabank.ru'
          BOT='LoyaltyCatalogResearchBot'
          urls=[
            ROOT+'/everyday/package/premium/',
            ROOT+'/everyday/package/premium/tsum/',
            ROOT+'/everyday/package/premium/restaurants/',
            ROOT+'/everyday/package/premium/lounge/',
          ]
          headers={'User-Agent':BOT+'/1.0'}
          ca_url,ca_sha=CA_FILES[0]
          with requests.Session() as ca:
            ca.trust_env=False
            cr=ca.get(ca_url,timeout=(5,12),allow_redirects=False)
            assert cr.status_code==200,('ca',cr.status_code)
            assert len(cr.content)<=16384,'ca_oversized'
            assert hashlib.sha256(cr.content).hexdigest()==ca_sha,'ca_digest_changed'
            ca_bytes=cr.content
          td=tempfile.TemporaryDirectory()
          bundle=Path(td.name)/'bank-ca.pem'
          bundle.write_bytes(Path(certifi.where()).read_bytes()+b'\n'+ca_bytes)
          s=requests.Session()
          s.trust_env=False
          rob=s.get(ROOT+'/robots.txt',headers=headers,verify=str(bundle),timeout=(8,20),allow_redirects=False)
          assert rob.status_code==200,('robots',rob.status_code)
          rules=Protego.parse(rob.text)
          out={'official_root_sha256':ca_sha,'robots_sha256':hashlib.sha256(rob.content).hexdigest(),'pages':[]}
          for url in urls:
            assert rules.can_fetch(url,BOT),('robots_disallow',url)
            r=s.get(url,headers=headers,verify=str(bundle),timeout=(8,30),allow_redirects=False)
            assert r.status_code in (200,301,302,307,308),(url,r.status_code)
            if r.status_code!=200:
              target=urljoin(url,r.headers.get('Location',''))
              u=urlsplit(target)
              assert u.scheme=='https' and u.netloc=='alfabank.ru',(url,'foreign_redirect',target)
              assert rules.can_fetch(target,BOT),('robots_disallow_redirect',target)
              r=s.get(target,headers=headers,verify=str(bundle),timeout=(8,30),allow_redirects=False)
              assert r.status_code==200,(target,r.status_code)
              url=target
            assert len(r.content)<=4_000_000,(url,'oversized')
            soup=BeautifulSoup(r.text,'html.parser')
            title=(soup.title.get_text(' ',strip=True) if soup.title else '')
            text=' '.join(soup.stripped_strings)
            assert not re.search(r'access denied|captcha|проверка безопасности',title+' '+text[:500],re.I),url
            heads=[x.get_text(' ',strip=True) for x in soup.select('h1,h2,h3') if x.get_text(' ',strip=True)]
            snippets=[]
            patterns=[r'.{0,90}кэшбэк.{0,140}',r'.{0,90}скидк.{0,140}',r'.{0,90}РБК.{0,140}',r'.{0,90}Альфа.?Мобайл.{0,140}',r'.{0,90}приоритетн.{0,140}']
            for p in patterns:
              for m in re.finditer(p,text,re.I):
                value=' '.join(m.group(0).split())
                if value not in snippets: snippets.append(value[:350])
            out['pages'].append({'url':url,'status':r.status_code,'sha256':hashlib.sha256(r.content).hexdigest(),'bytes':len(r.content),'title':title,'headings':heads[:120],'evidence':snippets[:40]})
          open('alfa-public-probe/report.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-public-layer-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-public-probe/
          retention-days: 7
