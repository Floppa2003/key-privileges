name: Only Assist Android compatibility probe
on:
  push:
    branches: ['diagnostics/only-assist-android-20260920']
    paths: ['.github/workflows/only-assist-android-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          python -m pip install requests==2.32.5
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          python -m py_compile diagnostics/only_assist_package.py diagnostics/only_assist_ui_probe.py
      - name: Read verified free split APK set from RuStore
        id: package
        run: python diagnostics/only_assist_package.py
      - name: Inspect discount API declarations statically, without calling app services
        if: steps.package.outputs.apk_ready == 'true'
        timeout-minutes: 5
        run: |
          curl --fail --silent --show-error --location --max-time 90 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o "$RUNNER_TEMP/jadx.zip"
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  $RUNNER_TEMP/jadx.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          chmod +x "$RUNNER_TEMP/jadx/bin/jadx"
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP']); install=json.loads((tmp/'only-assist-install.json').read_text())
          result={'tool':'jadx-1.5.6','tool_sha256':'545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974','source_account_login':False,'api_calls':0,'files':[]}
          with (tmp/'jadx.log').open('w') as log:
              p=subprocess.run([str(tmp/'jadx/bin/jadx'),'--no-res','--decompilation-mode','simple','-j','2','-d',str(tmp/'only-static'),install['base']],stdout=log,stderr=log,timeout=200,env={**os.environ,'JAVA_OPTS':'-Xmx4g'})
          result['decompiler_exit_code']=p.returncode
          for f in (tmp/'only-static/sources').rglob('*.java'):
              s=f.read_text(errors='replace')
              if not re.search(r'benefits\.konsierge\.com|/benefits|/rubrics',s):continue
              # Save only short structural routes/parameter names. Never preserve
              # credentials, token values, service keys, or complete app source.
              evidence=[]
              for n,line in enumerate(s.splitlines(),1):
                  if re.search(r'benefits\.konsierge\.com|/benefits|/rubrics|@(?:Query|Path|Header)\(',line):
                      if re.search(r'secret|api.?key|Bearer\s+[A-Za-z0-9]|token\s*=|Authorization\s*:',line,re.I):continue
                      if len(line)>500:continue
                      evidence.append({'line':n,'text':line.strip()})
              if evidence:
                  result['files'].append({'file':str(f.relative_to(tmp/'only-static/sources')),'sha256':hashlib.sha256(s.encode()).hexdigest(),'declarations':evidence[:45],'declarations_truncated':len(evidence)>45,'authorization_name_present':'Authorization' in s,'bearer_name_present':'Bearer' in s})
          result['source_files_examined']=sum(1 for _ in (tmp/'only-static/sources').rglob('*.java'))
          Path('only-assist-evidence/discount_api_structure.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Prepare disposable Android 15 emulator
        if: steps.package.outputs.apk_ready == 'true'
        timeout-minutes: 9
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64' > "$RUNNER_TEMP/sdk-install.log" 2>&1
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n only-assist-probe -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd only-assist-probe -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          python - <<'PY'
          import subprocess,time
          for _ in range(90):
              p=subprocess.run(['adb','-s','emulator-5554','shell','getprop','sys.boot_completed'],capture_output=True,text=True,timeout=10)
              if p.stdout.strip()=='1':break
              time.sleep(2)
          else:raise RuntimeError('emulator_boot_timeout')
          PY
          adb -s emulator-5554 shell input keyevent 82
      - name: Install verified APKs and read pre-login UI only
        if: steps.package.outputs.apk_ready == 'true'
        timeout-minutes: 4
        run: python diagnostics/only_assist_ui_probe.py
      - name: Record execution identity and destroy ephemeral emulator
        if: always()
        run: |
          mkdir -p only-assist-evidence
          git rev-parse HEAD > only-assist-evidence/commit.txt
          sha256sum diagnostics/only_assist_package.py diagnostics/only_assist_ui_probe.py > only-assist-evidence/code_hashes.txt
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: only-assist-android-${{ github.run_id }}
          path: only-assist-evidence/
          retention-days: 7
