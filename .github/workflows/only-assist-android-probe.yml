name: Only Assist Android compatibility probe
on:
  push:
    branches: ['diagnostics/only-assist-android-20260920']
    paths: ['.github/workflows/only-assist-android-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5
      - name: Read exact free APK using RuStore v2 device-aware protocol
        id: package
        run: python diagnostics/only_assist_package.py
      - name: Prepare disposable Android 15 emulator only if package is verified
        if: steps.package.outputs.apk_ready == 'true'
        timeout-minutes: 9
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64' > "$RUNNER_TEMP/sdk-install.log" 2>&1
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n only-assist-probe -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd only-assist-probe -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          python - <<'PY'
          import subprocess,time
          for _ in range(90):
              p=subprocess.run(['adb','-s','emulator-5554','shell','getprop','sys.boot_completed'],capture_output=True,text=True,timeout=10)
              if p.stdout.strip()=='1':break
              time.sleep(2)
          else:raise RuntimeError('emulator_boot_timeout')
          PY
          adb -s emulator-5554 shell input keyevent 82
      - name: Install verified APK and read pre-login UI only
        if: steps.package.outputs.apk_ready == 'true'
        timeout-minutes: 4
        run: python diagnostics/only_assist_ui_probe.py
      - name: Record execution identity and destroy ephemeral emulator
        if: always()
        run: |
          mkdir -p only-assist-evidence
          git rev-parse HEAD > only-assist-evidence/commit.txt
          sha256sum diagnostics/only_assist_package.py diagnostics/only_assist_ui_probe.py > only-assist-evidence/code_hashes.txt
          adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: only-assist-android-${{ github.run_id }}
          path: only-assist-evidence/
          retention-days: 7
