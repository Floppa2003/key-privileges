name: Only Assist Android compatibility probe
on:
  push:
    branches: ['diagnostics/only-assist-android-20260920']
    paths: ['.github/workflows/only-assist-android-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5
      - name: Read free app distribution metadata and inspect exact APK statically
        id: package
        run: python diagnostics/only_assist_package.py
      - name: Record execution identity
        if: always()
        run: |
          mkdir -p only-assist-evidence
          git rev-parse HEAD > only-assist-evidence/commit.txt
          sha256sum diagnostics/only_assist_package.py > only-assist-evidence/code_hashes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: only-assist-android-${{ github.run_id }}
          path: only-assist-evidence/
          retention-days: 7
