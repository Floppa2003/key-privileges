name: Only Assist Android compatibility probe
on:
  push:
    branches: ['diagnostics/only-assist-android-20260920']
    paths: ['.github/workflows/only-assist-android-probe.yml']
permissions: {contents: read}
jobs:
  static-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Read only the exact base APK already identity/signature verified
        run: |
          mkdir -p only-assist-evidence
          curl --fail --silent --show-error --max-time 90 'https://static.rustore.ru/2026/8/19/88/7a247b98-2174-4348-ad1b-bd047304af5c.apk' -o "$RUNNER_TEMP/only-base.apk"
          echo "856870ddb0197451612a36cdc86d6a6b46d6880ee25a32c44d0a30f1c2447952  $RUNNER_TEMP/only-base.apk" | sha256sum -c -
          curl --fail --silent --show-error --location --max-time 90 'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o "$RUNNER_TEMP/jadx.zip"
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  $RUNNER_TEMP/jadx.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          chmod +x "$RUNNER_TEMP/jadx/bin/jadx"
      - name: Inspect only auth/tariff origins and redact every non-structural literal
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from datetime import datetime,timezone
          tmp=Path(os.environ['RUNNER_TEMP'])
          with (tmp/'jadx.log').open('w') as log:
              p=subprocess.run([str(tmp/'jadx/bin/jadx'),'--no-res','--decompilation-mode','simple','-j','2','-d',str(tmp/'only-static'),str(tmp/'only-base.apk')],stdout=log,stderr=log,timeout=200,env={**os.environ,'JAVA_OPTS':'-Xmx4g'})
          Path('only-assist-evidence/execution.json').write_text(json.dumps({'observed_at':datetime.now(timezone.utc).isoformat(),'base_apk_sha256':'856870ddb0197451612a36cdc86d6a6b46d6880ee25a32c44d0a30f1c2447952','decompiler_exit_code':p.returncode,'account_access':False,'source_service_requests':0},indent=2))
          PY
          python diagnostics/only_assist_auth_structure.py "$RUNNER_TEMP/only-static/sources"
      - name: Record execution identity
        if: always()
        run: |
          mkdir -p only-assist-evidence
          git rev-parse HEAD > only-assist-evidence/commit.txt
          sha256sum diagnostics/only_assist_auth_structure.py > only-assist-evidence/code_hashes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: only-assist-origin-${{ github.run_id }}
          path: only-assist-evidence/
          retention-days: 7
