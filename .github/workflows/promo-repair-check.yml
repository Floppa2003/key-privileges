name: Verify literal coupon repair
on:
  push:
    branches: [loyalty/promo-evidence-repair]
    paths: [loyalty/**, .github/workflows/promo-repair-check.yml]
permissions:
  contents: read
concurrency:
  group: promo-evidence-repair
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - run: python -m playwright install --with-deps chromium
      - name: Collect and normalize public sources
        run: python loyalty/collect_normalized.py --limit 200
      - name: Validate publisher data without credentials
        run: python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
      - name: Preserve tested public code
        if: always()
        run: |
          mkdir -p loyalty-output
          git archive --format=tar --output=loyalty-output/tested-code.tar HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: promo-repair-${{ github.run_id }}
          path: loyalty-output/
          retention-days: 7
          if-no-files-found: error
