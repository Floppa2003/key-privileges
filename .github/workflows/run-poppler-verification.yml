name: One-time Poppler release verification dispatch
on:
  push:
    branches: [verify/poppler-release-20261022]
    paths: [.github/workflows/run-poppler-verification.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: poppler-release-dispatch-20261022
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/verify/poppler-release-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify release identity and dispatch only bounded checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(gh api repos/Floppa2003/key-privileges/git/ref/heads/main --jq .object.sha)" = debde8a59d8e0154506f2b8227eecee3003261bc
          printf '%s\n' '{"ref":"main"}' | gh api --method POST repos/Floppa2003/key-privileges/actions/workflows/content-driven-discovery-check.yml/dispatches --input -
          echo 'Dispatched main read-only regression'
          printf '%s\n' '{"ref":"main","inputs":{"limit":"500","sources":"","publish":false}}' | gh api --method POST repos/Floppa2003/key-privileges/actions/workflows/loyalty.yml/dispatches --input -
          echo 'Dispatched main collection with publish=false'
          printf '%s\n' '{"ref":"verify/poppler-release-20261022"}' | gh api --method POST repos/Floppa2003/key-privileges/actions/workflows/loyalty-free-access.yml/dispatches --input -
          echo 'Dispatched free-access regression on verification branch; source and publish jobs require main and will skip'
