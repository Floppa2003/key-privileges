name: Current public content capture
on:
  push:
    branches: [fix/content-driven-discovery-20261022]
    paths: [.github/workflows/content-live-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Capture anonymous source evidence with existing access policy
        env:
          PYTHONPATH: loyalty
        run: |
          python - <<'PY'
          import asyncio, hashlib, json
          from pathlib import Path
          from datetime import datetime, timezone
          from playwright.async_api import async_playwright
          from public_transport import PublicSource
          import tsvetnoy_source as t
          out=Path('live-content');out.mkdir()
          report={'observed_at':datetime.now(timezone.utc).isoformat(),'publication_allowed':False,'pages':[]}
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  for name,url in [('flystation','https://flystation.net/promotions'),('mantera','https://lk.manteratravel.ru/faq'),('tsvetnoy',t.ROOT)]:
                      row={'id':name,'url':url}
                      try:
                          async with PublicSource(browser,url) as client:
                              await client.robots()
                              raw=await client.read(url,render=True)
                              (out/(name+'.html')).write_text(raw)
                              row.update(status='captured',sha256=hashlib.sha256(raw.encode()).hexdigest())
                              if name=='tsvetnoy':
                                  data=await client.json('https://tsvetnoy.com/api/v1/documents')
                                  (out/'documents.json').write_text(json.dumps(data,ensure_ascii=False))
                                  doc=t.current_document(data)
                                  pdf=await client.read_pdf('https://tsvetnoy.com/pdf/'+doc['key'])
                                  (out/'tsvetnoy.pdf').write_bytes(pdf)
                                  row['pdf_sha256']=hashlib.sha256(pdf).hexdigest()
                      except Exception as exc:
                          row.update(status='failed',error_type=type(exc).__name__,error=str(exc)[:180])
                      report['pages'].append(row)
                      (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
                  await browser.close()
          asyncio.run(main())
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-content-${{ github.run_id }}
          path: live-content/
          retention-days: 14
