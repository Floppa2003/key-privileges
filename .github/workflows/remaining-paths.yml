name: Remaining original sources - distinct retrieval hypotheses
on:
  push:
    branches: ['diagnostics/remaining-source-paths-20260915']
    paths: ['diagnostics/remaining_paths.py', '.github/workflows/remaining-paths.yml']
permissions:
  contents: read
jobs:
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 protego==0.6.2
      - name: At most twelve free provider reads; stop on quota; no private data
        run: python diagnostics/remaining_paths.py external
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-path-${{ github.run_id }}
          path: remaining-paths-output/
          retention-days: 7
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [ekp, nordwind, coral, coral_promo, rzd, aeroflot]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Distinguish TCP and TLS from application loading
        env:
          SOURCE: ${{ matrix.source }}
        run: timeout 35s python diagnostics/remaining_paths.py network --source "$SOURCE"
      - name: Ordinary requested-root navigation before checking crawl policy
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
        run: timeout --kill-after=5s 180s xvfb-run -a python diagnostics/remaining_paths.py bootstrap --source "$SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bootstrap-${{ matrix.source }}-${{ github.run_id }}
          path: remaining-paths-output/
          retention-days: 7
