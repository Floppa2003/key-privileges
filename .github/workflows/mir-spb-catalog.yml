name: Inspect Mir Saint Petersburg catalogue
on:
  push:
    branches: [loyalty/ekp-native-catalog]
    paths: [.github/workflows/mir-spb-catalog.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          import asyncio,json,sys,time
          from pathlib import Path
          from datetime import datetime,timezone
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from mir_ui import collect_mir
          OUT=Path('mir-spb');OUT.mkdir()
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  async with PublicSource(browser,'https://vamprivet.ru/') as client:
                      client.deadline=time.monotonic()+200
                      await client.robots();await client.read('https://vamprivet.ru/',render=True)
                      await client.page.wait_for_timeout(2000)
                      yes=client.page.locator('.region-confirmation-modal__controls').get_by_role('button',name='Да',exact=True)
                      if await yes.count() and await yes.is_visible():await yes.click()
                      await client.page.locator('button.region-button').click()
                      await client.page.locator('.region-menu__link').get_by_text('Санкт-Петербург и ЛО',exact=True).click()
                      await client.page.wait_for_function("document.querySelector('.region-button__title')?.textContent.trim()==='Санкт-Петербург и ЛО'")
                      await client.page.wait_for_timeout(2000)
                      report={'errors':[]}; now=datetime.now(timezone.utc).isoformat()
                      records=await collect_mir(client,{'url':'https://vamprivet.ru/'},report,now,1)
                      OUT.joinpath('snapshot.json').write_text(json.dumps({'report':report,'records':records,'selected_region':await client.page.locator('.region-button__title').inner_text()},ensure_ascii=False,indent=2),encoding='utf8')
                  await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mir-spb-${{ github.run_id }}
          path: mir-spb/
          retention-days: 7
