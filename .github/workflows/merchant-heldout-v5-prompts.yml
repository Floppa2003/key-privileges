name: Merchant heldout v5 prompt materialization
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-heldout-v5-prompts.yml, loyalty/experiments/merchant_general/heldout-v5.json]
permissions:
  contents: read
jobs:
  prompts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize frozen v5 prompts without gold labels
        run: |
          mkdir -p heldout-v5-prompts
          PYTHONPATH=loyalty python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import merchant_blocks_v2 as b
          src=Path('loyalty/experiments/merchant_general/heldout-v5.json')
          data=json.loads(src.read_text(encoding='utf-8'))
          assert data['version']=='merchant-heldout-v5'
          assert data['expected_labels_sent_to_model'] is False
          out={
              'corpus_version':data['version'],
              'corpus_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
              'labels_frozen_at':data['labels_frozen_at'],
              'implementation_frozen_before_predictions':data['implementation_frozen_before_predictions'],
              'prompt_module_version':b.VERSION,
              'expected_labels_sent_to_model':False,
              'publication_allowed':False,
              'cases':[],
          }
          for case in data['cases']:
              s=case['source']
              doc=b.build(s['markdown'],url=s['url'],observed_at=s['observed_at'],
                          completeness=s['completeness'])
              out['cases'].append({
                  'id':case['id'],
                  'url':s['url'],
                  'target':case['target'],
                  'source_sha256':doc['source_sha256'],
                  'selected_block_ids':[x['id'] for x in b.scoped_blocks(case['target'],doc)],
                  'prompt':b.scoped_prompt(case['target'],doc),
              })
          Path('heldout-v5-prompts/prompts.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git rev-parse HEAD > heldout-v5-prompts/materializer-commit.txt
          sha256sum heldout-v5-prompts/prompts.json > heldout-v5-prompts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merchant-heldout-v5-prompts-${{ github.run_id }}-${{ github.run_attempt }}
          path: heldout-v5-prompts/
          retention-days: 1
