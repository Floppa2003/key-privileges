name: Qwen programme-grounding v2 comparison
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-grounding-v2.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-grounding-v2
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test complete existing suite and prompt boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p regression-output
          git rev-parse HEAD > regression-output/commit.txt
          python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
          python -m unittest discover -s loyalty/tests -v > regression-output/existing.log 2>&1
          python -m unittest discover -s loyalty/experiments/prompt_ab -p 'test_*.py' -v > regression-output/prompt.log 2>&1
          node --test key/refresh.test.mjs > regression-output/key.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grounding-regressions-${{ github.run_id }}
          path: regression-output/
          retention-days: 7
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [muzcomedy, rzd_museum, golden_triangle, lavka, nevsky, academia]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact execution code and bounded experiment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p grounding-output/code
          git rev-parse HEAD > grounding-output/commit.txt
          cp loyalty/experiments/prompt_ab/* grounding-output/code/
          cp loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh grounding-output/code/
          cp .github/workflows/merchant-grounding-v2.yml grounding-output/workflow.yml
          lscpu > grounding-output/cpu.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36437468853'
          artifact-ids: '10977881042'
          github-token: ${{ github.token }}
          path: sources/one
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36437468853'
          artifact-ids: '10979455386'
          github-token: ${{ github.token }}
          path: sources/two
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36436658401'
          artifact-ids: '10976691199'
          github-token: ${{ github.token }}
          path: sources/three
          merge-multiple: true
      - name: Install same checksum-verified local model
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > grounding-output/setup.log 2>&1
      - name: One baseline and one grounded response using identical evidence
        run: |
          set -euo pipefail
          loyalty/experiments/resolution/.venv/bin/python -m unittest discover -s loyalty/experiments/prompt_ab -p 'test_*.py' -v > grounding-output/tests-prompt.log 2>&1
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/prompt_ab/prompt_ab.py --execute --source sources --out grounding-output/results --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama" --cases ${{ matrix.case }} --plan loyalty/experiments/prompt_ab/grounding-plan.json --candidate-prompt loyalty/experiments/prompt_ab/grounded_prompt.txt > grounding-output/inference.log 2>&1
      - name: Preserve runtime diagnostics and checksums without weights
        if: always()
        run: |
          if test -d loyalty/experiments/resolution/setup-logs; then cp -r loyalty/experiments/resolution/setup-logs grounding-output/; fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('grounding-output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grounding-${{ matrix.case }}-${{ github.run_id }}
          path: grounding-output/
          retention-days: 7
