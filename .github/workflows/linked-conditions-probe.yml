name: Public linked-conditions diagnostic
on:
  push:
    branches: ['diagnostics/linked-conditions-20260917']
    paths: [diagnostics/linked_conditions_probe.py, .github/workflows/linked-conditions-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35094999686
          name: aeroflot-import-public-35094999686-1
          path: parent-af
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35070130567
          name: ekp-public-35070130567-2
          path: parent-ekp
      - name: Probe historical-catalogue links with new ordinary public GETs
        run: python diagnostics/linked_conditions_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linked-conditions-probe-${{ github.run_id }}
          path: linked-probe-output/
          retention-days: 7
