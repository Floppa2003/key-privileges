name: Prepare and verify iLocked public release
on:
  push:
    branches: ['loyalty/ilocked-public-release-20260918']
    paths: [.github/workflows/ilocked-prepare-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Register only the reviewed new routes without replacing existing sources
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('loyalty');out=Path('ilocked-verification');out.mkdir()
          command=['python','-m','unittest','discover','-s','loyalty/tests','-p','test_ilocked_ekp.py','-v']
          before=subprocess.run(command,capture_output=True,text=True)
          (out/'before.log').write_text(before.stdout+before.stderr)
          assert before.returncode!=0 and ('KeyError' in before.stderr or 'not enough values' in before.stderr)
          routes=[('chuzhoy','Чужой'),('mumiya','Мумия'),('morskoy-boy','Морской бой'),
                  ('gold_rush','Золотая лихорадка'),('among_us','AMONG US'),('morskoi-boi-kids','Морской бой. KIDS'),
                  ('poslednyaya-tayna-da-vinchi','Последняя тайна Да Винчи'),
                  ('atlantida-kosmicheskaya-odisseya-0','Атлантида: космическая Одиссея')]
          pp=root/'partner_pages.json';sp=root/'sources_normalized.json';code=root/'partner_pages.py'
          config=json.loads(pp.read_text());sources=json.loads(sp.read_text())
          old_config=json.loads(pp.read_text());old_sources=json.loads(sp.read_text())
          ids=[]
          for slug,label in routes:
              sid='ekp_ilocked_'+slug.replace('-','_');url='https://ilocked.ru/quest/'+slug
              assert sid not in config and not any(s['id']==sid for s in sources)
              config[sid]={'program':'Единая карта петербуржца (ЕКП)','partner':'iLocked','url':url,'parser':'ilocked_ekp','category':'Квесты'}
              sources.append({'id':sid,'name':'ЕКП → iLocked — '+label,'mode':'html','url':url});ids.append(sid)
          sid='ilocked_certificate_terms';assert sid not in config
          config[sid]={'program':'iLocked — ограничения скидок','partner':'iLocked','url':'https://ilocked.ru/certificate','parser':'ilocked_certificate','category':'Квесты'}
          sources.append({'id':sid,'name':'iLocked — ограничения скидок по сертификатам','mode':'html','url':'https://ilocked.ru/certificate','coverage_scope':'one_short_discount_restriction_not_full_contract'});ids.append(sid)
          assert all(config[k]==v for k,v in old_config.items()) and sources[:len(old_sources)]==old_sources
          pp.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n');sp.write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          raw=code.read_text();target="    blocks=required(soup,cfg['selectors']);terms=content(blocks)";assert raw.count(target)==1
          replacement="    if cfg.get('parser') in ('ilocked_ekp','ilocked_certificate'):\n        from ilocked_ekp import extract_ilocked_ekp\n        return extract_ilocked_ekp(source,soup,url,observed_at,cfg)\n"+target
          code.write_text(raw.replace(target,replacement))
          (out/'source_ids.txt').write_text(','.join(ids))
          subprocess.run(command,check=True)
          PY
      - name: Complete regressions and archive exact proposed code
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee ilocked-verification/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee ilocked-verification/key-tests.log
          tar -cf ilocked-verification/code.tar loyalty key .github/workflows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35354858688
          name: ilocked-source-check-35354858688-1
          path: ilocked-source
      - name: Replay actual public source documents at their original observation times
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from adapters import extract
          from partner_pages import CONFIG
          from normalized import validate_offer
          root=Path('ilocked-source');audit=json.loads((root/'audit.json').read_text())
          assert audit['run_id']=='35354858688:1' and audit['complete'] and not audit['account_used']
          records=[]
          for item in audit['pages']:
              data=(root/item['file']).read_bytes();assert hashlib.sha256(data).hexdigest()==item['saved_sha256']
              assert item['responses'][-1]=={'url':item['url'],'status':200}
              sid=next(k for k,v in CONFIG.items() if v['url']==item['url'])
              row,=extract(sid,data.decode('utf8'),item['url'],item['finished_at']);validate_offer(row);records.append(row)
          assert len(records)==9 and len({r['id'] for r in records})==9
          assert sum(r['record_kind']=='partner_offer' for r in records)==8
          assert records[-1]['benefit_text']=='' and not records[-1]['rates'] and not records[-1]['promo_codes']
          Path('ilocked-verification/source-replay.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          print('Real source replay: nine records; eight quest offers and one short condition')
          PY
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the real dispatcher with only these sources, no Google credentials
        run: |
          xvfb-run -a python loyalty/collect_normalized.py --sources "$(cat ilocked-verification/source_ids.txt)" --out ilocked-verification/live-output
          python loyalty/sheets_normalized.py --input ilocked-verification/live-output/normalized.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('ilocked-verification/live-output/normalized.json').read_text())
          assert len(x['records'])==9 and all(r['status']=='ok' for r in x['source_reports'])
          print('Real dispatcher: all nine registered pages yielded validated records')
          PY
      - name: Commit only the three configuration and dispatch changes on the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/loyalty/ilocked-public-release-20260918'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/partner_pages.py loyalty/partner_pages.json loyalty/sources_normalized.json
          git diff --cached --stat > ilocked-verification/changed-config.txt
          git commit -m 'Register exact iLocked public quest and certificate routes after source and regression verification'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/loyalty/ilocked-public-release-20260918
          git rev-parse HEAD > ilocked-verification/proposed-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ilocked-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ilocked-verification/
          retention-days: 7
