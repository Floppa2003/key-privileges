name: Public access options experiment
on:
  push:
    branches: [diagnostics/access-options-20260914]
    paths: [diagnostics/access_check.py, .github/workflows/access-options.yml]
permissions:
  contents: read
concurrency:
  group: access-options-experiment
  cancel-in-progress: false
jobs:
  investigate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - shell: bash
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 playwright==1.57.0
      - name: Validate diagnostic classifier
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'diagnostics')
          from access_check import document, safe_url
          assert document('<title>Blocked</title><p>Доступ к сайту временно ограничен владельцем веб-ресурса.</p>',200)[0]['classification']=='refused'
          assert document('<p>Нужно включить javascript</p>',200)[0]['classification']=='shell_or_other'
          assert document('<h1>Партнёры</h1><p>'+('скидка 10% на услуги. '*60)+'</p>',200)[0]['classification']=='content_candidate'
          assert safe_url('https://example.com/?token=xxx') is None
          assert safe_url('https://example.com/?region=78')
          print('Five diagnostic assertions passed')
          PY
      - name: Compare native TLS and HTTP transports
        shell: bash
        run: python diagnostics/access_check.py --mode transport
      - name: Install browser engines
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_ARCH" = "X64" ]; then
            python -m playwright install --with-deps chromium firefox webkit
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Read in ordinary anonymous browser contexts
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a python diagnostics/access_check.py --mode browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: access-options-${{ matrix.os }}-${{ github.run_id }}
          path: |
            access-output/*.json
            access-output/*.html
            diagnostics/access_check.py
          retention-days: 7
          if-no-files-found: warn
