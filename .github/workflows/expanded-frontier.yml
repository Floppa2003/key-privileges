name: Inspect advertised public crawl expansion
on:
  push:
    branches: [diagnostics/public-frontier-20260915]
    paths: [diagnostics/expanded_frontier.py, .github/workflows/expanded-frontier.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m py_compile diagnostics/expanded_frontier.py
      - run: python diagnostics/expanded_frontier.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: expanded-frontier-${{ github.run_id }}
          path: |
            expanded-output/
            frontier-output/
          retention-days: 7
