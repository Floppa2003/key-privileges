name: EKP bounded catalogue and detail comparison
on:
  push:
    branches: [main]
    paths: [diagnostics/ekp_detail_probe.py, diagnostics/ekp_catalogue_full_ui.js, .github/workflows/ekp-detail-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Complete regressions and bounded diagnostic selfcheck without credentials
        run: |
          python -m unittest discover -s loyalty/tests
          node --test key/refresh.test.mjs
          python diagnostics/ekp_detail_probe.py --selfcheck
          node -e 'new (Object.getPrototypeOf(async function(){}).constructor)(require("fs").readFileSync("diagnostics/ekp_catalogue_full_ui.js","utf8"));'
      - name: Fresh public catalogue and two discovered details, no account or Google access
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python diagnostics/ekp_detail_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-details-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-detail-output/
          retention-days: 7
