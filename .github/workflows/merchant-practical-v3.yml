name: Qwen practical advice v3 smoke
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-practical-v3.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-practical-v3
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test existing suites and practical output contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p regression-output
          git rev-parse HEAD > regression-output/commit.txt
          python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
          python -m unittest discover -s loyalty/tests -v > regression-output/existing.log 2>&1
          python -m unittest discover -s loyalty/experiments/prompt_ab -p 'test_*.py' -v > regression-output/prompt.log 2>&1
          python -m unittest discover -s loyalty/experiments/local_visual -p 'test_*.py' -v > regression-output/local-visual.log 2>&1
          python -m unittest discover -s loyalty/experiments/resolution -p 'test_*.py' -v > regression-output/resolution.log 2>&1
          node --test key/refresh.test.mjs > regression-output/key.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practical-regressions-${{ github.run_id }}
          path: regression-output/
          retention-days: 7
  compare:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [rzd_museum, lavka, muzcomedy, nevsky]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact execution code and bounded experiment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p practical-output/code
          git rev-parse HEAD > practical-output/commit.txt
          cp loyalty/experiments/prompt_ab/* practical-output/code/
          cp loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh practical-output/code/
          cp .github/workflows/merchant-practical-v3.yml practical-output/workflow.yml
          lscpu > practical-output/cpu.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36437468853'
          artifact-ids: '10977881042'
          github-token: ${{ github.token }}
          path: sources/one
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36437468853'
          artifact-ids: '10979455386'
          github-token: ${{ github.token }}
          path: sources/two
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36436658401'
          artifact-ids: '10976691199'
          github-token: ${{ github.token }}
          path: sources/three
          merge-multiple: true
      - name: Install same checksum-verified local model
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > practical-output/setup.log 2>&1
      - name: One practical_v3 response on frozen evidence (not paired A/B)
        run: |
          set -euo pipefail
          loyalty/experiments/resolution/.venv/bin/python -m unittest discover -s loyalty/experiments/prompt_ab -p 'test_*.py' -v > practical-output/tests-prompt.log 2>&1
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/prompt_ab/prompt_ab.py --execute --source sources --out practical-output/results --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama" --cases ${{ matrix.case }} --plan loyalty/experiments/prompt_ab/grounding-plan.json --candidate-prompt loyalty/experiments/prompt_ab/practical_prompt.txt --candidate-schema loyalty/experiments/prompt_ab/practical_schema.json --variants defined > practical-output/inference.log 2>&1
      - name: Preserve runtime diagnostics and checksums without weights
        if: always()
        run: |
          if test -d loyalty/experiments/resolution/setup-logs; then cp -r loyalty/experiments/resolution/setup-logs practical-output/; fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('practical-output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practical-${{ matrix.case }}-${{ github.run_id }}
          path: practical-output/
          retention-days: 7
