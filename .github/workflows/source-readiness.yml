name: Seven source readiness - isolated bounded confirmation
on:
  push:
    branches: ["diagnostics/seven-routes-transport-20260915"]
    paths: ["diagnostics/source_readiness.py", ".github/workflows/source-readiness.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        source: [utair, ekp, nordwind, coral, coral_promo, rzd, aeroflot]
        replica: [1]
        include:
          - source: utair
            replica: 2
          - source: ekp
            replica: 2
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 curl_cffi==0.16.0 playwright==1.57.0
      - name: Verify readiness and redaction assertions
        run: python diagnostics/source_readiness.py --selfcheck
      - name: Read one configured public page in a disposable Chrome process
        env:
          SOURCE_ID: ${{ matrix.source }}
          REPLICA: ${{ matrix.replica }}
        run: timeout --signal=TERM --kill-after=5s 140s xvfb-run -a python diagnostics/source_readiness.py --source "$SOURCE_ID"
      - name: Preserve diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readiness-${{ matrix.source }}-${{ matrix.replica }}-${{ github.run_id }}
          path: source-readiness-output/
          if-no-files-found: warn
          retention-days: 7
