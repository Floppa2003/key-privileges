name: Check exact iLocked source documents
on:
  push:
    branches: ['loyalty/ilocked-public-release-20260918']
    paths: [.github/workflows/ilocked-source-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect public DOM with exact location and existing policy checks; no account or destination
        run: |
          python - <<'PY'
          import asyncio,hashlib,json,os,sys
          from pathlib import Path
          from datetime import datetime,timezone
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from free_access_probe import sanitized_page
          def now():return datetime.now(timezone.utc).isoformat()
          def sha(b):return hashlib.sha256(b).hexdigest()
          out=Path('ilocked-source-check');out.mkdir()
          paths=['/quest/chuzhoy','/quest/mumiya','/quest/morskoy-boy','/quest/gold_rush',
                 '/quest/among_us','/quest/morskoi-boi-kids','/quest/poslednyaya-tayna-da-vinchi',
                 '/quest/atlantida-kosmicheskaya-odisseya-0','/certificate']
          audit={'run_id':os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],
                 'commit':os.environ['GITHUB_SHA'],'started_at':now(),'account_used':False,'pages':[]}
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      async with PublicSource(browser,'https://ilocked.ru') as client:
                          await client.robots();audit['robots']=client.robots_info
                          client.request_interval=max(client.request_interval,3)
                          for path in paths:
                              url='https://ilocked.ru'+path
                              item={'url':url,'requested_at':now()};audit['pages'].append(item)
                              responses=[]
                              def record(response):
                                  if response.request.is_navigation_request() and response.request.frame==client.page.main_frame:
                                      responses.append({'url':response.url,'status':response.status})
                              client.page.on('response',record)
                              try:
                                  raw=await client.read(url,render=True)
                                  if client.page.url!=url:raise ValueError('exact_location_changed')
                                  item['source_sha256']=sha(raw.encode())
                                  dom=BeautifulSoup(raw,'html.parser')
                                  if not dom.html:raise ValueError('no_html')
                                  dom.html['data-loyalty-probe-location']=client.page.url
                                  clean,identity=sanitized_page(str(dom),url)
                                  data=clean.encode();name=sha(data)+'.html';(out/name).write_bytes(data)
                                  item.update(file=name,saved_sha256=sha(data),bytes=len(data),identity=identity)
                              except Exception as exc:
                                  item['error']=str(exc) if isinstance(exc,RuntimeError) else type(exc).__name__
                              finally:
                                  item['responses']=responses;item['finished_at']=now()
                                  client.page.remove_listener('response',record)
                              if item.get('error'):break
                  finally:await browser.close()
          try:asyncio.run(main())
          except Exception as exc:audit['failure']=type(exc).__name__
          audit['finished_at']=now();audit['complete']=len(audit['pages'])==len(paths) and all('file' in p for p in audit['pages'])
          (out/'audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2))
          print(json.dumps({'complete':audit['complete'],'pages':len(audit['pages']),'successful':sum('file' in p for p in audit['pages'])}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ilocked-source-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ilocked-source-check/
          retention-days: 7
