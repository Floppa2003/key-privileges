name: Qwen field routing prompt-only v4 comparison
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-field-routing-v4.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-field-routing-v4
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test existing suites and practical output contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p regression-output
          git rev-parse HEAD > regression-output/commit.txt
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
          python -m unittest discover -s loyalty/tests -v > regression-output/existing.log 2>&1
          python -m unittest discover -s loyalty/experiments/prompt_ab -p 'test_*.py' -v > regression-output/prompt.log 2>&1
          python -m unittest discover -s loyalty/experiments/local_visual -p 'test_*.py' -v > regression-output/local-visual.log 2>&1
          python -m unittest discover -s loyalty/experiments/resolution -p 'test_*.py' -v > regression-output/resolution.log 2>&1
          node --test key/refresh.test.mjs > regression-output/key.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: field-routing-regressions-${{ github.run_id }}
          path: regression-output/
          retention-days: 7
  compare:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - case: rzd_museum
            artifact: '11005841757'
          - case: lavka
            artifact: '11005801319'
          - case: muzcomedy
            artifact: '11004982266'
          - case: nevsky
            artifact: '11005842519'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact execution code and bounded experiment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p field-routing-output/code
          git rev-parse HEAD > field-routing-output/commit.txt
          cp loyalty/experiments/prompt_ab/* field-routing-output/code/
          cp loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh field-routing-output/code/
          cp .github/workflows/merchant-field-routing-v4.yml field-routing-output/workflow.yml
          lscpu > field-routing-output/cpu.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36500846197'
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: sources/${{ matrix.case }}
          merge-multiple: true
      - name: Install same checksum-verified local model
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > field-routing-output/setup.log 2>&1
      - name: Paired practical_v3 and field_routing_v4 responses; only system content differs
        run: |
          set -euo pipefail
          loyalty/experiments/resolution/.venv/bin/python -m unittest discover -s loyalty/experiments/prompt_ab -p 'test_*.py' -v > field-routing-output/tests-prompt.log 2>&1
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/prompt_ab/prompt_ab.py --execute --source sources --out field-routing-output/results --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama" --cases ${{ matrix.case }} --plan loyalty/experiments/prompt_ab/field-routing-plan.json --candidate-prompt loyalty/experiments/prompt_ab/field_routing_prompt.txt > field-routing-output/inference.log 2>&1
      - name: Preserve runtime diagnostics and checksums without weights
        if: always()
        run: |
          if test -d loyalty/experiments/resolution/setup-logs; then cp -r loyalty/experiments/resolution/setup-logs field-routing-output/; fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('field-routing-output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: field-routing-${{ matrix.case }}-${{ github.run_id }}
          path: field-routing-output/
          retention-days: 7
