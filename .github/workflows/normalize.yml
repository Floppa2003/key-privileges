name: Normalize all stored loyalty sources
on:
  push:
    branches: [main, loyalty/unified-normalization]
    paths: [loyalty/unified*, loyalty/tests/test_unified*, .github/workflows/normalize.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt jsonschema==4.26.0
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Validate common JSON schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          Draft202012Validator.check_schema(json.load(open('loyalty/unified.schema.json')))
          PY
      - name: Record tested public code hashes only
        run: sha256sum loyalty/unified*.py loyalty/unified.schema.json loyalty/tests/test_unified*.py
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.LOYALTY_SHEETS_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - name: Obtain short-lived Google access
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Normalize stored inputs privately and verify derived views
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DISCOUNTS_SPREADSHEET_ID: ${{ secrets.DISCOUNTS_SPREADSHEET_ID }}
        run: python loyalty/unified_publish.py --publish
      # No artifact upload: corporate/community source rows and codes are private.
