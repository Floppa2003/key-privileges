name: Review live structure extraction
on:
  push:
    branches: [loyalty/live-documents-and-generic-text]
    paths: [loyalty/**, .github/live-runtime-edits.json, .github/workflows/live-extraction-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize reviewed code changes
        run: |
          mkdir -p review-output
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          patches=Path('.github/live-runtime-edits.json')
          if patches.exists():
              replacements={}
              for name,spec in json.loads(patches.read_text()).items():
                  path=Path(name);old=path.read_text() if path.exists() else None
                  actual=hashlib.sha256(old.encode()).hexdigest() if old is not None else None
                  if actual!=spec['old_sha256']:raise ValueError('code baseline changed: '+name)
                  value=spec.get('write',old)
                  for start,size,new in reversed(spec.get('edits',[])):
                      # Repair only JSON transport escaping; final code hash is authoritative.
                      if name=='loyalty/announcements.py':
                          new=new.replace("'\n\n'","'\\n\\n'").replace("'\n'","'\\n'")
                      value=value[:start]+new+value[start+size:]
                  actual=hashlib.sha256(value.encode()).hexdigest() if value is not None else None
                  if actual!=spec['new_sha256']:raise ValueError('code result hash mismatch: '+name)
                  replacements[path]=value
              for path,value in replacements.items():
                  if value is None:path.unlink()
                  else:path.write_text(value,encoding='utf8')
              patches.unlink()
              doc=Path('loyalty/document_text.py');s=doc.read_text()
              s=s.replace('ocr_count=0;total=0','ocr_count=0;ocr_attempted=0;total=0')
              s=s.replace('if allow_ocr and ocr_count<10:', 'if allow_ocr and ocr_attempted<10:\n                    ocr_attempted+=1')
              s=s.replace("    d=record['details'];pages=d.get('pages',[])","    from normalized import text\n    d=record['details'];pages=d.get('pages',[])")
              s=s.replace("__import__('normalized').text(page_text(pages))",'text(page_text(pages))')
              doc.write_text(s)
              p=Path('loyalty/tests/test_known_pdf.py');s=p.read_text();s=s.replace('pdf_pages(b\'%PDF-small\',3)', 'pdf_pages(b\'%PDF-small\')')
              s=s.replace("pdf_pages(b'<html>challenge</html>',3)","pdf_pages(b'<html>challenge</html>')")
              p.write_text(s)
              p=Path('loyalty/NORMALIZED.md');s=p.read_text();s+='\nLive PDF extraction and generic album ownership supersede the historical visual-review profile; see LIVE_EXTRACTION.md.\n';p.write_text(s)
              p=Path('loyalty/RECOVERED_SOURCES.md');s=p.read_text();p.write_text('> Historical 2.8.0 contract; live linked-PDF discovery and extraction are described in LIVE_EXTRACTION.md (2.9.0).\n\n'+s)
          PY
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Run complete regression suite
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee review-output/python-tests.log
          node --test key/refresh.test.mjs | tee review-output/key-tests.log
      - name: Install native browser and image-PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus
          python -m playwright install --with-deps chromium
      - name: Fetch live sources through production entrypoints
        run: |
          python - <<'PY'
          import sys,asyncio,json,os,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          import document_text,recovered_sources,utair_documents,reviewed_pdf
          from collect_normalized import one,source_budget,bounded_source
          from playwright.async_api import async_playwright
          from sheets_normalized import prepare
          from jsonschema import validate
          out=Path('review-output');(out/'pdf').mkdir(exist_ok=True)
          original=document_text.extract_pdf
          def observed(data,**kwargs):
              (out/'pdf'/(hashlib.sha256(data).hexdigest()+'.pdf')).write_bytes(data)
              return original(data,**kwargs)
          for module in (document_text,recovered_sources,utair_documents,reviewed_pdf):module.extract_pdf=observed
          cfgs=[c for c in json.loads(Path('loyalty/sources_normalized.json').read_text()) if c['id'] in ('rgo','mir_announcements','utair_rule_documents','af_vtb_rules','nspk_ekp_rules','uralsib_rzd_rules')]
          now=datetime.now(timezone.utc).isoformat()
          async def run():
              async with async_playwright() as p:
                  browser=await p.chromium.launch();sem=asyncio.Semaphore(3)
                  try:return await asyncio.gather(*(bounded_source(lambda c=c:one(browser,c,now,500),sem,source_budget(c)) for c in cfgs))
                  finally:await browser.close()
          results=asyncio.run(run());records=[r for _,rs in results for r in rs];reports=[r for r,_ in results]
          bundle={'schema_version':2,'run_id':os.environ['GITHUB_RUN_ID']+':1','observed_at':now,'records':records,'sources':reports}
          (out/'normalized.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2))
          schema=json.loads(Path('loyalty/offer.schema.json').read_text())
          for row in records:validate(row,schema)
          prepare(bundle)
          print(json.dumps({'records':len(records),'sources':[{'id':r['source_id'],'status':r['status'],'count':r['normalized'],'errors':r['errors']} for r in reports]},ensure_ascii=False))
          PY
      - name: Preserve exact code and offline test dependency
        if: always()
        run: |
          python -m pip download --no-deps -d review-output/wheels protego==0.6.2
          tar --exclude=.git --exclude=review-output --exclude='__pycache__' -cf review-output/code.tar .
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=list(Path('loyalty').glob('*.py'))+list(Path('loyalty/tests').glob('*.py'))
          Path('review-output/code-hashes.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},indent=2))
          PY
      - name: Persist validated materialized code on this branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty .github
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: materialize tested live extraction without snapshot answers'
            git push origin HEAD:loyalty/live-documents-and-generic-text
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-extraction-review-${{ github.run_id }}
          path: review-output/
          retention-days: 7
