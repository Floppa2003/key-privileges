name: Verify HSE and Alfa source registration once
on:
  push:
    branches: ['loyalty/hse-alfa-20260918']
    paths: [.github/workflows/hse-prepare-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Verify tests fail before wiring and apply only the four reviewed hunks
        run: |
          mkdir hse-verification
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          out=Path('hse-verification')
          old=json.loads(Path('loyalty/sources_normalized.json').read_text())
          command=['python','-m','unittest','discover','-s','loyalty/tests','-p','test_hse_alumni.py','-v']
          before=subprocess.run(command,capture_output=True,text=True)
          (out/'before.log').write_text(before.stdout+before.stderr)
          assert before.returncode!=0 and 'Source URL is outside the source allowlist' in before.stderr
          subprocess.run(['git','apply','--check','loyalty/hse_integration.patch'],check=True)
          subprocess.run(['git','apply','loyalty/hse_integration.patch'],check=True)
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())=={'loyalty/normalized.py','loyalty/collect_normalized.py','loyalty/sources_normalized.json','loyalty/unified_normalization.py'}
          new=json.loads(Path('loyalty/sources_normalized.json').read_text());assert new[:len(old)]==old and len(new)==len(old)+2
          subprocess.run(command,check=True)
          PY
      - name: Run all regression tests and archive exact proposed code
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee hse-verification/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee hse-verification/key-tests.log
          tar -cf hse-verification/code.tar loyalty key .github/workflows
          git diff > hse-verification/change.patch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35369463758
          name: hse-alfa-source-35369463758-1
          path: hse-source
      - name: Replay source identities and offer scopes at the original source time
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from hse_alumni import parse_catalog
          from normalized import validate_offer
          from sheets_normalized import prepare,SCHEMAS
          from unified_normalization import make_input,normalize_record
          root=Path('hse-source');a=json.loads((root/'audit.json').read_text());data=(root/a['file']).read_bytes()
          assert a['run_id']=='35369463758:1' and not a['account_used'] and a['responses'][-1]=={'url':a['url'],'status':200}
          assert hashlib.sha256(data).hexdigest()==a['saved_sha256']=='821ea05dbaff1b4afcb22277868e9c8f924845fdaf4f508e0c8b6a97589daf2f'
          rows=parse_catalog(data.decode('utf8'),a['started_at']);assert len(rows)==55 and sum(r['record_kind']=='partner_offer' for r in rows)==51
          for row in rows:validate_offer(row)
          assert {r['details']['public_catalog_block']['anchor'] for r in rows if r['record_kind']=='source_observation'}=={'skyeng','mordapechat','skillcup','academiya'}
          assert {r['native_id'] for r in rows if r['validity_status']=='expired_by_published_end'}=={'anchor:retreatmama','anchor:gruzovichkof'}
          b={'schema_version':2,'run_id':a['run_id'],'observed_at':a['started_at'],'records':rows,'sources':[{'source_id':'hse_alumni','name':'HSE','root':a['url'],'status':'partial','normalized':len(rows),'discovered':len(rows),'failed':1,'errors':[],'coverage':'replay','region':None,'observed_at':a['started_at']}]}
          common=[]
          for idx,row in enumerate(prepare(b)['parser_offers'],2):
              raw=make_input({'id':row[0],'origin':'parser_offers','row':idx,'fields':{k:{'value':v} for k,v in zip(SCHEMAS['parser_offers'],row)}})
              n=normalize_record(raw,as_of='2026-09-18');common.append(n)
              assert all(x['value']!='100' for x in n['benefits'] if x['unit']=='percent')
          Path('hse-verification/source-replay.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          Path('hse-verification/common-replay.json').write_text(json.dumps(common,ensure_ascii=False,indent=2))
          print('55 source records,51 detailed; two expired; no payment100percent discount in common views')
          PY
      - run: python -m playwright install --with-deps chromium
      - name: Fresh normal dispatcher for the two new sources; no Google or provider credentials
        run: |
          xvfb-run -a python loyalty/collect_normalized.py --sources hse_alumni,alfa_only_partner_offers --out hse-verification/live-output
          python loyalty/sheets_normalized.py --input hse-verification/live-output/normalized.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('hse-verification/live-output/normalized.json').read_text())
          assert len(x['records'])==55 and {r['source_id'] for r in x['records']}=={'hse_alumni'}
          by={s['source_id']:s for s in x['sources']}
          assert by['hse_alumni']['status']=='partial' and by['hse_alumni']['normalized']==55
          assert by['alfa_only_partner_offers']['normalized']==0
          print('Source failures are recorded explicitly, not converted to cashback or login claims')
          PY
      - name: Commit only the tested integration on the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/loyalty/hse-alfa-20260918'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/normalized.py loyalty/collect_normalized.py loyalty/sources_normalized.json loyalty/unified_normalization.py
          git commit -m 'Register HSE public offers and Alfa access probe after source and full regression checks'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/loyalty/hse-alfa-20260918
          git rev-parse HEAD > hse-verification/proposed-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hse-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: hse-verification/
          retention-days: 7
