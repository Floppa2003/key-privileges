name: Qwen direct think JSON diagnostic v2
# described-schema retry
# One-stage: full evidence + think=true -> JSON
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths:
      - .github/workflows/merchant-direct-think-json.yml
      - loyalty/experiments/direct_think_json/direct_json.py
      - loyalty/experiments/direct_think_json/described_schema.json
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-direct-think-json
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run existing and direct-probe checks
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual:$GITHUB_WORKSPACE/loyalty/experiments/simple_thinking"
          python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
          python -m py_compile loyalty/experiments/direct_think_json/direct_json.py
          python -m unittest discover -s loyalty/experiments/simple_thinking -p 'test_*.py' -v
          node --test key/refresh.test.mjs

  direct:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OLLAMA_MODEL: qwen3.5:9b-q4_K_M
      DIRECT_MODEL: qwen3.5:9b-q4_K_M
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - case: muzcomedy
            artifact: '11092173951'
          - case: nevsky
            artifact: '11092462751'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve experiment metadata
        run: |
          set -euo pipefail
          mkdir -p direct-output/code
          git rev-parse HEAD > direct-output/commit.txt
          cp loyalty/experiments/direct_think_json/* direct-output/code/
          cp loyalty/experiments/simple_thinking/probe.py loyalty/experiments/simple_thinking/plan.json direct-output/code/
          cp loyalty/experiments/prompt_ab/prompt_ab.py loyalty/experiments/prompt_ab/practical_schema.json direct-output/code/
          cp loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh direct-output/code/
          cp .github/workflows/merchant-direct-think-json.yml direct-output/workflow.yml
          lscpu > direct-output/cpu.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: sources/${{ matrix.case }}
          merge-multiple: true
      - name: Install pinned local model
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > direct-output/setup.log 2>&1
      - name: Direct full-evidence think=true JSON extraction
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual:$GITHUB_WORKSPACE/loyalty/experiments/simple_thinking"
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/direct_think_json/direct_json.py             --source sources --case ${{ matrix.case }} --out direct-output/results             --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama"             > direct-output/inference.log 2>&1
      - name: Hash diagnostics
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('direct-output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-think-json-${{ matrix.case }}-${{ github.run_id }}
          path: direct-output/
          retention-days: 14
