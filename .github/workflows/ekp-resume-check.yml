name: EKP contract on repaired baseline
on:
  push:
    branches: [loyalty/remaining-correctness]
    paths: [.github/workflows/ekp-resume-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Observe public catalogue and two linked cards
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          mkdir -p ekp-output
          git archive --format=tar --output=ekp-output/code.tar HEAD
          python - <<'PY'
          import asyncio,json,re,sys,os,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlsplit,urljoin
          from bs4 import BeautifulSoup
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from model import clean_url
          from playwright.async_api import async_playwright
          out=Path('ekp-output')
          async def main():
              report={'observed_at':datetime.now(timezone.utc).isoformat(),'sample':os.environ['SAMPLE'],'pages':[],'responses':[],'errors':[]}
              tasks=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      async with PublicSource(browser,'https://ekp.spb.ru/') as c:
                          await c.robots()
                          page=c.page
                          async def receive(resp):
                              try:
                                  u=urlsplit(resp.url)
                                  if u.hostname!='ekp.spb.ru' or not re.fullmatch(r'/api/portal/loyalty/(?:partners(?:/[0-9]+)?|regions|categories/partners)',u.path):return
                                  if len(report['responses'])>=30:return
                                  url=clean_url(resp.url)
                                  entry={'url':url,'status':resp.status,'method':resp.request.method}
                                  if resp.status==200 and 'json' in resp.headers.get('content-type',''):
                                      raw=await resp.body()
                                      if len(raw)<=3000000:
                                          obj=json.loads(raw)
                                          name='response-'+hashlib.sha256(url.encode()+raw).hexdigest()[:16]+'.json'
                                          (out/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf8')
                                          entry['file']=name
                                  report['responses'].append(entry)
                              except Exception as exc:report['errors'].append({'phase':'response','type':type(exc).__name__})
                          def capture(resp):tasks.append(asyncio.create_task(receive(resp)))
                          page.on('response',capture)
                          async def snapshot(label):
                              await page.wait_for_timeout(4000)
                              if tasks:await asyncio.gather(*tasks)
                              soup=BeautifulSoup(await page.content(),'html.parser')
                              for n in soup.select('script,style,form,input,textarea'):n.decompose()
                              main=soup.select_one('main') or soup.body or soup
                              (out/(label+'.html')).write_text(str(main),encoding='utf8')
                              links=[]
                              for a in soup.select('a[href]'):
                                  try:url=clean_url(urljoin(page.url,a['href']))
                                  except (ValueError,TypeError):continue
                                  if re.fullmatch(r'https://ekp\.spb\.ru/capabilities/loyalty/tiles/[0-9]+(?:\?[^#]*)?',url):links.append(url)
                              report['pages'].append({'label':label,'url':page.url,'cards':list(dict.fromkeys(links)),'buttons':[b.get_text(' ',strip=True) for b in soup.select('button')]})
                              return list(dict.fromkeys(links))
                          await c.read('https://ekp.spb.ru/capabilities/loyalty/tiles?region=78',render=True)
                          cards=await snapshot('catalogue')
                          button=page.get_by_role('button',name=re.compile(r'^Показать (?:ещё|еще)$',re.I)).first
                          if await button.count() and await button.is_visible() and await button.is_enabled():
                              await button.click(timeout=5000)
                              await snapshot('catalogue-next')
                          for n,url in enumerate(cards[:2]):
                              await c.read(url,render=True)
                              await snapshot('detail-'+str(n))
                  except Exception as exc:report['errors'].append({'phase':'source','type':type(exc).__name__,'reason':str(exc)[:300]})
                  finally:
                      if tasks:await asyncio.gather(*tasks,return_exceptions=True)
                      await browser.close()
              (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
              print(json.dumps({'pages':len(report['pages']),'responses':len(report['responses']),'errors':report['errors']},ensure_ascii=False))
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-resume-${{ matrix.sample }}-${{ github.run_id }}
          path: ekp-output/
          retention-days: 7
