name: Diagnose public SIM rule shape
on:
  push:
    branches: [loyalty/known-source-completion]
    paths: [.github/workflows/known-sim-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Capture exact public article and parsing error
        run: |
          mkdir -p sim-review
          command -v pdftotext > sim-review/pdf-command.txt || true
          python - <<'PY'
          import asyncio,json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          from bs4 import BeautifulSoup
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from known_rules import parse_known_rule
          from playwright.async_api import async_playwright
          async def main():
              url='https://msk.t2.ru/help/article/recovery-sim';out=Path('sim-review');reports=[]
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  try:
                      for render in (False,True):
                          r={'render':render}
                          try:
                              async with asyncio.timeout(75):
                                  async with PublicSource(b,url) as c:
                                      await c.robots();raw=await c.read(url,render=render)
                                      s=BeautifulSoup(raw,'html.parser')
                                      for n in s.select('script,style,form,input,textarea'):n.decompose()
                                      (out/('article-'+str(render)+'.html')).write_text(str(s.body or s),encoding='utf8')
                                      try:
                                          rows=parse_known_rule('t2_sim_rules',raw,url,datetime.now(timezone.utc).isoformat())
                                          r.update(status='parsed',rows=len(rows),fees=rows[0]['details']['fees'])
                                      except ValueError as exc:r.update(status='parse_error',reason=str(exc))
                          except Exception as exc:r.update(status='read_error',reason=str(exc)[:160] if isinstance(exc,RuntimeError) else type(exc).__name__)
                          reports.append(r)
                  finally:await b.close()
              (out/'report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding='utf8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sim-review-${{ github.run_id }}
          path: sim-review/
          retention-days: 7
