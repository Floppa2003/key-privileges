name: Qwen decoder-constraint diagnostic
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-free-json.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-free-json
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - case: rzd_museum
            artifact: '11111500277'
          - case: lavka
            artifact: '11111745399'
          - case: nevsky
            artifact: '11111890672'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact code and machine
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p free-output/code
          git rev-parse HEAD > free-output/commit.txt
          cp loyalty/experiments/simple_thinking/* free-output/code/
          cp loyalty/experiments/prompt_ab/prompt_ab.py loyalty/experiments/prompt_ab/practical_schema.json free-output/code/
          cp loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh free-output/code/
          cp .github/workflows/merchant-free-json.yml free-output/workflow.yml
          lscpu > free-output/cpu.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36741893989'
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: source
          merge-multiple: true
      - name: Install same pinned local model
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > free-output/setup.log 2>&1
      - name: Remove only decoder format; validate unchanged final JSON afterwards
        run: |
          set -euo pipefail
          loyalty/experiments/resolution/.venv/bin/python -m unittest discover -s loyalty/experiments/simple_thinking -p 'test_*.py' -v > free-output/tests.log 2>&1
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/simple_thinking/free_json.py --source source --out free-output/results --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama" > free-output/inference.log 2>&1
      - name: Preserve diagnostics and hashes without weights
        if: always()
        run: |
          if test -d loyalty/experiments/resolution/setup-logs; then cp -r loyalty/experiments/resolution/setup-logs free-output/; fi
          python - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          root=Path('free-output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-json-${{ matrix.case }}-${{ github.run_id }}
          path: free-output/
          retention-days: 14
