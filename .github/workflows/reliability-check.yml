name: Coverage reliability bounded check
on:
  push:
    branches: ["loyalty/coverage-reliability-20260922"]
    paths: [".github/workflows/reliability-check.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python diagnostics/public_coverage_gaps.py
      - run: python -m pip download --no-deps protego==0.6.2 -d reliability-probe/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reliability-gaps-${{ github.run_id }}
          path: reliability-probe/
          retention-days: 1
