name: Coverage reliability bounded check
on:
  push:
    branches: ["loyalty/coverage-reliability-20260922"]
    paths: [".github/workflows/reliability-check.yml"]
permissions:
  contents: read
  actions: read
jobs:
  final-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Regression on final source code
        run: |
          mkdir -p reliability-final
          python -m unittest discover -s loyalty/tests -v > reliability-final/tests.log 2>&1
          tail -5 reliability-final/tests.log
          node --test key/refresh.test.mjs > reliability-final/key-tests.log 2>&1
          tail -8 reliability-final/key-tests.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reliability-live-35753691428
          run-id: 35753691428
          github-token: ${{ github.token }}
          path: earlier-public
      - name: Replay every actual source record and keep restaurant activation unknown
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from public_reward_projection import make_record
          from source_lifecycle import health_summary
          from sheets_normalized import prepare,SCHEMAS
          from unified_normalization import make_input,normalize_record
          from catalogue_view import record_row
          raw=Path('earlier-public/live/normalized.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='4dedc420b076194e3888f20861b270f25d211c9ec827424c196a2f650f58644b'
          b=json.loads(raw);unchanged=0;corrected=0
          for i,r in enumerate(b['records']):
              new=make_record(r['source_id'],r['details']['public_reward_evidence'],r['observed_at'])
              if new==r:
                  unchanged+=1
              else:
                  assert r['source_url'].endswith('/zaly-ozhidaniya/dragonpass')
                  assert {k for k in r if r[k]!=new[k]}=={'content_sha256','redemption_text'}
                  assert new['redemption_text']==''
                  b['records'][i]=new;corrected+=1
          assert (unchanged,corrected)==(200,1)
          assert all(r['healthy'] for r in health_summary(b))
          for row in prepare(b)['parser_offers']:
              raw=make_input(dict(id=row[0],origin='parser_offers',row=2,fields={h:{'value':v} for h,v in zip(SCHEMAS['parser_offers'],row)}))
              view,why=record_row(normalize_record(raw,as_of=b['observed_at'][:10]),b['observed_at'][:10])
              assert view and why is None,(row[2],why)
          result={'unchanged_actual_records':unchanged,'restaurant_activation_corrections':corrected,'all_reader_records':len(b['records']),'source_run':b['run_id'],'source_observed_at':b['observed_at'],'new_source_fetch':False,'published':False}
          Path('reliability-final/acceptance.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
      - name: Preserve reviewed code and test evidence
        if: always()
        run: |
          mkdir -p reliability-final
          git rev-parse HEAD > reliability-final/commit.txt
          git archive HEAD loyalty key .github/workflows > reliability-final/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reliability-final-${{ github.run_id }}
          path: reliability-final/
          retention-days: 1
