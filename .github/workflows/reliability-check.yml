name: Coverage reliability bounded check
on:
  push:
    branches: ["loyalty/coverage-reliability-20260922"]
    paths: [".github/workflows/reliability-check.yml"]
permissions:
  contents: read
jobs:
  apply-and-test:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/loyalty/coverage-reliability-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply the reviewed hash-guarded Python changes offline
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/loyalty/coverage-reliability-20260922'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          items=json.loads(Path('diagnostics/reliability_changes.json').read_text())
          assert len(items)==25 and len({x['path'] for x in items})==25
          for x in items:
              p=Path(x['path']);assert not p.is_absolute() and '..' not in p.parts
              assert x['path'].startswith('loyalty/') or x['path']=='.github/workflows/loyalty.yml'
              expected=x['new_sha256'] if not x['old_sha256'] or x['path']=='.github/workflows/loyalty.yml' else x['old_sha256']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, x['path']
          patch=Path('diagnostics/reliability_existing.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='c6e4dae3c7fcce286a6d3326401b602775cc8008a314680bec9fa8cb382c699c'
          # The workflow file was committed through the connected GitHub app;
          # this job only applies and commits the reviewed Python file changes.
          patch=patch[patch.index(b'--- a/loyalty/avolta_source.py'):]
          subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          for x in items:
              assert hashlib.sha256(Path(x['path']).read_bytes()).hexdigest()==x['new_sha256'],x['path']
          PY
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full offline regression before committing the feature branch
        run: |
          mkdir -p reliability-check
          python -m unittest discover -s loyalty/tests -v > reliability-check/tests.log 2>&1
          tail -5 reliability-check/tests.log
          node --test key/refresh.test.mjs > reliability-check/key-tests.log 2>&1
          tail -8 reliability-check/key-tests.log
      - name: Commit only the checked feature-branch Python paths
        id: commit
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          items=json.loads(Path('diagnostics/reliability_changes.json').read_text())
          for x in items:
              assert hashlib.sha256(Path(x['path']).read_bytes()).hexdigest()==x['new_sha256'],x['path']
          paths=[x['path'] for x in items if x['old_sha256'] and x['path'].startswith('loyalty/')]
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)==set(paths),(changed,paths)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Integrate tested public-source coverage, reversible holds and freshness checks'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/loyalty/coverage-reliability-20260922'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/loyalty/coverage-reliability-20260922'],text=True).split()[0]
          assert remote==sha
          Path('reliability-check/commit.txt').write_text(sha+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('commit='+sha+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reliability-regression-${{ github.run_id }}
          path: reliability-check/
          retention-days: 1
  collect:
    needs: apply-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply-and-test.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Fresh collection of the three approved public sources
        run: xvfb-run -a python loyalty/collect_normalized.py --sources backit_public,club_avolta_public,mantera_moments --limit 500 --out reliability-check/live
      - name: Validate actual source health, every record, and clean reader fields
        run: |
          python loyalty/source_lifecycle.py --input reliability-check/live/normalized.json
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from sheets_normalized import prepare,SCHEMAS
          from unified_normalization import make_input,normalize_record
          from catalogue_view import record_row
          b=json.loads(Path('reliability-check/live/normalized.json').read_text())
          values=prepare(b)['parser_offers']
          for row in values:
              raw=make_input(dict(id=row[0],origin='parser_offers',row=2,fields={h:{'value':v} for h,v in zip(SCHEMAS['parser_offers'],row)}))
              reader,reason=record_row(normalize_record(raw,as_of=b['observed_at'][:10]),b['observed_at'][:10])
              assert reader and reason is None,(row[2],reason)
          summary={'run_id':b['run_id'],'observed_at':b['observed_at'],'records':len(values),'sources':[{k:r[k] for k in ('source_id','normalized','status','failed')} for r in b['sources']],'published':False}
          Path('reliability-check/acceptance.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary))
          PY
      - name: Preserve exact source code and observation evidence
        if: always()
        run: |
          mkdir -p reliability-check
          git rev-parse HEAD > reliability-check/commit.txt
          git archive HEAD loyalty key .github/workflows > reliability-check/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reliability-live-${{ github.run_id }}
          path: reliability-check/
          retention-days: 1
