name: One-time public client source map inspection
on:
  push:
    branches: [research/public-alternatives-20260924]
    paths: [.github/workflows/public-sourcemap-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: npm install --no-audit --no-fund --ignore-scripts typescript@5.9.3
      - name: Read only public root and source-advertised static resources
        run: |
          node --input-type=module <<'JS'
          import ts from 'typescript';
          import {createHash} from 'node:crypto';
          const origin='https://marketplace.konsierge.com';
          const report={started_at:new Date().toISOString(),account_used:false,credentials_used:false,client_code_executed:false,api_calls:0,requests:[]};
          const hash=x=>createHash('sha256').update(x).digest('hex');
          async function read(url,bound){
            const u=new URL(url);if(u.origin!==origin||u.search||u.hash||u.username||u.password)throw Error('outside_static_scope');
            const row={url,requested_at:new Date().toISOString()};report.requests.push(row);
            const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(30000),headers:{'User-Agent':'PublicLoyaltyResearch/1.0'}});row.status=r.status;
            row.server_date=r.headers.get('Date');row.cache_age=r.headers.get('Age');
            if(r.status!==200||r.headers.has('Retry-After'))throw Error('source_response_not_200');
            const parts=[];let total=0;
            for await(const b of r.body){total+=b.length;if(total>bound)throw Error('response_size_bound');parts.push(b);}
            const raw=Buffer.concat(parts);Object.assign(row,{bytes:raw.length,sha256:hash(raw),finished_at:new Date().toISOString()});return raw.toString('utf8');
          }
          function redacted(code,file){
            const tree=ts.createSourceFile(file,code,ts.ScriptTarget.Latest,true,file.endsWith('x')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
            const retain=new Set(['GET_BENEFITS_REQUEST','GET_BENEFITS_RESPONSE','GET_BENEFITS_ERROR','GET_RUBRICS_REQUEST','GET_RUBRICS_RESPONSE','GET_RUBRICS_ERROR','Authorization','Basic','Bearer','tariff_id','rubric_id','page','per','get','GET']);
            const spans=[];
            function walk(n){
              if(ts.isStringLiteralLike(n)||ts.isNumericLiteral(n)||ts.isRegularExpressionLiteral(n)||[ts.SyntaxKind.TemplateHead,ts.SyntaxKind.TemplateMiddle,ts.SyntaxKind.TemplateTail].includes(n.kind)){
                const v=n.text;const safe=typeof v==='string'&&(retain.has(v)||(/^https:\/\/benefits\.konsierge\.com\/[A-Za-z0-9/_-]*$/.test(v))||(/^\/?[A-Za-z0-9/_-]*(benefits|rubrics)[A-Za-z0-9/_-]*$/.test(v)));
                if(!safe)spans.push([n.getStart(tree),n.end]);
              }
              ts.forEachChild(n,walk);
            }
            walk(tree);spans.sort((a,b)=>a[0]-b[0]);let p=0,out='';
            for(const [s,e]of spans){if(s<p)continue;out+=code.slice(p,s)+'[literal omitted]';p=e;}return out+code.slice(p);
          }
          try{
            const root=await read(origin+'/',100000);
            const scripts=[...root.matchAll(/<script[^>]*\bsrc=["']([^"']+)["']/g)].map(m=>new URL(m[1],origin).href).filter(u=>u.startsWith(origin+'/'));
            if(scripts.length!==1)throw Error('main_script_not_unique');
            const bundle=await read(scripts[0],5000000);
            const links=[...bundle.matchAll(/[#@]\s*sourceMappingURL=([^\s*]+)/g)];report.source_map_advertised=links.length===1;
            if(links.length!==1)throw Error('source_map_not_uniquely_advertised');
            const mapUrl=new URL(links[0][1],scripts[0]).href;const map=JSON.parse(await read(mapUrl,35000000));
            if(!Array.isArray(map.sources)||!Array.isArray(map.sourcesContent)||map.sources.length!==map.sourcesContent.length)throw Error('invalid_source_map');
            report.source_count=map.sources.length;
            const matching=[];
            for(let i=0;i<map.sources.length;i++){
              const path=map.sources[i],body=map.sourcesContent[i];if(typeof body!=='string'||/node_modules/.test(path))continue;
              if(/benefits|rubrics/i.test(path)||(/GET_BENEFITS_REQUEST/.test(body)&&!/(^|\/)constants\//.test(path))){
                matching.push({path,sha256:hash(body),characters:body.length,redacted_source:body.length<=24000?redacted(body,path):null,omitted_for_length:body.length>24000});
              }
            }
            report.relevant_sources=matching;report.outcome=matching.length?'public_source_map_inspected':'no_matching_source_module';
          }catch(e){report.outcome='incomplete';report.error=/^[a-z0-9_]+$/.test(e.message)?e.message:e.name;}
          report.finished_at=new Date().toISOString();console.log('SOURCE_MAP_AUDIT_BEGIN');console.log(JSON.stringify(report,null,2));console.log('SOURCE_MAP_AUDIT_END');
          JS
