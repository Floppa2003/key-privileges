name: One-time conventional public source map test
on:
  push:
    branches: [research/public-alternatives-20260924]
    paths: [.github/workflows/public-sourcemap-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: npm install --no-audit --no-fund --ignore-scripts typescript@5.9.3
      - name: Read one inferred static map path, redact literals, never call catalogue APIs
        run: |
          node --input-type=module <<'JS'
          import ts from 'typescript';
          import {createHash} from 'node:crypto';
          const url='https://marketplace.konsierge.com/static/js/main.959cee1e.js.map';
          const report={started_at:new Date().toISOString(),url,url_provenance:'one_conventional_inferred_map_path_for_the_source_linked_js_not_an_advertised_map',account_used:false,credentials_used:false,client_executed:false,api_calls:0};
          const hash=x=>createHash('sha256').update(x).digest('hex');
          function redact(code,path){
            const root=ts.createSourceFile(path,code,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX),spans=[];
            function walk(n){
              if(ts.isStringLiteralLike(n)||ts.isNumericLiteral(n)||ts.isRegularExpressionLiteral(n)||[ts.SyntaxKind.TemplateHead,ts.SyntaxKind.TemplateMiddle,ts.SyntaxKind.TemplateTail].includes(n.kind))spans.push([n.getStart(root),n.end]);
              ts.forEachChild(n,walk);
            }
            walk(root);spans.sort((a,b)=>a[0]-b[0]);let at=0,out='';for(const[s,e]of spans){if(s<at)continue;out+=code.slice(at,s)+'[literal omitted]';at=e;}return out+code.slice(at);
          }
          try{
            const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(30000),headers:{'User-Agent':'PublicLoyaltyResearch/1.0'}});report.status=r.status;report.content_type=r.headers.get('Content-Type');report.cache_age=r.headers.get('Age');report.server_date=r.headers.get('Date');
            if(r.status!==200||r.headers.has('Retry-After')){report.outcome='non_200_no_retry';}
            else{
              const parts=[];let n=0;for await(const b of r.body){n+=b.length;if(n>35000000)throw Error('response_bound');parts.push(b);}
              const raw=Buffer.concat(parts);report.bytes=raw.length;report.sha256=hash(raw);const map=JSON.parse(raw.toString('utf8'));
              if(!Array.isArray(map.sources)||!Array.isArray(map.sourcesContent)||map.sources.length!==map.sourcesContent.length)throw Error('invalid_map');
              report.source_count=map.sources.length;report.relevant_sources=[];
              for(let i=0;i<map.sources.length;i++){
                const path=map.sources[i],body=map.sourcesContent[i];if(typeof body!=='string'||/node_modules/.test(path))continue;
                if(/benefits|rubrics/i.test(path)||/getBenefits|getRubrics/.test(body))report.relevant_sources.push({path,characters:body.length,sha256:hash(body),redacted_source:body.length<=25000?redact(body,path):null,omitted_for_length:body.length>25000});
              }
              report.outcome='public_map_read_static_source_inspected';
            }
          }catch(e){report.outcome='incomplete';report.error=/^[a-z_]+$/.test(e.message)?e.message:e.name;}
          report.finished_at=new Date().toISOString();console.log('CONVENTIONAL_MAP_BEGIN');console.log(JSON.stringify(report,null,2));console.log('CONVENTIONAL_MAP_END');
          JS
