name: Review remaining known public sources
on:
  push:
    branches: [loyalty/known-source-completion]
    paths: [loyalty/**, .github/workflows/known-source-review.yml]
permissions:
  contents: read
concurrency:
  group: known-source-review
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed code registration if present
        run: |
          if test -f loyalty/register_known.py; then python loyalty/register_known.py; fi
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Retain only the verified code registration
        id: commit
        run: |
          if test -f loyalty/register_known.py; then
            git add -- loyalty/known_rules.py loyalty/known_rules.json loyalty/sources_normalized.json loyalty/requirements.txt
            git rm -- loyalty/register_known.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: register native PDF rules and delayed article readiness'
            git push origin HEAD:refs/heads/loyalty/known-source-completion
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  collect:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.test.outputs.tested_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run the actual public-source dispatcher without Google access
        run: |
          mkdir -p known-review
          git archive --format=tar --output=known-review/code.tar HEAD
          python -m pip download --no-deps pypdf==6.18.1 -d known-review
          python - <<'PY'
          import asyncio,json,os,sys
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          sys.path.insert(0,'loyalty')
          from playwright.async_api import async_playwright
          from collect_normalized import one
          from sheets_normalized import prepare
          async def main():
              cfgs=[c for c in json.loads(Path('loyalty/sources_normalized.json').read_text()) if c['mode']=='known_rules']
              now=datetime.now(timezone.utc).isoformat();sem=asyncio.Semaphore(3);locks={}
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  async def run(c):
                      async with locks.setdefault(urlsplit(c['url']).hostname,asyncio.Lock()),sem:
                          return await one(browser,c,now,500)
                  try:results=await asyncio.gather(*(run(c) for c in cfgs))
                  finally:await browser.close()
              bundle={'schema_version':2,'run_id':os.environ['GITHUB_RUN_ID']+':1','observed_at':now,'sources':[r for r,_ in results],'records':[x for _,xs in results for x in xs]}
              prepare(bundle)
              Path('known-review/normalized.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2),encoding='utf8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: known-source-review-${{ github.run_id }}
          path: known-review/
          retention-days: 7
          if-no-files-found: error
