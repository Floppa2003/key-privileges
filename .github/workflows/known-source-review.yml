name: Review remaining known public sources
on:
  push:
    branches: [loyalty/known-source-completion]
    paths: [loyalty/**, .github/workflows/known-source-review.yml]
permissions:
  contents: read
concurrency:
  group: known-source-review
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Bounded anonymous inspection, no Google credentials
        run: |
          mkdir -p known-review
          git archive --format=tar --output=known-review/code.tar HEAD
          python - <<'PY'
          import asyncio,json,sys,hashlib
          from pathlib import Path
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from normalized import canonical_url
          from playwright.async_api import async_playwright
          TARGETS='''https://www.rendez-vous.ru/aeroflotbonus/
          https://media.utair.ru/wmiles
          https://media.utair.ru/ugoodness
          https://media.utair.ru/promo
          https://media.utair.ru/status
          https://sp.yandex.ru/s7
          https://msk.t2.ru/help/article/magnit-plus-premium
          https://msk.t2.ru/option/mixx-m
          https://msk.t2.ru/journal/article/more-loyalty
          https://msk.t2.ru/help/article/recovery-sim
          https://bootwood.com/afl_bonus/
          https://wolford.ru/aeroflot_bonus/
          https://aeroflot.iway.ru/
          https://vkusomania.ru/partners/aeroflot/
          https://skyshop.aeromar.ru/info/aeroflot-bonus/
          https://sovcomins.ru/bonuses/mili-programmy-aeroflot-bonus/
          https://afl.premier.one/
          https://x5club.ru/partners/202?redirectedFrom=landing
          https://ru.comfort-pass.aero/
          https://tripster.atlassian.net/wiki/spaces/affiliates/pages/3979739137
          https://www.vtb.ru/privilegia/karty/debetovye/privilegiya-aeroflot/
          https://www.gazprombank.ru/personal/cards/7515685/
          https://www.primbank.ru/d/tariffs-aeroflot-bonus
          https://vip-zal.ru/aeroflot-bonus.php
          https://www.hse.ru/scholarships/rzd_bonus
          https://uralsib.ru/aktsii/privetstvennye-bally-rzhd-za-oformlenie-karty
          https://assets.finuslugi.ru/sc-disclosure/293d2bf4-16c4-46c6-87a5-0a2d35d18ad8
          https://azimuthotels.com/ru/info/privileges-ab
          https://azimuthotels.com/ru/info/accumulate-points
          https://rgo.ru/membership/loyalty-program/book24-ru/
          https://rgo.ru/activity/travel-list/excursions-and-routes/ekskursiya-po-istoricheskoy-shtab-kvartire-rgo-v-sankt-peterburge/
          https://www.gov.spb.ru/gov/otrasl/c_econom/news/312063/
          https://www.gov.spb.ru/gov/otrasl/c_econom/news/312678/
          https://cdn.flysmartavia.com/smartup/
          https://sferakrasoti.ru/
          https://www.nspk.ru/press-center/details/00d06ff9-ac6f-41fd-9aad-39965b9762cd
          https://aeroexpress.ru/aero/press/news20101967.html
          https://101hotels.com/page/contacts/rules_mir_cashback/usloviya_akcii_cashback_mir_10_prosentov_1_06_2026
          https://www.coral.ru/poleznaya-informatsiya/offers/aktsiya-sherwood-resorts-hotels/
          https://promomiles.aeroflot.ru/act/march2026/partner-code-terms-use
          https://www.uralairlines.ru/baggage_detail/sverkhnormativnyy-bagazh/'''.split()
          SUPPORT='''https://www.utair.ru/support/6/dopolnitelnye_uslugi/ob_usluge_povyshenie_klassa_obsluzhivaniya
          https://www.utair.ru/support/6/dopolnitelnye_uslugi/povyshenie_klassa_obsluzhivaniya_za_mili_uteir_status
          https://www.utair.ru/support/9/kak_poluchit_promocod
          https://www.utair.ru/support/6/dopolnitelnye_uslugi/usluga_fast_track
          https://www.utair.ru/support/11/biznes_zaly'''.split()
          SHORT='wzqdRP JdyRTA pYGdKM gGliaq ZNxBpY yRBVmU yZhJLY cuOyfc uXoqHP uWpmkU qzWiWH TlYigt pNnqOk bFwqtV CpeHTa coHFJh yxouTP hXfkMF MvgoSB'.split()
          OUT=Path('known-review');sem=asyncio.Semaphore(4);locks={}
          async def probe(browser,url):
              host=urlsplit(url).hostname;lock=locks.setdefault(host,asyncio.Lock())
              async with sem,lock:
                  r={'url':url,'observed_at':datetime.now(timezone.utc).isoformat()}
                  try:
                      async with asyncio.timeout(70):
                          async with PublicSource(browser,url) as c:
                              await c.robots();r['robots']=c.robots_info
                              raw=await c.read(url,render=True)
                              soup=BeautifulSoup(raw,'html.parser')
                              r['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                              r['final_url']=canonical_url(c.page.url)
                              links=[]
                              for a in soup.select('a[href]'):
                                  try:u=canonical_url(a['href'])
                                  except (ValueError,TypeError):continue
                                  links.append({'text':a.get_text(' ',strip=True),'url':u})
                              r['links']=links[:400]
                              for n in soup.select('script,style,form,input,textarea'):n.decompose()
                              body=soup.body or soup
                              name=hashlib.sha256(url.encode()).hexdigest()[:16]+'.html'
                              (OUT/name).write_text(str(body),encoding='utf8')
                              r.update(status='read',html_file=name,text_length=len(body.get_text()))
                  except Exception as exc:
                      r.update(status='failed',reason=str(exc)[:180] if isinstance(exc,RuntimeError) else type(exc).__name__)
                  print(json.dumps({k:v for k,v in r.items() if k!='links'},ensure_ascii=False),flush=True)
                  return r
          async def shortlinks(browser):
              rows=[]
              async with browser.new_context() as c:
                  for key in SHORT:
                      url='https://ut0.ru/'+key
                      try:
                          res=await c.request.get(url,max_redirects=0,timeout=15000)
                          loc=res.headers.get('location');safe=None
                          if loc:
                              try:safe=canonical_url(loc)
                              except ValueError:pass
                          rows.append({'url':url,'http_status':res.status,'location':safe,'redirection_followed':False})
                      except Exception as exc:rows.append({'url':url,'reason':type(exc).__name__})
                      await asyncio.sleep(0.3)
              return rows
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  try:
                      reports,short=await asyncio.gather(asyncio.gather(*(probe(b,u) for u in TARGETS+SUPPORT)),shortlinks(b))
                  finally:await b.close()
              (OUT/'report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding='utf8')
              (OUT/'shortlinks.json').write_text(json.dumps(short,ensure_ascii=False,indent=2),encoding='utf8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: known-source-review-${{ github.run_id }}
          path: known-review/
          retention-days: 7
          if-no-files-found: error
