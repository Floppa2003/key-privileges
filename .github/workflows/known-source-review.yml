name: Review remaining known public sources
on:
  push:
    branches: [loyalty/known-source-completion]
    paths: [loyalty/**, .github/workflows/known-source-review.yml]
permissions:
  contents: read
concurrency:
  group: known-source-review
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python loyalty/review_public_details.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: known-source-review-${{ github.run_id }}
          path: known-review/
          retention-days: 7
          if-no-files-found: error
