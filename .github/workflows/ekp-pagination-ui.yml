name: EKP source-owned UI pagination
on:
  push:
    branches: [main]
    paths: [diagnostics/ekp_pagination_ui.py, .github/workflows/ekp-pagination-ui.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Check syntax and existing Free-budget assertions without secrets
        run: |
          python -m py_compile diagnostics/ekp_pagination_ui.py
          python - <<'PY'
          import sys,subprocess
          sys.path.insert(0,'diagnostics')
          from ekp_pagination_ui import JS
          from free_residential_comparison import selfcheck
          selfcheck()
          subprocess.run(['node','-e','new (Object.getPrototypeOf(async function(){}).constructor)(require("fs").readFileSync(0,"utf8"));'],input=JS,text=True,check=True)
          assert 'document.cookie' not in JS and 'fetch(' not in JS and 'XMLHttpRequest' not in JS
          PY
      - name: Read public page-size, load-more and one discovered non-login card
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python diagnostics/ekp_pagination_ui.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-pagination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-pagination-output/
          retention-days: 7
