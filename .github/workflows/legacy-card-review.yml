name: Review unmatched known S7 cards
on:
  push:
    branches: [loyalty/known-source-completion]
    paths: [.github/workflows/legacy-card-review.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read exact legacy URLs without authentication or promotion
        run: |
          mkdir -p legacy-review
          python - <<'PY'
          import asyncio,json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from playwright.async_api import async_playwright
          from adapters import next_state,s7_detail
          from normalized import validate_offer
          urls=['https://marketplace.s7.ru/city/offer/tsum','https://marketplace.s7.ru/city/offer/CozyHome','https://marketplace.s7.ru/partners/offer/airo']
          async def main():
              reports=[];records=[];now=datetime.now(timezone.utc).isoformat()
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      async with PublicSource(browser,urls[0]) as client:
                          await client.robots()
                          for url in urls:
                              row={'url':url,'observed_at':now}
                              try:
                                  raw=await client.read(url,render=False)
                                  parsed=s7_detail(next_state(raw),url,now)
                                  for item in parsed:validate_offer(item)
                                  records.extend(parsed);row.update(status='normalized',record_ids=[x['id'] for x in parsed])
                              except Exception as exc:
                                  row.update(status='failed',reason=str(exc)[:160] if isinstance(exc,RuntimeError) else type(exc).__name__)
                              reports.append(row)
                  finally:await browser.close()
              Path('legacy-review/result.json').write_text(json.dumps({'reports':reports,'records':records},ensure_ascii=False,indent=2),encoding='utf8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy-card-review-${{ github.run_id }}
          path: legacy-review/
          retention-days: 7
