name: EKP bounded application readiness
on:
  push:
    branches: [main]
    paths: [diagnostics/ekp_ready_wait.py, .github/workflows/ekp-ready-wait.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Compile and verify the bounded read-only snippet before key access
        run: |
          python -m py_compile diagnostics/ekp_ready_wait.py
          python - <<'PY'
          import sys, subprocess
          sys.path.insert(0,'diagnostics')
          from ekp_ready_wait import JS
          from free_residential_comparison import selfcheck
          selfcheck()
          subprocess.run(['node','-e','new (Object.getPrototypeOf(async function(){}).constructor)(require("fs").readFileSync(0,"utf8"));'],input=JS,text=True,check=True)
          assert '45000' in JS and 'cookie' not in JS and '.click(' not in JS
          PY
      - name: One policy and one delayed public root observation
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python diagnostics/ekp_ready_wait.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-ready-wait-output/
          retention-days: 7
