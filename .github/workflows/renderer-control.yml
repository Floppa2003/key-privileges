name: Renderer liveness before public source navigation
on:
  push:
    branches: ["diagnostics/seven-routes-transport-20260915"]
    paths: ["diagnostics/renderer_control.py", ".github/workflows/renderer-control.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        source: [ekp, nordwind]
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 curl_cffi==0.16.0 playwright==1.57.0
      - name: Test blank renderers before bounded public page reads
        env:
          SOURCE_ID: ${{ matrix.source }}
          REPLICA: ${{ matrix.replica }}
        run: timeout --signal=TERM --kill-after=5s 180s xvfb-run -a python diagnostics/renderer_control.py
      - name: Preserve diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: renderer-${{ matrix.source }}-${{ matrix.replica }}-${{ github.run_id }}
          path: renderer-control-output/
          if-no-files-found: warn
          retention-days: 7
