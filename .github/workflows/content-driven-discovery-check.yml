name: Content-driven discovery regression
on:
  push:
    branches: [main, fix/content-driven-discovery-20261022]
    paths: [loyalty/**, key/**, .github/workflows/**]
  pull_request:
    paths: [loyalty/**, key/**, .github/workflows/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-driven-discovery-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve tested source snapshot
        run: |
          mkdir -p regression-output
          git rev-parse HEAD > regression-output/commit.txt
          git archive --format=zip HEAD > regression-output/source.zip
      - name: Install test dependencies
        run: |
          python -m pip install -r loyalty/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Run full regression and content mutation suites
        run: |
          set -euo pipefail
          python -m unittest discover -s loyalty/tests -v > regression-output/tests.log 2>&1
          node --test key/refresh.test.mjs > regression-output/key-tests.log 2>&1
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: content-discovery-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: regression-output/
          retention-days: 14
