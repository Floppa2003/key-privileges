name: Verify Sacvoyage public alternative once
on:
  push:
    branches: ['loyalty/partner-alternatives-20260918']
    paths: [.github/workflows/sacvoyage-prepare-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Register the one reviewed source without changing prior entries
        run: |
          python - <<'PY'
          import copy,json,subprocess
          from pathlib import Path
          out=Path('sacvoyage-verification');out.mkdir()
          command=['python','-m','unittest','discover','-s','loyalty/tests','-p','test_sacvoyage_loyalty.py','-v']
          before=subprocess.run(command,capture_output=True,text=True)
          (out/'before.log').write_text(before.stdout+before.stderr)
          assert before.returncode!=0 and ('KeyError' in before.stderr or 'AssertionError' in before.stderr)
          pp=Path('loyalty/partner_pages.json');sp=Path('loyalty/sources_normalized.json');code=Path('loyalty/partner_pages.py')
          config=json.loads(pp.read_text());sources=json.loads(sp.read_text())
          old_config=copy.deepcopy(config);old_sources=copy.deepcopy(sources)
          sid='sacvoyage_loyalty';url='https://sacvoyage.ru/aktsii/'
          assert sid not in config and not any(s['id']==sid for s in sources)
          config[sid]={'url':url,'program':'Саквояж впечатлений — собственная программа','partner':'Саквояж впечатлений','category':'Отели','parser':sid}
          sources.append({'id':sid,'name':'Саквояж впечатлений — собственные скидки','mode':'html','url':url})
          assert all(config[k]==v for k,v in old_config.items()) and sources[:-1]==old_sources
          pp.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n');sp.write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          raw=code.read_text();target="    if cfg.get('parser') in ('ilocked_ekp','ilocked_certificate'):"
          assert raw.count(target)==1
          added="    if cfg.get('parser') == 'sacvoyage_loyalty':\n        from sacvoyage_loyalty import extract_sacvoyage\n        return extract_sacvoyage(source,soup,url,observed_at,cfg)\n"
          code.write_text(raw.replace(target,added+target))
          subprocess.run(command,check=True)
          PY
      - name: Complete regression suite and exact code archive
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee sacvoyage-verification/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee sacvoyage-verification/key-tests.log
          tar -cf sacvoyage-verification/code.tar loyalty key .github/workflows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35364900578
          name: partner-alternative-check-35364900578-1
          path: sacvoyage-source
      - name: Replay the real public page at its original observation time
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from adapters import extract
          from normalized import validate_offer
          root=Path('sacvoyage-source');audit=json.loads((root/'audit.json').read_text())
          assert audit['run_id']=='35364900578:1' and not audit['account_used']
          group=audit['groups'][0];assert group['robots']['state']=='rules_loaded'
          url='https://sacvoyage.ru/aktsii/'
          item,=[p for p in group['pages'] if p['url']==url]
          data=(root/item['file']).read_bytes()
          assert hashlib.sha256(data).hexdigest()==item['saved_sha256']
          assert item['responses'][-1]=={'url':url,'status':200} and item['identity']['final_url']==url
          rows=extract('sacvoyage_loyalty',data.decode('utf8'),url,item['requested_at'])
          assert len(rows)==2 and [r['rates'][0]['value'] for r in rows]==['5','10']
          for r in rows:
              validate_offer(r)
              assert not r['promo_codes'] and not r['details']['gated_catalogue_terms_recovered']
          Path('sacvoyage-verification/source-replay.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print('Actual source replay: two hotel-owned audiences, no RZD substitution')
          PY
      - run: python -m playwright install --with-deps chromium
      - name: Exercise existing source dispatcher and publication validator without Google access
        run: |
          xvfb-run -a python loyalty/collect_normalized.py --sources sacvoyage_loyalty --out sacvoyage-verification/live-output
          python loyalty/sheets_normalized.py --input sacvoyage-verification/live-output/normalized.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('sacvoyage-verification/live-output/normalized.json').read_text())
          assert len(x['records'])==2 and len(x['sources'])==1 and x['sources'][0]['status']=='ok'
          print('Real dispatcher: one current public source, two validated records')
          PY
      - name: Inspect two newly source-linked hotel pages as separate read-only diagnostics
        run: |
          python - <<'PY'
          import asyncio,hashlib,json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from free_access_probe import sanitized_page
          def now():return datetime.now(timezone.utc).isoformat()
          out=Path('sacvoyage-verification/admiral-diagnostic');out.mkdir()
          urls=['https://admhotel.ru/loyalty-program/','https://admhotel.ru/offers/']
          audit={'run_id':os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],
                 'started_at':now(),'account_used':False,'discovered_in':'35365375514:1',
                 'parent_url':'https://admhotel.ru/',
                 'parent_saved_sha256':'3a67a8e15fa3b623ee428c238fbd7f5dbc94aedc77dce5be344783802ea39f80','pages':[]}
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      async with PublicSource(browser,urls[0]) as client:
                          await client.robots();audit['robots']=client.robots_info
                          client.request_interval=max(client.request_interval,3)
                          for url in urls:
                              item={'url':url,'requested_at':now(),'responses':[]};audit['pages'].append(item)
                              def record(response):
                                  if response.request.is_navigation_request() and response.request.frame==client.page.main_frame:
                                      item['responses'].append({'url':response.url,'status':response.status})
                              client.page.on('response',record)
                              try:
                                  raw=await client.read(url,render=True)
                                  if client.page.url!=url:raise ValueError('exact_location_changed')
                                  item['source_sha256']=hashlib.sha256(raw.encode()).hexdigest()
                                  dom=BeautifulSoup(raw,'html.parser')
                                  if not dom.html:raise ValueError('no_html')
                                  dom.html['data-loyalty-probe-location']=client.page.url
                                  clean,identity=sanitized_page(str(dom),url)
                                  data=clean.encode();digest=hashlib.sha256(data).hexdigest();name=digest+'.html'
                                  (out/name).write_bytes(data);item.update(file=name,saved_sha256=digest,identity=identity)
                              except Exception as exc:
                                  item['error']=str(exc)[:180] if isinstance(exc,(RuntimeError,ValueError)) else type(exc).__name__
                              finally:
                                  item['finished_at']=now();client.page.remove_listener('response',record)
                              if item.get('error'):break
                  finally:await browser.close()
          try:asyncio.run(main())
          except Exception as exc:audit['error']=type(exc).__name__
          audit['finished_at']=now();audit['complete']=len(audit['pages'])==2 and all('file' in p for p in audit['pages'])
          (out/'audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2))
          print(json.dumps({'diagnostic_complete':audit['complete']}))
          PY
      - name: Commit only three tested registration files on the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/loyalty/partner-alternatives-20260918'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/partner_pages.py loyalty/partner_pages.json loyalty/sources_normalized.json
          git diff --cached > sacvoyage-verification/change.patch
          git commit -m 'Register one verified independent Sacvoyage source while preserving existing programmes'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/loyalty/partner-alternatives-20260918
          git rev-parse HEAD > sacvoyage-verification/proposed-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sacvoyage-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: sacvoyage-verification/
          retention-days: 7
