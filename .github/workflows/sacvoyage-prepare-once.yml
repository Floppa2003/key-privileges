name: Verify separate Sacvoyage programmes once
on:
  push:
    branches: ['loyalty/partner-alternatives-20260918']
    paths: [.github/workflows/sacvoyage-prepare-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Demonstrate missing date handling then add one independently scoped source
        run: |
          python - <<'PY'
          import copy,json,subprocess
          from pathlib import Path
          out=Path('sacvoyage-verification');out.mkdir()
          command=['python','-m','unittest','discover','-s','loyalty/tests','-p','test_sacvoyage_rzd.py','-v']
          before=subprocess.run(command,capture_output=True,text=True)
          (out/'before.log').write_text(before.stdout+before.stderr)
          assert before.returncode!=0 and 'AssertionError' in before.stderr
          root=Path('loyalty');code=root/'partner_pages.py';s=code.read_text()
          target="    if rule=='full_dmy':"
          added="    if rule=='end_dmy':\n        matches=list(re.finditer(r'Срок действия предложения:\\s*до (\\d{2}\\.\\d{2}\\.\\d{4})(?!\\d)',flat,re.I))\n        if len(matches)>1:raise ValueError('Ambiguous published end dates')\n        if matches:\n            m=matches[0];return None,datetime.strptime(m[1],'%d.%m.%Y').date().isoformat(),m[0]\n    elif rule=='full_dmy':"
          assert s.count(target)==1;s=s.replace(target,added)
          target="    if date_evidence:details['validity_evidence']=date_evidence\n"
          added=target+"    if cfg.get('require_explicit_period') and not date_evidence:\n        raise ValueError('Required published period missing')\n    if cfg.get('link_selectors'):\n        links=[]\n        for node in required(soup,cfg['link_selectors']):\n            item={'label':text(node.get_text(' ',strip=True)),'href':node.get('href','')}\n            if item not in links:links.append(item)\n        details['published_links']=links\n"
          assert s.count(target)==1;code.write_text(s.replace(target,added))
          pp=root/'partner_pages.json';sp=root/'sources_normalized.json'
          config=json.loads(pp.read_text());sources=json.loads(sp.read_text())
          old_config=copy.deepcopy(config);old_sources=copy.deepcopy(sources)
          sid='rzd_sacvoyage_public';url='https://sacvoyage.ru/partners/rzhd-bonus/'
          assert 'sacvoyage_loyalty' in config and sid not in config and not any(s['id']==sid for s in sources)
          config[sid]={'url':url,'program':'РЖД Бонус — публичная страница отеля','partner':'Саквояж впечатлений','category':'Отели',
              'selectors':['main .news-content'],'benefit_selectors':['main .news-content > h1.card-room__title + p'],
              'redemption_selectors':['main .news-content-text'],'link_selectors':['main .news-content-text a[href]'],
              'date_rule':'end_dmy','require_explicit_period':True,
              'warnings':['independent_partner_page_not_authenticated_programme_card','no_equivalence_with_unread_programme_card_verified','check_published_link_destinations_not_only_labels']}
          sources.append({'id':sid,'name':'РЖД Бонус — публичные условия Саквояжа','mode':'html','url':url})
          assert all(config[k]==v for k,v in old_config.items()) and sources[:-1]==old_sources
          pp.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n');sp.write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(command,check=True)
          PY
      - name: Complete regressions and archive exact proposed executable/config files
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee sacvoyage-verification/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee sacvoyage-verification/key-tests.log
          tar -cf sacvoyage-verification/code.tar loyalty key .github/workflows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35364900578
          name: partner-alternative-check-35364900578-1
          path: sacvoyage-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35365134061
          name: partner-alternative-check-35365134061-1
          path: sacvoyage-rzd-source
      - name: Independently replay two observed pages at their own original times
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from adapters import extract
          from normalized import validate_offer
          records=[]
          for folder,sid,run in [('sacvoyage-source','sacvoyage_loyalty','35364900578:1'),('sacvoyage-rzd-source','rzd_sacvoyage_public','35365134061:1')]:
              root=Path(folder);audit=json.loads((root/'audit.json').read_text())
              assert audit['run_id']==run and not audit['account_used']
              if sid=='sacvoyage_loyalty':
                  group=audit['groups'][0];assert group['robots']['state']=='rules_loaded'
                  item,=[p for p in group['pages'] if p['url']=='https://sacvoyage.ru/aktsii/']
              else:
                  assert audit['complete'] and audit['robots']['state']=='rules_loaded';item=audit
              data=(root/item['file']).read_bytes();assert hashlib.sha256(data).hexdigest()==item['saved_sha256']
              assert item['responses'][-1]=={'url':item['url'],'status':200} and item['identity']['final_url']==item['url']
              rows=extract(sid,data.decode('utf8'),item['url'],item['requested_at'])
              for r in rows:validate_offer(r)
              records.extend(rows)
          assert len(records)==3 and [r['rates'][0]['value'] for r in records]==['5','10','15']
          assert records[-1]['valid_until']=='2025-12-31' and records[-1]['validity_status']=='expired_by_published_end'
          assert all(not r['promo_codes'] for r in records)
          Path('sacvoyage-verification/source-replay.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          print('Source replay: two own-programme audiences and one explicitly expired independent RZD page')
          PY
      - run: python -m playwright install --with-deps chromium
      - name: Fresh real-dispatcher read of the two exact sources, no Google account
        run: |
          xvfb-run -a python loyalty/collect_normalized.py --sources sacvoyage_loyalty,rzd_sacvoyage_public --out sacvoyage-verification/live-output
          python loyalty/sheets_normalized.py --input sacvoyage-verification/live-output/normalized.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('sacvoyage-verification/live-output/normalized.json').read_text())
          assert len(x['records'])==3 and len(x['sources'])==2 and all(s['status']=='ok' for s in x['sources'])
          r,=[r for r in x['records'] if r['source_id']=='rzd_sacvoyage_public']
          assert r['validity_status']=='expired_by_published_end' and not r['promo_codes']
          print('Actual dispatcher: two source pages, three records, one remains explicitly expired')
          PY
      - name: Commit only the three tested existing-file changes on the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/loyalty/partner-alternatives-20260918'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/partner_pages.py loyalty/partner_pages.json loyalty/sources_normalized.json
          git diff --cached > sacvoyage-verification/change.patch
          git commit -m 'Keep dated hotel-owned RZD evidence distinct and require its explicit published validity'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/loyalty/partner-alternatives-20260918
          git rev-parse HEAD > sacvoyage-verification/proposed-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sacvoyage-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: sacvoyage-verification/
          retention-days: 7
