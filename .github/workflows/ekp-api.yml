name: EKP public catalogue and Sheets sync
on:
  push:
    branches: [main, 'loyalty/ekp-api-release-20260916', 'loyalty/ekp-policy-retry-20260916', 'loyalty/ekp-page-recovery-20260916']
    paths: [loyalty/ekp_catalog.py, loyalty/ekp_api_collect.py, loyalty/tests/test_ekp_api.py, loyalty/tests/test_ekp_policy_retry.py, loyalty/tests/test_ekp_page_recovery.py, .github/workflows/ekp-api.yml]
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * 1'
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Complete regression and archive exact execution tree
        run: |
          mkdir -p ekp-tests
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee ekp-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee ekp-tests/key-tests.log
          tar -cf ekp-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-tests/
          retention-days: 7
  collect:
    needs: regression
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      has_payload: ${{ steps.collect.outputs.has_payload }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Collect current public API fields under the existing Free account
        id: collect
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python loyalty/ekp_api_collect.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-api-output/
          retention-days: 7
  publish:
    needs: collect
    if: >-
      needs.collect.result == 'success' && needs.collect.outputs.has_payload == 'true' &&
      github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main' &&
      vars.LOYALTY_SHEETS_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ekp-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-source-evidence
      - name: Validate public payload before obtaining a Google token
        run: |
          python - <<'PY'
          import os,sys
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from ekp_catalog import validate_bundle
          validate_bundle('ekp-source-evidence',run_id=os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],commit=os.environ['GITHUB_SHA'],clock=datetime.now(timezone.utc))
          print('EKP source artifact reconstructed and validated')
          PY
          python loyalty/sheets_normalized.py --input ekp-source-evidence/normalized.json
      - name: Obtain existing short-lived Sheets-scoped authorization
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Reuse bounded public upserts and private normalization with readback
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DISCOUNTS_SPREADSHEET_ID: ${{ secrets.DISCOUNTS_SPREADSHEET_ID }}
        run: |
          python loyalty/sheets_normalized.py --input ekp-source-evidence/normalized.json --publish
          python loyalty/unified_publish.py --publish
