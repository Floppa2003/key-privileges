name: Capture Mir region-switch catalogue response
on:
  push:
    branches: [loyalty/ekp-native-catalog]
    paths: [.github/workflows/mir-switch-response.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          import asyncio,json,sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from mir_ui import BrowserResponses
          OUT=Path('mir-switch');OUT.mkdir()
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  async with PublicSource(browser,'https://vamprivet.ru/promo/') as client:
                      captured=BrowserResponses(client.page,client.host)
                      client.page.on('response',captured.observe)
                      report={}
                      try:
                          await client.robots();await client.read('https://vamprivet.ru/promo/',render=True)
                          first=await captured.wait(captured.catalogs,0,lambda x:x['page']==1)
                          yes=client.page.locator('.region-confirmation-modal__controls').get_by_role('button',name='Да',exact=True)
                          if await yes.count() and await yes.is_visible():await yes.click()
                          offset=len(captured.catalogs)
                          await client.page.locator('button.region-button').click()
                          await client.page.locator('.region-menu__link').get_by_text('Санкт-Петербург и ЛО',exact=True).click()
                          await client.page.wait_for_function("document.querySelector('.region-button__title')?.textContent.trim()==='Санкт-Петербург и ЛО'")
                          second=await captured.wait(captured.catalogs,offset,lambda x:x['page']==1)
                          report={'first':first,'second':second,'url':client.page.url}
                      except Exception as exc:report['error']=str(exc)
                      finally:
                          report['catalogs']=captured.catalogs;report['errors']=captured.errors
                          OUT.joinpath('report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
                          soup=BeautifulSoup(await client.page.content(),'html.parser')
                          for n in soup.select('script,style,form,input,textarea'):n.decompose()
                          OUT.joinpath('dom.html').write_text(str(soup),encoding='utf8')
                          await captured.close()
                  await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mir-switch-${{ github.run_id }}
          path: mir-switch/
          retention-days: 7
