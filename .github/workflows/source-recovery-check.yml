name: Source recovery acceptance
on:
  push:
    branches: [fix/source-errors-20261022, fix/remaining-source-errors-20261023]
    paths: [.github/workflows/source-recovery-check.yml, loyalty/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-recovery-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Leave room for dependency installation AND the collector's own 1000s budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve execution snapshot and install dependencies
        run: |
          set -euo pipefail
          mkdir -p repair-output/dependencies
          git rev-parse HEAD > repair-output/commit.txt
          git archive --format=zip HEAD > repair-output/source.zip
          python -m pip install -r loyalty/requirements.txt
          python -m pip download --no-deps protego==0.6.2 -d repair-output/dependencies
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus
      - name: Full regression
        run: |
          set -euo pipefail
          python -m unittest discover -s loyalty/tests -v > repair-output/tests.log 2>&1
          node --test key/refresh.test.mjs > repair-output/key-tests.log 2>&1
          git diff --exit-code
      - name: Install browser for public collection
        run: python -m playwright install --with-deps chromium
      - name: Check repaired sources before the complete collection
        id: smoke
        env:
          SOURCE_IDS: hse_alumni,smartavia_rules,mantera_moments,af_parkfly,af_primbank_rules,t2_mixx,t2_selection,t2_mixx_s,t2_powerbank,t2_mixx_rules,t2_registration_rules,x5_partners_public
        run: |
          set -euo pipefail
          xvfb-run -a python loyalty/collect_normalized.py --limit 500 --sources "$SOURCE_IDS" --out repair-output/smoke 2>&1 | tee repair-output/smoke.log
          python loyalty/sheets_normalized.py --input repair-output/smoke/normalized.json > repair-output/smoke-validation.log
          python loyalty/source_lifecycle.py --input repair-output/smoke/normalized.json --sources "$SOURCE_IDS" > repair-output/smoke-health.json
      - name: Collect all registered public routes without publication
        if: success() || steps.smoke.outcome == 'failure'
        run: |
          set -euo pipefail
          xvfb-run -a python loyalty/collect_normalized.py --limit 500 --out repair-output/collection 2>&1 | tee repair-output/collection.log
      - name: Validate public rows and report all source routes
        if: always()
        run: |
          if test -f repair-output/collection/normalized.json; then
            python loyalty/sheets_normalized.py --input repair-output/collection/normalized.json > repair-output/publication-validation.log
            python loyalty/source_lifecycle.py --input repair-output/collection/normalized.json > repair-output/source-health.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: repair-output/
          retention-days: 14
