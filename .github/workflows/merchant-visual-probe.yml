name: Merchant PDF and screenshot feasibility probe
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-visual-probe.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Recapture one known page after necessary-cookie choice; no offers activated
        run: |
          mkdir -p visual-probe/golden_triangle
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > visual-probe/commit.txt
          cp .github/workflows/merchant-visual-probe.yml visual-probe/capture-workflow.yml
          PYTHONPATH=loyalty python - <<'PY'
          import asyncio, hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.async_api import async_playwright
          from public_transport import PublicSource
          async def run():
              out=Path('visual-probe/golden_triangle')
              url='https://gthotel.ru/offers/'
              item={'id':'golden_triangle','requested_url':url,'target_program':'РЖД Бонус',
                    'publication_allowed':False,'login_performed':False,'actions':[],
                    'viewport':{'width':1280,'height':960},'native_pdf_media':'screen',
                    'pdf_page_css_px':[1280,1800],
                    'screenshot_and_pdf_are_sequential_captures':True}
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  item['browser_version']=browser.version
                  async with PublicSource(browser,url) as source:
                      page=source.page
                      await page.set_viewport_size(item['viewport'])
                      await source.robots()
                      await source.read(url,render=True)
                      # The exact visible choice rejects optional cookies. No broad 'accept all'.
                      control=page.get_by_text('Принять необходимые',exact=True)
                      if await control.count()!=1 or not await control.is_visible():
                          raise ValueError('necessary_cookie_control_missing_or_ambiguous')
                      await control.click(timeout=5000)
                      await page.wait_for_timeout(500)
                      if await control.is_visible():
                          raise ValueError('cookie_banner_not_dismissed')
                      item['actions'].append('clicked_visible_necessary_cookies_only')
                      for _ in range(24):
                          size=await page.evaluate('({y:scrollY,h:innerHeight,total:document.documentElement.scrollHeight})')
                          if size['total']>32000:raise ValueError('capture_height_budget')
                          if size['y']+size['h']>=size['total']-2:break
                          await page.evaluate('window.scrollBy(0,800)')
                          await page.wait_for_timeout(200)
                      await page.evaluate('window.scrollTo(0,0)')
                      await page.wait_for_timeout(1200)
                      await page.emulate_media(media='screen',reduced_motion='reduce')
                      item.update(observed_at=datetime.now(timezone.utc).isoformat(),final_url=page.url,
                          title=await page.title(),robots=source.robots_info,
                          closed_details=await page.locator('details:not([open])').count(),
                          collapsed_controls=await page.locator('[aria-expanded="false"]').count())
                      text=await page.locator('body').inner_text()
                      (out/'visible-text.txt').write_text(text,encoding='utf-8')
                      await page.screenshot(path=str(out/'screen.png'),full_page=True,timeout=20000)
                      await page.pdf(path=str(out/'page.pdf'),width='1280px',height='1800px',
                          margin={'top':'0','bottom':'0','left':'0','right':'0'},print_background=True,
                          display_header_footer=False,prefer_css_page_size=False)
                      item['body_changed_between_captures']=(text!=await page.locator('body').inner_text())
                      item['status']='captured_needs_visual_inspection'
                      item['files']={f.name:{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in out.iterdir() if f.is_file()}
                  await browser.close()
              (out/'capture.json').write_text(json.dumps(item,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('visual-probe/capture-report.json').write_text(json.dumps({'purpose':'single-page cookie-overlay correction; no model inference','results':[item],'publication_allowed':False},ensure_ascii=False,indent=2),encoding='utf-8')
              print(item['status'])
          asyncio.run(run())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-visual-probe-${{ github.run_id }}
          path: visual-probe/
          retention-days: 3
