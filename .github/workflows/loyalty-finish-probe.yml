name: Inspect remaining public loyalty sources
on:
  push:
    branches: [loyalty/finish-catalogs]
    paths: [.github/workflows/loyalty-finish-probe.yml, loyalty/finish_probe.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python loyalty/finish_probe.py
      - name: Preserve only sanitized public-page observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loyalty-finish-browser-${{ github.run_id }}
          path: finish-browser/
          retention-days: 7
