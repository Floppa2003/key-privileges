name: Verify pinned robots parser dependency
on:
  push:
    branches: [loyalty/finish-catalogs]
    paths: [.github/workflows/loyalty-finish-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip download --no-deps --only-binary=:all: protego==0.6.2 -d public-wheels
      - run: echo '714de21d82527c9be900066c3211b266985dd6a19b6e70c57e033fc1a589f3ff  public-wheels/protego-0.6.2-py3-none-any.whl' | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-protego-wheel-${{ github.run_id }}
          path: public-wheels/
          retention-days: 7
