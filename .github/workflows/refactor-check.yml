name: Refactor check

on:
  push:
    branches:
      - "refactor/compact-repo"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test key/refresh.test.mjs
      - run: node key/refresh.mjs
      - name: Verify refreshed snapshot
        run: |
          node -e 'const s=require("./key/status.json"); if(!s.ok||s.partner_count<20||!s.content_sha256||!s.remote_ok) process.exit(1)'
