name: Verify scoped tables and partial collection repair
on:
  push:
    branches: [loyalty/remaining-correctness]
    paths: [loyalty/**, .github/workflows/repair-verify.yml]
permissions:
  contents: read
concurrency:
  group: loyalty-remaining-correctness
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact reviewed source delta
        run: |
          if test -f loyalty/apply_reviewed_patch.py; then python loyalty/apply_reviewed_patch.py; fi
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Commit only verified source files and remove transfer helpers
        run: |
          if test -f loyalty/apply_reviewed_patch.py; then
            git rm -- loyalty/apply_reviewed_patch.py loyalty/repaired-source.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: normalize table-scoped discounts and preserve completed catalogue records'
            git push origin HEAD:refs/heads/loyalty/remaining-correctness
          fi
      - name: Save tested public source snapshot
        run: |
          mkdir -p repair-output
          git archive --format=tar --output=repair-output/tested-code.tar HEAD
      - run: python -m playwright install --with-deps chromium
      - name: Fresh public collection without Google credentials
        run: python loyalty/collect_normalized.py --out repair-output --limit 200
      - name: Validate normalized publication payload without writing to Sheets
        run: python loyalty/sheets_normalized.py --input repair-output/normalized.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repair-scoped-${{ github.run_id }}
          path: repair-output/
          retention-days: 7
          if-no-files-found: warn
