name: General merchant experimental check
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [loyalty/merchant_general.py, loyalty/merchant_review.py, loyalty/tests/test_merchant_general.py, loyalty/tests/test_merchant_review.py, loyalty/experiments/merchant_general/semantic-counterexample.json, .github/workflows/merchant-general-check.yml]
permissions:
  contents: read
concurrency:
  group: merchant-general-experimental
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Functional tests only; not semantic acceptance
        run: |
          mkdir -p merchant-general-output
          git rev-parse HEAD > merchant-general-output/commit.txt
          cp loyalty/merchant_general.py loyalty/merchant_review.py loyalty/tests/test_merchant_general.py loyalty/tests/test_merchant_review.py merchant-general-output/
          python -m unittest discover -s loyalty/tests -v > merchant-general-output/python-tests.log 2>&1
          node --test key/refresh.test.mjs > merchant-general-output/key-tests.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-general-${{ github.run_id }}-${{ github.run_attempt }}
          path: merchant-general-output/
          retention-days: 1
  semantic-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Evaluate recorded live verdict; expected to fail until a new verified model result resolves it
        run: |
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          case=json.loads(Path('loyalty/experiments/merchant_general/semantic-counterexample.json').read_text())
          passed=case['observed_verdict']==case['expected_verdict']
          print(json.dumps({'case':case['case_id'],'observed':case['observed_verdict'],'expected':case['expected_verdict'],'passed':passed,'fresh_model_call':False,'publication_allowed':False}))
          sys.exit(0 if passed else 1)
          PY
