name: One-time EKP pre-projection metadata diagnostic
on:
  push:
    branches: [diagnostics/access-boundary-20260923]
    paths: [.github/workflows/ekp-boundary-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-refs/heads/main
  cancel-in-progress: false
  queue: max
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python -m pip install --quiet -r loyalty/requirements.txt
      - name: Read one anonymous catalogue page; export only field states
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          python - <<'PY'
          import os,sys,json,tempfile,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          import ekp_session_collect as m
          from public_transport import robots_document
          from protego import Protego
          from bs4 import BeautifulSoup
          report={'started_at':datetime.now(timezone.utc).isoformat(),'mode':'one_anonymous_browser_page_field_metadata_only','source_account_used':False,'protected_values_saved':False,'publication':False,'max_provider_credits':150}
          js=r'''
          const API='https://ekp.spb.ru/api/portal/loyalty/partners';
          const result={startedAt:new Date().toISOString(),pagesRead:0,catalogueComplete:false,sourceCredentialsUsed:false,protectedValuesExported:false};
          function state(row,k){
            if(!Object.prototype.hasOwnProperty.call(row,k))return 'missing';
            const v=row[k];if(v===null)return 'null';if(typeof v!=='string')return 'unexpected_type';
            const d=new DOMParser().parseFromString(v,'text/html');const t=d.body.textContent.trim();
            if(!t)return 'empty';
            if(/авторизуйтесь|войдите в личный|для просмотра.*вход/i.test(t))return 'login_instruction_present';
            return 'nonempty_text_not_exported';
          }
          try{
            if(location.origin!=='https://ekp.spb.ru'||!['/capabilities/loyalty/','/capabilities/loyalty/tiles','/capabilities/loyalty/tiles/'].includes(location.pathname))throw Error('unexpected_root');
            if(/captcha|access denied|проверка безопасности|доступ к сайту временно ограничен/i.test(document.title+' '+document.body.textContent.slice(0,1000)))throw Error('restriction_document');
            const request={pagination:{limit:120,offset:0},filters:{categories:[],name:'',qrDiscount:false,region:'98'}};
            const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);
            try{
              const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(request),credentials:'omit',redirect:'error',cache:'no-store',signal:c.signal});
              result.status=r.status;
              if(r.status!==200||r.url!==API||r.headers.has('Retry-After'))throw Error('source_http_refusal');
              const raw=await r.text();if(raw.length>6000000)throw Error('size_bound');
              const p=JSON.parse(raw);
              if(!Array.isArray(p.partners)||p.offset!==0||p.partners.length>120)throw Error('schema_changed');
              result.total=p.total;result.sampleRows=p.partners.length;result.pagesRead=1;
              result.responseSha256=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)))].map(x=>x.toString(16).padStart(2,'0')).join('');
              const counts={},samples=[];
              for(const row of p.partners){
                if(typeof row.description_authorized!=='boolean')throw Error('invalid_access_flag');
                const s={restricted_flag:row.description_authorized,loyaltyDescription:state(row,'loyaltyDescription'),discountScheme:state(row,'discountScheme')};
                const k=JSON.stringify(s);counts[k]=(counts[k]||0)+1;
                if(row.description_authorized&&samples.length<5)samples.push({public_partner_id:row.id,field_states:s});
              }
              result.fieldStateCounts=counts;result.restrictedSamples=samples;result.outcome='pre_projection_field_metadata_read';
            }finally{clearTimeout(timer);}
          }catch(e){result.error=/^[a-z_]+$/.test(e.message)?e.message:e.name;}
          result.finishedAt=new Date().toISOString();
          const pre=document.createElement('pre');pre.id='ekp-field-metadata';pre.textContent=JSON.stringify(result);document.body.replaceChildren(pre);
          '''
          reader=None
          try:
              with tempfile.TemporaryDirectory() as td:
                  script=Path(td)/'metadata.js';script.write_text(js)
                  m.SCRIPT=script;m.MAX_CREDITS=150;m.MAX_REQUESTS=2
                  reader=m.Reader(os.environ.get('SCRAPINGANT_API_KEY',''))
                  reader.preflight();report['opening_free_balance']=reader.balance
                  raw=reader.read(m.POLICY);rules,status=robots_document(200,raw);policy=Protego.parse(rules)
                  if not all(policy.can_fetch(u,'LoyaltyCatalogResearchBot') for u in (m.ROOT,m.API)):raise RuntimeError('robots_disallow')
                  if policy.crawl_delay('LoyaltyCatalogResearchBot') or policy.request_rate('LoyaltyCatalogResearchBot'):raise RuntimeError('source_pacing_requires_review')
                  report['policy_state']=status
                  raw=reader.read(m.ROOT);soup=BeautifulSoup(raw,'html.parser');nodes=soup.select('#ekp-field-metadata')
                  if len(nodes)!=1:raise RuntimeError('metadata_marker_missing')
                  obj=json.loads(nodes[0].get_text())
                  allowed={'startedAt','finishedAt','pagesRead','catalogueComplete','sourceCredentialsUsed','protectedValuesExported','status','total','sampleRows','responseSha256','fieldStateCounts','restrictedSamples','outcome','error'}
                  if set(obj)-allowed or obj.get('sourceCredentialsUsed') is not False or obj.get('protectedValuesExported') is not False:raise RuntimeError('metadata_contract_changed')
                  report['source_metadata']=obj
          except Exception as e:
              report['error']=str(e) if isinstance(e,RuntimeError) and __import__('re').fullmatch('[a-z_0-9]{1,100}',str(e)) else type(e).__name__
          finally:
              if reader:report.update(provider_requests=reader.calls,reserved_credits=reader.reserved,known_charged_credits=reader.charged,closing_free_balance=reader.closing_balance())
              report['finished_at']=datetime.now(timezone.utc).isoformat()
              print('EKP_METADATA_BEGIN');print(json.dumps(report,ensure_ascii=False,indent=2));print('EKP_METADATA_END')
          PY
