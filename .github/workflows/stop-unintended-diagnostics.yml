name: Stop unintended diagnostic push jobs
on:
  push:
    branches: [fix/diagnostics-manual-20261024]
    paths: [.github/workflows/stop-unintended-diagnostics.yml]
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only push runs from the exact maintenance merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from pathlib import Path
          target='ba6f3c0489875aa1d4a40256884ec2b81d5d157d'
          base='https://api.github.com/repos/Floppa2003/key-privileges'
          def api(path, method='GET'):
              r=urllib.request.Request(base+path, method=method,
                  data=b'' if method=='POST' else None,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(r, timeout=20) as response:
                  raw=response.read()
                  return response.status, json.loads(raw) if raw else None
          _,data=api('/actions/runs?head_sha='+target+'&per_page=100')
          selected=[r for r in data['workflow_runs'] if r['head_sha']==target and r['event']=='push'
                    and r['path']!='.github/workflows/content-driven-discovery-check.yml']
          audit=[]
          for r in selected:
              row={k:r[k] for k in ('id','name','path','head_sha','status','conclusion')}
              if r['status']!='completed':
                  try:row['cancel_http']=api('/actions/runs/'+str(r['id'])+'/cancel','POST')[0]
                  except urllib.error.HTTPError as exc:row['cancel_http']=exc.code
              audit.append(row)
          for attempt in range(6):
              for row in audit:
                  _,r=api('/actions/runs/'+str(row['id']))
                  row['final_status']=r['status'];row['final_conclusion']=r['conclusion']
              if all(r['final_status']=='completed' for r in audit):break
              time.sleep(5)
          Path('stop-audit.json').write_text(json.dumps(audit,indent=2))
          print(json.dumps(audit,indent=2))
          if any(r['final_status']!='completed' for r in audit):raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unintended-push-stop-${{ github.run_id }}
          path: stop-audit.json
          retention-days: 14
