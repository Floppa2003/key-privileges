name: Verify bounded Mir recovery
on:
  push:
    branches: [loyalty/promo-evidence-repair]
    paths: [.github/workflows/mir-recovery-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - run: python -m playwright install --with-deps chromium
      - name: Check three actual public cards without Google credentials
        run: |
          mkdir -p mir-check-output
          git archive --format=tar --output=mir-check-output/tested-code.tar HEAD
          python - <<'PY'
          import asyncio,json,sys,time,os
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from playwright.async_api import async_playwright
          from public_transport import PublicSource
          from mir_ui import BrowserResponses,read_matching_detail
          from normalized import validate_offer
          targets=[
              ('5f116166-8b3b-4b41-b498-41bad3949bac','https://vamprivet.ru/promo/transport/ekspress-v-aeroport-s-vygodoy-i-komfortom-1/'),
              ('db7f56ef-dd05-4b44-a103-21d5b1316d58','https://vamprivet.ru/promo/krasota-i-zdorovye/chekap-zubov-dlya-zdorovoy-ulybki-1/'),
              ('d660fa25-8b62-4611-aac1-2b961dd2d85d','https://vamprivet.ru/promo/mir-supreme/gastronomicheskoe-udovolstvie-s-premialnymi-produktami-ps-mir-5/')]
          async def main():
              result={'run_id':os.environ['GITHUB_RUN_ID'],'observed_at':datetime.now(timezone.utc).isoformat(),'records':[],'errors':[],'scope':'three_fixed_public_details_not_full_catalog'}
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      async with PublicSource(browser,'https://vamprivet.ru/') as client:
                          await client.robots()
                          captured=BrowserResponses(client.page,client.host)
                          client.page.on('response',captured.observe)
                          try:
                              for identity,url in targets:
                                  try:
                                      record=await read_matching_detail(client,captured,url,result['observed_at'],expected_id=identity,deadline=time.monotonic()+90)
                                      validate_offer(record)
                                      result['records'].append(record)
                                  except Exception as exc:result['errors'].append({'native_id':identity,'type':type(exc).__name__,'reason':str(exc)[:200] if isinstance(exc,RuntimeError) else 'read_failed'})
                              result['response_diagnostics']=captured.errors
                          finally:await captured.close()
                  except Exception as exc:result['errors'].append({'type':type(exc).__name__,'reason':'source_setup_failed'})
                  finally:await browser.close()
              Path('mir-check-output/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf8')
              print(json.dumps({'records':len(result['records']),'errors':result['errors']},ensure_ascii=False))
              if len(result['records'])!=3:raise SystemExit(2)
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mir-recovery-${{ github.run_id }}
          path: mir-check-output/
          retention-days: 7
          if-no-files-found: error
