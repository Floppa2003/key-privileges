name: Confirmed merchant channel contracts
on:
  push:
    branches: [loyalty/confirmed-channels-20261031]
    paths:
      - '.github/workflows/merchant-channel-check.yml'
      - 'loyalty/merchant*.py'
      - 'loyalty/tests/test_merchant*.py'
  pull_request:
    paths:
      - '.github/workflows/merchant-llm-daily.yml'
      - 'loyalty/merchant*.py'
      - 'loyalty/tests/test_merchant*.py'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies; no model keys
        run: python -m pip install -r loyalty/requirements.txt
      - name: New channel contracts
        run: |
          mkdir -p channel-test-output
          git rev-parse HEAD > channel-test-output/commit.txt
          python -m unittest discover -s loyalty/tests -p test_merchant_channels.py -v > channel-test-output/contracts.log 2>&1
      - name: Full Python regression
        if: always()
        run: python -m unittest discover -s loyalty/tests -v > channel-test-output/python.log 2>&1
      - name: KEY regression
        if: always()
        run: node --test key/refresh.test.mjs > channel-test-output/key.log 2>&1
      - name: Read exact test summaries
        if: always()
        run: |
          for f in channel-test-output/*.log; do echo "=== $f ==="; tail -70 "$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: channel-contracts-${{ github.run_id }}
          path: channel-test-output/
          retention-days: 30
