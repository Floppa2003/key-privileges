name: Coral purchase layout regressions
on:
  push:
    branches: ['loyalty/coral-purchase-layouts-20260916']
    paths: ['loyalty/**', '.github/workflows/coral-purchase-tests.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full regression without provider or Google credentials
        run: |
          mkdir -p purchase-tests
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee purchase-tests/python.log
          node --test key/refresh.test.mjs 2>&1 | tee purchase-tests/key.log
      - name: Preserve exact executed code and tests
        if: always()
        run: |
          mkdir -p purchase-tests
          tar -cf purchase-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coral-purchase-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: purchase-tests/
          retention-days: 7
