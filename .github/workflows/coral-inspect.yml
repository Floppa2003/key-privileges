name: Inspect Coral public source
on:
  push:
    branches: [loyalty/finish-catalogs]
    paths: [diagnostics/coral_public.py, .github/workflows/coral-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 6
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 protego==0.6.2
      - run: python diagnostics/coral_public.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coral-inspection-${{ github.run_id }}
          path: coral-inspection/
          retention-days: 7
