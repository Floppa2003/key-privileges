name: Wire RZD external integration
on:
  push:
    branches: ['loyalty/rzd-external-20260917']
    paths: ['.github/workflows/rzd-external-wire.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Apply the two reviewed integration deltas only
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('loyalty/normalized.py');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='0c9b229ec8cd95d249bfae117c29f205f8759477ca40bf54e2da04e7aa41ed68'
          s=s.replace("HOSTS['rzd']=['rzd-bonus.ru']", "HOSTS['rzd']=['rzd-bonus.ru']\nHOSTS['rzd_tour_conditions']=['rzdtour.com']\nHOSTS['rzd_unicredit_reference']=['www.unicreditbank.ru']\nHOSTS['rzd_unicredit_rules']=['www.unicreditbank.ru']")
          assert hashlib.sha256(s.encode()).hexdigest()=='592fce28655621c198ac18cb246349b32605fdb2d8413567d0ed14e8bf1dbbec';p.write_text(s)
          p=Path('loyalty/unified_normalization.py');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='b21861759e6655b822eca72cd2f52c15f730cc8538399e6f15c0a2e3caa24f22'
          needle="    if raw['kind']=='program_rules' and d.get('retrieval_method')=='coral_source_linked_pdf_free_api_v1':"
          extra="""    if d.get('retrieval_method')=='rzd_external_direct_v1':
                  # Only the tour-owned RZD clause projects benefits. Other price-table
                  # discounts, bank refund rules and illustrative codes stay conditions.
                  scope={'source_url':raw['source_url'],'title':raw['title'],'eligibility_not_verified':True}
                  if d.get('public_tour'):
                      for rate in normalize_rates(raw.get('benefit','')):
                          benefit(rate['kind'],'/benefit',value=rate['value'],unit=rate['unit'],
                                  qualifier=rate['qualifier'],scope=scope)
                  condition('external_partner_rules','/conditions',scope=scope)
                  n['quality']['issues'].append('external_context_not_generalized_to_all_products')
                  n['content_sha256']=digest({k:v for k,v in n.items() if k!='content_sha256'})
                  validate_normalized(n);return n
          """
          # YAML block indentation is removed above; align subsequent source lines.
          lines=extra.splitlines(True);extra=lines[0]+''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          assert s.count(needle)==1;s=s.replace(needle,extra+needle)
          assert hashlib.sha256(s.encode()).hexdigest()=='c011a751e2ed1ee59c254b5024fbb2ba1220521afc5a660d15bc2e76c76eaa1a';p.write_text(s)
          PY
      - name: Test exact resulting code before commit
        run: |
          mkdir -p integration-check
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee integration-check/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee integration-check/key-tests.log
          tar -cf integration-check/code.tar loyalty key .github/workflows
      - name: Commit only the two guarded files to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/normalized.py loyalty/unified_normalization.py
          git diff --cached --stat
          git commit -m 'Register external RZD evidence and keep tour rewards scoped to their own clauses'
          git push origin HEAD:refs/heads/loyalty/rzd-external-20260917
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rzd-external-integration-${{ github.run_id }}
          path: integration-check/
          retention-days: 7
