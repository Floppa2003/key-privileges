name: Inspect Mir public regional controls
on:
  push:
    branches: [loyalty/ekp-native-catalog]
    paths: [.github/workflows/mir-region-inspection.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          import asyncio,json,sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          OUT=Path('mir-regions');OUT.mkdir()
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  async with PublicSource(browser,'https://vamprivet.ru/') as client:
                      await client.robots();await client.read('https://vamprivet.ru/',render=True)
                      await client.page.wait_for_timeout(4000)
                      soup=BeautifulSoup(await client.page.content(),'html.parser')
                      for node in soup.select('script,style,form,input,textarea'):node.decompose()
                      OUT.joinpath('public-dom.html').write_text(str(soup),encoding='utf8')
                      controls=await client.page.locator('a,button,[role=button]').evaluate_all('(els)=>els.map(e=>({tag:e.tagName,text:e.textContent.trim(),href:e.getAttribute("href"),class:e.className,aria:e.getAttribute("aria-label")}))')
                      OUT.joinpath('controls.json').write_text(json.dumps(controls,ensure_ascii=False,indent=2),encoding='utf8')
                  await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mir-region-contract-${{ github.run_id }}
          path: mir-regions/
          retention-days: 7
