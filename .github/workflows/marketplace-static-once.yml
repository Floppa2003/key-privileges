name: One-time public marketplace static analysis
on:
  push:
    branches: [diagnostics/public-representations-20260923]
    paths: [.github/workflows/marketplace-static-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: npm install --no-audit --no-fund --ignore-scripts acorn@8.15.0
      - name: Parse public bundle as data; do not execute it or call discovered routes
        run: |
          node --input-type=module <<'JS'
          import * as acorn from 'acorn';
          import {createHash} from 'node:crypto';
          const url='https://marketplace.konsierge.com/static/js/main.959cee1e.js';
          const report={started_at:new Date().toISOString(),url,source_account_used:false,source_credentials_used:false,bundle_executed:false,discovered_routes_requested:false};
          try {
            const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(25000),headers:{'User-Agent':'PublicLoyaltyResearch/1.0'}});
            report.status=r.status;
            if(r.status!==200||r.headers.has('Retry-After'))throw Error('http_refusal_no_retry');
            const raw=Buffer.from(await r.arrayBuffer());if(raw.length>4000000)throw Error('size_bound');
            report.bytes=raw.length;report.sha256=createHash('sha256').update(raw).digest('hex');
            if(report.sha256!=='7dc923347de9b832bfbaa97bdcfa5391ea37fb6217aca295e174ee20bbedab2c')throw Error('source_bundle_changed');
            const ast=acorn.parse(raw.toString('utf8'),{ecmaVersion:'latest',sourceType:'script'});
            const urls=new Set(),paths=new Set(),labels=new Set(),calls=[],identifiers={};
            function safeRoute(v){
              if(typeof v!=='string'||v.length>400||/token|secret|session|password|authorization|api.?key/i.test(v))return null;
              if(/^https:\/\//.test(v)){
                try {const u=new URL(v);if(u.username||u.password||!/konsierge|apcg|knsrg/.test(u.hostname))return null;
                if(u.pathname.split('/').some(x=>x.length>60))return null;
                return u.origin+u.pathname;}catch{return null;}
              }
              if(/^[/.]?[a-z][a-z0-9_./{}:-]{0,160}$/i.test(v)&&/benefit|rubric|discount|partner|catalog|product|\bapi\b/i.test(v))return v;
              return null;
            }
            function literal(n){if(n?.type==='Literal'&&typeof n.value==='string')return n.value;if(n?.type==='BinaryExpression'&&n.operator==='+'){const l=literal(n.left),r=literal(n.right);if(l!==null&&r!==null)return l+r;}return null;}
            const stack=[ast];let visited=0;
            while(stack.length){
              const n=stack.pop();if(!n||typeof n!=='object')continue;visited++;
              if(n.type==='Literal'&&typeof n.value==='string'){
                const v=n.value,safe=safeRoute(v);if(safe)(safe.startsWith('https:')?urls:paths).add(safe);
                if(v.length<160&&/Авторизация|Введите свой номер|Скидки|Привилегии|Партнёры|Партнеры|Авиабилеты|Отели|Рестораны/.test(v)&&!/[<>{}=]/.test(v))labels.add(v);
              }
              if(n.type==='Identifier'&&/benefit|rubric|discount|tariff|catalog/i.test(n.name))identifiers[n.name]=(identifiers[n.name]||0)+1;
              if(n.type==='CallExpression'&&n.callee?.type==='MemberExpression'&&/^(get|post|fetch|request)$/.test(n.callee.property?.name||'')){
                const v=literal(n.arguments?.[0]),safe=safeRoute(v);if(safe)calls.push({method_name:n.callee.property.name,source_literal_route:safe,additional_argument_count:Math.max(0,n.arguments.length-1)});
              }
              for(const [k,v] of Object.entries(n)){if(k==='start'||k==='end')continue;if(Array.isArray(v))stack.push(...v);else if(v&&typeof v==='object')stack.push(v);}
            }
            report.ast_nodes=visited;report.source_owned_urls=[...urls].sort();report.route_literals=[...paths].sort();report.ui_labels=[...labels].sort();report.relevant_identifier_counts=identifiers;report.literal_network_calls=calls;report.scope='one_exact_source_linked_bundle_not_lazy_chunks_or_server_authorization';
            report.outcome='static_ast_inspected';
          }catch(e){report.outcome='incomplete';report.error=/^[a-z_]+$/.test(e.message)?e.message:e.name;}
          report.finished_at=new Date().toISOString();console.log('MARKETPLACE_AST_BEGIN');console.log(JSON.stringify(report,null,2));console.log('MARKETPLACE_AST_END');
          JS
