name: Seven public routes - transport and DNS experiment
on:
  push:
    branches: ["diagnostics/seven-routes-transport-20260915"]
    paths: ["diagnostics/seven_routes_transport.py", ".github/workflows/seven-routes-transport.yml"]
permissions:
  contents: read
concurrency:
  group: seven-routes-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-slim]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 curl_cffi==0.16.0
      - name: Finite anonymous access experiment
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: python diagnostics/seven_routes_transport.py
      - name: Preserve diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seven-transport-${{ matrix.runner }}-${{ github.run_id }}
          path: seven-access-output/
          if-no-files-found: warn
          retention-days: 7
