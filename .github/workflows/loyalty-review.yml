name: Review remaining loyalty sources
on:
  push:
    branches: [loyalty/coverage-completion]
    paths: [loyalty/**, .github/workflows/loyalty-review.yml]
permissions:
  contents: read
concurrency:
  group: loyalty-coverage-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply checksum-bound code registration when present
        run: |
          if test -f loyalty/enable_announcements.py; then python loyalty/enable_announcements.py; fi
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Commit only reviewed code changes
        run: |
          if test -f loyalty/enable_announcements.py; then
            git add -- loyalty/normalized.py loyalty/collect_normalized.py loyalty/sources_normalized.json loyalty/offer.schema.json
            git rm -- loyalty/enable_announcements.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: register evidence-scoped public announcement sources'
            git push origin HEAD:refs/heads/loyalty/coverage-completion
          fi
      - name: Preserve public tested code and offline test dependency
        run: |
          mkdir -p review-output
          git archive --format=tar --output=review-output/public-code.tar HEAD
          python -m pip download --no-deps Protego==0.6.2 -d review-output
      - run: python -m playwright install --with-deps chromium
      - name: Collect announcements without Google credentials
        run: |
          python - <<'PY'
          import asyncio,json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from playwright.async_api import async_playwright
          from collect_normalized import one
          from sheets_normalized import prepare
          async def main():
              cfgs=[c for c in json.loads(Path('loyalty/sources_normalized.json').read_text()) if c['mode']=='announcements']
              now=datetime.now(timezone.utc).isoformat()
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:results=[await one(browser,cfg,now,200) for cfg in cfgs]
                  finally:await browser.close()
              bundle={'schema_version':2,'run_id':'announcement-branch-review','observed_at':now,'sources':[r for r,_ in results],'records':[r for _,rs in results for r in rs]}
              prepare(bundle)
              Path('review-output/announcements.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2),encoding='utf8')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loyalty-review-${{ github.run_id }}
          path: review-output/
          retention-days: 7
          if-no-files-found: warn
