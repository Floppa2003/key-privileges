name: Review remaining loyalty sources
on:
  push:
    branches: [loyalty/coverage-completion]
    paths: [loyalty/**, .github/workflows/loyalty-review.yml]
permissions:
  contents: read
concurrency:
  group: loyalty-coverage-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Public-source diagnostic or verification
        run: |
          mkdir -p review-output
          git archive --format=tar --output=review-output/public-code.tar HEAD
          if test -f loyalty/review_remaining.py; then
            python -m playwright install --with-deps chromium
            python loyalty/review_remaining.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loyalty-review-${{ github.run_id }}
          path: review-output/
          retention-days: 7
          if-no-files-found: warn
