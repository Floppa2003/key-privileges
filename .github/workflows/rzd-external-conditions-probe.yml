name: RZD external conditions transport probe
on:
  push:
    branches: ['diagnostics/rzd-external-conditions-20260917']
    paths: ['.github/workflows/rzd-external-conditions-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 protego==0.6.2
      - name: Bounded public reads with source policy and sanitized evidence
        run: |
          python - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlsplit,urljoin
          import requests
          from bs4 import BeautifulSoup
          from protego import Protego
          OUT=Path('external-probe');OUT.mkdir()
          BOT='LoyaltyCatalogResearchBot'
          targets={
            'tour':('https://rzdtour.com/', 'https://rzdtour.com/'),
            'bank':('https://www.unicreditbank.ru/', 'https://www.unicreditbank.ru/ru/personal/cards/pi-packages/debit-cash-and-back.html')}
          report={'run':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],
            'accounts_used':False,'provider_credits':0,'publication':False,'reads':[],'sources':{}}
          def now():return datetime.now(timezone.utc).isoformat()
          def save(): (OUT/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          def read(url,label):
            item={'url':url,'started_at':now()};report['reads'].append(item);save()
            try:
              with requests.get(url,timeout=(8,20),allow_redirects=False,stream=True,headers={'User-Agent':BOT+'/1.0'}) as r:
                item.update(status=r.status_code,mime=r.headers.get('Content-Type'),location=r.headers.get('Location'))
                if r.status_code==429 or r.headers.get('Retry-After'):raise ValueError('rate_limit_stop')
                data=bytearray()
                for block in r.iter_content(65536):
                  data.extend(block)
                  if len(data)>2000000:raise ValueError('size_limit')
                item['bytes']=len(data);item['sha256']=hashlib.sha256(data).hexdigest()
                r._content=bytes(data);r.encoding=r.apparent_encoding
                raw=r.text
                if label.endswith('robots'):
                  (OUT/(label+'.txt')).write_text(raw)
                elif r.status_code==200:
                  soup=BeautifulSoup(raw,'html.parser')
                  for e in soup.select('script,style,form,input,textarea,button,iframe'):e.decompose()
                  for e in soup.find_all(True):e.attrs={k:v for k,v in e.attrs.items() if k in ('href','id','class','title')}
                  (OUT/(label+'.html')).write_text(str(soup))
                  item['title']=soup.title.get_text(' ',strip=True) if soup.title else None
                  item['loyalty_fragments']=[t.strip() for t in soup.stripped_strings if 'бонус' in t.lower()][:30]
              return item,raw
            except Exception as exc:
              item['error']=str(exc) if isinstance(exc,ValueError) else type(exc).__name__;raise
            finally:item['finished_at']=now();save()
          for name,(root,target) in targets.items():
            try:
              meta,raw=read(root+'robots.txt',name+'-robots')
              if meta['status']!=200 or 'User-agent' not in raw or '<html' in raw.lower():raise ValueError('robots_not_read')
              rules=Protego.parse(raw)
              if not rules.can_fetch(target,BOT):raise ValueError('robots_disallow')
              rate=rules.request_rate(BOT);delay=max(5,rules.crawl_delay(BOT) or 0,rate.seconds/rate.requests if rate else 0)
              if delay>30:raise ValueError('delay_bound')
              time.sleep(delay)
              meta,raw=read(target,name+'-target')
              report['sources'][name]={'target_status':meta['status'],'read':meta['status']==200}
              if name=='tour' and meta['status']==200:
                soup=BeautifulSoup(raw,'html.parser')
                candidates=[]
                for a in soup.select('a[href]'):
                  u=urljoin(target,a['href']);p=urlsplit(u)
                  if p.scheme=='https' and p.netloc=='rzdtour.com' and p.path.startswith('/kruiznyie-turyi/kruiznyie-poezda/') and not p.query and not p.fragment and u not in candidates:candidates.append(u)
                report['sources'][name]['discovered_tour_pages']=candidates
                chosen=next((u for u in candidates if rules.can_fetch(u,BOT)),None)
                if chosen:
                  time.sleep(delay);read(chosen,name+'-one-linked-tour')
            except Exception as exc:report['sources'][name]={'error':str(exc) if isinstance(exc,ValueError) else type(exc).__name__}
            save()
          assert len(report['reads'])<=5
          (OUT/'executed-workflow.yml').write_bytes(Path('.github/workflows/rzd-external-conditions-probe.yml').read_bytes())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rzd-external-conditions-${{ github.run_id }}
          path: external-probe/
          retention-days: 7
