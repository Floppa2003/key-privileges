name: EKP payload and DOM boundary probe
on:
  push:
    branches: ["diagnostics/ekp-payload-20260915"]
    paths: ["diagnostics/ekp_payload_probe.py", ".github/workflows/ekp-payload-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Inspect current public source through existing isolated Chrome
        env:
          REPLICA: ${{ matrix.replica }}
        run: xvfb-run -a python diagnostics/ekp_payload_probe.py
      - name: Preserve bounded public evidence even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekp-payload-${{ matrix.replica }}-${{ github.run_id }}
          path: ekp-payload-output/
          if-no-files-found: error
          retention-days: 7
