name: Original sources - external public reader feasibility
on:
  push:
    branches: ["loyalty/daily-source-coverage-20260915"]
    paths: [".github/workflows/public-reader-check.yml"]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [ekp, nordwind, coral, coral_promo, rzd, aeroflot]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - name: One uncached anonymous read, no account or paid key
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit
          import requests
          from bs4 import BeautifulSoup
          sid=os.environ['SOURCE']
          cfg=next(x for x in json.loads(Path('loyalty/sources_normalized.json').read_text()) if x['id']==sid)
          url=cfg['url']; out=Path('reader-output'); out.mkdir()
          report={'source_id':sid,'target_url':url,'observed_at':datetime.now(timezone.utc).isoformat(),
                  'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],
                  'provider':'r.jina.ai','cache_bypass_requested':True,'robots_check_requested':True,
                  'paid_key_used':False,'publication':False,'classification':'no_response'}
          headers={'Accept':'application/json','X-Respond-With':'html','X-No-Cache':'true',
                   'X-Cache-Tolerance':'0','X-Timeout':'25','X-Robots-Txt':'LoyaltyCatalogResearchBot'}
          started=time.monotonic()
          try:
              with requests.get('https://r.jina.ai/'+url,headers=headers,timeout=(10,65),stream=True,allow_redirects=False) as r:
                  report['service_status']=r.status_code
                  report['retry_after_present']=bool(r.headers.get('Retry-After'))
                  raw=bytearray()
                  for chunk in r.iter_content(65536):
                      raw.extend(chunk)
                      if len(raw)>6000000: raise ValueError('reader_response_size_limit')
              report['response_sha256']=hashlib.sha256(raw).hexdigest()
              data=json.loads(raw); report['provider_code']=data.get('code'); report['provider_status']=data.get('status')
              report['provider_message']=str(data.get('message',''))[:500]
              if r.status_code==200 and data.get('code')==200 and isinstance(data.get('data'),dict):
                  obj=data['data']; report['reported_url']=obj.get('url'); report['title']=obj.get('title')
                  body=obj.get('html') or obj.get('content') or ''
                  if not isinstance(body,str): raise ValueError('reader_body_type')
                  soup=BeautifulSoup(body,'html.parser')
                  for n in soup.select('script,style,noscript,form,input,textarea,iframe'):n.decompose()
                  for node in soup.find_all(True):
                      for k in list(node.attrs):
                          if k not in ('id','class','href','title','role'):del node.attrs[k]
                      if node.has_attr('href'):
                          u=urlsplit(urljoin(url,node['href']))
                          if u.scheme in ('http','https') and not u.username and not u.password:
                              node['href']=urlunsplit((u.scheme,u.netloc,u.path,'',''))
                          else:del node.attrs['href']
                  text=soup.get_text(' ',strip=True)
                  report['text_chars']=len(text); report['headings']=[x.get_text(' ',strip=True) for x in soup.select('h1,h2')][:20]
                  report['link_count']=len(soup.select('a[href]'))
                  refused=bool(re.search(r'access denied|captcha|доступ.{0,80}ограничен|forbidden',str(report['title'])+' '+text[:500],re.I))
                  report['classification']='restriction_document' if refused else 'public_content_candidate_not_verified'
                  if not refused:
                      clean=str(soup).encode(); (out/'public-dom.html').write_bytes(clean)
                      report['sanitized_dom_sha256']=hashlib.sha256(clean).hexdigest()
              else:report['classification']='reader_refusal_or_error'
          except Exception as exc:report['error_type']=type(exc).__name__
          report['elapsed_seconds']=round(time.monotonic()-started,2)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-reader-${{ matrix.source }}-${{ github.run_id }}
          path: reader-output/
          retention-days: 7
