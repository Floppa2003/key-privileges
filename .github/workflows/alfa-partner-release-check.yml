name: Alfa partner PDF release regression
on:
  push:
    branches: ['loyalty/finish-catalogs']
    paths:
      - '.github/workflows/alfa-partner-release-check.yml'
permissions:
  contents: read
concurrency:
  group: alfa-partner-release-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full Python regression
        run: python -m unittest discover -s loyalty/tests -v
      - name: KEY regression
        run: node --test key/refresh.test.mjs
      - name: Repeat live five-PDF parse
        run: |
          python - <<'PY'
          import asyncio,sys
          sys.path.insert(0,'loyalty')
          import alfa_partner_rules as a
          from normalized import validate_offer
          from sheets_normalized import prepare
          now='2026-09-18T22:50:00+00:00'
          report={'source_id':a.SOURCE_ID,'name':'Alfa','root':'https://alfabank.servicecdn.ru/','status':'ok','discovered':0,'normalized':0,'failed':0,'coverage':'','region':None,'errors':[],'observed_at':now}
          rows=asyncio.run(a.collect({'id':a.SOURCE_ID,'url':'https://alfabank.servicecdn.ru/'},report,now,20))
          for row in rows: validate_offer(row)
          report['normalized']=len(rows); report['failed']=len(report['errors'])
          prepared=prepare({'schema_version':2,'run_id':'release:1','observed_at':now,'records':rows,'sources':[report]})
          print({'records':len(rows),'errors':report['errors'],'offers':len(prepared['parser_offers'])})
          assert len(rows)==5 and not report['errors'] and len(prepared['parser_offers'])==5
          PY
