name: Public source network diagnosis (no publication)
on:
  push:
    branches: [fix/source-reliability-20261022]
    paths: [.github/workflows/source-network-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 certifi
      - name: Read only configured public URLs; retain response diagnostics without cookies
        env:
          PYTHONPATH: loyalty
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,json,re,time
          from pathlib import Path
          from urllib.parse import urlsplit,urlunsplit
          import requests,certifi
          from bs4 import BeautifulSoup
          from recovered_contract import CA_FILES
          out=Path('network-output');out.mkdir()
          cfgs=json.loads(Path('loyalty/sources_normalized.json').read_text())
          selected={'loyals','club_avolta_public','ural','ural_tiers','mir','mir_neva','nordwind','coral','coral_promo','rzd','aeroflot','ekp','af_primbank_rules'}
          def read(item):
              sid,url,verify=item
              row={'source_id':sid,'url':url,'tls_verified':True,'scoped_ca':verify is not True}
              started=time.monotonic()
              try:
                  with requests.Session() as s:
                      s.trust_env=False
                      with s.get(url,timeout=(8,16),allow_redirects=False,stream=True,verify=verify,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ru-RU,ru;q=0.9'}) as r:
                          raw=bytearray()
                          for chunk in r.iter_content(32768):
                              raw.extend(chunk)
                              if len(raw)>5000000:raise ValueError('response_too_large')
                          row.update(http_status=r.status_code,content_type=r.headers.get('Content-Type'),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                          if r.headers.get('Location'):
                              u=urlsplit(r.headers['Location']);row['redirect']=urlunsplit((u.scheme,u.netloc,u.path,'',''))
                          if r.headers.get('Retry-After'):row['retry_after']=r.headers['Retry-After'][:50]
                          if r.status_code==200:
                              suffix='.pdf' if raw.startswith(b'%PDF-') else '.txt'
                              name=sid+('-robots' if url.endswith('/robots.txt') else '-page')+('-scoped' if verify is not True else '')+suffix
                              if url.endswith('/robots.txt') or raw.startswith(b'%PDF-'):
                                  (out/name).write_bytes(raw)
                              else:
                                  soup=BeautifulSoup(raw,'html.parser')
                                  row['title']=soup.title.get_text(' ',strip=True)[:160] if soup.title else ''
              except Exception as exc:
                  row['error_type']=type(exc).__name__
                  marker=re.search(r'CERTIFICATE_VERIFY_FAILED|SSLCertVerificationError|NameResolutionError|Read timed out|Connection refused',str(exc))
                  if marker:row['error_code']=marker[0]
              row['seconds']=round(time.monotonic()-started,3)
              return row
          tasks=[];seen=set()
          for cfg in cfgs:
              if cfg['id'] not in selected:continue
              u=urlsplit(cfg['url'])
              for url in (cfg['url'],f'{u.scheme}://{u.netloc}/robots.txt'):
                  if url in seen:continue
                  seen.add(url);tasks.append((cfg['id'],url,True))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              rows=list(pool.map(read,tasks))
          # Only the same publisher's exact two endpoints; no system trust changes.
          try:
              pem=Path(certifi.where()).read_bytes()+b'\n'
              for url,digest in CA_FILES:
                  r=requests.get(url,timeout=20,allow_redirects=False)
                  if r.status_code!=200 or hashlib.sha256(r.content).hexdigest()!=digest:raise ValueError('official_ca_digest_not_verified')
                  pem+=r.content+b'\n'
              ca=out/'temporary-source-ca.pem';ca.write_bytes(pem)
              for url in ('https://www.primbank.ru/robots.txt','https://www.primbank.ru/d/tariffs-aeroflot-bonus'):
                  rows.append(read(('af_primbank_rules',url,str(ca))))
              ca.unlink()
          except Exception as exc:rows.append({'source_id':'af_primbank_rules','phase':'scoped_ca_validation','error_type':type(exc).__name__})
          (out/'results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print(json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-source-network-${{ github.run_id }}
          path: network-output/
          retention-days: 7
