name: RZD external public partner conditions
on:
  push:
    branches: [main, 'loyalty/rzd-external-20260917']
    paths: [loyalty/rzd_external.py, 'loyalty/tests/test_rzd_external*.py', .github/workflows/rzd-external.yml]
  workflow_dispatch:
  schedule:
    - cron: '57 9 * * 3'
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Complete regressions and preserve exact executed code
        run: |
          mkdir -p external-tests
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee external-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee external-tests/key-tests.log
          tar -cf external-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rzd-external-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: external-tests/
          retention-days: 7
  collect:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Read public source pages and linked rules without any credentials
        run: python loyalty/rzd_external.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rzd-external-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: rzd-external-output/
          retention-days: 7
  publish:
    needs: collect
    if: >-
      needs.collect.result == 'success' && github.repository == 'Floppa2003/key-privileges' &&
      github.ref == 'refs/heads/main' && vars.LOYALTY_SHEETS_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rzd-external-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: rzd-external-source
      - name: Reconstruct current source evidence before destination authorization
        run: |
          python - <<'PY'
          import os,sys
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from rzd_external import validate_bundle
          validate_bundle('rzd-external-source',os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],os.environ['GITHUB_SHA'],datetime.now(timezone.utc))
          PY
          python loyalty/sheets_normalized.py --input rzd-external-source/normalized.json
      - name: Existing short-lived authorization for the original destination
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Upsert source rows and independently read back unified destination
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DISCOUNTS_SPREADSHEET_ID: ${{ secrets.DISCOUNTS_SPREADSHEET_ID }}
        run: |
          python loyalty/sheets_normalized.py --input rzd-external-source/normalized.json --publish
          python loyalty/unified_publish.py --publish
