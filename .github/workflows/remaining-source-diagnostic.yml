name: Remaining source diagnostic
on:
  push:
    branches: [fix/remaining-source-errors-20261023]
    paths: [.github/workflows/remaining-source-diagnostic.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read only anonymous configured pages and public index
        run: |
          mkdir -p remaining-output
          git rev-parse HEAD > remaining-output/commit.txt
          PYTHONPATH=loyalty xvfb-run -a python - <<'PY'
          import asyncio,json,re,hashlib
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          from public_transport import PublicSource,RobotsCache,check_response
          from source_diagnostics import error_record
          from urllib.parse import urlsplit
          configs={c['id']:c for c in json.loads(Path('loyalty/sources_normalized.json').read_text())}
          urls={k:configs[k]['url'] for k in ('t2_registration_rules','t2_mixx_s','t2_powerbank','mir_neva')}
          urls['neva_index']='https://neva.travel/ru/promotions/'
          def safe_html(raw):
              soup=BeautifulSoup(raw,'html.parser')
              for n in soup.select('script,style,form,input,textarea,iframe'):n.decompose()
              for n in soup.find_all(True):
                  for k in list(n.attrs):
                      v=str(n.attrs[k])
                      if k.startswith('on') or re.search(r'token|secret|session|signature|authorization|X-Amz-',k+' '+v,re.I):del n.attrs[k]
              return str(soup)
          async def main():
              out=Path('remaining-output');rows=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=False)
                  browser._loyalty_robots_cache=RobotsCache()
                  for key,url in urls.items():
                      row={'id':key,'url':url}
                      async with PublicSource(browser,url) as client:
                          try:
                              async with asyncio.timeout(110):
                                  await client.robots();client.check_url(url)
                                  status,body=await client.navigate(url)
                                  row.update(status=status,sha256=hashlib.sha256(body.encode()).hexdigest(),bytes=len(body.encode()))
                                  check_response(status,body)
                                  if key.startswith('t2_'):
                                      await client.page.wait_for_timeout(7000)
                                      if client.page.url!=url:raise RuntimeError('diagnostic_redirect')
                                      body=await client.page.content()
                                  html=safe_html(body);(out/(key+'.html')).write_text(html)
                                  soup=BeautifulSoup(html,'html.parser')
                                  row['headings']=[n.get_text(' ',strip=True)[:200] for n in soup.select('h1,h2')][:30]
                                  row['classes']=sorted({x for n in soup.find_all(True) for x in n.get('class',[]) if re.search('article|journal|promo|detail',x)})[:120]
                          except Exception as exc:row['error']=error_record(exc,'capture',url)
                          row['robots']=getattr(client,'robots_info',{})
                      rows.append(row);(out/'results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
                  await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remaining-source-diagnostic-${{ github.run_id }}
          path: remaining-output/
          retention-days: 7
