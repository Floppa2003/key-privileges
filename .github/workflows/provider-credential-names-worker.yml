name: Inspect relevant credential names
on:
  workflow_call:
    secrets:
      VARIABLE_CONTEXT:
        required: true
      SECRET_CONTEXT:
        required: true
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Print only relevant names and presence, never values
        env:
          VARIABLE_CONTEXT: ${{ secrets.VARIABLE_CONTEXT }}
          SECRET_CONTEXT: ${{ secrets.SECRET_CONTEXT }}
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          result={}
          for kind in ('VARIABLE','SECRET'):
              raw=os.environ.pop(kind+'_CONTEXT','{}')
              values=json.loads(raw)
              result[kind.lower()]=sorted(k for k,v in values.items() if v and re.search(r'EXPER|EXPLAB|VERCEL|GATEWAY', k, re.I))
              del values,raw
          Path('credential-names.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relevant-credential-names-${{ github.run_id }}
          path: credential-names.json
          retention-days: 7
