name: EKP client-side detail throughput
on:
  push:
    branches: [main]
    paths: [diagnostics/ekp_bulk_public.py, diagnostics/ekp_bulk_public.js, .github/workflows/ekp-bulk-public.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Syntax and owned-term checks without credentials
        run: |
          python -m py_compile diagnostics/ekp_bulk_public.py
          python diagnostics/ekp_owned_terms.py
          node -e 'new (Object.getPrototypeOf(async function(){}).constructor)(require("fs").readFileSync("diagnostics/ekp_bulk_public.js","utf8").replace("__EKP_CONFIG__",JSON.stringify({shards:2,shard:0,maxDetails:600})));'
      - name: Observe public UI and account credit delta only
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python diagnostics/ekp_bulk_public.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-bulk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-bulk-output/
          retention-days: 7
