name: Inspect Mir public page navigation
on:
  push:
    branches: [loyalty/finish-catalogs]
    paths: [diagnostics/mir_public.py, .github/workflows/mir-ui-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python diagnostics/mir_public.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mir-public-ui-${{ github.run_id }}
          path: mir-ui-probe/
          retention-days: 7
