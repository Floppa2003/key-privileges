name: Inspect Mir public page navigation
on:
  push:
    branches: [loyalty/finish-catalogs]
    paths: [diagnostics/mir_public.py, .github/workflows/mir-ui-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: |
          mkdir -p public-code
          git archive HEAD loyalty key .github/workflows > public-code/code.tar
          sha256sum public-code/code.tar > public-code/sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-code-${{ github.run_id }}
          path: public-code/
          retention-days: 7
