name: Replay saved public parser corpora (2026-11-06)
on:
  push:
    branches: [diagnostics/parsing-artifact-review-20261106]
    paths:
      - .github/workflows/public-parser-replay-20261106.yml
      - diagnostics/public_parser_replay_20261106.py
permissions:
  contents: read
  actions: read
concurrency:
  group: public-parser-replay-20261106-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay-public-corpora:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/diagnostics/parsing-artifact-review-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read the reviewed diagnostic script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9cdce0c1299cdadb44bf3d45ead5216c5254464f
          path: .replay/code/driver
          persist-credentials: false
      - name: Read the original main and Aeroflot publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f718b69e96e47c885698d4c42abd2d36b5d1cd34
          path: .replay/code/f718
          persist-credentials: false
      - name: Read the EKP publisher and baseline consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d47d003e36c711348fe4ce106eefefef4dec4ee9
          path: .replay/code/d47
          persist-credentials: false
      - name: Read the exact final candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d4f9b270ac88214905e70cc0f4cbf9a2dce3fe78
          path: .replay/code/candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned local parser dependencies
        run: python -m pip install -r .replay/code/candidate/loyalty/requirements.txt
      - name: Read main public collection artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 42131727166
          artifact-ids: 13466762585
          merge-multiple: true
          path: .replay/source/main
      - name: Read Aeroflot public collection artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 42131714684
          artifact-ids: 13465277924
          merge-multiple: true
          path: .replay/source/aero
      - name: Read EKP public collection artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 42139982440
          artifact-ids: 13468259329
          merge-multiple: true
          path: .replay/source/ekp
      - name: Verify exact code and replay saved public inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-replay-results
          exec > >(tee public-replay-results/replay.log) 2>&1
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          expected = {
              "driver": "9cdce0c1299cdadb44bf3d45ead5216c5254464f",
              "f718": "f718b69e96e47c885698d4c42abd2d36b5d1cd34",
              "d47": "d47d003e36c711348fe4ce106eefefef4dec4ee9",
              "candidate": "d4f9b270ac88214905e70cc0f4cbf9a2dce3fe78",
          }
          manifest = {"code": {}, "inputs": {}}
          for name, wanted in expected.items():
              root = Path(".replay/code") / name
              actual = subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()
              if actual != wanted:
                  raise AssertionError("unexpected_replay_code_revision")
              tree = subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD^{tree}"], text=True).strip()
              manifest["code"][name] = {"commit": actual, "tree": tree}
          driver = Path(".replay/code/driver/diagnostics/public_parser_replay_20261106.py")
          manifest["script_sha256"] = hashlib.sha256(driver.read_bytes()).hexdigest()
          for name, artifact_id in (("main", 13466762585), ("aero", 13465277924), ("ekp", 13468259329)):
              source = Path(".replay/source") / name / "normalized.json"
              if source.is_symlink() or not source.is_file() or source.stat().st_size > 64 * 1024 * 1024:
                  raise AssertionError("unexpected_public_artifact_payload")
              manifest["inputs"][name] = {
                  "artifact_id": artifact_id,
                  "normalized_json_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
              }
          Path("public-replay-results/manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2), encoding="utf-8")
          print("REPLAY_MANIFEST " + json.dumps(manifest, sort_keys=True), flush=True)
          PY
          replay_script=".replay/code/driver/diagnostics/public_parser_replay_20261106.py"
          python "$replay_script" prepare .replay/code/f718 .replay/source/main/normalized.json public-replay-results/main-inputs.json 42131727166:1 1309
          python "$replay_script" normalize .replay/code/d47 public-replay-results/main-inputs.json public-replay-results/main-old.json
          python "$replay_script" normalize .replay/code/candidate public-replay-results/main-inputs.json public-replay-results/main-new.json
          python "$replay_script" compare main public-replay-results/main-old.json public-replay-results/main-new.json
          python "$replay_script" prepare .replay/code/f718 .replay/source/aero/normalized.json public-replay-results/aero-inputs.json 42131714684:1 240
          python "$replay_script" normalize .replay/code/d47 public-replay-results/aero-inputs.json public-replay-results/aero-old.json
          python "$replay_script" normalize .replay/code/candidate public-replay-results/aero-inputs.json public-replay-results/aero-new.json
          python "$replay_script" compare aero public-replay-results/aero-old.json public-replay-results/aero-new.json
          python "$replay_script" prepare .replay/code/d47 .replay/source/ekp/normalized.json public-replay-results/ekp-inputs.json 42139982440:1 1027
          python "$replay_script" normalize .replay/code/d47 public-replay-results/ekp-inputs.json public-replay-results/ekp-old.json
          python "$replay_script" normalize .replay/code/candidate public-replay-results/ekp-inputs.json public-replay-results/ekp-new.json
          python "$replay_script" compare ekp public-replay-results/ekp-old.json public-replay-results/ekp-new.json
      - name: Preserve only public replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-parser-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-replay-results/
          if-no-files-found: warn
          retention-days: 7
