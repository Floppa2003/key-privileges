name: Public coverage closure inspection
on:
  push:
    branches: ["loyalty/public-coverage-closure-20260923"]
    paths: ["diagnostics/coverage_pagination_contracts.py", ".github/workflows/public-coverage-closure.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Inspect public list termination and cashback details
        run: python diagnostics/coverage_pagination_contracts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-coverage-contracts-${{ github.run_id }}
          path: coverage-pagination-contracts/
          if-no-files-found: error
          retention-days: 1
