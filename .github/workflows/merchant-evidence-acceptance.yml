name: Merchant evidence end-to-end acceptance
on:
  push:
    branches: [loyalty/merchant-evidence-fix-20261031]
    paths: [.github/workflows/merchant-evidence-acceptance.yml]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install capture without model credentials
        run: |
          mkdir -p evidence-acceptance
          git rev-parse HEAD > evidence-acceptance/commit.txt
          python -m pip install -r loyalty/requirements.txt > /tmp/install.log 2>&1
          python -m playwright install --with-deps chromium >> /tmp/install.log 2>&1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '41205750809'
          artifact-ids: '13044468348'
          github-token: ${{ github.token }}
          path: prior-acceptance
          merge-multiple: true
      - name: Stronger check must detect the old omitted secondary benefit, without new inference
        run: |
          python - <<'PY' > evidence-acceptance/semantic-red.log 2>&1
          import sys
          from pathlib import Path
          sys.path.insert(0,'diagnostics')
          import merchant_evidence_acceptance as a
          a.ROOT=Path('prior-acceptance')
          try:
              a.inspect()
          except AssertionError as exc:
              assert 'lost secondary benefit' in str(exc),str(exc)
              print('Expected old-output regression:',str(exc))
          else:
              raise AssertionError('Expected missing non-monetary benefit')
          PY
          tail -2 evidence-acceptance/semantic-red.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '41194911797'
          artifact-ids: '13041115453'
          github-token: ${{ github.token }}
          path: acceptance-input
          merge-multiple: true
      - name: Fresh native target objects and complete original card PNGs
        run: python diagnostics/merchant_evidence_acceptance.py prepare --catalog acceptance-input/normalized.json
      - name: Four free-only generation attempts, no production state writes
        env:
          EXPERIENTAL_API_KEY: ${{ secrets.EXPERIENTAL_API_KEY || vars.EXPERIENTAL_API_KEY }}
        run: python diagnostics/merchant_evidence_acceptance.py infer
      - name: Read responses and check monetary and non-monetary benefits
        run: python diagnostics/merchant_evidence_acceptance.py inspect
      - name: Preserve source and evidence hashes
        if: always()
        run: |
          mkdir -p evidence-acceptance/code
          cp loyalty/merchant_queue.py loyalty/merchant_extract.py loyalty/merchant_evidence.py loyalty/merchant_konsierge_capture.py loyalty/merchant_prompt.txt loyalty/merchant_offer.schema.json evidence-acceptance/code/
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=Path('evidence-acceptance')
          (r/'SHA256SUMS.json').write_text(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.rglob('*') if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-evidence-acceptance-${{ github.run_id }}
          path: evidence-acceptance/
          retention-days: 30
  readback:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: merchant-evidence-acceptance-${{ github.run_id }}
          path: evidence
      - name: Independently read completed outputs and verify every hash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=Path('evidence');h=json.loads((r/'SHA256SUMS.json').read_text())
          for name,digest in h.items():
              p=(r/name).resolve();assert p.is_relative_to(r.resolve())
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
          print('Verified files:',len(h))
          for name in ['input-check.json','summary.json','answers.json','semantic-check.json']:
              p=r/name
              print(name,p.read_text() if p.exists() else 'NOT PRODUCED')
          PY
