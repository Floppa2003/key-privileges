name: Inspect observed public rule destinations
on:
  push:
    branches: ['loyalty/remaining-rule-access-20260917']
    paths: [.github/workflows/remaining-rule-destinations.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Read observed destinations with source policy and size bounds
        run: |
          python - <<'PY'
          import sys,json,re,time
          from pathlib import Path
          from urllib.parse import urlsplit
          sys.path.insert(0,'loyalty')
          from remaining_rule_access_probe import read,sha,now,BOT
          from ekp_linked_rules import clean_html,html_fields
          from document_text import extract_pdf
          from protego import Protego
          import requests
          urls=['https://stoletov.ru/catalog/extra/spiski-tovarov/tovary-bez-skidok','https://parking.svo.aero/storage/2023/11/08/37eb5856e547162527fd77ebb56af2b836c79d8e.pdf']
          session=requests.Session();session.trust_env=False
          out=Path('rule-destinations');out.mkdir()
          report={'kind':'diagnostic_not_publication','started_at':now(),'provider_credits':0,'source_account_used':False,'results':[]}
          for url in urls:
              item={'url':url};report['results'].append(item)
              pr,raw=read(session,'https://'+urlsplit(url).netloc+'/robots.txt');item['policy_receipt']=pr
              if pr.get('status') in (404,410):rules=Protego.parse('User-agent: *\nAllow: /')
              elif raw and b'<html' not in raw.lower() and re.search(br'^\s*User-agent:',raw,re.I|re.M):rules=Protego.parse(raw.decode('utf8'))
              else:item['error']='policy_unavailable';continue
              if not rules.can_fetch(url,BOT):item['error']='policy_disallow';continue
              rate=rules.request_rate(BOT);delay=max(3,rules.crawl_delay(BOT) or 0,rate.seconds/rate.requests if rate else 0)
              if delay>20:item['error']='delay_bound';continue
              time.sleep(delay)
              receipt,data=read(session,url);item['receipt']=receipt
              if data is None:item['error']='no_target_bytes';continue
              if data.startswith(b'%PDF-'):
                  name=sha(url.encode())+'.pdf';(out/name).write_bytes(data);item['file']=name
                  doc=extract_pdf(data,allow_ocr=False)
                  item['native_pdf']={'pages':doc['page_count'],'text_pages':sum(bool(p['text']) for p in doc['pages']),'errors':doc['errors'],'page_text_lengths':[len(p['text']) for p in doc['pages']]}
                  (out/(name+'.text.json')).write_text(json.dumps(doc,ensure_ascii=False))
              else:
                  try:
                      clean=clean_html(data);name=sha(url.encode())+'.html';(out/name).write_text(clean);item['file']=name
                      title,value=html_fields(clean);item['title']=title;item['text_chars']=len(value)
                  except ValueError as exc:item['parse_error']=str(exc)
          report['finished_at']=now();(out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rule-destinations-${{ github.run_id }}
          path: rule-destinations/
          retention-days: 7
