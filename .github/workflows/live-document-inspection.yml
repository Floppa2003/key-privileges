name: Inspect live document structure
on:
  push:
    branches: [loyalty/live-documents-and-generic-text]
    paths: [.github/workflows/live-document-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Inspect bounded anonymous public documents
        run: |
          mkdir -p inspection
          python - <<'PY'
          import sys,json,time,hashlib,re
          from pathlib import Path
          from urllib.parse import urlsplit
          import requests
          sys.path.insert(0,'loyalty')
          from recovered_sources import ScopedReader,parse_bank_page
          from recovered_contract import SOURCES
          from public_transport import check_response
          from datetime import datetime,timezone
          out=Path('inspection'); reports=[]; now=datetime.now(timezone.utc).isoformat()
          for sid in ('af_vtb_rules','nspk_ekp_rules','uralsib_rzd_rules'):
              cfg={'id':sid,'url':SOURCES[sid]['url'],'access_profile':SOURCES[sid]['profile']}
              report={'source_id':sid,'errors':[],'documents':[]}; reports.append(report)
              try:
                  with ScopedReader(cfg,report,time.monotonic()+160) as reader:
                      _,raw=reader.read(cfg['url']); (out/(sid+'.html')).write_bytes(raw)
                      record=parse_bank_page(sid,raw.decode('utf8'),now)
                      report['links']=record['details']['linked_documents']
                      seen=set()
                      for link in report['links']:
                          url=link['url'].strip(); u=urlsplit(url)
                          if u.hostname!=urlsplit(cfg['url']).hostname or not u.path.lower().endswith('.pdf') or u.query or url in seen: continue
                          seen.add(url)
                          if len(seen)>10: raise ValueError('inspection_document_limit')
                          if not reader.policy.can_fetch(url,'LoyaltyCatalogResearchBot'): raise ValueError('document_robots_disallow')
                          time.sleep(1)
                          with reader.session.get(url,verify=reader.verify,timeout=(7,20),allow_redirects=False,stream=True) as r:
                              if r.status_code!=200 or r.headers.get('Retry-After'): raise ValueError('document_http_'+str(r.status_code))
                              chunks=[];size=0
                              for c in r.iter_content(65536):
                                  size+=len(c)
                                  if size>5000000: raise ValueError('document_size_limit')
                                  chunks.append(c)
                              data=b''.join(chunks)
                              if not data.startswith(b'%PDF-'): raise ValueError('not_PDF')
                              filename=sid+'-'+str(len(seen))+'.pdf';(out/filename).write_bytes(data)
                              report['documents'].append({'url':url,'label':link['label'],'file':filename,'sha256':hashlib.sha256(data).hexdigest()})
              except Exception as exc: report['errors'].append(type(exc).__name__+':'+str(exc)[:180])
          urls={'telegram':'https://t.me/s/promomir?before=1636','utair':'https://media.utair.ru/status','rgo':'https://rgo.ru/membership/loyalty-program/'}
          for name,url in urls.items():
              try:
                  r=requests.get(url,timeout=(7,30));check_response(r.status_code,r.text)
                  if len(r.content)>6000000:raise ValueError('size_bound')
                  (out/(name+'.html')).write_text(r.text,encoding='utf8')
                  reports.append({'source_id':name,'status':r.status_code,'sha256':hashlib.sha256(r.content).hexdigest()})
              except Exception as exc:reports.append({'source_id':name,'error':type(exc).__name__})
          (out/'report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print(json.dumps([{k:v for k,v in r.items() if k not in ('links','documents')} for r in reports]))
          PY
          tar --exclude=.git --exclude=inspection -cf inspection/code.tar .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-document-inspection-${{ github.run_id }}
          path: inspection/
          retention-days: 7
