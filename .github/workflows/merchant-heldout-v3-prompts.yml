name: Merchant heldout v3 prompt materialization
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-heldout-v3-prompts.yml, loyalty/experiments/merchant_general/heldout-v3.json]
permissions:
  contents: read
jobs:
  prompts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize frozen v3 prompts without gold labels
        run: |
          mkdir -p heldout-v3-prompts
          PYTHONPATH=loyalty python - <<'PY'
          import json
          from pathlib import Path
          import merchant_blocks_v2 as b
          src=Path('loyalty/experiments/merchant_general/heldout-v3.json')
          data=json.loads(src.read_text(encoding='utf-8'))
          assert data['labels_frozen_before_predictions'] is True
          assert data['expected_labels_sent_to_model'] is False
          out={'corpus_version':data['version'],
               'corpus_sha256':__import__('hashlib').sha256(src.read_bytes()).hexdigest(),
               'implementation_frozen_before_predictions':data['implementation_frozen_before_predictions'],
               'prompt_module_version':b.VERSION,
               'expected_labels_sent_to_model':False,
               'publication_allowed':False,'cases':[]}
          for case in data['cases']:
              s=case['source']
              doc=b.build(s['markdown'],url=s['url'],observed_at=s['observed_at'],
                          completeness=s['completeness'])
              out['cases'].append({
                  'id':case['id'],
                  'url':s['url'],
                  'target':case['target'],
                  'source_sha256':doc['source_sha256'],
                  'selected_block_ids':[x['id'] for x in b.scoped_blocks(case['target'],doc)],
                  'prompt':b.scoped_prompt(case['target'],doc),
              })
          Path('heldout-v3-prompts/prompts.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          sha256sum heldout-v3-prompts/prompts.json > heldout-v3-prompts/SHA256SUMS
          git rev-parse HEAD > heldout-v3-prompts/materializer-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merchant-heldout-v3-prompts-${{ github.run_id }}-${{ github.run_attempt }}
          path: heldout-v3-prompts/
          retention-days: 1
