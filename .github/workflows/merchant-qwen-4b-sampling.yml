name: Qwen 4B recommended sampling stress probe
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths:
      - .github/workflows/merchant-qwen-4b-sampling.yml
      - loyalty/experiments/direct_think_json/direct_sampling.py
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-qwen-4b-sampling
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OLLAMA_MODEL: qwen3.5:4b
      DIRECT_MODEL: qwen3.5:4b
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: muzcomedy
            artifact: '11092173951'
          - case: nevsky
            artifact: '11092462751'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m py_compile loyalty/experiments/direct_think_json/direct_sampling.py
      - name: Preserve experiment
        run: |
          set -euo pipefail
          mkdir -p output/code
          git rev-parse HEAD > output/commit.txt
          cp loyalty/experiments/direct_think_json/direct_sampling.py loyalty/experiments/direct_think_json/direct_json.py output/code/
          cp loyalty/experiments/simple_thinking/probe.py loyalty/experiments/simple_thinking/plan.json output/code/
          cp loyalty/experiments/prompt_ab/prompt_ab.py loyalty/experiments/prompt_ab/practical_schema.json output/code/
          cp loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh output/code/
          cp .github/workflows/merchant-qwen-4b-sampling.yml output/workflow.yml
          lscpu > output/cpu.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: sources/${{ matrix.case }}
          merge-multiple: true
      - name: Install pinned local model
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > output/setup.log 2>&1
      - name: 4B recommended-sampling one-shot JSON
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual:$GITHUB_WORKSPACE/loyalty/experiments/simple_thinking"
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/direct_think_json/direct_sampling.py             --source sources --case ${{ matrix.case }} --out output/results             --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama"             > output/inference.log 2>&1
      - name: Hash diagnostics
        if: always()
        run: |
          mkdir -p output
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-4b-sampling-${{ matrix.case }}-${{ github.run_id }}
          path: output/
          retention-days: 14
