name: Build confirmed merchant channels
on:
  push:
    branches: [loyalty/confirmed-channels-20261030]
    paths: [.github/workflows/confirmed-channels-build.yml, diagnostics/integrate_confirmed_channels_20261030.py]
permissions:
  contents: read
concurrency:
  group: confirmed-channels-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install test dependencies without provider credentials
        run: |
          mkdir -p channel-build-output
          python -m pip install -r loyalty/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Confirm integration regression is red before wiring
        run: |
          set +e
          python -m unittest discover -s loyalty/tests -p test_merchant_channels.py -v > channel-build-output/red.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          tail -8 channel-build-output/red.log
      - name: Apply checked source edits and run complete regression
        run: |
          set -euo pipefail
          python diagnostics/integrate_confirmed_channels_20261030.py
          python -m py_compile loyalty/merchant_channels.py loyalty/merchant_extract.py loyalty/merchant_queue.py
          python -m unittest discover -s loyalty/tests -p test_merchant_channels.py -v > channel-build-output/channels.log 2>&1
          python -m unittest discover -s loyalty/tests -v > channel-build-output/full.log 2>&1
          node --test key/refresh.test.mjs > channel-build-output/key.log 2>&1
          git diff --check
          tail -8 channel-build-output/channels.log
          tail -8 channel-build-output/full.log
          tail -8 channel-build-output/key.log
      - name: Commit only verified extractor and queue edits to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin refs/heads/loyalty/confirmed-channels-20261030
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- loyalty/merchant_extract.py loyalty/merchant_queue.py
          git commit -m 'feat(loyalty): wire confirmed providers into durable merchant queue'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/loyalty/confirmed-channels-20261030
          expected=$(git rev-parse HEAD)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin refs/heads/loyalty/confirmed-channels-20261030
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          echo "$expected" | tee channel-build-output/verified-commit.txt
      - name: Preserve exact tested sources
        if: always()
        run: |
          mkdir -p channel-build-output/code
          cp loyalty/merchant_channels.py loyalty/merchant_extract.py loyalty/merchant_queue.py loyalty/tests/test_merchant_channels.py channel-build-output/code/
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('channel-build-output')
          (root/'SHA256SUMS.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: confirmed-channel-build-${{ github.run_id }}
          path: channel-build-output/
          retention-days: 30
