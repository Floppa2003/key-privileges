name: Free provider document comparison 20261024
on:
  push:
    branches: [loyalty/free-provider-eval-20261024]
    paths: [.github/workflows/free-provider-documents-20261024.yml]
permissions:
  contents: read
concurrency:
  group: free-provider-documents-20261024
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install public capture dependencies and validate transport
        run: |
          python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 jsonschema==4.26.0
          python -m playwright install --with-deps chromium
          mkdir -p output
          python -m unittest discover -s loyalty/experiments/free_providers_20261024 -v > output/tests.log 2>&1
          git rev-parse HEAD > output/commit.txt
          git archive HEAD -o output/source.zip
      - name: Capture the same four URLs freshly, no credentials or robots preflight
        run: python loyalty/experiments/free_providers_20261024/capture_cli.py capture --out output/captures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fresh-equal-inputs-${{ github.run_id }}
          path: output/
          retention-days: 30
  compare:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - provider: harbor
            secret: TOKENHARBOR_API_KEY
          - provider: gemini
            secret: GEMINI_API_KEY
          - provider: openrouter
            secret: OPENROUTER_API_KEY
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==12.3.0 jsonschema==4.26.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fresh-equal-inputs-${{ github.run_id }}
          path: inputs/
      - name: One request per document and model; shared evidence; no publication
        env:
          LLM_PROVIDER_KEY: ${{ secrets[matrix.secret] }}
          EVAL_PROVIDER: ${{ matrix.provider }}
        run: |
          mkdir -p output
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'loyalty/experiments/free_providers_20261024')
          import routes
          routes.ROUTES['openrouter']['models']=['google/gemma-4-31b-it:free']
          sys.argv=['routes','--provider',os.environ['EVAL_PROVIDER'],'--out','output/results','--inputs','inputs/captures/inputs.json']
          routes.main()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: documents-${{ matrix.provider }}-${{ github.run_id }}
          path: output/
          retention-days: 30
  opencode:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [glm-5.3-flash-free, deepseek-v4.1-flash-free, mimo-v2.6-flash-free]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official CLI without credentials; record exact package
        run: |
          mkdir -p output
          npm view opencode-ai@latest version dist.integrity --json > output/npm-metadata.json
          version=$(node -p "require('./output/npm-metadata.json').version")
          npm install -g "opencode-ai@$version"
          opencode --version > output/version.txt
          python -m pip install requests==2.32.5 Pillow==12.3.0 jsonschema==4.26.0
          python -m unittest discover -s loyalty/experiments/free_providers_20261024 -v > output/tests.log 2>&1
      - name: Official CLI synthetic image control, no tools or paid helper models
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python loyalty/experiments/free_providers_20261024/capture_cli.py cli --model 'opencode/${{ matrix.model }}' --out output/results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opencode-cli-${{ matrix.model }}-${{ github.run_id }}
          path: output/
          retention-days: 30
  baseline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 61698b4e58fea6d730182fe4dcd5b03ccfdd7f97
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independently reproduce inherited suite error on untouched PR90 base
        run: |
          python -m pip install -r loyalty/requirements.txt
          mkdir -p output
          git rev-parse HEAD > output/commit.txt
          set +e
          python -m unittest discover -s loyalty/tests -p 'test_collection_entry.py' -v > output/base-entry-tests.log 2>&1
          rc=$?
          echo "$rc" > output/exit-code.txt
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unchanged-base-entry-${{ github.run_id }}
          path: output/
          retention-days: 30
