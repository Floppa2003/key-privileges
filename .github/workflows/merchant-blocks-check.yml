name: Merchant block-reference regressions
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths:
      - 'loyalty/merchant*.py'
      - 'loyalty/tests/test_merchant*.py'
      - 'loyalty/experiments/merchant_general/*.json'
      - '.github/workflows/merchant-blocks-check.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact triggering commit and preserve public execution source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p merchant-blocks-output
          git rev-parse HEAD > merchant-blocks-output/commit.txt
          git archive --format=tar.gz HEAD > merchant-blocks-output/source.tar.gz
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full regression tests
        run: |
          python -m unittest discover -s loyalty/tests -v > merchant-blocks-output/python-tests.log 2>&1
          node --test key/refresh.test.mjs > merchant-blocks-output/key-tests.log 2>&1
          tail -4 merchant-blocks-output/python-tests.log
          tail -8 merchant-blocks-output/key-tests.log
      - name: Frozen evaluation reports (not a production quality approval)
        run: |
          python loyalty/merchant_guard_eval.py --input loyalty/experiments/merchant_general/block-observed.json --out merchant-blocks-output/guard-eval.json
          PYTHONPATH=loyalty python - <<'PY'
          import json
          from pathlib import Path
          import merchant_heldout_eval as e
          import merchant_blocks_v2 as b
          import merchant_semantic_guard as g
          import merchant_claims as c
          root=Path('loyalty/experiments/merchant_general')
          for version in ('v2','v4','v5'):
              observed=root/f'heldout-{version}-observed.json'
              if not observed.exists():
                  print(version, 'NOT_RUN: no saved predictions')
                  continue
              report=e.evaluate(root/f'heldout-{version}.json',observed)
              Path(f'merchant-blocks-output/heldout-{version}-eval.json').write_text(
                  json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
              print(version,report['passed_cases'],'/',report['cases'], 'publication_allowed=false')
          observed=root/'heldout-v5-json-observed-20260926.json'
          report=e.evaluate(root/'heldout-v5.json',observed)
          Path('merchant-blocks-output/json-trial-eval.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          corpus=json.loads((root/'heldout-v5.json').read_text())
          trials=json.loads(observed.read_text())['trials']
          stages=[]
          for case,trial in zip(corpus['cases'],trials):
              assert case['id']==trial['id']
              s=case['source']
              doc=b.build(s['markdown'],url=s['url'],observed_at=s['observed_at'],completeness=s['completeness'])
              checked=b.check(case['target'],doc,json.loads(trial['raw_answer']))
              guarded=g.assess_result(case['target'],checked)
              bundle=c.generate(case['target'],doc,checked)
              assert guarded['publication_allowed'] is False and bundle['publication_allowed'] is False
              stages.append({'id':case['id'],'block_problems':checked['problems'],
                  'guard':guarded,'claim_status':bundle['status'],'claim_reasons':bundle['reasons'],
                  'claim_count':len(bundle['claims']),'publication_allowed':False})
          Path('merchant-blocks-output/json-trial-stages.json').write_text(
              json.dumps(stages,ensure_ascii=False,indent=2),encoding='utf-8')
          print('JSON development comparison',report['passed_cases'],'/',report['cases'],'not a production approval')
          PY
          sha256sum merchant-blocks-output/* > merchant-blocks-output/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-blocks-${{ github.run_id }}-${{ github.run_attempt }}
          path: merchant-blocks-output/
          retention-days: 1
