name: Merchant block-reference regressions
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [loyalty/merchant_blocks.py, loyalty/merchant_blocks_v2.py, loyalty/merchant_semantic_guard.py, loyalty/merchant_claims.py, loyalty/merchant_guard_eval.py, loyalty/merchant_heldout_eval.py, loyalty/tests/test_merchant_blocks.py, loyalty/tests/test_merchant_blocks_v2.py, loyalty/tests/test_merchant_semantic_guard.py, loyalty/tests/test_merchant_guard_eval.py, loyalty/tests/test_merchant_claims.py, loyalty/tests/test_merchant_heldout_eval.py, loyalty/experiments/merchant_general/block-observed.json, loyalty/experiments/merchant_general/heldout-v1.json, loyalty/experiments/merchant_general/heldout-v1-observed.json, loyalty/experiments/merchant_general/heldout-v1-observed-v2.json, loyalty/experiments/merchant_general/heldout-v2.json, loyalty/experiments/merchant_general/heldout-v2-observed.json, loyalty/experiments/merchant_general/heldout-v4.json, loyalty/experiments/merchant_general/heldout-v4-observed.json, .github/workflows/merchant-blocks-check.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full regressions and exact execution files
        run: |
          mkdir -p merchant-blocks-output
          git rev-parse HEAD > merchant-blocks-output/commit.txt
          cp loyalty/merchant_general.py loyalty/merchant_review.py loyalty/merchant_blocks.py loyalty/merchant_blocks_v2.py loyalty/merchant_semantic_guard.py loyalty/merchant_claims.py loyalty/merchant_guard_eval.py loyalty/merchant_heldout_eval.py loyalty/merchant_nli.py loyalty/tests/test_merchant_general.py loyalty/tests/test_merchant_review.py loyalty/tests/test_merchant_blocks.py loyalty/tests/test_merchant_blocks_v2.py loyalty/tests/test_merchant_semantic_guard.py loyalty/tests/test_merchant_guard_eval.py loyalty/tests/test_merchant_claims.py loyalty/tests/test_merchant_heldout_eval.py loyalty/experiments/merchant_general/block-observed.json loyalty/experiments/merchant_general/heldout-v1.json loyalty/experiments/merchant_general/heldout-v1-observed.json loyalty/experiments/merchant_general/heldout-v1-observed-v2.json loyalty/experiments/merchant_general/heldout-v2.json loyalty/experiments/merchant_general/heldout-v2-observed.json loyalty/experiments/merchant_general/heldout-v4.json loyalty/experiments/merchant_general/heldout-v4-observed.json loyalty/experiments/merchant_general/nli-cases.json merchant-blocks-output/
          sha256sum merchant-blocks-output/*.py merchant-blocks-output/*.json > merchant-blocks-output/SHA256SUMS
          python -m unittest discover -s loyalty/tests -v > merchant-blocks-output/python-tests.log 2>&1
          python loyalty/merchant_guard_eval.py --input loyalty/experiments/merchant_general/block-observed.json --out merchant-blocks-output/guard-eval.json
          PYTHONPATH=loyalty python - <<'PY'
          import json
          from pathlib import Path
          import merchant_heldout_eval as e
          root=Path('loyalty/experiments/merchant_general')
          report=e.evaluate(root/'heldout-v2.json',root/'heldout-v2-observed.json')
          Path('merchant-blocks-output/heldout-v2-eval.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('heldout-v2', report['passed_cases'], '/', report['cases'])
          print('block_contract_valid',report['block_contract_valid'])
          print('required_evidence',report['required_evidence_phrases_found'],'/',report['required_evidence_phrases_total'])
          print('forbidden_borrowing_hits',report['forbidden_borrowing_hits'])
          report4=e.evaluate(root/'heldout-v4.json',root/'heldout-v4-observed.json')
          Path('merchant-blocks-output/heldout-v4-eval.json').write_text(
              json.dumps(report4,ensure_ascii=False,indent=2),encoding='utf-8')
          print('heldout-v4', report4['passed_cases'], '/', report4['cases'])
          print('v4_transport',report4['transport_successes'],'/',report4['transport_attempts'])
          print('v4_block_contract_valid',report4['block_contract_valid'])
          print('v4_required_evidence',report4['required_evidence_phrases_found'],'/',report4['required_evidence_phrases_total'])
          print('v4_forbidden_borrowing_hits',report4['forbidden_borrowing_hits'])
          PY
          node --test key/refresh.test.mjs > merchant-blocks-output/key-tests.log 2>&1
          tail -4 merchant-blocks-output/python-tests.log
          tail -8 merchant-blocks-output/key-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-blocks-${{ github.run_id }}-${{ github.run_attempt }}
          path: merchant-blocks-output/
          retention-days: 1
