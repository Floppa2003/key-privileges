name: Verify practical offer scope once
on:
  push:
    branches: ['maintenance/practical-scope-20260918']
    paths: [.github/workflows/practical-prepare-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Demonstrate missing practical routing before applying the reviewed change
        run: |
          mkdir -p practical-verification
          python - <<'PY'
          import subprocess
          from pathlib import Path
          r=subprocess.run(['python','-m','unittest','discover','-s','loyalty/tests','-p','test_practical_collection.py','-v'],capture_output=True,text=True)
          Path('practical-verification/red-integration.log').write_text(r.stdout+r.stderr)
          assert r.returncode!=0 and ('AssertionError' in r.stderr or 'unexpected keyword' in r.stderr)
          PY
      - name: Apply reviewed changes and preserve unrelated test assertions
        run: |
          python loyalty/practical_prepare_once.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('loyalty/tests/test_daily_coverage.py');s=p.read_text()
          accidental="before['loyalty_partner_benefits']['values'] if False else before['loyalty_partner_benefits']"
          assert s.count(accidental)==1
          p.write_text(s.replace(accidental,"before['loyalty_partner_benefits']"))
          p=Path('practical-verification/changed-paths.json');paths=json.loads(p.read_text())
          paths.append('loyalty/tests/test_daily_coverage.py');p.write_text(json.dumps(paths))
          PY
      - name: Run all regressions without live sources
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee practical-verification/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee practical-verification/key-tests.log
          git diff > practical-verification/change.patch
          tar -cf practical-verification/code.tar loyalty key .github/workflows
      - name: Store exact tested public Git objects only; do not change any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='Floppa2003/key-privileges'
          assert os.environ['GITHUB_REF']=='refs/heads/maintenance/practical-scope-20260918'
          folder=Path('practical-verification');paths=json.loads((folder/'changed-paths.json').read_text())
          assert len(paths)==16 and len(set(paths))==16
          objects=[]
          for path in paths:
              data=Path(path).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              reply=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','-'],input=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode()))
              assert reply['sha']==expected
              objects.append({'path':path,'mode':'100644','type':'blob','sha':expected,'sha256':hashlib.sha256(data).hexdigest()})
          (folder/'objects.json').write_text(json.dumps({'objects':objects,'refs_changed':False,'google_used':False,'sources_fetched':0},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practical-scope-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: practical-verification/
          retention-days: 7
