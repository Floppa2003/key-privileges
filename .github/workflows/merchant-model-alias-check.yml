name: Merchant response alias regression and offline replay
on:
  push:
    branches: [fix/orcarouter-model-alias-20261027]
    paths:
      - .github/workflows/merchant-model-alias-check.yml
      - loyalty/merchant_extract.py
      - loyalty/tests/test_merchant_model_alias.py
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-model-alias-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies without model credentials
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install -r loyalty/requirements.txt
      - name: Reproduce or verify provider-scoped alias contract
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          set -o pipefail
          python -m unittest discover -s loyalty/tests -p test_merchant_model_alias.py -v 2>&1 | tee verification/alias-tests.log
      - name: Full Python, diagnostic and KEY suites
        run: |
          status=0
          python -m unittest discover -s loyalty/tests -v > verification/python-tests.log 2>&1 || status=1
          python -m unittest discover -s diagnostics/tests -v > verification/diagnostic-tests.log 2>&1 || status=1
          node --test key/refresh.test.mjs > verification/key-tests.log 2>&1 || status=1
          for log in verification/python-tests.log verification/diagnostic-tests.log verification/key-tests.log; do
            echo "=== $log ==="
            tail -n 12 "$log"
            sed -n '/^======================================================================/,$p' "$log"
          done
          exit "$status"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '40269021585'
          artifact-ids: '12631285058'
          github-token: ${{ github.token }}
          path: saved-responses/2026-10-26
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '40451431897'
          artifact-ids: '12711878655'
          github-token: ${{ github.token }}
          path: saved-responses/2026-10-27
          merge-multiple: true
      - name: Replay exact archived HTTP responses without requests or publication
        run: |
          python - <<'PY'
          from collections import Counter
          import hashlib
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'loyalty')
          import merchant_extract as m
          schema = m.strict_json(Path('loyalty/merchant_offer.schema.json').read_text())
          rows = []
          for path in sorted(Path('saved-responses').rglob('response.json')):
              raw = path.read_bytes()
              try:
                  data = m.strict_json(raw)
              except (ValueError, UnicodeError):
                  continue
              if not isinstance(data, dict) or data.get('model') != 'deepseek-v4-1-flash-economy-261017':
                  continue
              original = m.strict_json((path.parent.parent / 'summary.json').read_text())
              assert original['provider'] == 'orcarouter', str(path)
              assert original['requested_model'] == 'deepseek/deepseek-v4.1-flash-free', str(path)
              try:
                  m.parse_final(data, schema, provider='orcarouter')
                  outcome = 'accepted'
              except ValueError as exc:
                  outcome = str(exc)
              rows.append({'path': str(path), 'sha256': hashlib.sha256(raw).hexdigest(),
                           'original_status': original['status'],
                           'original_error': original.get('error'), 'outcome': outcome})
          counts = dict(Counter(row['outcome'] for row in rows))
          report = {'responses': len(rows), 'outcomes': counts, 'live_model_requests': 0,
                    'publication_allowed': False, 'rows': rows}
          Path('verification/offline-replay.json').write_text(json.dumps(report, indent=2))
          print(json.dumps({key: value for key, value in report.items() if key != 'rows'}, indent=2))
          assert counts == {'accepted': 86, 'incomplete_or_blocked_generation': 14}, counts
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-model-alias-verification-${{ github.run_id }}
          path: verification/
          retention-days: 30
