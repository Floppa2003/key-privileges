name: Verify practical reader catalogue
on:
  push:
    branches: ['maintenance/catalogue-quality-20260920']
    paths: ['.github/workflows/catalogue-quality-check.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt jsonschema==4.26.0
      - name: Full regression with only synthetic and public fixtures
        run: |
          mkdir -p catalogue-check
          python -m unittest discover -s loyalty/tests -v > catalogue-check/tests.log 2>&1
          tail -6 catalogue-check/tests.log
          node --test key/refresh.test.mjs > catalogue-check/key-tests.log 2>&1
          tail -9 catalogue-check/key-tests.log
      - name: Record exact tested public code
        if: always()
        run: |
          mkdir -p catalogue-check
          git rev-parse HEAD > catalogue-check/commit.txt
          sha256sum loyalty/catalogue*.py loyalty/unified_publish.py loyalty/tests/test_catalogue*.py > catalogue-check/hashes.txt
          git archive HEAD loyalty key .github/workflows > catalogue-check/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: catalogue-quality-${{ github.run_id }}
          path: catalogue-check/
          retention-days: 7
