name: Merchant original evidence repair
on:
  push:
    branches: [loyalty/full-offer-inputs-20261031]
    paths: [.github/workflows/merchant-offer-input-check.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-offer-input-repair
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install test dependencies
        run: |
          python -m pip install -r loyalty/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Original-evidence regression (initially expected RED)
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python -m unittest discover -s loyalty/tests -p 'test_merchant_evidence.py' -v 2>&1 | tee evidence/contracts.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-evidence-tests-${{ github.run_id }}
          path: evidence/
          retention-days: 30
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '41194911797'
          artifact-ids: '13041115453'
          github-token: ${{ github.token }}
          path: catalog
          merge-multiple: true
      - name: Install public browser runtime without model keys
        run: |
          python -m pip install -r loyalty/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Inspect exact raw inputs and native read-only card layout
        run: |
          mkdir -p evidence
          PYTHONPATH=loyalty python - <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright
          from public_transport import PublicSource,check_response
          p=next(Path('catalog').rglob('normalized.json'))
          records=json.loads(p.read_text())['records']
          wanted=['Memo','Hide','El Copitas Bar','Po’mestam']
          selected=[r for r in records if r.get('source_id')=='konsierge_public' and r.get('partner_name') in wanted]
          Path('evidence/original-records.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2))
          print('ORIGINAL RECORDS',json.dumps(selected,ensure_ascii=False))
          async def inspect():
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(headless=True)
                  try:
                      async with PublicSource(browser,'https://konsierge.com/benefits') as source:
                          page=source.page
                          status,body=await source.navigate('https://konsierge.com/benefits')
                          check_response(status,body)
                          await page.wait_for_selector('qy-benefit-teaser',timeout=20000)
                          cards=page.locator('qy-benefit-teaser')
                          print('CARDS',await cards.count())
                          print('FIRST CARD',await cards.first.evaluate('(n)=>n.outerHTML'))
                          for _ in range(35):
                              match=page.locator('qy-benefit-teaser').filter(has=page.locator('.BenefitTeaser-Title').filter(has_text=re.compile('^\\s*Memo\\s*$')))
                              if await match.count(): break
                              n=await cards.count()
                              await page.evaluate('window.scrollTo(0,0)')
                              await page.wait_for_timeout(250)
                              await page.evaluate('window.scrollTo(0,document.body.scrollHeight)')
                              try: await page.wait_for_function('(n)=>document.querySelectorAll("qy-benefit-teaser").length>n',arg=n,timeout=10000)
                              except Exception: break
                          if not await match.count():
                              print('TARGET NOT LOADED')
                              return
                          print('TARGET CARD',await match.first.evaluate('(n)=>n.outerHTML'))
                          await match.first.scroll_into_view_if_needed()
                          await match.first.click(timeout=10000)
                          await page.wait_for_timeout(1500)
                          print('AFTER URL',page.url)
                          print('AFTER TEXT',(await page.locator('body').inner_text())[:30000])
                          print('DETAIL ELEMENTS',json.dumps(await page.evaluate('Array.from(document.querySelectorAll("[role=dialog],mat-dialog-container,[class*=Modal],[class*=Detail],qy-benefit")).map(n=>({tag:n.tagName,cls:n.className,html:n.outerHTML.slice(0,15000)}))'),ensure_ascii=False))
                          Path('evidence/card-detail.html').write_text(await page.content())
                          await page.screenshot(path='evidence/card-detail.png',full_page=True)
                  finally: await browser.close()
          asyncio.run(inspect())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-evidence-inspection-${{ github.run_id }}
          path: evidence/
          retention-days: 30
