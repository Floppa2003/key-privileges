name: Merchant original evidence repair
on:
  push:
    branches: [loyalty/full-offer-inputs-20261031]
    paths: [.github/workflows/merchant-offer-input-check.yml]
  pull_request:
    paths:
      - loyalty/merchant_evidence.py
      - loyalty/merchant_queue.py
      - loyalty/merchant_extract.py
      - loyalty/tests/test_merchant_evidence*.py
      - diagnostics/test_merchant_evidence_browser.py
      - .github/workflows/merchant-offer-input-check.yml
permissions:
  contents: read
concurrency:
  group: merchant-offer-input-tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r loyalty/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          python -m playwright install --with-deps chromium
      - name: Evidence contracts
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python -m unittest discover -s loyalty/tests -p 'test_merchant_evidence*.py' -v 2>&1 | tee evidence/contracts.log
      - name: Real browser capture regressions
        run: python diagnostics/test_merchant_evidence_browser.py > evidence/browser.log 2>&1
      - name: Full Python regression
        run: python -m unittest discover -s loyalty/tests -v > evidence/python.log 2>&1
      - name: KEY regression
        run: node --test key/refresh.test.mjs > evidence/key.log 2>&1
      - name: Exact results
        if: always()
        run: |
          for f in evidence/*.log; do echo "=== $f ==="; tail -75 "$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-evidence-tests-${{ github.run_id }}
          path: evidence/
          retention-days: 30
