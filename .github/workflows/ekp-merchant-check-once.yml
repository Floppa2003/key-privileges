name: One-time public EKP merchant acceptance
on:
  push:
    branches: [loyalty/ekp-merchant-clauses-20260924]
    paths: [loyalty/**, .github/workflows/ekp-merchant-check-once.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full regression suite
        run: |
          mkdir -p acceptance
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee acceptance/python-tests.log
          node --test key/refresh.test.mjs | tee acceptance/key-tests.log
      - run: python -m playwright install --with-deps chromium
      - name: Run standard public collector for the three new registered sources
        run: xvfb-run -a python loyalty/collect_normalized.py --limit 500 --sources ekp_artparking_public,ekp_domknigi_public,ekp_itc_public
      - name: Require actual source success and validate normal publisher input
        run: |
          python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
          python loyalty/source_lifecycle.py --input loyalty-output/normalized.json --sources ekp_artparking_public,ekp_domknigi_public,ekp_itc_public
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('loyalty-output/normalized.json').read_text())
          assert len(b['sources'])==3
          assert all(r['status']=='ok' and r['failed']==0 for r in b['sources']), b['sources']
          assert len(b['records'])==4
          print([(r['source_id'],r['normalized']) for r in b['sources']])
          PY
      - name: Preserve exact public code for independent audit
        if: always()
        run: |
          git rev-parse HEAD > acceptance/execution-commit.txt
          tar -czf acceptance/repository-code.tar.gz loyalty key
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-merchant-acceptance-${{ github.run_id }}
          path: |
            acceptance/
            loyalty-output/
          retention-days: 3
