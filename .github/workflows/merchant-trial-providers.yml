name: Cohere and Scaleway frozen merchant trials
on:
  workflow_dispatch:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-trial-providers.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-trial-providers
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve commit
        run: |
          mkdir -p regression-output
          git rev-parse HEAD > regression-output/commit.txt
      - name: Install existing pinned test dependencies
        run: python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
      - name: All regression suites without model calls or provider secrets
        run: |
          set -uo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual:$GITHUB_WORKSPACE/loyalty/experiments/simple_thinking"
          status=0
          for dir in loyalty/tests loyalty/experiments/prompt_ab loyalty/experiments/local_visual loyalty/experiments/resolution loyalty/experiments/simple_thinking loyalty/experiments/direct_think_json loyalty/experiments/cloud_json; do
            name=$(basename "$dir")
            if ! python -m unittest discover -s "$dir" -p 'test_*.py' -v > "regression-output/$name.log" 2>&1; then status=1; fi
          done
          if ! node --test key/refresh.test.mjs > regression-output/key.log 2>&1; then status=1; fi
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trial-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: regression-output/
          retention-days: 14
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[trial-smoke]')
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        provider: [cohere, scaleway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact code and install runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install -r loyalty/merchant-requirements.txt
          mkdir -p output/code
          git rev-parse HEAD > output/commit.txt
          cp loyalty/merchant_extract.py loyalty/merchant_prompt.txt loyalty/merchant_offer.schema.json loyalty/merchant-requirements.txt output/code/
          cp loyalty/experiments/cloud_json/trial_probe.py loyalty/experiments/cloud_json/test_trial_probe.py loyalty/experiments/cloud_json/TRIAL_PROTOCOL_20261006.md output/code/
          cp loyalty/experiments/simple_thinking/plan.json output/code/
          cp .github/workflows/merchant-trial-providers.yml output/workflow.yml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: '11092173951'
          github-token: ${{ github.token }}
          path: sources/muzcomedy
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: '11092462751'
          github-token: ${{ github.token }}
          path: sources/nevsky
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: '11092615920'
          github-token: ${{ github.token }}
          path: sources/rzd_museum
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: '11092032661'
          github-token: ${{ github.token }}
          path: sources/lavka
          merge-multiple: true
      - name: Build same ordinary manifest from frozen checksums
        run: |
          python - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          root=Path('sources')
          plan=json.loads(Path('loyalty/experiments/simple_thinking/plan.json').read_text())
          specs={s['id']:s for s in plan['cases']}
          docs=[]
          for case in ('muzcomedy','nevsky','rzd_museum','lavka'):
              spec=specs[case]
              raw=(root/spec['request']).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==spec['sha256'][spec['request']]
              target=json.loads(json.loads(raw)['messages'][-1]['content'].split('\n',1)[0])
              docs.append({'id':case,'target':target,'text':spec['text'],'images':spec['images'],
                  'sha256':{name:spec['sha256'][name] for name in (spec['text'],*spec['images'])}})
          manifest=json.dumps({'documents':docs},ensure_ascii=False,indent=2)
          (root/'trial-manifest.json').write_text(manifest)
          Path('output/frozen-manifest.json').write_text(manifest)
          PYCODE
      - name: Four documents, one metadata GET and at most eight POSTs
        env:
          COHERE_API_KEY: ${{ matrix.provider == 'cohere' && secrets.COHERE_API_KEY || '' }}
          SCALEWAY_API_KEY: ${{ matrix.provider == 'scaleway' && secrets.SCALEWAY_API_KEY || '' }}
        run: python loyalty/experiments/cloud_json/trial_probe.py --provider ${{ matrix.provider }} --manifest sources/trial-manifest.json --out output/results --execute > output/inference.log 2>&1
      - name: Preserve checksums
        if: always()
        run: |
          python - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          root=Path('output'); root.mkdir(exist_ok=True)
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trial-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 14
