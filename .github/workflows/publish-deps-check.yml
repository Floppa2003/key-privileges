name: Temporary normalized publish dependency check
on:
  push:
    branches: ['loyalty/finish-catalogs']
    paths: ['.github/workflows/publish-deps-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 pypdf==6.18.1
      - name: Exercise Alfa validation in publish dependency set
        run: |
          PYTHONPATH=loyalty python - <<'PY'
          import json
          from unittest.mock import patch
          import alfa_public_rules as a
          import sheets_normalized
          NOW='2026-09-18T20:00:00+00:00'
          TEXT='''Правила программы лояльности Редакция № 101 Редакция № 101 Правил введена в действие с 25.05.2026 УЛК (с оформлением ПУ «Alfa Only») 5 Категорий 30 000 Альфа-Баллов 50 000 Альфа-Баллов 500 000 рублей'''
          with patch.object(a,'pdf_text',return_value=TEXT):
            row=a.parse_cashback(b'%PDF-fixture',NOW)[0]
          bundle={'schema_version':2,'run_id':'publish-deps:1','observed_at':NOW,'records':[row],
                  'sources':[{'source_id':'alfa_only_cashback_rules','name':'Alfa','root':a.CASHBACK_URL,'status':'ok','normalized':1,'discovered':1,'failed':0,'coverage':'fixture','errors':[],'region':None,'observed_at':NOW}]}
          prepared=sheets_normalized.prepare(bundle)
          assert len(prepared['parser_offers'])==1
          print(json.dumps({'publish_dependency_validation':'ok','offers':1}))
          PY
