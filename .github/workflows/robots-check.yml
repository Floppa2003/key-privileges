name: Verify robots semantics and public page access
on:
  push:
    branches: [loyalty/robots-availability]
    paths: [loyalty/**, .github/workflows/robots-check.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewed delta
        run: |
          if test -f loyalty/_robots.patch; then git apply --check loyalty/_robots.patch && git apply loyalty/_robots.patch; fi
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={'loyalty/public_transport.py':'91ca043b889a5a752b98fb655227a906513f6eda9e7c08ab9b74eb47dbf51464','loyalty/collect_normalized.py':'1b78057a43d1969d93c1009829dc92569e15db468fb54f1b614a416973922b62','loyalty/normalized.py':'02830537ba87507decc48cb05cdbce42255465f51b0dcd13d770a3690635e761'}
          for p,h in expected.items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          PY
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Retain only verified code changes
        id: revision
        run: |
          if test -f loyalty/_robots.patch; then
            git add -- loyalty/public_transport.py loyalty/collect_normalized.py loyalty/normalized.py
            git rm -- loyalty/_robots.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: distinguish unavailable robots from denied target pages'
            git push origin HEAD:refs/heads/loyalty/robots-availability
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  probe:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.test.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Test exact public pages and a public reader without credentials
        run: python loyalty/robots_probe.py
      - name: Snapshot reviewed public code
        if: always()
        run: mkdir -p robots-output && git archive --format=tar HEAD > robots-output/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: robots-check-${{ github.run_id }}
          path: robots-output/
          retention-days: 7
