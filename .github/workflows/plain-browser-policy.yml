name: Remaining policy source-mode comparison
on:
  push:
    branches: [main]
    paths: [diagnostics/plain_browser_policy.py, .github/workflows/plain-browser-policy.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: One exact policy comparison per source, then root only under valid policy
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python diagnostics/plain_browser_policy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: policy-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: plain-browser-policy-output/
          retention-days: 7
