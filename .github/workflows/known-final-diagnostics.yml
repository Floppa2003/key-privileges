name: Resolve known public-source diagnostics
on:
  push:
    branches: [loyalty/known-source-completion]
    paths: [.github/workflows/known-final-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - name: Bounded public GETs; record but do not follow redirects
        run: |
          mkdir -p final-diagnostics
          python - <<'PY'
          import json,re,time,hashlib,sys
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          from datetime import datetime,timezone
          import requests
          from bs4 import BeautifulSoup
          sys.path.insert(0,'loyalty')
          from normalized import canonical_url
          urls=['https://www.vtb.ru/privilegia/karty/debetovye/privilegiya-aeroflot/','https://www.gazprombank.ru/personal/cards/7515685/','https://uralsib.ru/aktsii/privetstvennye-bally-rzhd-za-oformlenie-karty','https://www.nspk.ru/press-center/details/00d06ff9-ac6f-41fd-9aad-39965b9762cd']
          shorts='wzqdRP JdyRTA pYGdKM gGliaq ZNxBpY yRBVmU yZhJLY cuOyfc uXoqHP uWpmkU qzWiWH TlYigt pNnqOk bFwqtV CpeHTa coHFJh yxouTP hXfkMF MvgoSB'.split()
          rows=[]
          for url in urls+['https://ut0.ru/'+x for x in shorts]:
              row={'url':url,'observed_at':datetime.now(timezone.utc).isoformat(),'method':'plain_HTTPS_GET_no_redirect_following'}
              try:
                  res=requests.get(url,timeout=(5,10),allow_redirects=False,headers={'User-Agent':'Mozilla/5.0'})
                  row['http_status']=res.status_code
                  loc=res.headers.get('location')
                  if loc:
                      target=urljoin(url,loc)
                      try:row['redirect_target']=canonical_url(target)
                      except ValueError:row['redirect_target']=None;row['target_scheme']=urlsplit(target).scheme;row['target_host']=urlsplit(target).hostname;row['target_not_retained']='not_safe_public_https_url'
                  if res.status_code==200 and url in urls:
                      if len(res.content)>6000000:raise ValueError('Oversized public response')
                      soup=BeautifulSoup(res.content,'html.parser');row['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                      for n in soup.select('script,style,form,input,textarea'):n.decompose()
                      body=soup.body or soup
                      name=hashlib.sha256(url.encode()).hexdigest()[:16]+'.html'
                      Path('final-diagnostics',name).write_text(str(body),encoding='utf8');row['html_file']=name
              except Exception as exc:
                  row['error_type']=type(exc).__name__
                  if isinstance(exc,requests.exceptions.SSLError):row['reason']='tls_verification_failed'
                  elif isinstance(exc,requests.exceptions.Timeout):row['reason']='request_timeout'
                  else:row['reason']='request_failed'
              rows.append(row);time.sleep(0.35)
          Path('final-diagnostics/report.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: known-final-diagnostics-${{ github.run_id }}
          path: final-diagnostics/
          retention-days: 7
