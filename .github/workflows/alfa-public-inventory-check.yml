name: Alfa public inventory continuation
on:
  push:
    branches: ['loyalty/alfa-public-inventory-20260919']
    paths: ['.github/workflows/alfa-public-inventory-check.yml']
permissions:
  contents: read
concurrency:
  group: alfa-public-inventory-continuation
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Snapshot exact public code and reviewed PDF inputs
        run: |
          mkdir -p alfa-inventory-check
          git archive HEAD > alfa-inventory-check/code.tar
          python - <<'PY'
          import hashlib,json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          import alfa_partner_rules as a
          out=Path('alfa-inventory-check'); report=[]
          for spec in a.DOCS:
              item={'native_id':spec['native_id'],'url':spec['url'],'observed_at':datetime.now(timezone.utc).isoformat()}
              try:
                  data=a.fetch_pdf(spec['url'])
                  (out/(spec['native_id']+'.pdf')).write_bytes(data)
                  item.update(sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),status='downloaded')
              except Exception as e: item.update(status='failed',error=type(e).__name__)
              report.append(item)
          (out/'pdf_manifest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Inspect bounded public alternate index representations
        run: |
          python - <<'PY'
          import hashlib,json,re,time
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urlsplit
          import requests
          from bs4 import BeautifulSoup
          from protego import Protego
          out=Path('alfa-inventory-check'); report=[]
          urls=[
              'https://alfabank.servicecdn.ru/actions/rules/',
              'https://alfabank.st/actions/rules/',
              'https://alfabank-ru.translate.goog/actions/rules/?_x_tr_sl=ru&_x_tr_tl=en&_x_tr_hl=en',
          ]
          for n,url in enumerate(urls):
              row={'url':url,'observed_at':datetime.now(timezone.utc).isoformat()}
              try:
                  with requests.Session() as s:
                      s.trust_env=False
                      robots='https://'+urlsplit(url).netloc+'/robots.txt'
                      with s.get(robots,timeout=(5,12),allow_redirects=False,stream=True) as r:
                          raw=bytearray()
                          for chunk in r.iter_content(16384):
                              raw.extend(chunk)
                              if len(raw)>250000: raise RuntimeError('policy_bound')
                          row['robots_status']=r.status_code
                          if r.status_code==200:
                              if not Protego.parse(raw.decode('utf8','replace')).can_fetch(url,'LoyaltyCatalogResearchBot'): raise RuntimeError('robots_disallow')
                          elif r.status_code not in (401,403,404,410): raise RuntimeError('robots_unavailable')
                      s.cookies.clear()
                      with s.get(url,headers={'User-Agent':'LoyaltyCatalogResearchBot/1.0'},timeout=(5,18),allow_redirects=False,stream=True) as r:
                          row['status']=r.status_code
                          if r.status_code!=200: raise RuntimeError('page_not_200')
                          data=bytearray();deadline=time.monotonic()+20
                          for chunk in r.iter_content(65536):
                              data.extend(chunk)
                              if len(data)>6000000 or time.monotonic()>deadline: raise RuntimeError('page_bound')
                      soup=BeautifulSoup(bytes(data),'html.parser')
                      links=[]
                      for el in soup.select('a[href]'):
                          u=el['href']
                          if re.search(r'alfabank\.(?:servicecdn\.ru|st)/[^\s]+\.pdf',u): links.append({'url':u,'label':el.get_text(' ',strip=True)})
                      row.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),pdf_links=links)
                      row['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                      if links:
                          (out/('index-'+str(n)+'.html')).write_bytes(data)
              except Exception as e: row['error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
              report.append(row)
          (out/'index_routes.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps([{'url':r['url'],'status':r.get('status'),'error':r.get('error'),'pdf_links':len(r.get('pdf_links',[]))} for r in report]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-inventory-check-${{ github.run_id }}
          path: alfa-inventory-check/
          retention-days: 7
