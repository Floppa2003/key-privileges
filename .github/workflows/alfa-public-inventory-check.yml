name: Alfa public inventory continuation
on:
  push:
    branches: ['loyalty/alfa-public-inventory-20260919']
    paths: ['.github/workflows/alfa-public-inventory-check.yml']
permissions:
  contents: read
concurrency:
  group: alfa-public-inventory-continuation
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Public archive index byte-range discovery
        run: python loyalty/alfa_cc_range_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-inventory-check-${{ github.run_id }}
          path: alfa-inventory-check/
          retention-days: 7
