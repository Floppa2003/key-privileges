name: Aeroflot authorized public catalogue probe
on:
  push:
    branches: ['diagnostics/aeroflot-authorized-20260916']
    paths: ['.github/workflows/af-authorized-probe.yml']
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-refs/heads/main
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/diagnostics/aeroflot-authorized-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - name: Single anonymous browser, at most ten Free credits, no publication
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,re,sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          sys.path.insert(0,'loyalty')
          from free_access_probe import FreeReader,free_plan,now,public_url,sanitized_page,ProbeError
          ROOT='https://www.aeroflot.ru/ru-ru/partners'
          OUT=Path('af-probe-output');OUT.mkdir(exist_ok=True)
          script=r'''(async()=>{
            const startedAt=new Date().toISOString();
            await new Promise(resolve=>setTimeout(resolve,18000));
            const urls=[...new Set(performance.getEntriesByType('resource').map(x=>{
              try {const u=new URL(x.name);return u.protocol==='https:'&&
                (u.hostname==='aeroflot.ru'||u.hostname.endsWith('.aeroflot.ru'))&&
                /partners|cms|catalog|remote|shell-static|frontend|\/api\//i.test(u.pathname)
                ? u.origin+u.pathname:null;} catch(e){return null;}
            }).filter(Boolean))].slice(0,100);
            document.documentElement.setAttribute('data-loyalty-probe-location',location.href);
            const node=document.createElement('pre');node.id='af-authorized-public-probe';
            node.textContent=JSON.stringify({startedAt,finishedAt:new Date().toISOString(),
              finalUrl:location.origin+location.pathname,title:document.title,resources:urls});
            document.body.appendChild(node);
          })()'''
          report={'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],
                  'started_at':now(),'target':ROOT,'source_account_used':False,'publication':False,
                  'permission_basis':'owner_reported_source_permission_2026-09-16',
                  'permission_email_independently_read':False,'maximum_credits':10,'requests':0,
                  'script_sha256':hashlib.sha256(script.encode()).hexdigest()}
          reader=None
          try:
              reader=FreeReader(os.environ.get('SCRAPINGANT_API_KEY',''),[{'url':ROOT}],max_credits=10,max_requests=1)
              usage,_=reader._request('usage',{});report['opening_balance']=free_plan(usage)
              report['free_plan_confirmed']=True;report['requests']=1
              raw,meta=reader._request('general',{'url':ROOT,'browser':'true','proxy_country':'RU',
                  'proxy_type':'datacenter','timeout':'60','block_resource':['image','media','font'],
                  'js_snippet':base64.b64encode(script.encode()).decode()})
              charge=str(meta.get('Ant-credits-cost',''));status=str(meta.get('Ant-page-status-code',''))
              if not charge.isdigit() or int(charge)>10:raise ProbeError('cost_contract_changed')
              report['known_charged_credits']=int(charge)
              if not re.fullmatch('[1-5][0-9]{2}',status):raise ProbeError('origin_status_missing')
              report['origin_status']=int(status)
              if status!='200' or meta.get('ant-original-header-retry-after'):raise ProbeError('origin_refusal_or_rate_limit')
              soup=BeautifulSoup(raw,'html.parser');nodes=soup.select('#af-authorized-public-probe')
              if len(nodes)!=1:raise ProbeError('browser_marker_missing')
              info=json.loads(nodes[0].get_text());nodes[0].decompose()
              if info.get('finalUrl')!=ROOT or not isinstance(info.get('resources'),list):raise ProbeError('browser_identity_changed')
              if len(info['resources'])>100 or any(public_url(u)!=u for u in info['resources']):raise ProbeError('resource_url_contract_changed')
              clean,details=sanitized_page(str(soup),ROOT)
              body=BeautifulSoup(clean,'html.parser').get_text(' ',strip=True)
              restricted=bool(re.search(r'доступ.{0,40}ограничен|captcha|access denied|проверка безопасности',body[:700],re.I))
              report.update(browser=info,page=details,restriction=restricted,
                  public_dom_sha256=hashlib.sha256(clean.encode()).hexdigest(),
                  status='restriction_document' if restricted else 'public_page_requires_review')
              (OUT/'public-dom.html').write_text(clean)
          except Exception as exc:
              code=str(exc);report['error']=code if isinstance(exc,ProbeError) and re.fullmatch('[a-z0-9_]{1,100}',code) else type(exc).__name__
          finally:
              if reader is not None and not reader.halted:
                  try:
                      usage,_=reader._request('usage',{});report['closing_balance']=free_plan(usage)
                  except Exception:report['closing_balance_unavailable']=True
              report['finished_at']=now()
              (OUT/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
              (OUT/'executed-workflow.yml').write_bytes(Path('.github/workflows/af-authorized-probe.yml').read_bytes())
              print(json.dumps({k:report[k] for k in ('requests','status','error','known_charged_credits') if k in report}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: af-authorized-public-${{ github.run_id }}
          path: af-probe-output/
          retention-days: 7
