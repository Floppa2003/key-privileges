name: Verify free DeepSeek capacity expansion
on:
  push:
    branches: [loyalty/free-capacity-20261025]
    paths: [.github/workflows/free-capacity-apply.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: free-capacity-once
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/loyalty/free-capacity-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exactly the locally verified patch
        run: |
          set -euo pipefail
          mkdir -p output
          python diagnostics/capacity_apply.py > output/apply.log 2>&1
          python -m pip install -r loyalty/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Complete regression without credentials
        run: |
          status=0
          python -m unittest discover -s loyalty/tests -v > output/python-tests.log 2>&1 || status=1
          python -m unittest discover -s diagnostics/tests -v > output/diagnostic-tests.log 2>&1 || status=1
          node --test key/refresh.test.mjs > output/key-tests.log 2>&1 || status=1
          exit "$status"
      - name: Commit only verified product changes and remove one-shot bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- loyalty/merchant_extract.py loyalty/merchant_queue.py loyalty/tests/test_merchant_capacity.py .github/workflows/merchant-llm-daily.yml loyalty/DAILY_LLM.md loyalty/MERCHANT_DEEPSEEK.md
          git rm -- diagnostics/capacity_apply.py .github/workflows/free-capacity-apply.yml
          git commit -m 'feat: extend daily DeepSeek queue with independent Token Harbor free capacity'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/loyalty/free-capacity-20261025
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin refs/heads/loyalty/free-capacity-20261025
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git rev-parse HEAD > output/commit.txt
          git archive HEAD -o output/source.zip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: loyalty/llm-state
          path: state-copy
          sparse-checkout: state.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '40125342550'
          artifact-ids: '12573380423'
          github-token: ${{ github.token }}
          path: frozen
          merge-multiple: true
      - name: Bounded live pool check on saved real documents, no state publication
        env:
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          TOKENHARBOR_API_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          set -euo pipefail
          cp state-copy/state.json output/state.json
          python - <<'PY'
          import os,json
          from pathlib import Path
          names=('ORCAROUTER_API_KEY','TOKENHARBOR_API_KEY','NVIDIA_API_KEY','NEBIUS_API_KEY')
          Path('output/key-presence.json').write_text(json.dumps({name:bool(os.environ.get(name,'').strip()) for name in names}))
          PY
          python loyalty/merchant_queue.py pool --manifest frozen/captures/manifest.json --state output/state.json --out output/live --max-requests 6 --execute > output/live.log 2>&1
      - name: Hash saved evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('output');root.mkdir(exist_ok=True)
          result={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.json'}
          (root/'SHA256SUMS.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: free-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 14
