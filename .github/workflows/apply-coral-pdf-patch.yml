name: Apply and test bounded Coral PDF integration
on:
  push:
    branches: ['diagnostics/public-documents-20260917']
    paths: ['.github/workflows/apply-coral-pdf-patch.yml']
permissions:
  contents: write
jobs:
  patch_and_test:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/diagnostics/public-documents-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: loyalty/coral-pdfs-20260917
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact reviewed integration deltas, no source crawl or Google credential
        run: |
          test "$(git rev-parse HEAD)" = 'c1ee1f2abc6dc1f1585a21eb6ab26cacc7b70ab9'
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'loyalty/coral_pdf_collect.py':'1cc7ba7d44a5c8ec87a578eed425f4499be27df4f1453259323a1e9941e81a73',
            'loyalty/tests/test_coral_pdf_collect.py':'2d7b04934f36e0d4432b88b34e17ec6472aec1d01b1587cd17c953ace73ffd19',
            'loyalty/normalized.py':'8ad2961fee205935973c3b255af539f43eb66e44cd12e668dedffda72a340c67',
            'loyalty/unified_normalization.py':'a6ec37d87aa6be1fcfe4f33d240c6e4e5c7396f711c52e0bcc03b315a800bd77',
            '.github/workflows/coral-import.yml':'d032b4e4fcf869a55d813fb612fbe70145394bb26a5358051216bc8626722f66'}
          for name,want in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==want,name
          p=Path('loyalty/normalized.py');s=p.read_text();needle="HOSTS['coral_rule_documents']=['coralbonus.ru']\n";assert s.count(needle)==1
          p.write_text(s.replace(needle,needle+"HOSTS['coral_pdf_documents']=['coralbonus.ru']\n"))
          p=Path('loyalty/unified_normalization.py');s=p.read_text()
          needle="    if raw['kind']=='program_rules' and d.get('retrieval_method')=='coral_linked_public_rules_google_import_v1':\n"
          insert="""    if raw['kind']=='program_rules' and d.get('retrieval_method')=='coral_source_linked_pdf_free_api_v1':
                  # The PDF is a contract, not a catalogue of extra discounts or codes.
                  if not d.get('live_document_text') or not d.get('parent_references'):
                      raise ValueError('Linked PDF provenance missing')
                  condition('linked_pdf_rules','/conditions',scope={'parent_references':d['parent_references'],
                            'document_part':d['document_part'],'document_sha256':d['document_sha256'],
                            'applicability_requires_parent_offer_review':True})
                  n['quality']['level']='structured_with_review'
                  n['quality']['issues'].append('linked_rules_no_automatic_benefits_or_codes')
                  n['content_sha256']=digest({k:v for k,v in n.items() if k!='content_sha256'})
                  validate_normalized(n);return n
          """
          # Strip the YAML/Python continuation indent, retaining reviewed Python indentation.
          lines=insert.splitlines(True);insert=lines[0]+''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          assert s.count(needle)==1;p.write_text(s.replace(needle,insert+needle))
          p=Path('.github/workflows/coral-import.yml');s=p.read_text()
          s=s.replace("'loyalty/coral-linked-rules-20260916']","'loyalty/coral-linked-rules-20260916', 'loyalty/coral-pdfs-20260917']")
          s=s.replace('paths: [loyalty/coral_linked_rules.py','paths: [loyalty/coral_pdf_collect.py, loyalty/tests/test_coral_pdf_collect.py, loyalty/coral_linked_rules.py')
          needle='        run: python loyalty/coral_import.py\n';assert s.count(needle)==1
          s=s.replace(needle,needle+'      - name: Download source-linked public PDFs with the existing free key\n        env:\n          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}\n        run: python loyalty/coral_pdf_collect.py\n')
          s=s.replace('from coral_import import validate_bundle','from coral_pdf_collect import validate_bundle').replace('coral-source-evidence/normalized.json','coral-source-evidence/combined.json')
          p.write_text(s)
          final={
            'loyalty/normalized.py':'0c9b229ec8cd95d249bfae117c29f205f8759477ca40bf54e2da04e7aa41ed68',
            'loyalty/unified_normalization.py':'b21861759e6655b822eca72cd2f52c15f730cc8538399e6f15c0a2e3caa24f22',
            '.github/workflows/coral-import.yml':'9fc6180da7ee6a03eea185a92aeab86d125ba3cba7cd3803a94efa17f98fd654'}
          for name,want in final.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==want,name
          PY
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full tests on exact changed bytes
        run: |
          mkdir -p pdf-tests
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee pdf-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee pdf-tests/key-tests.log
      - name: Commit only the three reviewed deltas to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/normalized.py loyalty/unified_normalization.py .github/workflows/coral-import.yml
          git diff --cached --stat
          git commit -m 'Wire current-parent PDF documents into Coral collection and condition-only projection'
          git push origin HEAD:refs/heads/loyalty/coral-pdfs-20260917
          git rev-parse HEAD > pdf-tests/tested-commit.txt
          tar -cf pdf-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coral-pdf-integration-tests-${{ github.run_id }}
          path: pdf-tests/
          retention-days: 7
