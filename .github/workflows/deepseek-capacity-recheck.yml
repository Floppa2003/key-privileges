name: DeepSeek additional free capacity recheck
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deepseek-extra-capacity-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/loyalty/deepseek-capacity-recheck-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install PDF test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Install and test without model credentials
        run: |
          set -euo pipefail
          mkdir -p capacity-output
          git rev-parse HEAD > capacity-output/commit.txt
          python -m pip install -r loyalty/requirements.txt > capacity-output/install.log 2>&1
          python -m py_compile diagnostics/deepseek_capacity_probe.py
          python -m unittest discover -s diagnostics/tests -p test_deepseek_capacity_probe.py -v 2>&1 | tee capacity-output/probe-tests.log
          python -m unittest discover -s loyalty/tests -p 'test_merchant*.py' -v > capacity-output/merchant-tests.log 2>&1
          tail -n 5 capacity-output/merchant-tests.log
          VERSION=$(npm view opencode-ai version)
          echo "$VERSION" > capacity-output/opencode-version.txt
          npm install --prefix "$RUNNER_TEMP/opencode-capacity" "opencode-ai@$VERSION" > capacity-output/opencode-install.log 2>&1
          "$RUNNER_TEMP/opencode-capacity/node_modules/.bin/opencode" --version >> capacity-output/opencode-version.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '40637272596'
          artifact-ids: '12794924142'
          github-token: ${{ github.token }}
          path: saved
          merge-multiple: true
      - name: Reuse complete captured documents without recrawling or model keys
        run: |
          set -euo pipefail
          python diagnostics/deepseek_capacity_probe.py prepare --manifest saved/captures/manifest.json --out capacity-output
          cat capacity-output/inputs-summary.json
      - name: Test Vercel only on unused zero-balance account
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: python diagnostics/deepseek_capacity_probe.py vercel --inputs capacity-output/inputs.json --out capacity-output/vercel
      - name: Test exact OpenRouter free route without paid substitution
        if: always() && hashFiles('capacity-output/inputs.json') != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python diagnostics/deepseek_capacity_probe.py openrouter --inputs capacity-output/inputs.json --out capacity-output/openrouter
      - name: Test current OpenCode direct free endpoint
        if: always() && hashFiles('capacity-output/inputs.json') != ''
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python diagnostics/deepseek_capacity_probe.py opencode --inputs capacity-output/inputs.json --out capacity-output/opencode
      - name: Test official OpenCode CLI with every tool denied
        if: always() && hashFiles('capacity-output/inputs.json') != ''
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          export OPENCODE_BINARY="$RUNNER_TEMP/opencode-capacity/node_modules/.bin/opencode"
          python diagnostics/deepseek_capacity_probe.py cli --inputs capacity-output/inputs.json --out capacity-output/opencode-cli
      - name: Summarize actual provider outcomes and preserve executed code
        if: always()
        run: |
          mkdir -p capacity-output/code
          cp diagnostics/deepseek_capacity_probe.py diagnostics/tests/test_deepseek_capacity_probe.py capacity-output/code/
          cp .github/workflows/deepseek-capacity-recheck.yml capacity-output/code/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('capacity-output')
          reports={p.parent.name:json.loads(p.read_text()) for p in root.glob('*/summary.json')}
          result={'providers':reports,'production_state_changed':False,'publication_allowed':False}
          (root/'results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deepseek-capacity-recheck-${{ github.run_id }}
          path: capacity-output/
          retention-days: 30
