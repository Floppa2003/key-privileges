name: Build confirmed merchant channels
on:
  push:
    branches: [loyalty/confirmed-channels-20261031]
    paths:
      - '.github/workflows/merchant-channel-build.yml'
      - 'diagnostics/apply_confirmed_channels_20261031.py'
permissions:
  contents: read
concurrency:
  group: merchant-channel-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python and PDF test dependencies
        run: |
          python -m pip install -r loyalty/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Apply exact patch in isolated workspace
        run: |
          mkdir -p build-output
          git rev-parse HEAD > build-output/base.txt
          python diagnostics/apply_confirmed_channels_20261031.py
          python -m py_compile loyalty/merchant_channels.py loyalty/merchant_extract.py loyalty/merchant_queue.py
          git diff -- loyalty/merchant_extract.py loyalty/merchant_queue.py > build-output/production.patch
      - name: Verify new contracts
        run: python -m unittest discover -s loyalty/tests -p test_merchant_channels.py -v > build-output/contracts.log 2>&1
      - name: Full Python regression
        if: always()
        run: python -m unittest discover -s loyalty/tests -v > build-output/python.log 2>&1
      - name: KEY regression
        if: always()
        run: node --test key/refresh.test.mjs > build-output/key.log 2>&1
      - name: Commit verified source files to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/loyalty/confirmed-channels-20261031'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- loyalty/merchant_extract.py loyalty/merchant_queue.py
          git commit -m 'feat: integrate five confirmed channels with durable independent budgets'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/loyalty/confirmed-channels-20261031
          expected=$(git rev-parse HEAD)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin refs/heads/loyalty/confirmed-channels-20261031
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          echo "$expected" > build-output/verified-commit.txt
      - name: Preserve executed sources and all failures
        if: always()
        run: |
          cp loyalty/merchant_channels.py loyalty/merchant_extract.py loyalty/merchant_queue.py build-output/
          for f in build-output/*.log; do echo "=== $f ==="; grep -E '^(FAIL:|ERROR:|Ran |FAILED|OK|# tests |# pass |# fail )' "$f" || true; tail -35 "$f"; done
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('build-output')
          (root/'SHA256SUMS.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: channel-build-${{ github.run_id }}
          path: build-output/
          retention-days: 30
