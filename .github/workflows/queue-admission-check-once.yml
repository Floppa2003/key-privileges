name: One-time queue admission test acceptance
on:
  push:
    branches: [tests/queue-admission-20260924]
    paths: [.github/workflows/queue-admission-check-once.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full regression without changing production timeouts
        run: |
          mkdir -p queue-acceptance
          python -m unittest discover -s loyalty/tests -v > queue-acceptance/python-tests.log 2>&1
          tail -4 queue-acceptance/python-tests.log
          node --test key/refresh.test.mjs > queue-acceptance/key-tests.log
      - name: Repeated deterministic assertion and negative mutation controls
        run: |
          python - <<'PY'
          import io,json,sys,unittest
          from pathlib import Path
          from unittest.mock import patch
          sys.path[:0]=['loyalty','loyalty/tests']
          import test_collection_runtime as t
          original=Path('loyalty/collection_runtime.py').read_text()
          method='test_waiting_in_queue_does_not_consume_source_timeout'
          out={}
          def exercise(function,count):
              with patch.object(t,'collect_batch',function):
                  runner=unittest.TextTestRunner(stream=io.StringIO())
                  return runner.run(unittest.TestSuite(t.RuntimeTests(method) for _ in range(count)))
          result=exercise(t.collect_batch,25)
          assert result.wasSuccessful(), result.failures+result.errors
          out['normal_repetitions']=result.testsRun
          start=original.index('    async def worker(i):');end=original.index('\n    checkpoint()',start)
          worker=original[start:end].splitlines()
          wrapped='    async def worker(i):\n        async def admitted_worker():\n'+'\n'.join('    '+line for line in worker[1:])+'\n        return await asyncio.wait_for(admitted_worker(), timeout=budgets[i])\n'
          variants={
            'timer_before_admission':original[:start]+wrapped+original[end:],
            'missing_timer':original.replace('await asyncio.wait_for(run_source(cfg), timeout=budgets[i])','await run_source(cfg)'),
            'wrong_source_budget':original.replace('timeout=budgets[i]','timeout=budgets[0]')}
          for label,code in variants.items():
              scope={};exec(compile(code,'<in-memory-negative-control>','exec'),scope)
              result=exercise(scope['collect_batch'],1)
              assert not result.wasSuccessful(), 'Mutation escaped: '+label
              out[label]={'rejected':True,'failures':len(result.failures),'errors':len(result.errors)}
          assert Path('loyalty/collection_runtime.py').read_text()==original
          Path('queue-acceptance/mutation-results.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          PY
      - name: Preserve exact public test change
        if: always()
        run: |
          git rev-parse HEAD > queue-acceptance/execution-commit.txt
          cp loyalty/tests/test_collection_runtime.py queue-acceptance/
          cp loyalty/collection_runtime.py queue-acceptance/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: queue-admission-acceptance-${{ github.run_id }}
          path: queue-acceptance/
          retention-days: 3
