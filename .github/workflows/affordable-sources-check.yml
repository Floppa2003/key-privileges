name: Affordable sources bounded check
on:
  push:
    branches: ['loyalty/backit-avolta-mantera-20260922']
    paths: ['.github/workflows/affordable-sources-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read four previously failed public card sections
        run: |
          mkdir -p source-check
          xvfb-run -a python - <<'PY'
          import asyncio,hashlib,json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from public_reward_projection import plain
          async def main():
              report=[];out=Path('source-check')
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  async with PublicSource(browser,'https://backit.me/ru/cashback/shops') as client:
                      await client.robots();client.request_interval=max(1,client.request_interval)
                      for slug in ('vkusvill','justfood','mtsdk','takprodam-ozon'):
                          url='https://backit.me/ru/cashback/shops/'+slug
                          try:
                              raw=await client.read(url);soup=BeautifulSoup(raw,'html.parser')
                              fragment=BeautifulSoup('<html><body></body></html>','html.parser')
                              selectors=['span.mobile.name','.shop-rates','.shop-conditions','.shop-rules','.mu-auth__login_desktop','#activate-button']
                              for selector in selectors:
                                  for n in soup.select(selector):fragment.body.append(BeautifulSoup(str(n),'html.parser'))
                              for n in fragment.select('script,style,noscript,iframe,svg,input,textarea,form'):
                                  if n.parent is not None:n.decompose()
                              (out/(slug+'.html')).write_text(str(fragment))
                              report.append({'url':url,'observed_at':datetime.now(timezone.utc).isoformat(),'page_sha256':hashlib.sha256(raw.encode()).hexdigest(),'sections':{s:len(soup.select(s)) for s in selectors},'title':plain(soup.title),'tariff_nodes':[str(n) for n in fragment.select('.shop-rates .rate')],'name':[plain(n) for n in fragment.select('span.mobile.name')],'activation':[plain(n) for n in fragment.select('#activate-button')]})
                          except Exception as e:
                              report.append({'url':url,'error':str(e)[:140] if isinstance(e,RuntimeError) else type(e).__name__});break
                  await browser.close()
              (out/'details.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
              print(json.dumps(report,ensure_ascii=False))
          asyncio.run(main())
          PY
          git rev-parse HEAD > source-check/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: affordable-detail-check-${{ github.run_id }}
          path: source-check/
          retention-days: 1
