name: Affordable sources bounded check
on:
  push:
    branches: ['loyalty/backit-avolta-mantera-20260922']
    paths: ['.github/workflows/affordable-sources-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Read artifact footprint without deleting or changing billing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source-check
          python - <<'PY'
          import json,os,requests
          from pathlib import Path
          s=requests.Session();s.headers['Authorization']='Bearer '+os.environ['GITHUB_TOKEN']
          base='https://api.github.com/repos/Floppa2003/key-privileges/actions/'
          items=[]
          for page in range(1,21):
              r=s.get(base+'artifacts',params={'per_page':100,'page':page},timeout=25);r.raise_for_status();v=r.json()
              items.extend(v['artifacts'])
              if len(v['artifacts'])<100:break
          else:raise RuntimeError('artifact_inventory_bound')
          cache=s.get(base+'cache/usage',timeout=25)
          result={'repository':'Floppa2003/key-privileges','artifacts':len(items),'unexpired_bytes':sum(x['size_in_bytes'] for x in items if not x['expired']),
              'largest':[{'id':x['id'],'name':x['name'],'bytes':x['size_in_bytes'],'expired':x['expired'],'created_at':x['created_at']} for x in sorted(items,key=lambda x:x['size_in_bytes'],reverse=True)[:12]],
              'cache_usage':cache.json() if cache.status_code==200 else {'http_status':cache.status_code},'account_billing_quota_read':False,'deleted':0}
          Path('source-check/storage.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
      - name: Restore digest-verified public source fixtures and reviewed wiring
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,os,zipfile
          from pathlib import Path
          import requests
          for ident,digest,dest in [(10689521630,'38c22e16a2508472ae9cee51168c5fac4b223ca0ee8497ab5edde17ba53aa3a6','fixture-first'),(10690925255,'36827e43681485bb70a1be3f64befb084418e8489e3d427efb6d60099750d3f1','fixture-latest')]:
              r=requests.get(f'https://api.github.com/repos/Floppa2003/key-privileges/actions/artifacts/{ident}/zip',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN']},timeout=25,allow_redirects=False)
              assert r.status_code==302 and r.headers['Location'].startswith('https://')
              r=requests.get(r.headers['Location'],timeout=35);r.raise_for_status();data=r.content
              assert hashlib.sha256(data).hexdigest()==digest
              z=zipfile.ZipFile(io.BytesIO(data));assert z.testzip() is None
              Path(dest).mkdir(exist_ok=True)
              for n in z.namelist():
                  if n.endswith('.html') and '/' not in n:Path(dest,n).write_bytes(z.read(n))
          PY
          python diagnostics/install_affordable_routes.py fixture-first fixture-latest
      - name: Full regression before persisting feature code
        run: |
          python -m unittest discover -s loyalty/tests -v > source-check/tests.log 2>&1
          tail -5 source-check/tests.log
          node --test key/refresh.test.mjs > source-check/key-tests.log 2>&1
          tail -8 source-check/key-tests.log
      - name: Commit tested wiring only to the approved feature branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          branch='loyalty/backit-avolta-mantera-20260922';assert os.environ['GITHUB_REF_NAME']==branch
          files=['loyalty/'+n for n in ('collect_normalized.py','normalized.py','unified_normalization.py','sources_normalized.json','backit_catalog.py')]
          files+=sorted(str(p) for p in Path('loyalty/tests/fixtures_live/affordable').glob('*.html'))
          assert len(files)==12
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','commit','-m','Persist tested public Backit Avolta and Mantera source integrations'],check=True)
          auth=base64.b64encode(('x-access-token:'+os.environ['GITHUB_TOKEN']).encode()).decode()
          r=subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:'+branch],capture_output=True,text=True)
          if r.returncode:raise RuntimeError('feature_push_failed')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();Path('source-check/commit.txt').write_text(sha+'\n')
          paths=files+['loyalty/'+n for n in ('avolta_source.py','mantera_source.py','backit_source.py','public_reward_projection.py','tests/test_public_reward_sources.py')]
          Path('source-check/code_hashes.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          print('Tested feature commit',sha)
          PY
      - run: python -m playwright install --with-deps chromium
      - name: Fresh collection through production entrypoints without account credentials
        run: |
          xvfb-run -a python loyalty/collect_normalized.py --limit 500 --sources backit_public,club_avolta_public,mantera_moments
          python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
      - name: Check common projection of every collected record
        if: always()
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from sheets_normalized import prepare,SCHEMAS
          from unified_normalization import make_input,normalize_record
          p=Path('loyalty-output/normalized.json')
          if not p.exists():raise SystemExit(0)
          b=json.loads(p.read_text());v=prepare(b)['parser_offers'];out=[]
          for row in v:
              raw=make_input({'id':row[0],'origin':'parser_offers','row':2,'fields':{h:{'value':x} for h,x in zip(SCHEMAS['parser_offers'],row)}})
              n=normalize_record(raw,as_of=b['observed_at'][:10]);out.append(n)
          Path('source-check/common.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps([{k:s[k] for k in ('source_id','status','discovered','normalized','failed','errors')} for s in b['sources']],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: affordable-live-${{ github.run_id }}
          path: |
            source-check/
            loyalty-output/
          retention-days: 3
