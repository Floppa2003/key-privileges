name: Affordable sources bounded check
on:
  push:
    branches: ['loyalty/backit-avolta-mantera-20260922']
    paths: ['.github/workflows/affordable-sources-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Regression on committed source code
        run: |
          mkdir -p source-check
          python -m unittest discover -s loyalty/tests -v > source-check/tests.log 2>&1
          tail -5 source-check/tests.log
          node --test key/refresh.test.mjs > source-check/key-tests.log 2>&1
          tail -8 source-check/key-tests.log
      - run: python -m playwright install --with-deps chromium
      - name: Read remaining Backit source through its production entrypoint
        run: xvfb-run -a python loyalty/collect_normalized.py --limit 500 --sources backit_public --out source-check/live
      - name: Validate source and common projection
        if: always()
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from sheets_normalized import prepare,SCHEMAS
          from unified_normalization import make_input,normalize_record
          from catalogue_view import record_row
          b=json.loads(Path('source-check/live/normalized.json').read_text())
          p=prepare(b);indexed={v[0]:v for v in p['parser_offers']};projection=[]
          for r in b['records']:
              raw=make_input({'id':r['id'],'origin':'parser_offers','row':2,'fields':{h:{'value':v} for h,v in zip(SCHEMAS['parser_offers'],indexed[r['id']])}})
              n=normalize_record(raw,as_of=b['observed_at'][:10]);row,reason=record_row(n,b['observed_at'][:10])
              projection.append({'id':r['id'],'source_id':r['source_id'],'benefits':len(n['benefits']),'reader':row,'reader_exclusion':reason})
          Path('source-check/projection.json').write_text(json.dumps(projection,ensure_ascii=False,indent=2))
          print(json.dumps(b['sources'],ensure_ascii=False))
          if any(s['status']!='ok' or not s['normalized'] for s in b['sources']):raise SystemExit(1)
          PY
      - name: Preserve exact public code
        if: always()
        run: |
          mkdir -p source-check
          git rev-parse HEAD > source-check/commit.txt
          git archive HEAD loyalty key .github/workflows > source-check/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: affordable-source-check-${{ github.run_id }}
          path: source-check/
          retention-days: 1
