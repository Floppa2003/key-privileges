name: Affordable sources bounded check
on:
  push:
    branches: ['loyalty/backit-avolta-mantera-20260922']
    paths: ['.github/workflows/affordable-sources-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Observe second public Backit inventory page
        run: xvfb-run -a python diagnostics/backit_pagination_check.py
      - name: Read ordinary public Avolta partner pages
        if: always()
        run: xvfb-run -a python diagnostics/avolta_pages_check.py
      - run: git rev-parse HEAD > source-check/commit.txt
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: affordable-source-pages-${{ github.run_id }}
          path: source-check/
          retention-days: 3
