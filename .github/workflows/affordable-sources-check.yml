name: Affordable sources bounded check
on:
  push:
    branches: ['loyalty/backit-avolta-mantera-20260922']
    paths: ['.github/workflows/affordable-sources-check.yml']
permissions: {contents: read, actions: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full regression on final production code
        run: |
          mkdir -p source-check
          python -m unittest discover -s loyalty/tests -v > source-check/tests.log 2>&1
          tail -5 source-check/tests.log
          node --test key/refresh.test.mjs > source-check/key-tests.log 2>&1
          tail -8 source-check/key-tests.log
      - name: Replay exact public source evidence and repaired detail layouts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,sys,zipfile
          from pathlib import Path
          import requests
          sys.path.insert(0,'loyalty')
          from public_reward_projection import make_record
          from backit_source import parse_detail,source_fields
          from sheets_normalized import prepare,SCHEMAS
          from unified_normalization import make_input,normalize_record
          from catalogue_view import record_row
          def artifact(ident,digest):
              u=f'https://api.github.com/repos/Floppa2003/key-privileges/actions/artifacts/{ident}/zip'
              r=requests.get(u,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN']},timeout=25,allow_redirects=False)
              assert r.status_code==302 and r.headers['Location'].startswith('https://')
              r=requests.get(r.headers['Location'],timeout=35);r.raise_for_status();data=r.content
              assert len(data)<2500000 and hashlib.sha256(data).hexdigest()==digest
              z=zipfile.ZipFile(io.BytesIO(data));assert z.testzip() is None;return z
          old=artifact(10699341182,'8daff8d83a32c6f1e3cd3a39466980fbf7006d9d433382ef77f353fe12af335a')
          b=json.loads(old.read('live/normalized.json'));assert len(b['records'])==194
          for r in b['records']:
              assert make_record(r['source_id'],r['details']['public_reward_evidence'],r['observed_at'])==r
          patch=artifact(10699591435,'e441594d812b8534ca51aab52f0640d444d423f890519806e3d7b7d0542b1d15')
          observed=json.loads(patch.read('details.json'));extra=[]
          for slug in ('vkusvill','justfood'):
              item=next(r for r in observed if r['url'].endswith('/'+slug))
              row=parse_detail(patch.read(slug+'.html').decode(),{'url':item['url'],'name':item['name'][0]},item['observed_at'])
              # The legacy source rates list does not describe fixed RUB rewards;
              # their canonical values live in the source-owned common projection.
              f=source_fields(row['details']['public_reward_evidence'])
              assert f['terms'] and row['redemption_text'] and row['conditions_text']
              if slug=='vkusvill':assert 'VS1857' in str(row['promo_codes']) and len(row['rates'])==2
              extra.append(row)
          for r in extra:
              now=r['observed_at'];report={'source_id':r['source_id'],'name':r['program'],'root':r['source_url'],'status':'ok','normalized':1,'discovered':1,'failed':0,'coverage':'DOM excerpt replay only','errors':[],'region':None,'observed_at':now}
              vals=prepare({'schema_version':2,'run_id':'fixture:1','observed_at':now,'records':[r],'sources':[report]})['parser_offers'][0]
              raw=make_input({'id':r['id'],'origin':'parser_offers','row':2,'fields':{h:{'value':v} for h,v in zip(SCHEMAS['parser_offers'],vals)}})
              n=normalize_record(raw,as_of=now[:10]);reader,reason=record_row(n,now[:10]);assert reader and reason is None
              if r['source_url'].endswith('/justfood'):
                  assert [(x['value'],x['unit']) for x in n['benefits']]==[('377','RUB'),('301','RUB'),('167','RUB'),('1341','RUB')]
          result={'unchanged_actual_records_replayed':len(b['records']),'repaired_actual_DOM_excerpts':len(extra),'source_run':b['run_id'],'source_observed_at':b['observed_at'],'accounts_used':False,'new_catalogue_fetch':False,'provider_credits':0,'published':False}
          Path('source-check/acceptance.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
      - name: Preserve exact reviewed public code
        if: always()
        run: |
          mkdir -p source-check
          git rev-parse HEAD > source-check/commit.txt
          git archive HEAD loyalty key .github/workflows > source-check/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: affordable-final-review-${{ github.run_id }}
          path: source-check/
          retention-days: 1
