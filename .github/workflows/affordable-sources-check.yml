name: Affordable sources bounded check
on:
  push:
    branches: ['loyalty/backit-avolta-mantera-20260922']
    paths: ['.github/workflows/affordable-sources-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Observe anonymous public UI without authentication
        run: |
          mkdir -p source-check
          xvfb-run -a python - <<'PY'
          import asyncio,hashlib,json,re,sys
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs,urlunsplit,urlencode
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          out=Path('source-check');report=[]
          def safe_url(url):
              p=urlsplit(url);q=parse_qs(p.query)
              return urlunsplit((p.scheme,p.netloc,p.path,urlencode({k:v for k,v in q.items() if k in ('page','per','limit','offset','sort','order','lang','language','category','category_id','compilation')},doseq=True),''))
          async def probe(browser,label,url):
              r={'source':label,'url':url,'observed_at':datetime.now(timezone.utc).isoformat(),'network':[]}
              pending=[]
              try:
                  async with PublicSource(browser,url) as client:
                      await client.robots();r['robots_state']=client.robots_info['state']
                      page=client.page
                      async def response(res):
                          p=urlsplit(res.url)
                          if res.request.resource_type not in ('xhr','fetch') or not any(x in (p.hostname or '') for x in ('backit','clubavolta')):return
                          n={'url':safe_url(res.url),'status':res.status};r['network'].append(n)
                          if label=='backit' and '/shops' in p.path and res.status==200 and 'json' in res.headers.get('content-type',''):
                              raw=await res.body()
                              if len(raw)<2500000:
                                  payload=json.loads(raw)
                                  def scrub(value):
                                      if isinstance(value,dict):return {k:scrub(v) for k,v in value.items() if not re.search(r'token|cookie|password|secret|session|email|phone|user_id',k,re.I)}
                                      if isinstance(value,list):return [scrub(v) for v in value]
                                      return value
                                  name=f'backit-xhr-{len(r["network"]):03}.json';(out/name).write_text(json.dumps(scrub(payload),ensure_ascii=False));n['file']=name
                      page.on('response',lambda res:pending.append(asyncio.create_task(response(res))))
                      html=await client.read(url,render=True)
                      r['counts']=[]
                      if label=='backit':
                          for i in range(6):
                              r['counts'].append(await page.locator('a.mu-store__wrapper').count())
                              await page.evaluate('window.scrollTo(0,document.body.scrollHeight)');await page.wait_for_timeout(1500)
                              load=page.get_by_text('Показать ещё',exact=True)
                              if await load.count()==1 and await load.is_visible():await load.click();await page.wait_for_timeout(1200)
                          html=await page.content()
                      await asyncio.gather(*pending,return_exceptions=True)
                      s=BeautifulSoup(html,'html.parser')
                      for n in s.select('script,style,noscript,svg,iframe'):n.decompose()
                      (out/(label+'.html')).write_text(str(s));r['html_file']=label+'.html';r['html_sha256']=hashlib.sha256(html.encode()).hexdigest()
                      r['title']=await page.title();r['final_url']=safe_url(page.url)
              except Exception as e:r['error']=str(e)[:240] if isinstance(e,(ValueError,RuntimeError)) else type(e).__name__
              report.append(r)
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=False)
                  for label,url in [('backit','https://backit.me/ru/cashback/shops'),('avolta','https://www.clubavolta.com/ru')]:await probe(b,label,url)
                  await b.close()
              (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          asyncio.run(main())
          PY
          git rev-parse HEAD > source-check/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: affordable-source-browser-${{ github.run_id }}
          path: source-check/
          retention-days: 3
