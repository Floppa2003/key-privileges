name: Affordable sources bounded check
on:
  push:
    branches: ['loyalty/backit-avolta-mantera-20260922']
    paths: ['.github/workflows/affordable-sources-check.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Capture only public source pages for parser design
        run: |
          mkdir -p source-check
          python - <<'PY'
          import concurrent.futures,hashlib,json,sys,time
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urlsplit,urljoin
          import requests
          from bs4 import BeautifulSoup
          from protego import Protego
          sys.path.insert(0,'loyalty')
          from public_transport import robots_document,check_response
          targets={
            'backit':['https://backit.me/ru/cashback/shops','https://backit.me/ru/cashback/shops/kuper','https://backit.me/ru/cashback/shops/sportmaster'],
            'avolta':['https://www.clubavolta.com/ru','https://www.clubavolta.com/ru/nashi-partnery/zaly-ozhidaniya','https://www.clubavolta.com/ru/nashi-partnery/zaly-ozhidaniya/plaza'],
            'mantera':['https://manteracongress.ru/loyalty-program'],
            'mantera_faq':['https://lk.manteratravel.ru/faq']}
          def capture(pair):
            label,urls=pair;origin='https://'+urlsplit(urls[0]).netloc
            result={'source':label,'observed_at':datetime.now(timezone.utc).isoformat(),'pages':[]}
            s=requests.Session();s.trust_env=False;s.headers['User-Agent']='LoyaltyCatalogResearchBot/1.0'
            def get(url):
              with s.get(url,timeout=(8,25),allow_redirects=False,stream=True) as r:
                if r.status_code==429 or r.headers.get('Retry-After'):raise RuntimeError('rate_limit_stop')
                data=bytearray()
                for part in r.iter_content(65536):
                  data.extend(part)
                  if len(data)>7000000:raise RuntimeError('page_size_bound')
                return r.status_code,bytes(data),r.headers.get('Location','')
            try:
              status,raw,location=get(origin+'/robots.txt')
              rules,state=robots_document(status,raw.decode('utf-8',errors='replace'));policy=Protego.parse(rules)
              result['robots']={'status':status,'state':state,'text':rules}
              delay=max(1,policy.crawl_delay('LoyaltyCatalogResearchBot') or 0)
              for i,url in enumerate(urls):
                if not policy.can_fetch(url,'LoyaltyCatalogResearchBot'):raise RuntimeError('robots_disallow')
                time.sleep(delay);status,raw,location=get(url)
                item={'url':url,'status':status,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'observed_at':datetime.now(timezone.utc).isoformat()}
                if location:item['location']=urljoin(url,location).split('?')[0]
                result['pages'].append(item)
                if status!=200:continue
                text=raw.decode('utf-8',errors='replace');check_response(status,text)
                soup=BeautifulSoup(text,'html.parser')
                item['scripts']=[urljoin(url,a['src']).split('?')[0] for a in soup.select('script[src]')]
                item['script_ids']=[a.get('id') for a in soup.select('script[id]')]
                for n in soup.select('script,style,noscript,svg,iframe'):n.decompose()
                name=f'{label}-{i}.html';(Path('source-check')/name).write_text(str(soup));item['file']=name
            except Exception as e:result['error']=str(e) if isinstance(e,(ValueError,RuntimeError)) else type(e).__name__
            finally:s.close()
            return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:results=list(pool.map(capture,targets.items()))
          Path('source-check/report.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False))
          PY
          git rev-parse HEAD > source-check/commit.txt
          git archive HEAD loyalty key .github/workflows > source-check/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: affordable-source-check-${{ github.run_id }}
          path: source-check/
          retention-days: 3
