name: Coral public filter API feasibility
on:
  push:
    branches: ['loyalty/coral-completeness-20260916']
    paths: ['.github/workflows/coral-api-probe.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Two bounded anonymous requests, no publication
        run: |
          python - <<'PY'
          import hashlib,json,os,sys,time
          from pathlib import Path
          from datetime import datetime,timezone
          import requests
          from protego import Protego
          sys.path.insert(0,'loyalty')
          from public_transport import robots_document
          out=Path('coral-api-probe');out.mkdir()
          report={'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'started_at':datetime.now(timezone.utc).isoformat(),'source_accounts_used':False,'provider_credits':0,'published_records':0,'requests':[]}
          def read(method,url,**kw):
              item={'method':method,'url':url};report['requests'].append(item)
              with requests.request(method,url,timeout=(5,20),allow_redirects=False,stream=True,**kw) as r:
                  item['status']=r.status_code
                  if r.status_code==429 or r.headers.get('Retry-After'):raise RuntimeError('source_rate_limit')
                  data=bytearray()
                  for block in r.iter_content(65536):
                      data.extend(block)
                      if len(data)>1500000:raise RuntimeError('response_size_limit')
                  item['bytes']=len(data);item['sha256']=hashlib.sha256(data).hexdigest()
                  return r.status_code,data.decode('utf-8')
          try:
              status,raw=read('GET','https://coralbonus.ru/robots.txt')
              rules,state=robots_document(status,raw);policy=Protego.parse(rules);report['policy_state']=state
              url='https://coralbonus.ru/api/product/filter/'
              if not policy.can_fetch(url,'LoyaltyCatalogResearchBot'):raise RuntimeError('source_policy_disallow')
              time.sleep(max(2,policy.crawl_delay('LoyaltyCatalogResearchBot') or 0))
              # 4585 is from the current public transfer page's ng-init; this is a catalogue read, not an account/cart operation.
              status,raw=read('POST',url,json={'umbraco_category_id':4585,'filter_order':{'rating':'desc'}})
              if status!=200:raise RuntimeError('target_http_'+str(status))
              obj=json.loads(raw);report['response_keys']=list(obj) if isinstance(obj,dict) else None
              if not isinstance(obj,dict) or not isinstance(obj.get('products'),list):raise RuntimeError('public_catalogue_shape')
              products=obj['products'];report['products']=len(products)
              report['product_keys']=[sorted(p) for p in products if isinstance(p,dict)]
              allowed={'id','umbraco_id','title','url','price','old_price','referal','is_referal','description','category_id','umbraco_category_id','type'}
              report['public_previews']=[{k:v for k,v in p.items() if k in allowed and isinstance(v,(str,int,float,bool,type(None)))} for p in products if isinstance(p,dict)]
          except Exception as exc:
              report['error']=str(exc) if isinstance(exc,RuntimeError) else type(exc).__name__
          report['finished_at']=datetime.now(timezone.utc).isoformat()
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ('public_previews','product_keys')},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coral-api-probe-${{ github.run_id }}
          path: coral-api-probe/
          retention-days: 7
