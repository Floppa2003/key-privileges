name: Inspect retained DeepSeek capacity evidence
on:
  push:
    branches: [loyalty/deepseek-capacity-recheck-20261028]
    paths: [.github/workflows/deepseek-capacity-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/loyalty/deepseek-capacity-recheck-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '40750305744'
          artifact-ids: '12844465333'
          github-token: ${{ github.token }}
          path: evidence
          merge-multiple: true
      - name: Verify evidence hashes and inspect CLI outcome offline
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence').resolve()
          expected=json.loads((root/'SHA256SUMS.json').read_text())
          for name,digest in expected.items():
              path=(root/name).resolve()
              assert path.is_relative_to(root),name
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          report={'verified_hashes':len(expected),'live_model_requests':0,'publication_allowed':False}
          for name in ('commit.txt','opencode-version.txt','opencode-cli/vision/stderr.txt','opencode-cli/vision/events.jsonl'):
              path=root/name
              content=path.read_text(errors='replace')
              report[name]={'characters':len(content),'content':content[:24000],'truncated':len(content)>24000}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          Path('verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-capacity-offline-verification-${{ github.run_id }}
          path: verification.json
          retention-days: 30
