name: Practical offer scope and verified archive migration
on:
  push:
    branches: [main]
    paths: [loyalty/practical_scope.py, loyalty/practical_migrate.py, loyalty/tests/test_practical_scope.py, loyalty/tests/test_practical_migrate.py, loyalty/tests/test_practical_collection.py, .github/workflows/practical-scope.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Test final main code; no live websites or Google credentials
        run: |
          mkdir -p practical-tests
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee practical-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee practical-tests/key-tests.log
          tar -cf practical-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practical-main-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: practical-tests/
          retention-days: 7
  migrate:
    needs: regression
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main' && vars.LOYALTY_SHEETS_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Existing short-lived identity for the same spreadsheet
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Copy and verify excluded rows before clearing; rebuild current practical views
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DISCOUNTS_SPREADSHEET_ID: ${{ secrets.DISCOUNTS_SPREADSHEET_ID }}
        run: python loyalty/practical_migrate.py
