name: Seven public routes - independent Chrome confirmation
on:
  push:
    branches: ["diagnostics/seven-routes-transport-20260915"]
    paths: ["diagnostics/seven_browser_confirm.py", ".github/workflows/seven-browser-confirm.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 curl_cffi==0.16.0 playwright==1.57.0
      - name: Confirm anonymous reads with fresh installed Chrome profiles
        env:
          REPLICA: ${{ matrix.replica }}
        run: xvfb-run -a python diagnostics/seven_browser_confirm.py
      - name: Preserve diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seven-browser-${{ matrix.replica }}-${{ github.run_id }}
          path: seven-browser-output/
          if-no-files-found: warn
          retention-days: 7
