name: Remaining public document transports
on:
  push:
    branches: ['diagnostics/public-documents-20260917']
    paths: ['.github/workflows/public-documents-probe.yml']
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 989e5a9e28ae3ddd402896953a02091e58f37f7d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Two source-discovered public PDFs, existing free key only
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          python - <<'PY'
          import hashlib,json,os,sys,time
          from pathlib import Path
          from datetime import datetime,timezone
          import requests
          sys.path.insert(0,'loyalty')
          from free_access_probe import FreeReader,free_plan,ProbeError
          from document_text import extract_pdf
          out=Path('pdf-transport');out.mkdir()
          report={'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],
                  'publication':False,'source_account':False,'reserved':0,'requests':[]}
          def now():return datetime.now(timezone.utc).isoformat()
          def save():(out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          # Diagnostic inputs discovered in the verified live HTML-rule records,
          # never a production answer inventory. No source account is used.
          urls=['https://coralbonus.ru/media/m53l3xu3/правила-и-условия-пользования-подарочной-карты.pdf',
                'https://coralbonus.ru/media/futppgac/23-правила-участия-в-программе-лояльности-coralbonus-22-06-2026.pdf']
          key=os.environ.get('SCRAPINGANT_API_KEY','');halt=False
          try:
              guard=FreeReader(key,[{'url':'https://coralbonus.ru/'}],max_credits=52,max_requests=4)
              usage,_=guard._request('usage',{});report['opening_balance']=free_plan(usage)
              for index,url in enumerate(urls):
                  for proxy,cost in [('datacenter',1),('residential',25)]:
                      if halt:break
                      assert report['reserved']+cost<=52
                      report['reserved']+=cost
                      item={'url':url,'proxy_type':proxy,'requested_at':now()};report['requests'].append(item);save()
                      try:
                          with requests.get('https://api.scrapingant.com/v2/general',
                              params={'url':url,'x-api-key':key,'browser':'false','proxy_country':'RU','proxy_type':proxy,'timeout':'40'},
                              timeout=(10,55),allow_redirects=False,stream=True) as r:
                              item['provider_status']=r.status_code
                              item['origin_status']=r.headers.get('Ant-page-status-code')
                              item['credits']=r.headers.get('Ant-credits-cost')
                              item['content_type']=r.headers.get('Content-Type','')[:150]
                              if r.status_code in (401,402,403,409,429) or r.headers.get('Retry-After') or r.headers.get('ant-original-header-retry-after'):
                                  halt=True;raise RuntimeError('provider_auth_quota_or_rate_limit')
                              if r.status_code!=200:raise RuntimeError('provider_non_success')
                              charge=item['credits']
                              if not isinstance(charge,str) or not charge.isdigit() or int(charge)>cost:
                                  halt=True;raise RuntimeError('credit_contract_changed')
                              data=bytearray()
                              for block in r.iter_content(65536):
                                  data.extend(block)
                                  if len(data)>6000000:raise RuntimeError('response_size_bound')
                              if key.encode() in data:halt=True;raise RuntimeError('credential_echo')
                              item['bytes']=len(data);item['response_sha256']=hashlib.sha256(data).hexdigest()
                              if item['origin_status']!='200' or not data.startswith(b'%PDF-'):
                                  raise RuntimeError('not_origin_pdf_success')
                          doc=extract_pdf(bytes(data),allow_ocr=False)
                          path=out/f'document-{index+1}.pdf';path.write_bytes(data)
                          (out/f'document-{index+1}.json').write_text(json.dumps(doc,ensure_ascii=False,indent=2))
                          item.update(result='pdf_received',file=path.name,pages=doc['page_count'],errors=doc['errors'])
                          break
                      except Exception as exc:item['error']=str(exc) if isinstance(exc,RuntimeError) and str(exc).replace('_','').isalpha() else type(exc).__name__
                      finally:item['finished_at']=now();save();time.sleep(5)
              if not halt:
                  usage,_=guard._request('usage',{});report['closing_balance']=free_plan(usage)
          except Exception as exc:report['setup_error']=str(exc) if isinstance(exc,ProbeError) else type(exc).__name__
          report['finished_at']=now();save()
          print(json.dumps({'pdf_count':len(list(out.glob('*.pdf'))),'reserved':report['reserved'],'publication':False}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coral-binary-transport-${{ github.run_id }}
          path: pdf-transport/
          retention-days: 7
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 989e5a9e28ae3ddd402896953a02091e58f37f7d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Two external public targets and actual robots documents
        run: |
          python - <<'PY'
          import hashlib,json,os,sys,time
          from pathlib import Path
          from urllib.parse import urlsplit
          from datetime import datetime,timezone
          import requests
          from protego import Protego
          sys.path.insert(0,'loyalty')
          from free_access_probe import sanitized_page
          from public_transport import robots_document
          out=Path('external-documents');out.mkdir()
          report={'run_id':os.environ['GITHUB_RUN_ID'],'publication':False,'source_account':False,'requests':[]}
          urls=['https://rzdtour.com/','https://www.unicreditbank.ru/ru/personal/cards/pi-packages/debit-cash-and-back.html']
          def save():(out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          for index,url in enumerate(urls):
              item={'url':url};report['requests'].append(item);save()
              try:
                  policy_url='https://'+urlsplit(url).netloc+'/robots.txt'
                  r=requests.get(policy_url,headers={'User-Agent':'LoyaltyCatalogResearchBot/1.0'},timeout=(5,15),allow_redirects=False)
                  item['robots_http']=r.status_code
                  rules,state=robots_document(r.status_code,r.text);item['robots_state']=state
                  (out/f'robots-{index}.txt').write_text(rules)
                  policy=Protego.parse(rules)
                  if not policy.can_fetch(url,'LoyaltyCatalogResearchBot'):raise RuntimeError('robots_disallow')
                  delay=max(2,policy.crawl_delay('LoyaltyCatalogResearchBot') or 0)
                  if delay>30:raise RuntimeError('source_delay_bound')
                  time.sleep(delay)
                  with requests.get(url,headers={'User-Agent':'LoyaltyCatalogResearchBot/1.0'},timeout=(5,20),allow_redirects=False,stream=True) as r:
                      item['status']=r.status_code
                      item['location']=r.headers.get('Location','') if r.status_code in (301,302,303,307,308) else None
                      if r.status_code!=200 or r.headers.get('Retry-After'):raise RuntimeError('target_not_success')
                      data=bytearray()
                      for part in r.iter_content(65536):
                          data.extend(part)
                          if len(data)>4000000:raise RuntimeError('size_bound')
                      raw=data.decode(r.encoding or 'utf8')
                  safe,_=sanitized_page(raw,url,canonical_identity=True)
                  (out/f'page-{index}.html').write_text(safe)
                  item.update(result='html_received',sha256=hashlib.sha256(safe.encode()).hexdigest())
              except Exception as exc:item['error']=str(exc) if isinstance(exc,RuntimeError) and str(exc).replace('_','').isalpha() else type(exc).__name__
              save()
          PY
      - run: python -m pip download --no-deps protego==0.6.2 -d external-documents/dependency/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rzd-external-transport-${{ github.run_id }}
          path: external-documents/
          retention-days: 7
