name: Public alternatives bounded acceptance 20260925
on:
  push:
    branches: [loyalty/public-alternatives-20260925]
    paths: [loyalty/**, .github/workflows/public-alternatives-20260925.yml]
permissions:
  contents: read
concurrency:
  group: public-alternatives-20260925
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Record tested code
        run: |
          mkdir -p acceptance
          git rev-parse HEAD > acceptance/commit.txt
          git archive --format=tar.gz HEAD > acceptance/code.tar.gz
      - name: Regression tests
        run: |
          python -m unittest discover -s loyalty/tests -v > acceptance/python-tests.log 2>&1
          node --test key/refresh.test.mjs > acceptance/key-tests.log 2>&1
      - name: Collect two new sources through normal policy and validate without publication
        run: |
          python -m playwright install --with-deps chromium
          xvfb-run -a python loyalty/collect_normalized.py --limit 500 --sources ekp_ladoga_public,ekp_ilocked_brawl_stars
          python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
          python loyalty/source_lifecycle.py --input loyalty-output/normalized.json --sources ekp_ladoga_public,ekp_ilocked_brawl_stars
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-alternatives-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            acceptance/
            loyalty-output/
          retention-days: 1
