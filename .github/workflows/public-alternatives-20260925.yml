name: Public alternatives bounded acceptance 20260925
on:
  push:
    branches: [loyalty/public-alternatives-20260925]
    paths: [loyalty/**, .github/workflows/public-alternatives-20260925.yml]
permissions:
  contents: read
concurrency:
  group: public-alternatives-20260925
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Read four exact public merchant pages without accounts
        run: |
          mkdir -p acceptance/pages
          git rev-parse HEAD > acceptance/commit.txt
          git archive --format=tar.gz HEAD > acceptance/code.tar.gz
          python - <<'PY'
          import hashlib,json,time,requests
          from pathlib import Path
          from datetime import datetime,timezone
          from bs4 import BeautifulSoup,Comment
          urls={'academia':'https://academia-suites.ru/about-news/programma-loyalnosti-ekp','ladoga':'https://ladogabaza.ru/','brawl':'https://ilocked.ru/quest/brawl-stars','grandkarat':'https://grandkarat.com/special-offer/'}
          reports=[]
          for name,url in urls.items():
              item={'name':name,'url':url,'requested_at':datetime.now(timezone.utc).isoformat(),'account_used':False}
              try:
                  r=requests.get(url,timeout=(10,35),allow_redirects=False)
                  item.update(status=r.status_code,bytes=len(r.content),sha256=hashlib.sha256(r.content).hexdigest(),server_date=r.headers.get('Date'))
                  if r.status_code==200 and 'html' in r.headers.get('Content-Type',''):
                      dom=BeautifulSoup(r.content,'html.parser')
                      for n in dom.select('script,style,noscript,form,input,textarea'):
                          if n.parent is not None:n.decompose()
                      for n in dom.find_all(string=lambda v:isinstance(v,Comment)):n.extract()
                      data=str(dom).encode()
                      Path('acceptance/pages/'+name+'.html').write_bytes(data)
                      item.update(saved_sha256=hashlib.sha256(data).hexdigest(),outcome='public_html_read')
                  else:item['outcome']='non_html_or_non_200_no_retry'
              except requests.RequestException as e:item.update(outcome='request_failed',error=type(e).__name__)
              reports.append(item)
              time.sleep(2)
          Path('acceptance/pages/report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print(json.dumps(reports,ensure_ascii=False))
          PY
      - name: Regression tests
        run: |
          python -m unittest discover -s loyalty/tests -v > acceptance/python-tests.log 2>&1
          node --test key/refresh.test.mjs > acceptance/key-tests.log 2>&1
      - name: Collect newly implemented sources through the normal entrypoint
        run: |
          if test -f loyalty/ekp_stays_public.py; then
            python -m playwright install --with-deps chromium
            xvfb-run -a python loyalty/collect_normalized.py --limit 500 --sources ekp_academia_public,ekp_ladoga_public,ekp_ilocked_brawl_stars,rzd_grandkarat_public
            python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
            python loyalty/source_lifecycle.py --input loyalty-output/normalized.json --sources ekp_academia_public,ekp_ladoga_public,ekp_ilocked_brawl_stars,rzd_grandkarat_public
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-alternatives-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            acceptance/
            loyalty-output/
          retention-days: 1
