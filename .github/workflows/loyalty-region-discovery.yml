name: Inspect public T2 Saint Petersburg catalogue
on:
  push:
    branches: [loyalty/ekp-native-catalog]
    paths: [.github/workflows/loyalty-region-discovery.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Save only public offer fields and rendered labels
        run: |
          python - <<'PY'
          import asyncio,json,sys
          from pathlib import Path
          from urllib.parse import urlsplit
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from playwright.async_api import async_playwright
          FIELDS=('id','agreement','info','name','dateTo','companyName','partner','availableForAll','forAllTariffs','offlineOffer','areaType','offerType','promoCodeType','duration','segments')
          OUT=Path('regions');OUT.mkdir()
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  for host in ['spb.t2.ru','msk.t2.ru']:
                      report={'host':host,'observed_at':datetime.now(timezone.utc).isoformat()};captured=[];tasks=[]
                      try:
                          async with PublicSource(browser,'https://'+host+'/bolshe/offers') as client:
                              async def take(res):
                                  if urlsplit(res.url).hostname==host and urlsplit(res.url).path=='/api/loyalty/offers' and res.status==200:
                                      data=await res.json()
                                      captured.append({'meta':data.get('meta'), 'data':{'offers':[{k:o[k] for k in FIELDS if k in o} for o in data.get('data',{}).get('offers',[])]}})
                              def observe(res):tasks.append(asyncio.create_task(take(res)))
                              client.page.on('response',observe)
                              # Exact public landing, no logins, codes or activations.
                              status,body=await client.navigate('https://'+host+'/bolshe/offers')
                              report['status']=status
                              await client.page.wait_for_timeout(7000)
                              if tasks:await asyncio.gather(*tasks,return_exceptions=True)
                              report['url']=client.page.url;report['title']=await client.page.title()
                              report['offers']=len(captured[-1]['data']['offers']) if captured else 0
                              if captured:OUT.joinpath(host+'.json').write_text(json.dumps(captured[-1],ensure_ascii=False,indent=2),encoding='utf8')
                              OUT.joinpath(host+'.txt').write_text(await client.page.locator('body').inner_text(),encoding='utf8')
                      except Exception as exc:report['error']=type(exc).__name__
                      OUT.joinpath(host+'-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
                  await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regional-contract-${{ github.run_id }}
          path: regions/
          retention-days: 7
