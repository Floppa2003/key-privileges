name: Targeted Alfa partner PDF check
on:
  push:
    branches: ['loyalty/finish-catalogs']
    paths:
      - 'loyalty/alfa_partner_rules.py'
      - 'loyalty/tests/test_alfa_partner_rules.py'
      - '.github/workflows/alfa-partner-pdf-check.yml'
permissions:
  contents: read
concurrency:
  group: alfa-partner-pdf-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Partner PDF unit tests
        run: python -m unittest loyalty.tests.test_alfa_partner_rules -v
      - name: Live fetch and normalized payload validation
        run: |
          python - <<'PY'
          import asyncio,json,sys
          sys.path.insert(0,'loyalty')
          import alfa_partner_rules as a
          from normalized import validate_offer
          from sheets_normalized import prepare
          now='2026-09-18T22:45:00+00:00'
          cfg={'id':a.SOURCE_ID,'url':'https://alfabank.servicecdn.ru/'}
          report={'source_id':a.SOURCE_ID,'name':'Alfa','root':cfg['url'],'status':'ok','discovered':0,'normalized':0,'failed':0,'coverage':'','region':None,'errors':[],'observed_at':now}
          rows=asyncio.run(a.collect(cfg,report,now,20))
          for r in rows: validate_offer(r)
          report['normalized']=len(rows); report['failed']=len(report['errors']); report['status']='partial' if report['errors'] else 'ok'
          bundle={'schema_version':2,'run_id':'targeted:1','observed_at':now,'records':rows,'sources':[report]}
          prepared=prepare(bundle)
          print(json.dumps({'records':len(rows),'discovered':report['discovered'],'errors':report['errors'],'ids':[r['native_id'] for r in rows],'rows':{k:len(v) for k,v in prepared.items() if k in ('parser_offers','parser_coverage')}},ensure_ascii=False))
          assert len(rows)==5 and report['discovered']==5 and not report['errors']
          assert {r['native_id'] for r in rows}=={'betulla_0126','r14_0126','takhauli_0226','fresa_0226','mamatuta_probka_spb_0126'}
          PY
