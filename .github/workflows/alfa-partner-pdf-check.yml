name: Temporary Alfa partner PDF check
on:
  push:
    branches: ['loyalty/alfa-partner-pdfs']
    paths: ['.github/workflows/alfa-partner-pdf-check.yml','loyalty/alfa_partner_rules.py','loyalty/tests/test_alfa_partner_rules.py','loyalty/normalized.py','loyalty/sources_normalized.json','loyalty/collect_normalized.py']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Unit tests
        run: PYTHONPATH=loyalty python -m unittest loyalty.tests.test_alfa_partner_rules -v
      - name: Fresh CDN fetch and normalized payload validation
        run: |
          mkdir -p alfa-partner-output
          PYTHONPATH=loyalty python - <<'PY'
          import asyncio,json
          from datetime import datetime,timezone
          import alfa_partner_rules as a
          from normalized import validate_offer
          from sheets_normalized import prepare
          now=datetime.now(timezone.utc).isoformat()
          report={'source_id':a.SOURCE_ID,'name':'Alfa Only partner PDFs','root':'https://alfabank.servicecdn.ru/','status':'failed','discovered':0,'normalized':0,'failed':0,'coverage':'','region':None,'errors':[],'observed_at':now}
          rows=asyncio.run(a.collect({'id':a.SOURCE_ID,'url':'https://alfabank.servicecdn.ru/'},report,now,20))
          for r in rows: validate_offer(r)
          report['normalized']=len(rows);report['failed']=len(report['errors']);report['status']='partial' if report['errors'] else 'ok' if rows else 'failed'
          bundle={'schema_version':2,'run_id':'alfa-partner-live:1','observed_at':now,'records':rows,'sources':[report]}
          prepared=prepare(bundle)
          open('alfa-partner-output/normalized.json','w').write(json.dumps(bundle,ensure_ascii=False,indent=2))
          print(json.dumps({'status':report['status'],'discovered':report['discovered'],'normalized':len(rows),'errors':report['errors'],
              'offers':[{'partner':r['partner_name'],'valid_from':r['valid_from'],'valid_until':r['valid_until'],'validity':r['validity_status'],'rates':r['rates'],'scope':r['details']['transaction_scope']} for r in rows],
              'prepared_offers':len(prepared['parser_offers'])},ensure_ascii=False))
          for spec in a.DOCS:
            if any(e.get('native_id')==spec['native_id'] for e in report['errors']):
              data=a.fetch_pdf(spec['url']); text=a.pdf_text(data)
              for marker in ('3.1.','3.2.','1 500','10 %','10%'):
                i=text.find(marker)
                if i>=0:
                  print('DIAG',spec['native_id'],marker,text[max(0,i-350):i+1800])
                  break
          if len(rows)<2: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-partner-pdfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-partner-output/
          retention-days: 7
