name: Remaining explicit rule access diagnostic
on:
  push:
    branches: ['loyalty/remaining-rule-access-20260917']
    paths: [loyalty/remaining_rule_access_probe.py, .github/workflows/remaining-rule-access-probe.yml]
permissions:
  contents: read
concurrency:
  group: remaining-rule-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Check syntax and public source metadata without source or destination credentials
        run: |
          python -m py_compile loyalty/remaining_rule_access_probe.py
          python loyalty/remaining_rule_access_probe.py
          cp loyalty/remaining_rule_access_probe.py remaining-rule-probe/executed-probe.py
          cp .github/workflows/remaining-rule-access-probe.yml remaining-rule-probe/executed-workflow.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remaining-rule-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: remaining-rule-probe/
          retention-days: 7
