name: Qwen source-first one-shot JSON
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-source-first-json.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-source-first-json
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test unchanged suites and source-first contracts
        run: |
          set -euo pipefail
          mkdir -p regression-output
          git rev-parse HEAD > regression-output/commit.txt
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual:$GITHUB_WORKSPACE/loyalty/experiments/simple_thinking"
          python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
          python -m unittest discover -s loyalty/tests -v > regression-output/existing.log 2>&1
          python -m unittest discover -s loyalty/experiments/prompt_ab -p 'test_*.py' -v > regression-output/prompt.log 2>&1
          python -m unittest discover -s loyalty/experiments/local_visual -p 'test_*.py' -v > regression-output/local.log 2>&1
          python -m unittest discover -s loyalty/experiments/resolution -p 'test_*.py' -v > regression-output/resolution.log 2>&1
          python -m unittest discover -s loyalty/experiments/simple_thinking -p 'test_*.py' -v > regression-output/simple.log 2>&1
          python -m unittest discover -s loyalty/experiments/direct_think_json -p 'test_source_first.py' -v > regression-output/source-first.log 2>&1
          node --test key/refresh.test.mjs > regression-output/key.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-first-regressions-${{ github.run_id }}
          path: regression-output/
          retention-days: 14
  probe:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OLLAMA_MODEL: qwen3.5:4b
      DIRECT_MODEL: qwen3.5:4b
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: muzcomedy
            artifact: '11092173951'
          - case: nevsky
            artifact: '11092462751'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact experiment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p output/code
          git rev-parse HEAD > output/commit.txt
          cp loyalty/experiments/direct_think_json/source_first.py loyalty/experiments/direct_think_json/test_source_first.py loyalty/experiments/direct_think_json/direct_sampling.py output/code/
          cp loyalty/experiments/simple_thinking/probe.py loyalty/experiments/simple_thinking/plan.json output/code/
          cp loyalty/experiments/prompt_ab/prompt_ab.py loyalty/experiments/prompt_ab/practical_schema.json output/code/
          cp loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh output/code/
          cp .github/workflows/merchant-source-first-json.yml output/workflow.yml
          lscpu > output/cpu.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: sources/${{ matrix.case }}
          merge-multiple: true
      - name: Install same pinned CPU model
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > output/setup.log 2>&1
      - name: One source-first model call
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual:$GITHUB_WORKSPACE/loyalty/experiments/simple_thinking"
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/direct_think_json/source_first.py \
            --source sources --case ${{ matrix.case }} --out output/results \
            --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama" \
            > output/inference.log 2>&1
      - name: Preserve runtime setup and hash diagnostics
        if: always()
        run: |
          mkdir -p output
          if test -d loyalty/experiments/resolution/setup-logs; then cp -r loyalty/experiments/resolution/setup-logs output/; fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-first-${{ matrix.case }}-${{ github.run_id }}
          path: output/
          retention-days: 14
