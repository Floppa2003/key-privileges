name: Remaining original catalogues - canonical discovery
on:
  push:
    branches: ['diagnostics/last-catalogues-20260916']
    paths: ['diagnostics/last_catalogues.py', '.github/workflows/last-catalogues.yml']
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-refs/heads/main
  cancel-in-progress: false
jobs:
  direct:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/diagnostics/last-catalogues-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python diagnostics/last_catalogues.py --selfcheck
      - run: python diagnostics/last_catalogues.py --mode direct
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: last-catalogues-direct-${{ github.run_id }}
          path: last-catalogues-output/direct/
          retention-days: 7
  provider:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/diagnostics/last-catalogues-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python diagnostics/last_catalogues.py --selfcheck
      - name: Read current rules and discovered public paths only - no Google token
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python diagnostics/last_catalogues.py --mode provider
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: last-catalogues-provider-${{ github.run_id }}
          path: last-catalogues-output/provider/
          retention-days: 7
