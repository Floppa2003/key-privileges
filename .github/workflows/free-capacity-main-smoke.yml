name: Dispatch bounded main free-capacity smoke
on:
  push:
    branches: [verify/free-capacity-main-20261025]
    paths: [.github/workflows/free-capacity-main-smoke.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/verify/free-capacity-main-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify merged version and dispatch exactly three attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Floppa2003/key-privileges/git/ref/heads/main --jq .object.sha)" = '4b5ddd04b499610e36d22fc1d29ab36dd4d0bcd9'
          gh workflow run merchant-llm-daily.yml --repo Floppa2003/key-privileges --ref main -f max_requests=3 -f max_pages=3
          gh run list --repo Floppa2003/key-privileges --workflow merchant-llm-daily.yml --branch main --event workflow_dispatch --limit 3 --json databaseId,headSha,status,url > "$GITHUB_STEP_SUMMARY"
