name: Inspect public loyalty sources
on:
  push:
    branches: ['loyalty/normalized-sources']
    paths: ['loyalty/dev_deep.py', '.github/workflows/inspect-sources.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt beautifulsoup4==4.14.3
      - run: python -m playwright install --with-deps chromium
      - run: python loyalty/dev_deep.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-deep-inspection-${{ github.run_id }}
          path: source-inspection/
          retention-days: 7
