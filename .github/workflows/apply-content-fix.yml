name: Verify and apply content discovery repair
on:
  push:
    branches: [fix/content-driven-discovery-20261022]
    paths: [.github/workflows/apply-content-fix.yml]
permissions:
  contents: read
concurrency:
  group: apply-content-discovery-repair
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Floppa2003/key-privileges'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact patch and source preconditions
        run: |
          set -euo pipefail
          mkdir -p regression-output/staged
          git archive --format=zip HEAD > regression-output/source-before.zip
          cp diagnostics/content-followup-*.patch regression-output/staged/
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          expected={
            'loyalty/CONTENT_DISCOVERY.md':('91e00f3a1151b1dec954b663284d51ff81fd9e4512891b5ec21526237f681dfe','d5c618949c87f99af379bf0094907fd3d69756f711ba7b215594777d7781a051'),
            'loyalty/content_discovery.py':('63e4b7297a27efce6357bca76a17137a6b0aaa72824cecfa24652992c8f8b8d2','97a8850ed5f9e1b36100aab6c0f508c667446e98ba6c5994243dd501c47302a4'),
            'loyalty/ekp_stays_public.py':('d369f958a76e3dccc067d907a56429439d2a56b706c77925576656029d4f6a37','f7174e6668d780d909cf570a7afb68e0c6d6819eec6c1e7ce1ffd2e32d81b489'),
            'loyalty/hse_alumni.py':('86cdc5bd4c8bf3d34519d98784db630eed7de1c4368ea03dd5fa26f7aa9667dc','d0a6a178d43a57758c2d4be61a6d854ab56c91e78e0b29f93767743fa068353a'),
            'loyalty/known_rules.py':('586ae5bee18c4b7b2383a7335ddca69c9c85b138c0b3ca149cd824b90d2cc47c','1d8ca3471baf365261bad095de6e16d6fed21d9629132533be52f5eaf4d7bc90'),
            'loyalty/normalized.py':('798e6d2142ffd29e2739cde22ee2477b03c3a69ad21e001c8dd2d43394952bc4','bc17e76e13454e927c8eefaf3ebb4ef0f1fef08fe6c6920c03c957c962e3be64'),
            'loyalty/tests/test_content_discovery_remaining.py':(None,'54c4a2eb7f2d39cf78a71bd9820f519f32e0f252f2bfda915aeaf58a7ab715e0'),
            'loyalty/tests/test_ekp_public_20260925.py':('d0653dcc5564633c29baec170dd1ad0563fedf501428e31bc76444e6bcb17238','5969d5a5febdbc54b145c17271449292c18e973e9ee66754a9f3b6e441a3094f'),
            'loyalty/tests/test_known_rules.py':('f1106cfcb93f408a60c86df6c15b3a192a2be85b4c40c09357cc4151f27accc3','755fad8de4378e0a13eb74d009331f4513d62555e5fa019c738cb9cd16e923f9')}
          patch=b''.join(Path(f'diagnostics/content-followup-{i}.patch').read_bytes() for i in (1,2))
          assert hashlib.sha256(patch).hexdigest()=='bdf759806742d466348ff28e2c52033a4bc26fe1784b76c36eff4237dbf70dd1'
          for name,(before,after) in expected.items():
              p=Path(name)
              assert p.parts[0]=='loyalty' and not p.is_symlink()
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==before,name
          path=Path('regression-output/followup.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(changed)==set(expected)
          for name,(_,after) in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==after,name
          Path('regression-output/manifest.json').write_text(json.dumps(expected,indent=2))
          print('Verified patch and all 9 before/after source hashes.')
          PY
      - name: Install regression dependencies
        run: |
          python -m pip install -r loyalty/requirements.txt
          python -m pip download --no-deps --only-binary=:all: protego==0.6.2 -d regression-output/wheels
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Full regression and mutation tests
        run: |
          set -euo pipefail
          python -m unittest discover -s loyalty/tests -v > regression-output/tests.log 2>&1
          node --test key/refresh.test.mjs > regression-output/key-tests.log 2>&1
          git diff --check --cached
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '39685263932'
          artifact-ids: '12385379666'
          github-token: ${{ github.token }}
          path: captured-current
          merge-multiple: true
      - name: Replay current public source captures
        run: python loyalty/tests/replay_content_capture.py captured-current --output regression-output/current-replay.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '39583519809'
          artifact-ids: '12337983960'
          github-token: ${{ github.token }}
          path: captured-historical
          merge-multiple: true
      - name: Verify historical published row compatibility
        env:
          PYTHONPATH: loyalty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from normalized import validate_offer
          files=list(Path('captured-historical').rglob('normalized.json'))
          assert len(files)==1
          bundle=json.loads(files[0].read_text())
          for row in bundle['records']:validate_offer(row)
          result={'historical_rows':len(bundle['records']),'errors':0}
          Path('regression-output/historical-replay.json').write_text(json.dumps(result,indent=2))
          print(result)
          PY
      - name: Persist only successfully verified files to repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/content-driven-discovery-20261022'
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          for name,(_,expected) in json.loads(Path('regression-output/manifest.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          PY
          git diff --exit-code
          remote=$(gh api repos/Floppa2003/key-privileges/git/ref/heads/fix/content-driven-discovery-20261022 --jq .object.sha)
          test "$remote" = "$GITHUB_SHA"
          git rm diagnostics/content-followup-1.patch diagnostics/content-followup-2.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(loyalty): remove remaining label gates and scope literal reward rates'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/content-driven-discovery-20261022
          git rev-parse HEAD > regression-output/commit.txt
          git archive --format=zip HEAD > regression-output/source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-content-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: regression-output/
          retention-days: 14
