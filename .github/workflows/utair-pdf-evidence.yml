name: Inspect public Utair PDF evidence
on:
  push:
    branches: [loyalty/known-source-completion]
    paths: [.github/workflows/utair-pdf-evidence.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: |
          mkdir -p pdf-evidence
          python - <<'PY'
          import requests,json,hashlib,time
          from pathlib import Path
          from urllib.parse import urlsplit
          out=Path('pdf-evidence');report=[];headers={'User-Agent':'Mozilla/5.0'}
          for key in ['hXfkMF','yRBVmU','uXoqHP','yZhJLY']:
              row={'public_url':'https://ut0.ru/'+key}
              try:
                  a=requests.get(row['public_url'],headers=headers,timeout=15,allow_redirects=False)
                  if a.status_code not in (301,302,303,307,308):raise ValueError('shortlink_'+str(a.status_code))
                  target=a.headers.get('Location','');u=urlsplit(target)
                  if u.scheme!='https' or u.hostname!='eu-s3.beelinecloud.ru' or u.username or u.password or u.port not in (None,443):raise ValueError('unreviewed_redirect')
                  r=requests.get(target,headers=headers,timeout=20,allow_redirects=False)
                  if r.status_code!=200 or not r.content.startswith(b'%PDF-') or len(r.content)>3000000:raise ValueError('not_accepted_pdf')
                  (out/(key+'.pdf')).write_bytes(r.content)
                  row.update(status='saved',sha256=hashlib.sha256(r.content).hexdigest())
              except Exception as exc:
                  row.update(status='failed',error_type=type(exc).__name__)
              report.append(row);time.sleep(0.5)
          (out/'report.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: utair-pdf-evidence-${{ github.run_id }}
          path: pdf-evidence/
          retention-days: 7
