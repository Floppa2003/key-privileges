name: Public partner follow-up verification
on:
  push:
    branches: ["loyalty/public-partners-followup-20260922"]
    paths: [".github/workflows/public-partners-followup.yml"]
permissions:
  contents: read
  actions: read
jobs:
  final-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-partners-live-35764681102
          run-id: 35764681102
          github-token: ${{ github.token }}
          path: observed
      - name: Full regression on committed final code
        run: |
          mkdir -p final-evidence
          python -m unittest discover -s loyalty/tests -v > final-evidence/python-tests.log 2>&1
          node --test key/refresh.test.mjs > final-evidence/key-tests.log 2>&1
          tail -n 5 final-evidence/python-tests.log
      - name: Replay actual observations without the fixture helper clock
        run: |
          python - <<'PY'
          import json,sys,subprocess,pathlib
          sys.path.insert(0,'loyalty')
          from sheets_normalized import prepare,SCHEMAS
          from unified_normalization import make_input,normalize_record
          from catalogue_view import record_row
          from source_lifecycle import health_summary
          b=json.load(open('observed/normalized.json'))
          assert len(b['records'])==16 and len(b['sources'])==1
          h=health_summary(b,expected_sources=['mantera_moments'])
          assert len(h)==1 and h[0]['healthy']
          values=prepare(b)['parser_offers'];reader=[]
          for i,vals in enumerate(values,2):
            headers=SCHEMAS['parser_offers']+['Ручной комментарий']
            fields={key:({'value':value} if value!='' else {}) for key,value in zip(headers,vals+[''])}
            n=normalize_record(make_input(dict(id=vals[0],origin='parser_offers',row=i,fields=fields)),as_of=b['observed_at'][:10])
            r,reason=record_row(n,b['observed_at'][:10]);assert reason is None,(vals[0],reason)
            reader.append(r)
          out=pathlib.Path('final-evidence')
          json.dump({'records':16,'reader_accepted':len(reader),'health':h,'observation':b['observed_at'],'replay_not_new_source_read':True},open(out/'acceptance.json','w'),ensure_ascii=False,indent=2)
          missing=dict(b,sources=[],records=[])
          (out/'missing-source.json').write_text(json.dumps(missing))
          cmd=[sys.executable,'loyalty/source_lifecycle.py','--input',str(out/'missing-source.json'),'--sources','mantera_moments']
          result=subprocess.run(cmd,capture_output=True,text=True)
          assert result.returncode==1 and 'missing_source_report' in result.stdout
          (out/'missing-source-check.txt').write_text(result.stdout)
          subprocess.run([sys.executable,'loyalty/source_lifecycle.py','--input','observed/normalized.json','--sources','mantera_moments'],check=True)
          PY
      - name: Save exact accepted source code and payload identity
        run: |
          git rev-parse HEAD > final-evidence/commit.txt
          tar --exclude='__pycache__' --exclude='*.pyc' -cf final-evidence/code.tar loyalty key .github/workflows/loyalty.yml
          sha256sum observed/normalized.json > final-evidence/payload.sha256
          cp observed/normalized.json final-evidence/normalized.json
          cp observed/backit-product-probe.json final-evidence/backit-product-probe.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-partners-final-${{ github.run_id }}
          path: final-evidence/
          retention-days: 1
