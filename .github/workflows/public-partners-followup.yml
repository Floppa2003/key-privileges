name: Public partner follow-up verification
on:
  push:
    branches: ["loyalty/public-partners-followup-20260922"]
    paths: [".github/workflows/public-partners-followup.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Read public pages with bounded anonymous requests
        run: |
          python - <<'PY'
          import json, pathlib, hashlib, time
          from datetime import datetime, timezone
          from urllib.parse import urljoin, urlsplit
          import requests
          from bs4 import BeautifulSoup
          out=pathlib.Path('partner-probe');out.mkdir()
          urls={
            'sochi-park':'https://sochiparkhotel.ru/about/programma-loyalnosti/',
            'polyana':'https://krasnayapolyanaresort.ru/loyalty',
            'backit-marketplace':'https://backit.me/ru/cashback/products',
          }
          reports=[]
          for key,url in urls.items():
            r={'url':url,'observed_at':datetime.now(timezone.utc).isoformat()}
            try:
              with requests.get(url,headers={'User-Agent':'LoyaltyCatalogResearchBot/1.0'},timeout=(8,35),allow_redirects=False,stream=True) as res:
                r['status']=res.status_code
                if 300<=res.status_code<400:
                  dest=urlsplit(urljoin(url,res.headers.get('Location','')))
                  r['redirect_host']=dest.hostname;r['redirect_path']=dest.path
                if res.status_code==200:
                  raw=bytearray()
                  for chunk in res.iter_content(65536):
                    raw.extend(chunk)
                    if len(raw)>4000000:raise ValueError('oversize')
                  text=bytes(raw).decode('utf-8')
                  r['sha256']=hashlib.sha256(bytes(raw)).hexdigest()
                  soup=BeautifulSoup(text,'html.parser')
                  for bad in soup.select('script,style'):bad.decompose()
                  r['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                  r['links']=[{'text':a.get_text(' ',strip=True),'url':urljoin(url,a['href'])} for a in soup.select('a[href]') if any(t in (a.get_text(' ',strip=True)+' '+a['href']).lower() for t in ('лояль','момент','loyal','ozon','wildber','партнер','партнёр','marriott','rixos','novotel'))]
                  (out/(key+'.html')).write_text(text)
                  (out/(key+'.txt')).write_text(soup.get_text('\n',strip=True))
            except Exception as exc:r['error']=type(exc).__name__
            reports.append(r);time.sleep(1)
          (out/'report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print(json.dumps(reports,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-partners-${{ github.run_id }}
          path: partner-probe/
          retention-days: 1
