name: Coral PDF response regression
on:
  push:
    branches: ['loyalty/coral-pdf-response-20260917']
    paths: ['loyalty/**', '.github/workflows/coral-pdf-response-check.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Save exact source and portable verification dependencies
        run: |
          mkdir -p pdf-check/deps
          tar -cf pdf-check/code.tar loyalty key .github/workflows
          python -m pip download --no-deps --dest pdf-check/deps protego==0.6.2 pypdf==6.18.1
      - name: Full regressions
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee pdf-check/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee pdf-check/key-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coral-pdf-response-check-${{ github.run_id }}
          path: pdf-check/
          retention-days: 7
