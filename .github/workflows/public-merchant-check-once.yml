name: One-time public merchant evidence
on:
  push:
    branches: [diagnostics/public-frontier-20260924]
    paths: [.github/workflows/public-merchant-check-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.3
      - name: Read exact public merchant pages without accounts, forms or booking
        run: |
          python - <<'PY'
          import requests,re,json,time,hashlib
          from bs4 import BeautifulSoup
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          urls=[
            'https://ladogabaza.ru/',
            'https://academia-suites.ru/about-news/programma-loyalnosti-ekp',
            'https://www.gorodmus.ru/ekp/',
            'https://www.artparking.org/ekp/',
            'https://dk-spb.ru/news/news-company/dom-knigi-i-edinaya-karta-peterburzhtsa-zaklyuchili-partnerstvo/',
            'https://itctraining.ru/about/partnery/',
            'https://www.company.rt.ru/projects/innovations/news/d476187/'
          ]
          def now():return datetime.now(timezone.utc).isoformat()
          out={'started_at':now(),'source_accounts_used':False,'credentials_used':False,'forms_submitted':False,'production_publication':False,'requests':[]}
          pattern=re.compile(r'ЕКП|един\w*\s+карт\w*\s+петербур',re.I)
          for url in urls:
            item={'url':url,'requested_at':now()};out['requests'].append(item)
            try:
              with requests.Session() as s:
                s.trust_env=False
                with s.get(url,headers={'User-Agent':'PublicLoyaltyResearch/1.0','Accept':'text/html'},timeout=(10,25),allow_redirects=False,stream=True) as r:
                  item.update(status=r.status_code,server_date=r.headers.get('Date'),age=r.headers.get('Age'))
                  if r.status_code!=200 or r.headers.get('Retry-After'):
                    item['outcome']='non_200_or_rate_limit';continue
                  raw=bytearray();deadline=time.monotonic()+40
                  for b in r.iter_content(65536):
                    raw.extend(b)
                    if len(raw)>6000000 or time.monotonic()>deadline:raise ValueError('response_bound')
                  data=bytes(raw);item.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  soup=BeautifulSoup(data,'html.parser')
                  for n in soup.select('script,style,form,input,textarea,iframe,svg,header,footer,nav'):n.decompose()
                  blocks=[];seen=set()
                  for node in soup.find_all(string=pattern):
                    parent=node.parent
                    for ancestor in list(parent.parents):
                      if ancestor.name in ('body','html','[document]'):break
                      txt=ancestor.get_text(' ',strip=True)
                      if 200<=len(txt)<=11000:
                        parent=ancestor
                        if len(txt)>=500:break
                    txt=parent.get_text(' ',strip=True)
                    if len(txt)>14000:continue
                    digest=hashlib.sha256(txt.encode()).hexdigest()
                    if digest in seen:continue
                    seen.add(digest)
                    locator={'tag':parent.name,'id':parent.get('id'),'classes':parent.get('class',[])}
                    clone=BeautifulSoup(str(parent),'html.parser')
                    for n in clone.find_all(True):n.attrs={k:v for k,v in n.attrs.items() if k in ('id','class')}
                    blocks.append({'locator':locator,'text':txt,'sanitized_html':str(clone)})
                    if len(blocks)>=6:break
                  links=[]
                  for a in soup.select('a[href]'):
                    href=a.get('href','')
                    if 'ekp.spb.ru' in href and len(href)<300:links.append({'label':a.get_text(' ',strip=True),'href':href})
                  item.update(outcome='public_page_read',title=soup.title.get_text(' ',strip=True) if soup.title else None,ekp_blocks=blocks,program_links=links)
            except Exception as e:item.update(outcome='read_failed',error=str(e) if isinstance(e,ValueError) else type(e).__name__)
            finally:item['finished_at']=now()
            time.sleep(2)
          out['finished_at']=now();print('MERCHANT_EVIDENCE_BEGIN');print(json.dumps(out,ensure_ascii=False));print('MERCHANT_EVIDENCE_END')
          PY
