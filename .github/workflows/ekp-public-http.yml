name: EKP observed public endpoint HTTP control
on:
  push:
    branches: ["diagnostics/seven-routes-transport-20260915"]
    paths: ["diagnostics/ekp_public_http.py", ".github/workflows/ekp-public-http.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 protego==0.6.2
      - name: Read two exact anonymous public URLs and record network failures
        env:
          REPLICA: ${{ matrix.replica }}
        run: timeout --signal=TERM --kill-after=5s 100s python diagnostics/ekp_public_http.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekp-http-${{ matrix.replica }}-${{ github.run_id }}
          path: ekp-public-http-output/
          if-no-files-found: error
          retention-days: 7
