name: Deterministic parsing repair checks
on:
  push:
    branches: [fix/parsing-errors-20261105, fix/ekp-complete-upstream-20261105]
    paths: [diagnostics/parsing_source_probe.py, .github/workflows/parsing-repair-check.yml]
  pull_request:
    paths: [loyalty/**, diagnostics/parsing_source_probe.py, diagnostics/test_merchant_evidence_browser.py, diagnostics/test_source_parsing_browser.py, .github/workflows/parsing-repair-check.yml]
permissions:
  contents: read
concurrency:
  group: parsing-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-dom:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/parsing-errors-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: python -m playwright install --with-deps chromium
      - name: Preserve code identity and inspect original public DOM
        run: |
          set -euo pipefail
          mkdir -p parsing-probe-output
          git rev-parse HEAD > parsing-probe-output/commit.txt
          python diagnostics/parsing_source_probe.py parsing-probe-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parsing-source-dom-${{ github.run_id }}
          path: parsing-probe-output/
          retention-days: 14
  upstream-artifact:
    if: >-
      github.event_name == 'push' && github.repository == 'Floppa2003/key-privileges' &&
      github.ref == 'refs/heads/fix/ekp-complete-upstream-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Validate saved GitHub candidates without calling source sites
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upstream-check-output
          git rev-parse HEAD > upstream-check-output/commit.txt
          python loyalty/ekp_upstream.py select --selection upstream-check-output/selection.json | tee upstream-check-output/selection.log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.upstream.outputs.run_id }}
          artifact-ids: ${{ steps.upstream.outputs.artifact_id }}
          merge-multiple: true
          path: upstream-evidence
      - name: Revalidate the exact selected artifact and original observation time
        run: python loyalty/ekp_upstream.py validate --selection upstream-check-output/selection.json --folder upstream-evidence > upstream-check-output/validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-upstream-check-${{ github.run_id }}
          path: upstream-check-output/
          retention-days: 14
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: python -m playwright install --with-deps chromium
      - name: Full deterministic regression and real browser capture
        run: |
          set -euo pipefail
          mkdir -p parsing-test-output
          git rev-parse HEAD > parsing-test-output/commit.txt
          python -m unittest discover -s loyalty/tests -v > parsing-test-output/python.log 2>&1
          python diagnostics/test_merchant_evidence_browser.py > parsing-test-output/browser.log 2>&1
          python diagnostics/test_source_parsing_browser.py > parsing-test-output/source-browser.log 2>&1
          node --test key/refresh.test.mjs > parsing-test-output/key.log 2>&1
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parsing-regression-${{ github.run_id }}
          path: parsing-test-output/
          retention-days: 14
