name: Merchant input-loss diagnosis
on:
  push:
    branches: [loyalty/merchant-evidence-fix-20261031]
    paths: [.github/workflows/merchant-evidence-investigate.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Runtime without model keys
        run: |
          python -m pip install -r loyalty/requirements.txt > /tmp/install.log 2>&1
          python -m playwright install --with-deps chromium >> /tmp/install.log 2>&1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '41194911797'
          artifact-ids: '13041115453'
          github-token: ${{ github.token }}
          path: probe-input
          merge-multiple: true
      - name: Inspect ordinary public catalogue loading and exact native objects
        run: python diagnostics/merchant_source_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-input-diagnosis-${{ github.run_id }}
          path: source-probe/
          retention-days: 14
