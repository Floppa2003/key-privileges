name: Loyalty normalized catalog and Sheets sync
on:
  push:
    branches: ["loyalty/catalog-probe-and-sheets-sync", "loyalty/normalized-sources", "loyalty/source-expansion", "loyalty/finish-catalogs"]
    paths: ["loyalty/**", ".github/workflows/loyalty.yml"]
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum detail pages per source (1-500; coverage reported separately)
        default: "500"
        type: string
      sources:
        description: Comma-separated registered source IDs; blank keeps the complete normal scope
        default: ""
        type: string
      publish:
        description: Publish normalized offers after Google authorization
        default: false
        type: boolean
  schedule:
    - cron: "23 5 * * *"
permissions:
  contents: read
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    # Recurring collection was explicitly authorized on 2026-09-15.
    # Forks do not inherit scheduled crawling; manual/branch checks still work.
    if: github.event_name != 'schedule' || github.repository == 'Floppa2003/key-privileges'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Install generic image-PDF OCR fallback
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus
      - run: python -m playwright install --with-deps chromium
      - name: Collect public normalized offers (no Google credentials)
        env:
          PAGE_LIMIT: ${{ inputs.limit || '500' }}
          SOURCE_IDS: ${{ inputs.sources || '' }}
        run: xvfb-run -a python loyalty/collect_normalized.py --limit "$PAGE_LIMIT" --sources "$SOURCE_IDS"
      - name: Validate publication payload without access to Google
        if: always()
        run: |
          if test -f loyalty-output/normalized.json; then
            python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
          fi
      - name: Preserve public normalized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loyalty-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: loyalty-output/
          if-no-files-found: warn
          retention-days: 7
  source-health:
    needs: collect
    if: needs.collect.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 pypdf==6.18.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: loyalty-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: loyalty-output
      - name: Report source failures independently of successful-source publication
        run: python loyalty/source_lifecycle.py --input loyalty-output/normalized.json
  publish:
    needs: collect
    if: >-
      needs.collect.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      vars.LOYALTY_SHEETS_SYNC == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 pypdf==6.18.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: loyalty-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: loyalty-output
      - run: python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
      - name: Obtain a short-lived Sheets-scoped token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Upsert normalized parser tabs and verify readback
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DISCOUNTS_SPREADSHEET_ID: ${{ secrets.DISCOUNTS_SPREADSHEET_ID }}
        run: |
          python loyalty/sheets_normalized.py --input loyalty-output/normalized.json --publish
          python loyalty/unified_publish.py --publish
