name: Gemini direct migration checks
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-gemini-direct.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-gemini-direct
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve tracked integration sources, never credentials or git configuration
        run: |
          set -euo pipefail
          mkdir -p regression-output
          git rev-parse HEAD > regression-output/commit.txt
          python - <<'PY'
          import hashlib,json,subprocess,tarfile
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected=[]
          for name in paths:
              p=Path(name)
              if not name or not p.is_file() or p.is_symlink(): continue
              allowed=(name.startswith('loyalty/') and p.suffix in ('.py','.md','.txt','.json')) or name.startswith('.github/workflows/') or p.name in ('AGENTS.md','README.md','pyproject.toml') or name.startswith('key/') and p.suffix=='.mjs'
              if allowed and '/data/' not in name and '/fixtures/' not in name and p.name!='registry.json': selected.append(p)
          with tarfile.open('regression-output/integration-sources.tar.gz','w:gz') as tar:
              for p in selected: tar.add(p,arcname=str(p),recursive=False)
          hashes={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in selected}
          Path('regression-output/source-hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
      - name: Install existing pinned test dependencies
        run: python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
      - name: All regression suites without model calls or provider secrets
        run: |
          set -uo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual:$GITHUB_WORKSPACE/loyalty/experiments/simple_thinking"
          status=0
          for dir in loyalty/tests loyalty/experiments/prompt_ab loyalty/experiments/local_visual loyalty/experiments/resolution loyalty/experiments/simple_thinking loyalty/experiments/direct_think_json loyalty/experiments/cloud_json; do
            name=$(basename "$dir")
            if ! python -m unittest discover -s "$dir" -p 'test_*.py' -v > "regression-output/$name.log" 2>&1; then status=1; fi
          done
          if ! node --test key/refresh.test.mjs > regression-output/key.log 2>&1; then status=1; fi
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gemini-direct-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: regression-output/
          retention-days: 14
