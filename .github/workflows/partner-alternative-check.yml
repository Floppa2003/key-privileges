name: Check independent hotel offer indexes
on:
  push:
    branches: ['loyalty/partner-alternatives-20260918']
    paths: [.github/workflows/partner-alternative-check.yml]
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read two independent hotel indexes and at most one source-labelled RZD link each
        run: |
          python - <<'PY'
          import asyncio,hashlib,json,os,re,sys
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from free_access_probe import sanitized_page
          def now():return datetime.now(timezone.utc).isoformat()
          def sha(b):return hashlib.sha256(b).hexdigest()
          out=Path('partner-alternative-check');out.mkdir()
          roots=['https://admhotel.ru/','https://hgivolgograd.ru/special-offers/']
          audit={'run_id':os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],
                 'commit':os.environ['GITHUB_SHA'],'started_at':now(),'account_used':False,'groups':[]}
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      for root in roots:
                          group={'root':root,'pages':[]};audit['groups'].append(group)
                          async with PublicSource(browser,root) as client:
                              try:
                                  await client.robots();group['robots']=client.robots_info
                                  client.request_interval=max(client.request_interval,3)
                                  urls=[root]
                                  for url in urls:
                                      item={'url':url,'requested_at':now(),'responses':[]};group['pages'].append(item)
                                      def record(response):
                                          if response.request.is_navigation_request() and response.request.frame==client.page.main_frame:
                                              item['responses'].append({'url':response.url,'status':response.status})
                                      client.page.on('response',record)
                                      try:
                                          raw=await client.read(url,render=True)
                                          if client.page.url!=url:raise ValueError('exact_location_changed')
                                          item['source_sha256']=sha(raw.encode())
                                          dom=BeautifulSoup(raw,'html.parser')
                                          if not dom.html:raise ValueError('no_html')
                                          dom.html['data-loyalty-probe-location']=client.page.url
                                          clean,identity=sanitized_page(str(dom),url)
                                          data=clean.encode();name=sha(data)+'.html';(out/name).write_bytes(data)
                                          item.update(file=name,saved_sha256=sha(data),bytes=len(data),identity=identity)
                                          if url==root:
                                              candidates=[]
                                              for a in dom.select('a[href]'):
                                                  target=urljoin(url,a['href']);label=a.get_text(' ',strip=True)
                                                  if urlsplit(target).hostname==urlsplit(root).hostname and re.search('РЖД|RZD',label,re.I) and target not in urls+candidates:
                                                      candidates.append(target)
                                              group['rzd_links']=candidates
                                              if len(candidates)==1:urls.extend(candidates)
                                      finally:
                                          item['finished_at']=now();client.page.remove_listener('response',record)
                              except Exception as exc:
                                  group['error']=str(exc)[:180] if isinstance(exc,(RuntimeError,ValueError)) else type(exc).__name__
                                  group['robots']=getattr(client,'robots_info',{})
                  finally:await browser.close()
          try:asyncio.run(main())
          except Exception as exc:audit['failure']=type(exc).__name__
          audit['finished_at']=now();audit['successful']=sum('file' in p for g in audit['groups'] for p in g['pages'])
          (out/'audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2))
          print(json.dumps({'successful':audit['successful']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: partner-alternative-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: partner-alternative-check/
          retention-days: 7
