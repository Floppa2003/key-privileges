name: Check source-discovered Sacvoyage RZD detail
on:
  push:
    branches: ['loyalty/partner-alternatives-20260918']
    paths: [.github/workflows/partner-alternative-check.yml]
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read only the discovered hotel-owned RZD clause; no provider or destination
        run: |
          python - <<'PY'
          import asyncio,hashlib,json,os,sys
          from datetime import datetime,timezone
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from free_access_probe import sanitized_page
          def now():return datetime.now(timezone.utc).isoformat()
          def sha(b):return hashlib.sha256(b).hexdigest()
          out=Path('partner-alternative-check');out.mkdir()
          url='https://sacvoyage.ru/partners/rzhd-bonus/'
          audit={'run_id':os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'],
                 'commit':os.environ['GITHUB_SHA'],'started_at':now(),'account_used':False,
                 'discovered_in_run':'35364900578:1','parent_url':'https://sacvoyage.ru/partners/',
                 'parent_saved_sha256':'4e5a26180f3bbd49fb77e83d34fe49eada0b0d76e233d036bc188c2137654ab7',
                 'url':url,'responses':[]}
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      async with PublicSource(browser,url) as client:
                          await client.robots();audit['robots']=client.robots_info
                          client.request_interval=max(client.request_interval,3)
                          def record(response):
                              if response.request.is_navigation_request() and response.request.frame==client.page.main_frame:
                                  audit['responses'].append({'url':response.url,'status':response.status})
                          client.page.on('response',record)
                          audit['requested_at']=now()
                          raw=await client.read(url,render=True)
                          if client.page.url!=url:raise ValueError('exact_location_changed')
                          audit['source_sha256']=sha(raw.encode())
                          dom=BeautifulSoup(raw,'html.parser')
                          if not dom.html:raise ValueError('no_html')
                          dom.html['data-loyalty-probe-location']=client.page.url
                          clean,identity=sanitized_page(str(dom),url)
                          data=clean.encode();name=sha(data)+'.html';(out/name).write_bytes(data)
                          audit.update(file=name,saved_sha256=sha(data),bytes=len(data),identity=identity)
                  finally:await browser.close()
          try:asyncio.run(main())
          except Exception as exc:audit['error']=str(exc) if isinstance(exc,(RuntimeError,ValueError)) else type(exc).__name__
          audit['finished_at']=now();audit['complete']='file' in audit
          (out/'audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2))
          print(json.dumps({'complete':audit['complete'],'error':audit.get('error')}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: partner-alternative-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: partner-alternative-check/
          retention-days: 7
