name: Targeted Alfa public rules check
on:
  push:
    branches: ['loyalty/finish-catalogs']
    paths:
      - 'loyalty/alfa_public_rules.py'
      - 'loyalty/tests/test_alfa_public_rules.py'
      - 'loyalty/sources_normalized.json'
      - 'loyalty/normalized.py'
      - 'loyalty/collect_normalized.py'
      - '.github/workflows/alfa-public-rules-check.yml'
permissions:
  contents: read
concurrency:
  group: alfa-public-rules-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Unit tests
        run: python -m unittest loyalty.tests.test_alfa_public_rules -v
      - name: Live public Alfa PDF collection
        run: python loyalty/collect_normalized.py --sources alfa_only_public_rules,alfa_only_cashback_rules --limit 20 --out alfa-public-output
      - name: Validate publication payload
        run: python loyalty/sheets_normalized.py --input alfa-public-output/normalized.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-public-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-public-output/
          retention-days: 7
