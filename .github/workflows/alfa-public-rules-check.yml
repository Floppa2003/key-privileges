name: Targeted Alfa public rules check
on:
  push:
    branches: ['loyalty/finish-catalogs']
    paths:
      - 'loyalty/alfa_public_rules.py'
      - 'loyalty/tests/test_alfa_public_rules.py'
      - 'loyalty/sources_normalized.json'
      - 'loyalty/normalized.py'
      - 'loyalty/collect_normalized.py'
      - '.github/workflows/alfa-public-rules-check.yml'
permissions:
  contents: read
concurrency:
  group: alfa-public-rules-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Unit tests
        run: python -m unittest loyalty.tests.test_alfa_public_rules -v
      - name: Live public Alfa PDF collection
        run: |
          mkdir -p alfa-public-output
          python - <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          import alfa_public_rules as a
          from normalized import validate_offer
          observed=datetime.now(timezone.utc).isoformat()
          core_pdf=a.fetch_pdf(a.CORE_URL)
          core_text=a.pdf_text(core_pdf)
          for needle in ('Операция становится доступной для получения Выплаты','Получить Выплату','6.6.3.','6.7.7.','6.8.2.','Промо-баллы могут быть использованы','6.5.1.','Консьерж','SimplePrivé','Smart Reading','Страхование ВЗР','Услуга доступа к контенту'):
              i=core_text.find(needle)
              print('ALFA_CONTEXT',needle,repr(core_text[max(0,i-180):i+850] if i>=0 else 'MISSING'))
          core=a.parse_core(core_pdf,observed)
          cashback=a.parse_cashback(a.fetch_pdf(a.CASHBACK_URL),observed)
          rows=core+cashback
          for row in rows: validate_offer(row)
          bundle={'schema_version':2,'run_id':'targeted-live','observed_at':observed,'records':rows,
                  'sources':[{'source_id':'alfa_only_public_rules','name':'Alfa Only — публичные правила привилегий','root':a.CORE_URL,
                              'status':'ok','discovered':len(core),'normalized':len(core),'failed':0,'coverage':'targeted_live_core47','region':None,'errors':[],'observed_at':observed},
                             {'source_id':'alfa_only_cashback_rules','name':'Alfa Only — публичные лимиты кэшбэка','root':a.CASHBACK_URL,
                              'status':'ok','discovered':len(cashback),'normalized':len(cashback),'failed':0,'coverage':'targeted_live_cashback101','region':None,'errors':[],'observed_at':observed}]}
          Path('alfa-public-output/normalized.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2))
          print(json.dumps({'core':len(core),'cashback':len(cashback),'total':len(rows)}))
          PY
      - name: Validate publication payload
        run: python loyalty/sheets_normalized.py --input alfa-public-output/normalized.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-public-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: alfa-public-output/
          retention-days: 7
