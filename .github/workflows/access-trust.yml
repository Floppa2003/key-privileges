name: Public TLS trust experiment
on:
  push:
    branches: [diagnostics/access-options-20260914]
    paths: [diagnostics/tls_trust_check.py, .github/workflows/access-trust.yml]
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - run: python -m py_compile diagnostics/access_check.py diagnostics/tls_trust_check.py
      - run: python diagnostics/tls_trust_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: access-trust-${{ github.run_id }}
          path: |
            trust-output/
            diagnostics/tls_trust_check.py
          retention-days: 7
          if-no-files-found: warn
