name: GreatList one-time queue cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/greatlist-queue-cleanup.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.repository == 'Floppa2003/key-privileges'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel exactly the incidental PR71 Aeroflot collection before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='Floppa2003/key-privileges'
          run='35434051076'
          gh api "repos/$repo/actions/runs/$run" > run.json
          gh api "repos/$repo/actions/runs/$run/jobs?per_page=100" > jobs.json
          python - <<'PY'
          import json
          r=json.load(open('run.json'));j=json.load(open('jobs.json'))['jobs']
          assert r['id']==35434051076 and r['head_sha']=='5b3357040c867513f03b114e2df998eb2797e466'
          assert r['event']=='push' and r['head_branch']=='main' and r['path']=='.github/workflows/aeroflot-import.yml'
          assert r['status'] in ('queued','pending','in_progress'), 'run already completed; no cancellation'
          assert not any(x['name']=='publish' and x['status'] not in ('queued','pending') for x in j), 'publication started; do not interrupt'
          print('exact incidental run verified; publication has not started')
          PY
          gh api --method POST "repos/$repo/actions/runs/$run/cancel"
          echo 'Cancellation requested for only run35434051076; independently verify its terminal state.'
