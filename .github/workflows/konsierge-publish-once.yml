name: Publish verified Konsierge capture once
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/konsierge-publish-once.yml']
permissions: {contents: read}
concurrency:
  group: loyalty-catalog-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Validate unchanged code and exact accepted public payload before Google access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p konsierge-public
          python - <<'PY'
          import hashlib,io,json,os,sys,zipfile
          from pathlib import Path
          import requests
          sys.path.insert(0,'loyalty')
          from sheets_normalized import prepare
          u='https://api.github.com/repos/Floppa2003/key-privileges/actions/artifacts/10590009353/zip'
          r=requests.get(u,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'},timeout=25,allow_redirects=False)
          assert r.status_code==302 and r.headers['Location'].startswith('https://')
          r=requests.get(r.headers['Location'],timeout=35);r.raise_for_status();raw=r.content
          assert hashlib.sha256(raw).hexdigest()=='81521cb24f290317bc0221e85aeac205ee12ccb8fc064efa43f91b6c92390ec5'
          z=zipfile.ZipFile(io.BytesIO(raw));assert z.testzip() is None
          hashes=json.loads(z.read('code_hashes.json'))
          for p,sha in hashes.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha,p
          b=json.loads(z.read('normalized.json'));assert b['run_id']=='35463931323:1' and len(b['records'])==159
          assert b['observed_at']=='2026-09-19T19:18:49.862699+00:00'
          assert {r['source_id'] for r in b['records']}=={'konsierge_public'}
          assert b['sources'][0]['status']=='ok' and b['sources'][0]['failed']==0
          prepare(b)
          Path('konsierge-public/normalized.json').write_bytes(z.read('normalized.json'))
          Path('konsierge-public/code_hashes.json').write_bytes(z.read('code_hashes.json'))
          print(json.dumps({'source_run':b['run_id'],'source_observed_at':b['observed_at'],'records':159,'code_hashes_verified':True,'payload_sha256':hashlib.sha256(z.read('normalized.json')).hexdigest()}))
          PY
          python -m unittest discover -s loyalty/tests -v > konsierge-public/tests.log 2>&1
          tail -5 konsierge-public/tests.log
          node --test key/refresh.test.mjs > konsierge-public/key-tests.log 2>&1
          tail -8 konsierge-public/key-tests.log
          git rev-parse HEAD > konsierge-public/execution-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: konsierge-public-${{ github.run_id }}
          path: konsierge-public/
          retention-days: 7
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.LOYALTY_SHEETS_SYNC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3 pypdf==6.18.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: konsierge-public-${{ github.run_id }}
          path: konsierge-public
      - run: python loyalty/sheets_normalized.py --input konsierge-public/normalized.json
      - name: Obtain short-lived existing Sheets authorization
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish only accepted source and rebuild common views with readback
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DISCOUNTS_SPREADSHEET_ID: ${{ secrets.DISCOUNTS_SPREADSHEET_ID }}
        run: |
          python loyalty/sheets_normalized.py --input konsierge-public/normalized.json --publish
          python loyalty/unified_publish.py --publish --as-of 2026-09-19
