name: Build merchant evidence fix
on:
  push:
    branches: [loyalty/merchant-evidence-fix-20261031]
    paths: [.github/workflows/merchant-evidence-build.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies without model credentials
        run: |
          mkdir -p evidence-build
          python -m pip install -r loyalty/requirements.txt > evidence-build/install.log 2>&1
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils >> evidence-build/install.log 2>&1
          python -m playwright install --with-deps chromium >> evidence-build/install.log 2>&1
      - name: Apply exact source transformation
        run: |
          git rev-parse HEAD > evidence-build/base.txt
          python diagnostics/apply_merchant_evidence_fix.py
          git diff --check
          git diff > evidence-build/patch.diff
      - name: Previously failing source handoff tests
        run: python -m unittest discover -s loyalty/tests -p 'test_merchant_evidence.py' -v > evidence-build/contracts.log 2>&1
      - name: Chromium source identity and completeness tests
        run: python diagnostics/test_merchant_input_browser.py -v > evidence-build/browser.log 2>&1
      - name: Full Python regression
        run: python -m unittest discover -s loyalty/tests -v > evidence-build/python.log 2>&1
      - name: KEY regression
        run: node --test key/refresh.test.mjs > evidence-build/key.log 2>&1
      - name: Read actual results and preserve executed sources
        if: always()
        run: |
          for f in evidence-build/contracts.log evidence-build/browser.log evidence-build/python.log evidence-build/key.log; do test ! -f "$f" || { echo "=== $f ==="; tail -55 "$f"; }; done
          mkdir -p evidence-build/code
          cp loyalty/merchant_queue.py loyalty/merchant_extract.py loyalty/merchant_evidence.py loyalty/merchant_konsierge_capture.py evidence-build/code/
      - name: Commit only tested source transformations and verify branch readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- loyalty/merchant_queue.py loyalty/merchant_extract.py loyalty/merchant_evidence.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: retain full source evidence and recover unscoped negative results'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/loyalty/merchant-evidence-fix-20261031
          expected=$(git rev-parse HEAD)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin refs/heads/loyalty/merchant-evidence-fix-20261031
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          echo "$expected" > evidence-build/tested-commit.txt
          echo "Verified tested source commit: $expected"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-evidence-build-${{ github.run_id }}
          path: evidence-build/
          retention-days: 30
