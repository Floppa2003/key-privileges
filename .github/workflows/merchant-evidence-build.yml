name: Build verified merchant evidence repair
on:
  push:
    branches: [loyalty/full-offer-inputs-20261031]
    paths: [.github/workflows/merchant-evidence-build.yml]
permissions:
  contents: read
concurrency:
  group: merchant-evidence-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/loyalty/full-offer-inputs-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install bounded test runtime without provider credentials
        run: |
          set -euo pipefail
          mkdir -p repair-output/code
          git rev-parse HEAD > repair-output/base.txt
          python -m pip install -r loyalty/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          python -m playwright install --with-deps chromium
      - name: Observe browser regression on original capture
        run: |
          set -uo pipefail
          python diagnostics/test_merchant_evidence_browser.py > repair-output/browser-red.log 2>&1
          rc=$?
          cat repair-output/browser-red.log
          test "$rc" -ne 0
          grep -q 'Ran 3 tests' repair-output/browser-red.log
      - name: Apply exactly scoped production changes
        run: python diagnostics/apply_merchant_evidence_repair.py
      - name: Verify all source and state contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s loyalty/tests -p 'test_merchant_evidence*.py' -v > repair-output/contracts.log 2>&1
          python diagnostics/test_merchant_evidence_browser.py > repair-output/browser-green.log 2>&1
          python -m unittest discover -s loyalty/tests -v > repair-output/python.log 2>&1
          node --test key/refresh.test.mjs > repair-output/key.log 2>&1
      - name: Commit verified production files without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- loyalty/merchant_queue.py loyalty/merchant_extract.py
          git diff --cached > repair-output/production.patch
          git commit -m 'fix: carry complete source records to LLM and reject incomplete-source negatives'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/loyalty/full-offer-inputs-20261031
          expected=$(git rev-parse HEAD)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin refs/heads/loyalty/full-offer-inputs-20261031
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          echo "Verified committed source: $expected"
          echo "$expected" > repair-output/commit.txt
      - name: Preserve actual results and sources
        if: always()
        run: |
          for f in repair-output/*.log; do echo "=== $f ==="; tail -80 "$f"; done
          cp loyalty/merchant_{queue,extract,evidence}.py repair-output/code/
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('repair-output')
          (root/'SHA256SUMS.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-evidence-build-${{ github.run_id }}
          path: repair-output/
          retention-days: 30
