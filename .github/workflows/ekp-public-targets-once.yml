name: Check remaining EKP public references once
on:
  push:
    branches: ['loyalty/public-gap-completion-20260918']
    paths: [.github/workflows/ekp-public-targets-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ekp-public-targets-once
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '35070130567'
          name: ekp-public-35070130567-2
          path: parent
      - name: Search public posts for source-derived remaining identities only
        run: |
          python - <<'PY'
          import asyncio,copy,hashlib,json,re,sys,time
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib.parse import urlencode,urlsplit
          sys.path.insert(0,'loyalty')
          from playwright.async_api import async_playwright
          from bs4 import BeautifulSoup
          from public_transport import PublicSource,check_response
          from announcements import own_message_parts,caption_text,NUMERIC_BENEFIT
          from normalized import canonical_url,validate_offer
          def now():return datetime.now(timezone.utc).isoformat()
          def sha(x):return hashlib.sha256(x).hexdigest()
          files=list(Path('parent').rglob('normalized.json'));assert len(files)==1
          raw=files[0].read_bytes();parent=json.loads(raw)
          assert 0 <= (datetime.now(timezone.utc)-datetime.fromisoformat(parent['observed_at'])).total_seconds() < 604800
          targets={}
          for r in parent['records']:
              validate_offer(r)
              if r['source_id']!='ekp' or r['source_status']!='public_catalog_details_require_login':continue
              d=r['details'];assert d.get('protected_terms_retained') is False
              p=d['public_partner'];ident=str(p['id']);name=p['name']
              assert re.fullmatch('[0-9]+',ident) and 1<=len(name)<=160
              assert p['description_authorized'] is True and 'description' not in p
              targets.setdefault(name,[]).append(ident)
          assert 1<=len(targets)<=120
          out=Path('ekp-public-targets');out.mkdir();(out/'pages').mkdir()
          audit={'parent_sha256':sha(raw),'parent_observed_at':parent['observed_at'],'started_at':now(),'targets':targets,'reads':[],'matches':{},'scope':'one_public_search_page_per_remaining_partner_name','complete':False,'source_account_used':False}
          def checkpoint():
              (out/'audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2))
          def save_page(raw,url):
              soup=BeautifulSoup(raw,'html.parser');doc=BeautifulSoup('<html><head><title>EKP public search evidence</title></head><body></body></html>','html.parser')
              doc.html['data-loyalty-probe-location']=url
              for node in soup.select('.tgme_widget_message[data-post]'):
                  clone=copy.deepcopy(node)
                  for n in clone.select('script,style,form,input,textarea,iframe,svg,img,video,audio'):n.decompose()
                  for n in [clone]+clone.find_all(True):
                      n.attrs={k:v for k,v in n.attrs.items() if k in ('class','data-post','datetime','href')}
                      if n.has_attr('href'):
                          try:n['href']=canonical_url(n['href'])
                          except (ValueError,TypeError):del n['href']
                  doc.body.append(clone)
              if not doc.select('.tgme_widget_message[data-post]'):raise ValueError('no_owned_public_posts')
              return str(doc)
          async def main():
              started=time.monotonic()
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  async with PublicSource(browser,'https://t.me/s/ekpcard') as source:
                      await source.robots();audit['robots']=source.robots_info
                      for i,(name,ids) in enumerate(sorted(targets.items())):
                          if time.monotonic()-started>720: audit['stop_reason']='time_bound';break
                          url='https://t.me/s/ekpcard?'+urlencode({'q':name});item={'query':name,'target_ids':ids,'url':url,'requested_at':now()};audit['reads'].append(item)
                          try:
                              source.check_url(url);await asyncio.sleep(max(2,source.request_interval))
                              status,raw=await source.navigate(url);item.update(status=status,final_url=source.page.url)
                              check_response(status,raw)
                              if source.page.url!=url:raise ValueError('changed_public_search_location')
                              if len(raw.encode())>6000000:raise ValueError('response_bound')
                              original=BeautifulSoup(raw,'html.parser');item['has_more_results']=bool(original.select_one('a.tme_messages_more'))
                              safe=save_page(raw,url);data=safe.encode();path=f'pages/{i:03d}.html';(out/path).write_bytes(data)
                              item.update(file=path,sha256=sha(data),read_at=now(),matched_posts=[])
                              soup=BeautifulSoup(safe,'html.parser')
                              for node in soup.select('.tgme_widget_message[data-post]'):
                                  native=node['data-post']
                                  if not re.fullmatch(r'ekpcard/[0-9]+',native) or node.select_one('.tgme_widget_message_forwarded_from'):continue
                                  try:parts=own_message_parts(node,'ekpcard')
                                  except ValueError:continue
                                  if not parts:continue
                                  cap=BeautifulSoup(''.join(str(n) for _,n in parts),'html.parser');body='\n\n'.join(caption_text(n) for _,n in parts)
                                  links=[];linked=[]
                                  for a in cap.select('a[href]'):
                                      u=urlsplit(a['href']);m=re.fullmatch(r'/capabilities/loyalty/tiles/([0-9]+)/?',u.path)
                                      if u.hostname in ('ekp.spb.ru','www.ekp.spb.ru') and m:
                                          links.append({'url':a['href'],'label':a.get_text(' ',strip=True)});linked.append(m[1])
                                  if not set(linked)&set(ids):continue
                                  clock=node.select_one('.tgme_widget_message_date time[datetime]')
                                  if not clock:continue
                                  published=datetime.fromisoformat(clock['datetime'].replace('Z','+00:00'))
                                  if published.tzinfo is None or published>datetime.now(timezone.utc):continue
                                  hit={'native_id':native,'source_url':'https://t.me/'+native,'published_at':published.isoformat(),'body':body,'linked_cards':links,'has_numeric_or_code_mention':bool(NUMERIC_BENEFIT.search(body))}
                                  audit['matches'].setdefault(native,{'versions':[],'read_indices':[]})
                                  entry=audit['matches'][native]
                                  if hit not in entry['versions']:entry['versions'].append(hit)
                                  entry['read_indices'].append(i);item['matched_posts'].append(native)
                          except Exception as exc:
                              reason=str(exc) if isinstance(exc,(RuntimeError,ValueError)) else type(exc).__name__
                              item['error']=reason[:180]
                              if '429' in reason or 'access_challenge' in reason or 'robots_' in reason or 'unexpected_redirect' in reason:
                                  audit['stop_reason']='explicit_source_boundary';checkpoint();break
                          finally:item['finished_at']=now();checkpoint()
                      else:audit['complete']=True
                  await browser.close()
              audit['finished_at']=now();checkpoint()
              print(json.dumps({'queries':len(audit['reads']),'matched_posts':len(audit['matches']),'complete':audit['complete']}))
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-public-targets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ekp-public-targets/
          retention-days: 7
