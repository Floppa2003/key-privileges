name: Independent public Reader diagnostics
on:
  push:
    branches: [loyalty/finish-catalogs]
    paths: [.github/workflows/reader-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Read only seven allowlisted public URLs; no account or paid API key
        run: |
          python - <<'PY'
          import json,time,concurrent.futures
          from pathlib import Path
          import requests
          targets={
            'ekp':'https://ekp.spb.ru/capabilities/loyalty/',
            'coral':'https://coralbonus.ru/klub-privilegii/',
            'coral_detail':'https://coralbonus.ru/klub-privilegii/zdorov-e/medsi/',
            'rzd':'https://www.rzd-bonus.ru/?accessible=true',
            'aeroflot':'https://www.aeroflot.ru/ru-ru/afl_bonus/partners',
            'nordwind':'https://nordwindairlines.ru/ru/club/partnerlist',
            'loyals':'https://loyals.ru/'}
          out=Path('reader-results');out.mkdir()
          headers={'X-Robots-Txt':'LoyaltyCatalogResearchBot','X-No-Cache':'true','X-Proxy':'none','DNT':'1','Accept':'application/json'}
          def inspect(item):
            name,url=item; report={'source':name,'url':url,'transport':'anonymous_jina_reader','freshness':'uncertified_reader_response'}
            try:
              r=requests.get('https://r.jina.ai/'+url,headers=headers,timeout=(10,70))
              report['status']=r.status_code
              if len(r.content)>6000000:raise ValueError('response_too_large')
              (out/(name+'.txt')).write_text(r.text,encoding='utf8')
              report['bytes']=len(r.content)
            except Exception as exc:report['error']=type(exc).__name__
            return report
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as executor:
            reports=list(executor.map(inspect,targets.items()))
          (out/'report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(reports,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-reader-${{ github.run_id }}
          path: reader-results/
          retention-days: 7
