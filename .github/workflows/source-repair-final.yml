name: Final source-repair verification
on:
  push:
    branches: ['loyalty/source-repair-20260918']
    paths: [.github/workflows/source-repair-final.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Regression before routing and the exact two-line dispatch addition
        run: |
          mkdir -p repair-final
          set +e
          python -m unittest discover -s loyalty/tests -p test_alfa_access.py -v >repair-final/before.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q AssertionError repair-final/before.log
          python - <<'PY'
          from pathlib import Path
          p=Path('loyalty/collect_normalized.py');raw=p.read_text()
          old='from hse_alumni import collect_hse\n'
          assert raw.count(old)==1 and 'from alfa_access import' not in raw
          raw=raw.replace(old,old+'from alfa_access import collect_access as collect_alfa_access\n')
          old="        elif cfg['id']=='utair':records=await collect_utair(cfg,report,now,limit)\n"
          assert raw.count(old)==1
          p.write_text(raw.replace(old,old+"        elif cfg['id']=='alfa_only_partner_offers':await collect_alfa_access(cfg,report)\n"))
          PY
      - name: Complete regression suite and exact proposed code
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee repair-final/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee repair-final/key-tests.log
          tar -cf repair-final/code.tar loyalty key .github/workflows
      - run: python -m playwright install --with-deps chromium
      - name: Fresh minimal source check, no repeat of the completed Mir catalogue
        run: |
          python loyalty/collect_normalized.py --sources hse_alumni,t2_selection,alfa_only_partner_offers --out repair-final/live-output
          python loyalty/sheets_normalized.py --input repair-final/live-output/normalized.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('repair-final/live-output/normalized.json').read_text())
          h=[r for r in b['records'] if r['source_id']=='hse_alumni'];assert len(h)==55
          assert sum(r['record_kind']=='partner_offer' for r in h)==52
          k=next(r for r in h if r['native_id']=='anchor:kvadrat');p=next(r for r in h if r['native_id']=='anchor:mordapechat')
          assert 'hello@modoband.ru' not in k['conditions_text'] and 'hello@modoband.ru' in p['conditions_text']
          assert p['rates'][0]['value']=='15' and k['rates'][0]['value']=='10'
          alfa=next(s for s in b['sources'] if s['source_id']=='alfa_only_partner_offers')
          assert alfa['normalized']==0 and alfa['status']=='failed'
          assert not any(r['source_id']=='alfa_only_partner_offers' for r in b['records'])
          # Network access is independently reported, not a precondition for testing the handler.
          # Do not replace a real connection failure with the earlier successful auth redirect.
          allowed={'alfa_bank_authentication_redirect','alfa_probe_transport_failed','alfa_certificate_verification_failed','official_ca_unavailable','official_ca_rate_limited','alfa_rate_limited','alfa_head_200_catalogue_body_not_read','alfa_unexpected_redirect_not_followed'}
          assert alfa['errors'][0]['reason'] in allowed,alfa['errors']
          if alfa['coverage']!='not_collected':
              access=json.loads(alfa['coverage']);assert access['tls_verified'] and not access['catalogue_collected'] and not access['account_used']
          (Path('repair-final')/'acceptance.json').write_text(json.dumps({'hse_details':52,'hse_previews':3,'alfa_actual_error':alfa['errors'],'alfa_cashback_collected':False},ensure_ascii=False,indent=2))
          PY
      - name: Commit only tested routing to the existing review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/loyalty/source-repair-20260918'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty/collect_normalized.py
          git commit -m 'Route Alfa availability through verified bank-scoped TLS without reading account data'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/loyalty/source-repair-20260918
          git rev-parse HEAD >repair-final/proposed-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-repair-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: repair-final/
          retention-days: 7
