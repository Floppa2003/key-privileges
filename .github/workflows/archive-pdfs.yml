name: Preserve public PDF originals in main
on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
    outputs:
      commit_sha:
        description: Main commit whose captured PDF bytes passed remote readback
        value: ${{ jobs.archive.outputs.commit_sha }}
permissions:
  contents: read
jobs:
  archive:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.archive.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_name }}
          path: archive-input
      - name: Commit immutable PDF bytes and independently verify main
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python loyalty/archive_publish.py --input archive-input/source-documents
