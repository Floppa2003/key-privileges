name: Public programme-link depth diagnostic
on:
  push:
    branches: ['diagnostics/linked-conditions-20260917']
    paths: [diagnostics/linked_conditions_depth.py, .github/workflows/linked-conditions-depth.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 35232079161
          name: linked-conditions-probe-35232079161
          path: prior
      - run: python diagnostics/linked_conditions_depth.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linked-conditions-depth-${{ github.run_id }}
          path: linked-depth-output/
          retention-days: 7
