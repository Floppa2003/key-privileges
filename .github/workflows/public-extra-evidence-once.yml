name: One-time additional public alternatives
on:
  push:
    branches: [diagnostics/public-frontier-20260924]
    paths: [.github/workflows/public-extra-evidence-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: python -m pip install --quiet requests==2.32.5 beautifulsoup4==4.14.3
      - name: Verify source-owned public clauses, stop on refusal
        run: |
          python - <<'PY'
          import requests,json,hashlib,re,time
          from datetime import datetime,timezone
          from bs4 import BeautifulSoup
          def now():return datetime.now(timezone.utc).isoformat()
          urls=['https://ilocked.ru/quest/brawl-stars','https://mb10.ru/news/vygodnye-pokupki-v-papiruse-po-yekp-karelskaya-/','https://artstudionevsky.ru/','https://benefits.konsierge.com/']
          out={'started_at':now(),'source_account_used':False,'credentials_used':False,'forms_submitted':False,'production_publication':False,'requests':[]}
          for url in urls:
            row={'url':url,'requested_at':now()};out['requests'].append(row)
            try:
              with requests.Session() as s:
                s.trust_env=False
                with s.get(url,headers={'User-Agent':'PublicLoyaltyResearch/1.0'},allow_redirects=False,stream=True,timeout=(8,20)) as r:
                  row.update(status=r.status_code,server_date=r.headers.get('Date'),cache_age=r.headers.get('Age'))
                  if r.status_code!=200 or r.headers.get('Retry-After'):
                    row['outcome']='non_200_no_follow_or_retry';continue
                  raw=bytearray();deadline=time.monotonic()+30
                  for b in r.iter_content(65536):
                    raw.extend(b)
                    if len(raw)>6000000 or time.monotonic()>deadline:raise ValueError('response_bound')
                  data=bytes(raw);row.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  soup=BeautifulSoup(data,'html.parser')
                  for n in soup.select('script,style,form,input,textarea,iframe,nav,header,footer,svg'):n.decompose()
                  blocks=[]
                  for node in soup.find_all(string=re.compile(r'ЕКП|Един\w*\s+Карт\w*\s+Петербур',re.I)):
                    parent=node.parent
                    for ancestor in parent.parents:
                      if ancestor.name in ('html','body','[document]'):break
                      txt=ancestor.get_text(' ',strip=True)
                      if 150<=len(txt)<=4500:parent=ancestor;break
                    txt=parent.get_text(' ',strip=True)
                    if len(txt)<=6000 and txt not in blocks:blocks.append(txt)
                    if len(blocks)>=6:break
                  row.update(outcome='public_page_read',title=soup.title.get_text(' ',strip=True) if soup.title else None,ekp_text_blocks=blocks)
            except Exception as e:row.update(outcome='read_failed',error=str(e) if isinstance(e,ValueError) else type(e).__name__)
            finally:row['finished_at']=now()
            time.sleep(2)
          out['finished_at']=now();print('EXTRA_PUBLIC_BEGIN');print(json.dumps(out,ensure_ascii=False));print('EXTRA_PUBLIC_END')
          PY
