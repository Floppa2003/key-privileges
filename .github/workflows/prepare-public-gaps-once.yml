name: Prepare reviewed public gap additions once
on:
  push:
    branches: ['loyalty/public-gap-completion-20260918']
    paths: [.github/workflows/prepare-public-gaps-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt jsonschema==4.26.0
      - name: Apply the reviewed patch and demonstrate the missing practical fields
        run: |
          mkdir public-gap-tests
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          p=Path('loyalty/public-gap-update.patch')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='05e5b2438f99e342830cc1c4a41a064a5b8d8d482697e0b6ee0229c5f0a3fbcd'
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          module=Path('loyalty/partner_pages.py');updated=module.read_bytes()
          try:
              module.write_bytes(subprocess.check_output(['git','show','HEAD:loyalty/partner_pages.py']))
              r=subprocess.run(['python','-m','unittest','discover','-s','loyalty/tests','-p','test_public_gap_partner_pages.py','-v'],capture_output=True,text=True)
              Path('public-gap-tests/before.log').write_text(r.stdout+r.stderr)
              assert r.returncode!=0 and 'article_published_at' in r.stderr and 'AssertionError' in r.stderr
          finally:module.write_bytes(updated)
          PY
      - name: Complete regression and schema validation without source credentials
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee public-gap-tests/python-tests.log
          node --test key/refresh.test.mjs 2>&1 | tee public-gap-tests/key-tests.log
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          Draft202012Validator.check_schema(json.load(open('loyalty/unified.schema.json')))
          PY
      - name: Retain only the tested changes on the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/loyalty/public-gap-completion-20260918'
          rm .github/workflows/public-gap-probe-once.yml .github/workflows/ekp-public-targets-once.yml .github/workflows/prepare-public-gaps-once.yml loyalty/public-gap-update.patch
          git add loyalty/partner_pages.json loyalty/sources_normalized.json loyalty/partner_pages.py loyalty/source_selection.py loyalty/collect_normalized.py loyalty/request.sh .github/workflows/loyalty.yml .github/workflows/loyalty-request.yml loyalty/tests/test_public_gap_partner_pages.py loyalty/tests/test_public_gap_selection.py
          git add -u .github/workflows loyalty/public-gap-update.patch
          git diff --cached --stat > public-gap-tests/change-stat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add source-bound EKP partner terms and explicit registered-source refreshes'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/loyalty/public-gap-completion-20260918
          git rev-parse HEAD > public-gap-tests/proposed-commit.txt
          tar -cf public-gap-tests/code.tar loyalty key .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-gap-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-gap-tests/
          retention-days: 7
