name: Review live value guards
on:
  push:
    branches: [loyalty/live-identity-guards]
    paths: [loyalty/**, .github/workflows/live-guards-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: mkdir -p review-output
      - run: python -m pip install -r loyalty/requirements.txt jsonschema==4.25.1
      - name: Verify and materialize exact reviewed changes
        run: |
          python loyalty/materialize_live_guards.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loyalty
          git commit -m 'fix: separate source identity from changing offer values'
          git push origin HEAD:loyalty/live-identity-guards
      - name: Run complete synthetic regression suite
        run: |
          set -o pipefail
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee review-output/python-tests.log
          node --test key/refresh.test.mjs | tee review-output/key-tests.log
      - run: python -m playwright install --with-deps chromium
      - name: Exercise changed source routes
        run: |
          python - <<'PY'
          import sys,asyncio,json,os
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from collect_normalized import one,source_budget,bounded_source
          from playwright.async_api import async_playwright
          from sheets_normalized import prepare
          from jsonschema import validate
          ids={'af_askona','ekp_sfera_rules','rgo_headquarters_rules','t2_mixx_rules','utair_family_rules','smartavia_rules','mir_101_rules','mir_aeroexpress_rules','promomiles_otello_rules','ural_carsgo_rules','af_vtb_rules','azimut_earning_rules'}
          cfgs=[c for c in json.loads(Path('loyalty/sources_normalized.json').read_text()) if c['id'] in ids]
          assert {c['id'] for c in cfgs}==ids
          now=datetime.now(timezone.utc).isoformat()
          async def run():
              async with async_playwright() as p:
                  browser=await p.chromium.launch();sem=asyncio.Semaphore(3)
                  try:return await asyncio.gather(*(bounded_source(lambda c=c:one(browser,c,now,500),sem,source_budget(c)) for c in cfgs))
                  finally:await browser.close()
          result=asyncio.run(run());records=[r for _,rows in result for r in rows];reports=[r for r,_ in result]
          data={'schema_version':2,'run_id':os.environ['GITHUB_RUN_ID']+':1','observed_at':now,'records':records,'sources':reports}
          Path('review-output/normalized.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          schema=json.loads(Path('loyalty/offer.schema.json').read_text())
          for r in records:validate(r,schema)
          prepare(data)
          print(json.dumps({'records':len(records),'sources':[{'id':r['source_id'],'status':r['status'],'count':r['normalized'],'errors':r['errors']} for r in reports]},ensure_ascii=False))
          if any(r['status']!='ok' for r in reports):raise SystemExit('A live source did not fully pass; inspect artifact before integration.')
          PY
      - name: Preserve executed code and diagnostics
        if: always()
        run: |
          tar --exclude=.git --exclude=review-output --exclude='__pycache__' -cf review-output/code.tar .
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=list(Path('loyalty').glob('*.py'))+list(Path('loyalty').glob('*.json'))+list(Path('loyalty/tests').glob('*.py'))
          Path('review-output/code-hashes.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-guards-review-${{ github.run_id }}
          path: review-output/
          retention-days: 7
