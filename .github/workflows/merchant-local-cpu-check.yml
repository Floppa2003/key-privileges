name: Local visual CPU extraction test
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-local-cpu-check.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-local-cpu-check
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '16384'
      CUDA_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test and preserve exact execution code
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p cpu-result/code
          git rev-parse HEAD > cpu-result/commit.txt
          cp loyalty/experiments/local_visual/*.py cpu-result/code/
          cp .github/workflows/merchant-local-cpu-check.yml cpu-result/workflow.yml
          lscpu > cpu-result/cpu.txt
          free -b > cpu-result/memory-before.txt
          python -m pip install -r loyalty/requirements.txt jsonschema==4.26.0 PyMuPDF==1.26.7 psutil==7.0.0 Pillow==12.3.0
          python -m unittest discover -s loyalty/tests -v > cpu-result/tests-existing.log 2>&1
          python -m unittest discover -s loyalty/experiments/local_visual -p 'test_*.py' -v > cpu-result/tests-probe.log 2>&1
          node --test key/refresh.test.mjs > cpu-result/tests-key.log 2>&1
      - name: Read the exact existing public capture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36288278400'
          artifact-ids: '10921671754'
          github-token: ${{ github.token }}
          path: source-capture
          merge-multiple: true
      - name: Install checksum-verified Ollama release without root
        run: |
          curl --fail --location --max-time 300 https://github.com/ollama/ollama/releases/download/v0.34.4/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          echo "c238986e61d40c0cc5f4a9b9e40b9eea104350b77efa34741fc134e105cb9533  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
      - name: Start loopback-only service and download one local model
        timeout-minutes: 10
        run: |
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          "$RUNNER_TEMP/ollama/bin/ollama" serve > cpu-result/ollama.log 2>&1 &
          echo "$!" > cpu-result/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/version > cpu-result/version.json; then break; fi
            sleep 1
          done
          timeout 480 "$RUNNER_TEMP/ollama/bin/ollama" pull qwen3.5:4b > cpu-result/pull.log 2>&1
      - name: One reduced-image request for timed-out source, same prompt and text
        run: |
          python loyalty/experiments/local_visual/resized_retry.py --source source-capture --out cpu-result --server-pid "$(cat cpu-result/server.pid)" > cpu-result/probe.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: merchant-local-cpu-${{ github.run_id }}
          path: cpu-result/
          retention-days: 1
