name: Investigate remaining public catalogue access
on:
  push:
    branches: [diagnostics/public-frontier-20260915]
    paths: [diagnostics/public_frontier.py, .github/workflows/public-frontier.yml]
permissions:
  contents: read
jobs:
  access:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.3
      - run: python -m py_compile diagnostics/public_frontier.py
      - run: python diagnostics/public_frontier.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontier-${{ matrix.os }}-${{ github.run_id }}
          path: frontier-output/
          retention-days: 7
