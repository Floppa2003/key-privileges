# One-time checksum-bound public-code transport; no Google credentials.
# Workflow changes and removal are performed separately by the authorized app.
name: Apply tested loyalty expansion and verify sources
on:
  push:
    branches: [loyalty/source-expansion]
    paths: [loyalty/transport/**, .github/workflows/loyalty-apply.yml]
permissions:
  contents: read
concurrency:
  group: loyalty-expansion-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/loyalty/source-expansion'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply only the checksum-verified public-code patch
        run: |
          python - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,zlib
          root=pathlib.Path('loyalty/transport')
          data=''.join((root/f'{i:02}.b64').read_text().strip() for i in range(4))
          patch=zlib.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='560b7c926cca1630b18d2e24ae70f7f074e7582dcc1e2a53b72f8611203ce23a'
          p=pathlib.Path('/tmp/loyalty-public-code.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          manifest=json.loads((root/'manifest.json').read_text())
          for name,expected in manifest.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          changed=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          assert all(line[3:] in manifest for line in changed),changed
          subprocess.run(['git','add','--',*manifest],check=True)
          print('All 12 transported production/test/document files match local SHA256.')
          PY
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Commit code without modifying workflow files
        id: commit
        run: |
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git rm -r -- loyalty/transport
          git rm -- loyalty/inspect_sources.py loyalty/inspection_targets.json
          if git diff --cached --name-only | grep '^.github/workflows/'; then
            echo 'Unexpected workflow change; refusing token-scope violation.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: expand normalized loyalty sources and harden mileage/date extraction'
          git push origin HEAD:refs/heads/loyalty/source-expansion
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  collect:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python loyalty/collect_normalized.py --limit 200
      - run: python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
      - name: Preserve public output without any Google credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loyalty-expanded-${{ github.run_id }}
          path: loyalty-output/
          retention-days: 7
          if-no-files-found: warn
