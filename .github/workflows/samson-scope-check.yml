name: Inspect source-linked Samson exclusions
on:
  push:
    branches: ['loyalty/samson-linked-20260918']
    paths: [.github/workflows/samson-scope-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Inspect one linked page after robots, no redirects or retries
        run: |
          python - <<'PY'
          import hashlib,json,re,time
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urljoin,urlsplit
          import requests
          from bs4 import BeautifulSoup
          from protego import Protego
          folder=Path('samson-inspection');folder.mkdir()
          host='https://samson-pharma.ru';target=host+'/catalog/extra/spiski-tovarov/tovary-bez-skidok/'
          bot='LoyaltyCatalogResearchBot'
          report={'source_url':target,'source_account_used':False,'provider_credits':0,'requests':[]}
          def read(url,policy=False):
              item={'url':url,'requested_at':datetime.now(timezone.utc).isoformat()};report['requests'].append(item)
              with requests.get(url,headers={'User-Agent':bot+'/1.0'},timeout=(5,20),allow_redirects=False,stream=True) as response:
                  item.update(status=response.status_code,mime=response.headers.get('Content-Type',''),retry_after=bool(response.headers.get('Retry-After')))
                  if response.status_code==429 or item['retry_after']:raise ValueError('rate_stop')
                  if policy and 400<=response.status_code<500:
                      item['interpretation']='robots_unavailable_RFC9309_2_3_1_3';return None
                  if response.status_code!=200:raise ValueError('target_http_'+str(response.status_code) if not policy else 'robots_http_'+str(response.status_code))
                  data=bytearray();deadline=time.monotonic()+30
                  for chunk in response.iter_content(65536):
                      data.extend(chunk)
                      if len(data)>6000000 or time.monotonic()>deadline:raise ValueError('response_bound')
              item.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              return bytes(data)
          try:
              policy=read(host+'/robots.txt',True)
              if policy is None:
                  rules=Protego.parse('User-agent: *\n');report['robots_state']='unavailable_4xx'
              else:
                  (folder/'robots.txt').write_bytes(policy);raw=policy.decode('utf8')
                  if 'user-agent:' not in raw.lower() or '<html' in raw.lower():raise ValueError('robots_unreadable')
                  rules=Protego.parse(raw);report['robots_state']='parsed'
              if not rules.can_fetch(target,bot):raise ValueError('source_policy')
              rate=rules.request_rate(bot);delay=max(3,rules.crawl_delay(bot) or 0,rate.seconds/rate.requests if rate else 0)
              if delay>30:raise ValueError('delay_bound')
              time.sleep(delay)
              data=read(target);dom=BeautifulSoup(data,'html.parser')
              title=dom.title.get_text(' ',strip=True) if dom.title else ''
              if not dom.html or dom.select('input[type=password]') or re.search(r'access denied|captcha|just a moment|доступ.{0,30}(?:запрещ|огранич)',title,re.I):raise ValueError('not_public_html')
              for node in dom.select('script,style,noscript,form,input,textarea,button,iframe,svg,img,nav,header,footer,[hidden]'):node.decompose()
              for node in dom.find_all(True):
                  node.attrs={k:v for k,v in node.attrs.items() if k in ('id','class','href','colspan','rowspan')}
                  if node.has_attr('href'):
                      url=urljoin(target,node['href']);u=urlsplit(url)
                      if u.scheme!='https' or u.netloc!='samson-pharma.ru' or not u.path.startswith('/catalog/') or u.fragment or (u.query and not re.fullmatch(r'page=[1-9][0-9]?',u.query)):del node.attrs['href']
                      else:node['href']=url
              (folder/'page.html').write_text(str(dom),encoding='utf8');report['status']='public_html_observed'
          except Exception as exc:
              report['status']='not_collected';report['error']=str(exc) if isinstance(exc,ValueError) else type(exc).__name__
          (folder/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: samson-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: samson-inspection/
          retention-days: 7
