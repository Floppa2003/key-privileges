name: Inspect EKP public catalogue contract
on:
  push:
    branches: [loyalty/ekp-native-catalog]
    paths: [.github/workflows/ekp-native-discovery.yml]
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Capture anonymous public catalogue and two linked details
        env:
          TRIAL: ${{ matrix.trial }}
        run: |
          python - <<'PY'
          import asyncio,json,re,os,hashlib
          from pathlib import Path
          from urllib.parse import urlsplit,parse_qs
          from datetime import datetime,timezone
          from playwright.async_api import async_playwright
          from bs4 import BeautifulSoup
          OUT=Path('ekp-contract'); OUT.mkdir()
          BASE='https://ekp.spb.ru'
          report={'trial':os.environ['TRIAL'],'observed_at':datetime.now(timezone.utc).isoformat(),'events':[],'pages':[]}
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  context=await browser.new_context(locale='ru-RU')
                  page=await context.new_page(); tasks=set(); seq=0
                  async def capture(response):
                      nonlocal seq
                      parts=urlsplit(response.url)
                      if parts.hostname!='ekp.spb.ru' or not re.fullmatch(r'/api/portal/loyalty/(?:partners(?:/[0-9]+)?|regions|categories/partners)',parts.path):return
                      event={'path':parts.path,'query':parts.query,'status':response.status,'method':response.request.method}
                      report['events'].append(event)
                      if response.status!=200:return
                      raw=await response.text()
                      if len(raw.encode())>6000000:return
                      try:data=json.loads(raw)
                      except ValueError:return
                      seq+=1; filename=f'public-{seq}.json'
                      OUT.joinpath(filename).write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf8')
                      event['file']=filename
                  def observe(response):
                      task=asyncio.create_task(capture(response));tasks.add(task);task.add_done_callback(tasks.discard)
                  page.on('response',observe)
                  # Exact already-observed public endpoint; no generated IDs or private paths.
                  try:
                      response=await context.request.get(BASE+'/api/portal/loyalty/partners',timeout=12000)
                      raw=await response.text();report['direct_api_status']=response.status
                      if response.status==200 and len(raw.encode())<6000000:
                          try:OUT.joinpath('direct-api.json').write_text(json.dumps(json.loads(raw),ensure_ascii=False,indent=2),encoding='utf8')
                          except ValueError:pass
                  except Exception as exc:report['direct_api_error']=type(exc).__name__
                  async def snapshot(url,label):
                      res=await page.goto(url,wait_until='domcontentloaded',timeout=22000)
                      await page.wait_for_timeout(3500)
                      raw=await page.content(); soup=BeautifulSoup(raw,'html.parser')
                      info={'label':label,'url':page.url,'status':res.status if res else None,'title':await page.title()}
                      if res and res.status==200:
                          for node in soup.select('script,style,form,input,textarea'):node.decompose()
                          OUT.joinpath(label+'.html').write_text(str(soup),encoding='utf8')
                          info['text_chars']=len(soup.get_text(' ',strip=True))
                          info['buttons']=await page.locator('button').all_text_contents()
                      report['pages'].append(info)
                      return info
                  try:
                      info=await snapshot(BASE+'/capabilities/loyalty/tiles?region=78','catalog')
                      if info['status']==200:
                          links=await page.locator('a[href]').evaluate_all('(els)=>els.map(e=>e.href)')
                          cards=list(dict.fromkeys(u for u in links if urlsplit(u).hostname=='ekp.spb.ru' and re.fullmatch(r'/capabilities/loyalty/tiles/[0-9]+/?',urlsplit(u).path)))
                          report['card_links']=cards
                          for n,url in enumerate(cards[:2]):await snapshot(url,f'detail-{n}')
                  except Exception as exc:report['page_error']=type(exc).__name__
                  if tasks:await asyncio.gather(*tasks,return_exceptions=True)
                  await context.close();await browser.close()
          asyncio.run(main())
          OUT.joinpath('report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekp-contract-${{ matrix.trial }}-${{ github.run_id }}
          path: ekp-contract/
          retention-days: 7
