name: Verify Konsierge recurring integration
on:
  push:
    branches: ['loyalty/konsierge-recurring-20260919']
    paths:
      - '.github/workflows/konsierge-recurring-check.yml'
      - 'loyalty/konsierge_source.py'
      - 'loyalty/tests/test_konsierge_recurring.py'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Apply reviewed source-local patch and run all regressions
        run: |
          mkdir -p recurring-check
          python diagnostics/konsierge_enable.py
          python -m unittest discover -s loyalty/tests -v > recurring-check/tests.log 2>&1
          tail -5 recurring-check/tests.log
          node --test key/refresh.test.mjs > recurring-check/key-tests.log 2>&1
          tail -8 recurring-check/key-tests.log
      - run: python -m playwright install --with-deps chromium
      - name: Fresh actual production collector, Konsierge only, no robots preflight
        run: |
          xvfb-run -a python loyalty/collect_normalized.py --sources konsierge_public --limit 500
          python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from sheets_normalized import prepare,SCHEMAS
          from unified_normalization import make_input,normalize_record
          from konsierge_catalog import RECURRING_MODE, ROBOTS_POLICY
          b=json.loads(Path('loyalty-output/normalized.json').read_text())
          assert len(b['sources'])==1
          s=b['sources'][0]
          assert s['source_id']=='konsierge_public' and s['status']=='ok' and s['failed']==0
          assert s['robots']['state']=='not_requested' and s['robots_requests']==0
          assert s['normalized']==s['discovered']==len(b['records'])>0
          common=[]
          for r in b['records']:
              assert r['details']['collection_mode']==RECURRING_MODE and r['details']['robots_policy']==ROBOTS_POLICY
              assert r['details']['source_run']==b['run_id']
              assert 'manual_capture_not_recurring_collection' not in r['warnings']
          for i,row in enumerate(prepare(b)['parser_offers'],2):
              raw=make_input({'id':row[0],'origin':'parser_offers','row':i,'fields':{k:{'value':v} for k,v in zip(SCHEMAS['parser_offers'],row)}})
              common.append(normalize_record(raw,as_of=b['observed_at'][:10]))
          result={'run':b['run_id'],'observed_at':b['observed_at'],'records':len(b['records']),
                  'categories':s['categories'],'root_only':s['root_only'],'robots_requests':0,
                  'common_records':len(common),'shared_transport_changed':False}
          Path('recurring-check/acceptance.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Commit only reviewed integration on feature branch and remove temporary helpers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          branch='loyalty/konsierge-recurring-20260919'
          assert os.environ['GITHUB_REF_NAME']==branch
          assert subprocess.check_output(['git','diff','--','loyalty/public_transport.py','.github/workflows/loyalty.yml'])==b''
          files=['loyalty/collect_normalized.py','loyalty/konsierge_catalog.py','loyalty/sources_normalized.json']
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','rm','--','diagnostics/konsierge_enable.py','.github/workflows/konsierge-recurring-check.yml'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Enable tested Konsierge browser route in existing daily source registry'],check=True)
          auth=base64.b64encode(('x-access-token:'+os.environ['GITHUB_TOKEN']).encode()).decode()
          pushed=subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:'+branch],capture_output=True)
          if pushed.returncode:raise RuntimeError('feature_branch_push_failed')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          Path('recurring-check/commit.txt').write_text(sha+'\n')
          files+=['loyalty/konsierge_source.py','loyalty/tests/test_konsierge_recurring.py']
          Path('recurring-check/code_hashes.json').write_text(json.dumps({f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files},indent=2))
          print('Verified feature commit:',sha)
          PY
          git archive HEAD loyalty key > recurring-check/repo-code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-recurring-${{ github.run_id }}
          path: |
            recurring-check/
            loyalty-output/
          retention-days: 7
