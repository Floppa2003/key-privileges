name: Review source reconciliation
on:
  push:
    branches: [loyalty/full-source-reconciliation]
    paths: [loyalty/**, .github/workflows/reconcile-review.yml]
permissions:
  contents: read
concurrency:
  group: loyalty-reconcile-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt jsonschema==4.26.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reconciliation-review-34819206189
          run-id: 34819206189
          github-token: ${{ github.token }}
          path: public-evidence/
      - name: Apply reviewed code registration
        run: |
          if test -f loyalty/register_reconciled.py; then python loyalty/register_reconciled.py; fi
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Preserve tested registration on this development branch
        run: |
          if test -f loyalty/register_reconciled.py; then
            git add -- loyalty/known_rules.json loyalty/sources_normalized.json loyalty/known_rules.py loyalty/normalized.py loyalty/announcements.py loyalty/tests/fixtures/reconciled/
            git rm -- loyalty/register_reconciled.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: register tested partner rules and official announcement sources'
            git push origin HEAD:refs/heads/loyalty/full-source-reconciliation
          fi
          mkdir -p reconcile-output
          git archive --format=tar --output=reconcile-output/code.tar HEAD
          python -m playwright install --with-deps chromium
      - name: Collect the twelve new sources using the production dispatcher
        run: |
          python - <<'PY'
          import asyncio,json,sys,hashlib,os
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from playwright.async_api import async_playwright
          from collect_normalized import one,bounded_source,source_budget
          from sheets_normalized import prepare
          async def main():
              cfgs=[c for c in json.loads(Path('loyalty/sources_normalized.json').read_text()) if c['id'].startswith('ural_') and c['mode']=='known_rules' or c['id'] in ('mir_announcements','bspb_announcements')]
              assert len(cfgs)==12
              now=datetime.now(timezone.utc).isoformat();sem=asyncio.Semaphore(3)
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:results=await asyncio.gather(*(bounded_source(lambda c=c:one(browser,c,now,500),sem,source_budget(c)) for c in cfgs))
                  finally:await browser.close()
              bundle={'schema_version':2,'run_id':os.environ['GITHUB_RUN_ID']+':1','observed_at':now,'sources':[r for r,_ in results],'records':[r for _,rs in results for r in rs]}
              prepare(bundle)
              Path('reconcile-output/normalized.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2),encoding='utf8')
              Path('reconcile-output/code_hashes.json').write_text(json.dumps({str(f):hashlib.sha256(f.read_bytes()).hexdigest() for f in Path('loyalty').glob('*.py')},indent=2))
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reconciliation-review-${{ github.run_id }}
          path: reconcile-output/
          retention-days: 7
          if-no-files-found: warn
