name: Review source reconciliation
on:
  push:
    branches: [loyalty/full-source-reconciliation]
    paths: [loyalty/**, .github/workflows/reconcile-review.yml]
permissions:
  contents: read
concurrency:
  group: loyalty-reconcile-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt jsonschema==4.26.0
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Preserve public code and inspect remaining exact references
        run: |
          mkdir -p reconcile-output
          git archive --format=tar --output=reconcile-output/code.tar HEAD
          python -m pip download --no-deps protego==0.6.2 pypdf==6.18.1 -d reconcile-output
          python -m playwright install --with-deps chromium
          python loyalty/reconcile_extra.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reconciliation-review-${{ github.run_id }}
          path: reconcile-output/
          retention-days: 7
          if-no-files-found: error
