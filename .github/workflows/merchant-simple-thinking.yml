name: Qwen short description and thinking diagnostic
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-simple-thinking.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-simple-thinking
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check existing suites and diagnostic boundaries
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p regression-output
          git rev-parse HEAD > regression-output/commit.txt
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
          python -m unittest discover -s loyalty/tests -v > regression-output/existing.log 2>&1
          python -m unittest discover -s loyalty/experiments/prompt_ab -p 'test_*.py' -v > regression-output/prompt.log 2>&1
          python -m unittest discover -s loyalty/experiments/local_visual -p 'test_*.py' -v > regression-output/local-visual.log 2>&1
          python -m unittest discover -s loyalty/experiments/resolution -p 'test_*.py' -v > regression-output/resolution.log 2>&1
          python -m unittest discover -s loyalty/experiments/simple_thinking -p 'test_*.py' -v > regression-output/probe.log 2>&1
          node --test key/refresh.test.mjs > regression-output/key.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: simple-thinking-regressions-${{ github.run_id }}
          path: regression-output/
          retention-days: 14
  compare:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - case: rzd_museum
            artifact: '11092615920'
          - case: lavka
            artifact: '11092032661'
          - case: muzcomedy
            artifact: '11092173951'
          - case: nevsky
            artifact: '11092462751'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact experiment and machine description
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p simple-thinking-output/code
          git rev-parse HEAD > simple-thinking-output/commit.txt
          cp loyalty/experiments/simple_thinking/* simple-thinking-output/code/
          cp loyalty/experiments/prompt_ab/prompt_ab.py loyalty/experiments/prompt_ab/practical_schema.json simple-thinking-output/code/
          cp loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py loyalty/experiments/resolution/setup.sh simple-thinking-output/code/
          cp .github/workflows/merchant-simple-thinking.yml simple-thinking-output/workflow.yml
          lscpu > simple-thinking-output/cpu.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: sources/${{ matrix.case }}
          merge-multiple: true
      - name: Install pinned local model with cloud disabled
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual"
          bash loyalty/experiments/resolution/setup.sh > simple-thinking-output/setup.log 2>&1
      - name: Describe in both modes and convert each unchanged final description
        run: |
          set -euo pipefail
          loyalty/experiments/resolution/.venv/bin/python -m unittest discover -s loyalty/experiments/simple_thinking -p 'test_*.py' -v > simple-thinking-output/tests-probe.log 2>&1
          loyalty/experiments/resolution/.venv/bin/python loyalty/experiments/simple_thinking/probe.py --execute --source sources --case ${{ matrix.case }} --out simple-thinking-output/results --ollama "$GITHUB_WORKSPACE/loyalty/experiments/resolution/.tools/ollama/bin/ollama" > simple-thinking-output/inference.log 2>&1
      - name: Preserve diagnostics and checksums without model weights
        if: always()
        run: |
          if test -d loyalty/experiments/resolution/setup-logs; then cp -r loyalty/experiments/resolution/setup-logs simple-thinking-output/; fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('simple-thinking-output')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'SHA256SUMS.json').write_text(json.dumps(hashes,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: simple-thinking-${{ matrix.case }}-${{ github.run_id }}
          path: simple-thinking-output/
          retention-days: 14
