name: Review parser repairs
on:
  push:
    branches: [loyalty/repair-and-ekp]
    paths: [loyalty/**, .github/workflows/repair-review.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: |
          if test -f loyalty/apply_repair.py; then python loyalty/apply_repair.py; fi
      - run: python -m unittest discover -s loyalty/tests -v
      - run: node --test key/refresh.test.mjs
      - name: Commit tested changes only
        run: |
          if test -f loyalty/apply_repair.py; then
            git rm loyalty/apply_repair.py loyalty/repair.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: preserve observed Mir IDs and enforce in-flight source deadline'
            git push origin HEAD:refs/heads/loyalty/repair-and-ekp
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          mkdir -p repair-output
          git archive --format=tar --output=repair-output/code.tar HEAD
      - run: python -m playwright install --with-deps chromium
      - name: Verify exact public Mir card and MEDSI without Google access
        run: |
          python - <<'PY'
          import asyncio,json,sys,time
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from mir_ui import BrowserResponses,read_matching_detail
          from adapters import extract
          from playwright.async_api import async_playwright
          async def main():
              now=datetime.now(timezone.utc).isoformat();report=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  for sid,url in [('mir','https://vamprivet.ru/promo/krasota-i-zdorovye/chekap-zubov-dlya-zdorovoy-ulybki-1/'),('af_medsi','https://medsi.ru/actions/aeroflot-bonus-v-klinikakh-medsi/')]:
                      try:
                          async with PublicSource(browser,url) as client:
                              await client.robots()
                              if sid=='mir':
                                  captured=BrowserResponses(client.page,client.host);client.page.on('response',captured.observe)
                                  try:records=[await read_matching_detail(client,captured,url,now,expected_id='db7f56ef-dd05-4b44-a103-21d5b1316d58',deadline=time.monotonic()+70)]
                                  finally:await captured.close()
                              else:records=extract(sid,await client.read(url,render=True),url,now)
                              report.append({'source':sid,'status':'ok' if records else 'empty','records':records})
                      except Exception as exc:report.append({'source':sid,'status':'failed','reason':str(exc)[:180]})
                  await browser.close()
              Path('repair-output/live-canaries.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repairs-final-${{ github.run_id }}
          path: repair-output/
          retention-days: 7
