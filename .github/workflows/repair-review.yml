name: Review parser repairs
on:
  push:
    branches: [loyalty/repair-and-ekp]
    paths: [loyalty/**, .github/workflows/repair-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m unittest discover -s loyalty/tests -v
      - run: python -m playwright install --with-deps chromium
      - name: Read anonymous EKP catalogue and observed cards
        run: |
          mkdir -p repair-output
          git archive --format=tar --output=repair-output/code.tar HEAD
          python - <<'PY'
          import asyncio,json,re,sys
          from pathlib import Path
          from urllib.parse import urlsplit,urljoin
          from bs4 import BeautifulSoup
          sys.path.insert(0,'loyalty')
          from public_transport import PublicSource
          from playwright.async_api import async_playwright
          async def main():
              out=Path('repair-output'); events=[]; pending=set()
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  try:
                      async with PublicSource(browser,'https://ekp.spb.ru/capabilities/loyalty/') as c:
                          async def save(resp):
                              u=urlsplit(resp.url)
                              if u.hostname!='ekp.spb.ru' or not re.fullmatch(r'/api/portal/loyalty/(?:partners(?:/[0-9]+)?|regions|categories/partners)/?',u.path):return
                              if re.search(r'token|secret|auth|session',u.query,re.I):return
                              try:
                                  raw=await resp.text()
                                  if len(raw.encode())>6000000:return
                                  data=json.loads(raw)
                                  events.append({'url':resp.url,'status':resp.status,'data':data})
                              except Exception:pass
                          def observe(resp):
                              task=asyncio.create_task(save(resp));pending.add(task);task.add_done_callback(pending.discard)
                          c.page.on('response',observe)
                          await c.robots()
                          raw=await c.read('https://ekp.spb.ru/capabilities/loyalty/',render=True)
                          await c.page.wait_for_timeout(4000)
                          for i in range(3):
                              body=await c.page.locator('body').inner_text()
                              (out/f'page-{i}.txt').write_text(body,encoding='utf8')
                              soup=BeautifulSoup(await c.page.content(),'html.parser')
                              for node in soup.select('script,style,form,input,textarea'):node.decompose()
                              (out/f'page-{i}.html').write_text(str(soup),encoding='utf8')
                              if i==0:
                                  links=await c.page.locator('a[href]').evaluate_all('(xs)=>xs.map(x=>x.href)')
                                  urls=list(dict.fromkeys(x for x in links if urlsplit(x).hostname=='ekp.spb.ru' and re.fullmatch(r'/capabilities/loyalty/tiles/[0-9]+/?',urlsplit(x).path)))[:2]
                              if i<len(urls):await c.read(urls[i],render=True);await c.page.wait_for_timeout(2000)
                              else:break
                          if pending:await asyncio.gather(*list(pending),return_exceptions=True)
                  except Exception as e:
                      (out/'error.json').write_text(json.dumps({'type':type(e).__name__,'reason':str(e)[:300]},ensure_ascii=False))
                  finally:
                      (out/'public-responses.json').write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf8')
                      await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repair-${{ matrix.sample }}-${{ github.run_id }}
          path: repair-output/
          retention-days: 7
