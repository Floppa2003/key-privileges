name: Public GreatList discovery
on:
  push:
    branches: ['loyalty/alfa-public-discovery-20260919']
    paths: ['.github/workflows/alfa-greatlist-discovery.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Inspect catalogue and sampled details
        run: python loyalty/greatlist_probe.py
      - name: Package public evidence and exact code
        if: always()
        run: |
          mkdir -p discovery/wheels
          python -m pip download --no-deps protego==0.6.2 -d discovery/wheels
          tar -cf discovery/main-code.tar loyalty key .github/workflows
          git rev-parse HEAD > discovery/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: greatlist-discovery-${{ github.run_id }}
          path: discovery/
          retention-days: 7
