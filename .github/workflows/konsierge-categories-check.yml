name: Konsierge category acceptance check
on:
  push:
    branches: ['loyalty/konsierge-categories-20260919']
    paths: ['.github/workflows/konsierge-categories-check.yml', 'diagnostics/konsierge_public_ui.py']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read normal public website and verify its native category/page inventory
        run: |
          mkdir -p category-check
          python diagnostics/konsierge_public_ui.py
          git rev-parse HEAD > category-check/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: konsierge-full-ui-${{ github.run_id }}
          path: category-check/
          retention-days: 3
