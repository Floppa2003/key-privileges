name: Locate provider credential names
on:
  push:
    branches: [loyalty/deepseek-capacity-recheck-20261028]
    paths: [.github/workflows/provider-credential-names.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  names:
    uses: ./.github/workflows/provider-credential-names-worker.yml
    secrets:
      VARIABLE_CONTEXT: ${{ toJSON(vars) }}
      SECRET_CONTEXT: ${{ toJSON(secrets) }}
