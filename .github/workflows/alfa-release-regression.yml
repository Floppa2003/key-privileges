name: Temporary Alfa release regression
on:
  push:
    branches: ['loyalty/finish-catalogs']
    paths: ['.github/workflows/alfa-release-regression.yml']
permissions:
  contents: read
concurrency:
  group: alfa-release-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full Python regression
        run: python -m unittest discover -s loyalty/tests -v
      - name: KEY regression
        run: node --test key/refresh.test.mjs
      - name: Live Alfa public rules and schema
        run: |
          mkdir -p alfa-release-output
          python - <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          import alfa_public_rules as a
          from normalized import validate_offer
          observed=datetime.now(timezone.utc).isoformat()
          core=a.parse_core(a.fetch_pdf(a.CORE_URL),observed)
          cashback=a.parse_cashback(a.fetch_pdf(a.CASHBACK_URL),observed)
          rows=core+cashback
          assert len(core)==9 and len(cashback)==1 and len(rows)==10
          for row in rows: validate_offer(row)
          bundle={'schema_version':2,'run_id':'release-live','observed_at':observed,'records':rows,
                  'sources':[{'source_id':'alfa_only_public_rules','name':'Alfa Only — публичные правила привилегий','root':a.CORE_URL,
                              'status':'ok','discovered':9,'normalized':9,'failed':0,'coverage':'release_live_core47','region':None,'errors':[],'observed_at':observed},
                             {'source_id':'alfa_only_cashback_rules','name':'Alfa Only — публичные лимиты кэшбэка','root':a.CASHBACK_URL,
                              'status':'ok','discovered':1,'normalized':1,'failed':0,'coverage':'release_live_cashback101','region':None,'errors':[],'observed_at':observed}]}
          Path('alfa-release-output/normalized.json').write_text(json.dumps(bundle,ensure_ascii=False,indent=2))
          print(json.dumps({'core':9,'cashback':1,'total':10}))
          PY
          python loyalty/sheets_normalized.py --input alfa-release-output/normalized.json
