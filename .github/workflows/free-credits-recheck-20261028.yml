name: Activated free credits and model alternatives
# Recheck only Experiential after the user supplied its exact credential name.
on:
  push:
    branches: [loyalty/deepseek-capacity-recheck-20261028]
    paths: [.github/workflows/free-credits-recheck-20261028.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: free-credits-recheck-20261028
  cancel-in-progress: false
jobs:
  evaluate:
    uses: ./.github/workflows/free-credits-worker.yml
    with:
      providers: '["experiential"]'
      experiential_variable_present: ${{ vars.EXPERIENTAL_API_KEY != '' }}
    secrets:
      EXPLABS_API_KEY: ${{ secrets.EXPERIENTAL_API_KEY || vars.EXPERIENTAL_API_KEY }}
