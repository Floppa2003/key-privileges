name: Only Assist public source probe
on:
  push:
    branches: ['loyalty/only-assist-public-20260919']
    paths: ['.github/workflows/only-assist-public-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Bounded public publisher and app distribution discovery
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          mkdir -p only-probe
          python - <<'PY'
          import hashlib,json,os,re,sys,time
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urljoin,urlsplit
          import requests
          from bs4 import BeautifulSoup
          from protego import Protego
          sys.path.insert(0,'loyalty')
          from public_transport import robots_document,check_response
          from free_access_probe import FreeReader,read_policy
          out=Path('only-probe');report={'observed_at':datetime.now(timezone.utc).isoformat(),'pages':[],'authenticated':False}
          reader=FreeReader(os.environ.get('SCRAPINGANT_API_KEY',''),[{'url':'https://konsierge.com/benefits','id':'publisher_public'}],max_credits=15,max_requests=10)
          def save(url,raw,status,kind):
              name=hashlib.sha256(url.encode()).hexdigest()[:16]+'.txt';item={'url':url,'status':status,'bytes':len(raw.encode()),'sha256':hashlib.sha256(raw.encode()).hexdigest(),'file':name,'kind':kind}
              (out/name).write_text(raw)
              if kind=='html':
                  soup=BeautifulSoup(raw,'html.parser');item['title']=soup.title.get_text(' ',strip=True) if soup.title else '';item['scripts']=[urljoin(url,x['src']) for x in soup.select('script[src]')]
                  item['links']=[{'url':urljoin(url,a['href']),'label':a.get_text(' ',strip=True)[:160]} for a in soup.select('a[href]') if not a['href'].startswith(('mailto:','tel:'))][:500]
              report['pages'].append(item);return item
          try:
              reader.preflight();info={};status,raw,cost=read_policy(reader,'https://konsierge.com/robots.txt',info)
              rules,state=robots_document(status,raw);policy=Protego.parse(rules);report['publisher_robots']={'status':status,'state':state};(out/'publisher-robots.txt').write_text(rules)
              url='https://konsierge.com/benefits'
              if not policy.can_fetch(url,'LoyaltyCatalogResearchBot'):raise RuntimeError('robots_disallow')
              status,raw,cost=reader.read(url,browser=False);check_response(status,raw);item=save(url,raw,status,'html')
              scripts=[u for u in item['scripts'] if urlsplit(u).netloc=='konsierge.com' and urlsplit(u).scheme=='https'][:6]
              for u in scripts:
                  if not policy.can_fetch(u,'LoyaltyCatalogResearchBot'):continue
                  reader.allowed.add(u)
                  try:
                      st,body,co=reader.read(u,browser=False);check_response(st,body);save(u,body,st,'js')
                  except Exception as e:report['pages'].append({'url':u,'error':type(e).__name__})
                  if reader.halted:break
          except Exception as e:report['publisher_error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
          finally:report.update(reserved_credits=reader.reserved,known_charged_credits=reader.known_charged_credits,calls=reader.calls)
          s=requests.Session();s.trust_env=False;s.headers['User-Agent']='LoyaltyCatalogResearchBot/1.0'
          try:
              r=s.get('https://www.rustore.ru/robots.txt',timeout=(8,20));rules,state=robots_document(r.status_code,r.text);pol=Protego.parse(rules)
              url='https://www.rustore.ru/catalog/app/com.konsierge.assist.only'
              if not pol.can_fetch(url,'LoyaltyCatalogResearchBot'):raise RuntimeError('robots_disallow')
              r=s.get(url,timeout=(8,25),allow_redirects=False);check_response(r.status_code,r.text);soup=BeautifulSoup(r.text,'html.parser')
              scripts=[urljoin(url,x['src']) for x in soup.select('script[src]') if '/app/app/' in x['src'] and '/page-' in x['src']]
              for u in scripts[:1]:
                  if urlsplit(u).netloc!='www.rustore.ru' or not pol.can_fetch(u,'LoyaltyCatalogResearchBot'):continue
                  r=s.get(u,timeout=(8,25),allow_redirects=False);check_response(r.status_code,r.text);save(u,r.text,r.status_code,'js')
          except Exception as e:report['rustore_error']=type(e).__name__
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='pages'},ensure_ascii=False))
          print(json.dumps([(p['url'],p.get('status'),p.get('error')) for p in report['pages']],ensure_ascii=False))
          PY
          git rev-parse HEAD > only-probe/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: only-assist-public-${{ github.run_id }}
          path: only-probe/
          retention-days: 7
