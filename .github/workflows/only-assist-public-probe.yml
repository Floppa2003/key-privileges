name: Only Assist public source probe
on:
  push:
    branches: ['loyalty/only-assist-public-20260919']
    paths: ['.github/workflows/only-assist-public-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Read public publisher pages and their same-origin scripts
        run: |
          mkdir -p only-probe
          python - <<'PY'
          import hashlib,json,re,sys,time
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urljoin,urlsplit,urlunsplit
          import requests
          from bs4 import BeautifulSoup
          from protego import Protego
          sys.path.insert(0,'loyalty')
          from public_transport import robots_document
          out=Path('only-probe');report={'observed_at':datetime.now(timezone.utc).isoformat(),'pages':[],'policies':{},'authenticated':False}
          s=requests.Session();s.trust_env=False;s.headers['User-Agent']='LoyaltyCatalogResearchBot/1.0'
          def fetch(url):
            with s.get(url,timeout=(8,25),allow_redirects=False,stream=True) as r:
              if r.status_code==429 or r.headers.get('Retry-After'):raise RuntimeError('rate_limited')
              raw=bytearray()
              for b in r.iter_content(65536):
                raw.extend(b)
                if len(raw)>6000000:raise RuntimeError('size_bound')
              return r.status_code,bytes(raw),r.headers.get('Location'),r.headers.get('Content-Type','')
          urls=['https://konsierge.com/','https://konsierge.com/benefits','https://konsierge.com/for-clients','https://www.rustore.ru/catalog/app/com.konsierge.assist.only']
          policies={};done=set();script_count=0
          for step in range(15):
            if not urls:break
            url=urls.pop(0)
            if url in done:continue
            done.add(url);p=urlsplit(url);root=p.scheme+'://'+p.netloc;item={'url':url}
            try:
              if root not in policies:
                status,raw,_,_=fetch(root+'/robots.txt');rules,state=robots_document(status,raw.decode('utf8','replace'));policies[root]=Protego.parse(rules)
                report['policies'][root]={'status':status,'state':state};(out/(p.hostname+'.robots.txt')).write_text(rules)
              if not policies[root].can_fetch(url,'LoyaltyCatalogResearchBot'):raise RuntimeError('robots_disallow')
              status,raw,location,ctype=fetch(url);item.update(status=status,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),content_type=ctype)
              if status in (301,302,307,308):
                dest=urljoin(url,location or '');item['redirect']=dest
                if urlsplit(dest).netloc==p.netloc and urlsplit(dest).scheme=='https':urls.append(dest)
              elif status==200:
                name=hashlib.sha256(url.encode()).hexdigest()[:16]+('.js' if p.path.endswith('.js') else '.html');(out/name).write_bytes(raw);item['file']=name
                if not p.path.endswith('.js'):
                  soup=BeautifulSoup(raw,'html.parser');item['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                  item['links']=[{'url':urljoin(url,a['href']),'label':a.get_text(' ',strip=True)[:160]} for a in soup.select('a[href]') if not a['href'].startswith(('mailto:','tel:'))][:500]
                  item['scripts']=[urljoin(url,x['src']) for x in soup.select('script[src]')]
                  for u in item['scripts']:
                    up=urlsplit(u)
                    if p.netloc=='konsierge.com' and up.scheme=='https' and up.netloc==p.netloc and u not in done and u not in urls and script_count<7:
                      urls.append(u);script_count+=1
                else:
                  text=raw.decode('utf8','replace');item['endpoint_candidates']=sorted(set(re.findall(r'https?://[^\s\"\x27<>`\\]+',text)))[:150]
            except Exception as e:item['error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
            report['pages'].append(item);time.sleep(0.5)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({'pages':[(x['url'],x.get('status'),x.get('error')) for x in report['pages']]},ensure_ascii=False))
          PY
          tar -cf only-probe/code.tar loyalty key .github/workflows
          git rev-parse HEAD > only-probe/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: only-assist-public-${{ github.run_id }}
          path: only-probe/
          retention-days: 7
