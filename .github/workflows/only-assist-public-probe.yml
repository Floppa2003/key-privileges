name: Only Assist public source probe
on:
  push:
    branches: ['loyalty/only-assist-public-20260919']
    paths: ['.github/workflows/only-assist-public-probe.yml']
permissions: {contents: read}
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Apply hash-guarded reviewed edits and recover public excerpt fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p only-probe
          python diagnostics/alfa_frontier_patch.py
      - name: Full regression before branch commit
        run: |
          python -m unittest discover -s loyalty/tests -v > only-probe/tests.log 2>&1
          tail -5 only-probe/tests.log
          node --test key/refresh.test.mjs > only-probe/key-tests.log 2>&1
          tail -8 only-probe/key-tests.log
      - name: Persist only reviewed files on the same branch, never main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME']=='loyalty/only-assist-public-20260919'
          files=['loyalty/'+p for p in ('partner_pages.json','partner_pages.py','announcements.py','normalized.py','sources_normalized.json','unified_normalization.py','tests/fixtures_live/tsum-alfa.html','tests/fixtures_live/alfa-simpleprive-post.html')]
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','commit','-m','Wire tested Alfa public announcements and TSUM loyalty tiers'],check=True)
          auth=base64.b64encode(('x-access-token:'+os.environ['GITHUB_TOKEN']).encode()).decode()
          result=subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:'+os.environ['GITHUB_REF_NAME']],capture_output=True,text=True)
          if result.returncode:raise RuntimeError('feature_branch_push_failed')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          paths=files+['loyalty/tsum_alfa.py','loyalty/tests/test_alfa_public_frontier.py']
          Path('only-probe/code_hashes.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          Path('only-probe/commit.txt').write_text(sha+'\n')
          print('Feature branch committed:',sha)
          PY
          git archive HEAD loyalty key > only-probe/code.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-frontier-install-${{ github.run_id }}
          path: only-probe/
          retention-days: 7
