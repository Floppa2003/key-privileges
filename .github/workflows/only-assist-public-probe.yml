name: Only Assist public source probe
on:
  push:
    branches: ['loyalty/only-assist-public-20260919']
    paths: ['.github/workflows/only-assist-public-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Bounded static inspection of publicly distributed Android package
        run: |
          mkdir -p only-probe
          python - <<'PY'
          import hashlib,io,json,re,sys,zipfile
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urljoin,urlsplit
          import requests
          from bs4 import BeautifulSoup
          from protego import Protego
          sys.path.insert(0,'loyalty')
          from public_transport import robots_document,check_response
          out=Path('only-probe');report={'observed_at':datetime.now(timezone.utc).isoformat(),'authenticated':False,'executed_app':False,'provider_calls':0,'catalogue_records':0,'requests':[]}
          hosts={'apkpure.net','d.apkpure.net','data.winudf.com'}
          def clean(url):
              p=urlsplit(url);return p.scheme+'://'+p.netloc+p.path
          def get(url,limit=100000000):
              for step in range(4):
                  p=urlsplit(url)
                  if p.scheme!='https' or p.netloc not in hosts:raise RuntimeError('unreviewed_distribution_redirect')
                  with requests.Session() as s:
                      s.trust_env=False
                      with s.get(url,headers={'User-Agent':'LoyaltyCatalogResearchBot/1.0'},timeout=(8,35),allow_redirects=False,stream=True) as r:
                          report['requests'].append({'url':clean(url),'status':r.status_code})
                          if r.status_code in (401,403,429) or r.headers.get('Retry-After'):raise RuntimeError('access_or_rate_stop')
                          if r.status_code in (301,302,303,307,308):
                              url=urljoin(url,r.headers.get('Location',''));continue
                          data=bytearray()
                          for part in r.iter_content(65536):
                              data.extend(part)
                              if len(data)>limit:raise RuntimeError('size_bound')
                          return r.status_code,bytes(data)
              raise RuntimeError('redirect_bound')
          try:
              status,raw=get('https://apkpure.net/robots.txt',500000)
              rules,state=robots_document(status,raw.decode('utf-8'));pol=Protego.parse(rules)
              page='https://apkpure.net/ru/only-assist/com.konsierge.assist.only/download'
              if not pol.can_fetch(page,'LoyaltyCatalogResearchBot'):raise RuntimeError('robots_disallow')
              status,raw=get(page,2500000);check_response(status,raw.decode('utf-8'))
              soup=BeautifulSoup(raw,'html.parser')
              report['distribution_page_sha256']=hashlib.sha256(raw).hexdigest()
              links=list(dict.fromkeys(urljoin(page,a['href']) for a in soup.select('a[href]') if 'd.apkpure.net/b/XAPK/com.konsierge.assist.only' in a['href']))
              report['distribution_links_found']=len(links)
              link=next((u for u in links if 'arm64-v8a' in u and 'versionCode=34' in u),None)
              if not link:raise RuntimeError('reviewed_version_link_missing')
              # An explicitly selected public distribution file, not an API/login endpoint.
              status,package=get(link)
              if status!=200 or not package.startswith(b'PK'):raise RuntimeError('distribution_not_zip')
              report['package_sha256']=hashlib.sha256(package).hexdigest();report['package_sha1']=hashlib.sha1(package).hexdigest();report['package_bytes']=len(package)
              if report['package_sha1']!='a8d31e5821299cbe5b3191b0e903d8eba8e4d5e9':raise RuntimeError('published_package_digest_mismatch')
              with zipfile.ZipFile(io.BytesIO(package)) as z:
                  report['package_members']=[{'name':i.filename,'bytes':i.file_size} for i in z.infolist()]
                  if sum(i.file_size for i in z.infolist())>300000000:raise RuntimeError('expanded_size_bound')
                  names=z.namelist()
                  if 'manifest.json' in names:
                      meta=json.loads(z.read('manifest.json'))
                      report['package_metadata']={k:meta[k] for k in ('package_name','version_name','version_code','min_sdk_version') if k in meta}
                      if meta.get('package_name')!='com.konsierge.assist.only':raise RuntimeError('package_identity_mismatch')
                  apk=next((n for n in names if n.endswith('com.konsierge.assist.only.apk')),None)
                  if not apk:raise RuntimeError('base_apk_missing')
                  base=z.read(apk)
              # Nothing is installed or executed. No credentials are used, extracted or published.
              with zipfile.ZipFile(io.BytesIO(base)) as z:
                  relevant=[i for i in z.infolist() if i.filename.startswith(('assets/','lib/')) or i.filename.endswith(('.dex','.dll'))]
                  report['base_members']=[{'name':i.filename,'bytes':i.file_size} for i in relevant]
                  routes=[]
                  for member in relevant:
                      if member.file_size>45000000:continue
                      raw=z.read(member)
                      for pattern in (rb'https?://[^\s\x00-\x20<>"\x27\\]{4,240}',):
                          for b in re.findall(pattern,raw):
                              try:u=b.decode('utf-8');p=urlsplit(u)
                              except (UnicodeError,ValueError):continue
                              if p.username or p.password or not p.hostname:continue
                              if any(x in p.hostname.lower() for x in ('konsierge','assist','apcg','quintessentially')):
                                  path=p.path if not re.search(r'token|secret|password|session',p.path,re.I) else '/[sensitive-path-omitted]'
                                  routes.append({'member':member.filename,'url':p.scheme+'://'+p.netloc+path})
                  report['service_routes']=list({json.dumps(r,sort_keys=True):r for r in routes}.values())
                  report['static_inspection_complete']=True
          except Exception as e:report['error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
          git rev-parse HEAD > only-probe/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: only-assist-public-${{ github.run_id }}
          path: only-probe/
          retention-days: 7
