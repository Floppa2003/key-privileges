name: Only Assist public source probe
on:
  push:
    branches: ['loyalty/only-assist-public-20260919']
    paths: ['.github/workflows/only-assist-public-probe.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Fresh bounded production-source collection without private credentials
        run: |
          mkdir -p only-probe
          xvfb-run -a python loyalty/collect_normalized.py --limit 500 --sources alfa_only_tsum,alfa_only_announcements
          python loyalty/sheets_normalized.py --input loyalty-output/normalized.json
      - name: Assert source and common-view contracts
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from normalized import validate_offer
          from sheets_normalized import prepare,SCHEMAS
          from unified_normalization import make_input,normalize_record
          b=json.loads(Path('loyalty-output/normalized.json').read_text())
          reports={s['source_id']:s for s in b['sources']}
          assert set(reports)=={'alfa_only_tsum','alfa_only_announcements'}
          assert all(s['status']=='ok' and s['failed']==0 and not s['errors'] for s in reports.values()),reports
          tsum=[r for r in b['records'] if r['source_id']=='alfa_only_tsum']
          ann=[r for r in b['records'] if r['source_id']=='alfa_only_announcements']
          assert len(tsum)==2 and len(ann)>=10
          assert len({r['id'] for r in b['records']})==len(b['records'])
          assert all(r['record_kind']=='announcement' and r['source_status']=='announced_unverified' and r['valid_until'] is None for r in ann)
          for r in b['records']:validate_offer(r)
          out=[]
          for r in tsum:
              values=prepare({**b,'records':[r]})['parser_offers'][0]
              raw=make_input({'id':r['id'],'origin':'parser_offers','row':2,'fields':{h:{'value':v} for h,v in zip(SCHEMAS['parser_offers'],values)}})
              n=normalize_record(raw,as_of=b['observed_at'][:10])
              assert len(n['benefits'])==1 and len(n['conditions'])==2
              benefit=n['benefits'][0]
              assert benefit['kind']=='earn_points' and benefit['reward_unit']=='TSUM_DLT_loyalty_credit'
              assert benefit['scope']['merchant_tier']==r['details']['tsum_tier']
              assert benefit['value']==r['rates'][0]['value'] and len(benefit['condition_ids'])==2
              out.append(n)
          Path('only-probe/common-tsum.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          Path('only-probe/acceptance.json').write_text(json.dumps({'source_observed_at':b['observed_at'],'tsum_records':len(tsum),'announcements':len(ann),'source_contracts':True,'common_view_contracts':True,'bank_authenticated':False,'provider_credits':0},indent=2))
          paths=['partner_pages.json','partner_pages.py','announcements.py','normalized.py','sources_normalized.json','unified_normalization.py','tsum_alfa.py','tests/test_alfa_public_frontier.py','tests/fixtures_live/tsum-alfa.html','tests/fixtures_live/alfa-simpleprive-post.html']
          Path('only-probe/code_hashes.json').write_text(json.dumps({p:hashlib.sha256((Path('loyalty')/p).read_bytes()).hexdigest() for p in paths},indent=2))
          print(Path('only-probe/acceptance.json').read_text())
          PY
          git rev-parse HEAD > only-probe/commit.txt
      - name: Check source-owned public channel attribution
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from protego import Protego
          sys.path.insert(0,'loyalty')
          from public_transport import robots_document,check_response
          result={'url':'https://t.me/s/AlfaBank?q=aaa_only','linked_channel':'aaa_only','bank_authentication_used':False}
          try:
              s=requests.Session();s.trust_env=False;s.headers['User-Agent']='LoyaltyCatalogResearchBot/1.0'
              r=s.get('https://t.me/robots.txt',timeout=(8,20),allow_redirects=False)
              rules,state=robots_document(r.status_code,r.text);pol=Protego.parse(rules)
              assert pol.can_fetch(result['url'],'LoyaltyCatalogResearchBot')
              r=s.get(result['url'],timeout=(8,20),allow_redirects=False);check_response(r.status_code,r.text)
              soup=BeautifulSoup(r.text,'html.parser');owned=[]
              for msg in soup.select('.tgme_widget_message[data-post]'):
                  if not msg['data-post'].lower().startswith('alfabank/') or msg.select_one('.tgme_widget_message_forwarded_from'):continue
                  caption=msg.select_one('.tgme_widget_message_text')
                  if caption and any(a.get('href','').rstrip('/').lower()=='https://t.me/aaa_only' for a in caption.select('a[href]')):
                      owned.append({'post':msg['data-post'],'text':caption.get_text(' ',strip=True)})
              result['source_owned_links']=owned
              result['http_status']=r.status_code
          except Exception as e:result['error']=type(e).__name__
          Path('only-probe/attribution.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alfa-frontier-live-${{ github.run_id }}
          path: |
            only-probe/
            loyalty-output/
          retention-days: 7
