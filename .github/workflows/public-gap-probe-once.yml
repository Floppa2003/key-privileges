name: Inspect exact remaining public sources
on:
  push:
    branches: ['loyalty/public-gap-completion-20260918']
    paths: [.github/workflows/public-gap-probe-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read only reviewed public pages and preserve sanitized evidence
        run: |
          python - <<'PY'
          import asyncio,hashlib,json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          sys.path.insert(0,'loyalty')
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          from public_transport import PublicSource,check_response
          from free_access_probe import sanitized_page
          targets={
            'alef':'https://coralbonus.ru/klub-privilegii/odezhda-i-aksessuary/alef/',
            'artflora':'https://artflora.ru/blog/vygodnye-pokupki-v-artflora-kak-poluchit-promokody-i-skidki/',
            'litres':'https://www.litres.ru/collections/2-knigi-iz-podborki-v-podarok-i-skidka-20-ot-ekp-i-litres/',
            'elcom':'https://lenobl.ru/ru/dlya-smi/news/96437/',
            'rzd_smart':'https://rzd-bonus.ru/promo/poluchite-4000-ballov-rzhd-bonus-za-oformlenie-programmy-smart-plyus-ot-renessans-zhizn/',
            'rzd_karat':'https://rzd-bonus.ru/promo/500-ballov-rzhd-bonus-za-kazhduyu-noch-prozhivaniya-v-otele-grand-karat-sochi_2026/'
          }
          out=Path('public-gap-probe');out.mkdir();reads=[]
          def now():return datetime.now(timezone.utc).isoformat()
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              for key,url in targets.items():
                item={'key':key,'url':url,'started_at':now()};reads.append(item)
                try:
                  async with PublicSource(browser,url) as source:
                    await source.robots();item['robots']=source.robots_info
                    source.check_url(url)
                    await asyncio.sleep(max(2,source.request_interval))
                    status,raw=await source.navigate(url)
                    item.update(http_status=status,final_url=source.page.url)
                    check_response(status,raw)
                    if source.page.url!=url:raise ValueError('exact_document_location_changed')
                    if len(raw.encode())>6000000:raise ValueError('document_too_large')
                    soup=BeautifulSoup(raw,'html.parser')
                    if not soup.html:raise ValueError('document_missing_html')
                    soup.html['data-loyalty-probe-location']=source.page.url
                    safe,_=sanitized_page(str(soup),url)
                    data=safe.encode();name=key+'.html';(out/name).write_bytes(data)
                    item.update(file=name,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data))
                except Exception as exc:
                  item['error']=str(exc)[:180] if isinstance(exc,(RuntimeError,ValueError)) else type(exc).__name__
                item['finished_at']=now()
                (out/'manifest.json').write_text(json.dumps({'reads':reads},ensure_ascii=False,indent=2))
              await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-gap-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-gap-probe/
          retention-days: 7
