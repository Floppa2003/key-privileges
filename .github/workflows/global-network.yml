name: Independent Globalping network measurements
on:
  push:
    branches: [loyalty/network-feasibility]
    paths: [global-network-probe/**, .github/workflows/global-network.yml]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: python -m unittest discover -s global-network-probe -v
      - run: python global-network-probe/probe.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-network-${{ github.run_id }}
          path: global-output/
          retention-days: 7
