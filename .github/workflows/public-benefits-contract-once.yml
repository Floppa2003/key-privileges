name: One-time public benefits contract check
on:
  push:
    branches: [diagnostics/public-frontier-20260924]
    paths: [.github/workflows/public-benefits-contract-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: npm install --no-audit --no-fund --ignore-scripts typescript@5.8.3
      - name: Summarize original request templates and app references, never credentials
        run: |
          node --input-type=module <<'JS'
          import ts from 'typescript';
          import {createHash} from 'node:crypto';
          const out={started_at:new Date().toISOString(),source_account_used:false,credentials_used:false,api_requests:0,client_executed:false};
          const root='https://marketplace.konsierge.com/static/js/main.959cee1e.js';
          async function read(url,max){const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(30000),headers:{'User-Agent':'PublicLoyaltyResearch/1.0'}});if(r.status!==200||r.headers.has('Retry-After'))throw Error('source_unavailable');let len=0,parts=[];for await(const p of r.body){len+=p.length;if(len>max)throw Error('size_bound');parts.push(p);}return Buffer.concat(parts);}
          function safeFragment(s){if(typeof s!=='string')return '[expression]';if(s.length<200&&/^[?&=/:._ a-zA-Z0-9-]*$/.test(s)&&!/[A-Za-z0-9_-]{35,}/.test(s)&&(!/key|secret|token|password/i.test(s))&&(s===''||s==='Basic '||s==='Bearer '||/client|api|benefit|rubric|tariff|lang|page|per|^\//i.test(s)))return s;return '[literal withheld]';}
          try{
            const binary=await read(root,4000000);out.bundle_sha256=createHash('sha256').update(binary).digest('hex');
            if(out.bundle_sha256!=='7dc923347de9b832bfbaa97bdcfa5391ea37fb6217aca295e174ee20bbedab2c')throw Error('bundle_changed');
            const raw=await read(root+'.map',22000000);out.map_sha256=createHash('sha256').update(raw).digest('hex');if(out.map_sha256!=='1a7a0f61ce38c238094b8a2525c282e1b115d27d8af165ff3568dbaa1d353bf9')throw Error('map_changed');const map=JSON.parse(raw.toString('utf8'));out.contracts=[];out.references=[];
            function symbolic(n){if(ts.isIdentifier(n))return '{'+n.text+'}';if(ts.isStringLiteral(n)||ts.isNoSubstitutionTemplateLiteral(n))return safeFragment(n.text);if(ts.isTemplateExpression(n))return safeFragment(n.head.text)+n.templateSpans.map(s=>symbolic(s.expression)+safeFragment(s.literal.text)).join('');if(ts.isBinaryExpression(n)&&n.operatorToken.kind===ts.SyntaxKind.PlusToken)return symbolic(n.left)+symbolic(n.right);return '[expression]';}
            for(let i=0;i<map.sources.length;i++){
              const name=map.sources[i],code=map.sourcesContent[i];if(name.includes('node_modules')||typeof code!=='string')continue;
              const ast=ts.createSourceFile(name,code,ts.ScriptTarget.Latest,true,name.endsWith('tsx')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
              const symbols=['getBenefitsAction','getRubricsAction','setBenefitsPageAction'];const relevant=symbols.filter(s=>code.includes(s));
              if(relevant.length)out.references.push({path:name,symbols:relevant});
              if(/^actions\/Benefits\//.test(name)){
                const templates=[],auth=[],network=[];
                function visit(n){if(ts.isVariableDeclaration(n)&&n.name.getText(ast)==='query'&&n.initializer)templates.push(symbolic(n.initializer));if(ts.isCallExpression(n)&&ts.isPropertyAccessExpression(n.expression)&&n.expression.name.text==='auth')auth.push(n.arguments.map(symbolic));if(ts.isCallExpression(n)&&ts.isIdentifier(n.expression)&&n.expression.text==='fetcher')network.push(n.arguments.map(symbolic));ts.forEachChild(n,visit);}visit(ast);out.contracts.push({path:name,query_templates:templates,fetcher_arguments:network,auth_arguments:auth});
              }
              if(name.endsWith('.tsx')&&(/Benefits|benefits|rubrics/.test(code))){const imported=[];function scan(n){if(ts.isImportDeclaration(n)&&/Benefits|benefits|rubrics/.test(n.moduleSpecifier.text))imported.push(n.moduleSpecifier.text);ts.forEachChild(n,scan);}scan(ast);if(imported.length)out.references.push({path:name,imports:imported});}
            }
            out.compiled_symbol_occurrences=Object.fromEntries(['getBenefitsAction','getRubricsAction'].map(s=>[s,binary.toString('utf8').split(s).length-1]));out.outcome='static_contract_and_reference_check_complete';out.caveat='Original source can contain tree-shaken code; this is not live server access or complete runtime reachability proof.';
          }catch(e){out.outcome='incomplete';out.error=/^[a-z_]+$/.test(e.message)?e.message:e.name;}
          out.finished_at=new Date().toISOString();console.log('BENEFITS_CONTRACT_BEGIN');console.log(JSON.stringify(out));console.log('BENEFITS_CONTRACT_END');
          JS
