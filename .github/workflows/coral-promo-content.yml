name: Coral promo exact public content confirmation
on:
  push:
    branches: ["diagnostics/seven-routes-transport-20260915"]
    paths: ["diagnostics/coral_promo_content.py", ".github/workflows/coral-promo-content.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read exact source with unchanged normal transport
        env:
          REPLICA: ${{ matrix.replica }}
        run: timeout --signal=TERM --kill-after=5s 150s python diagnostics/coral_promo_content.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coral-content-${{ matrix.replica }}-${{ github.run_id }}
          path: coral-promo-content-output/
          if-no-files-found: error
          retention-days: 7
