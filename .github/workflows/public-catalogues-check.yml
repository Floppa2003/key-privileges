name: Verify new public partner catalogues
on:
  push:
    branches: ["loyalty/public-catalogues-release-20260923"]
    paths: ["loyalty/**", "diagnostics/catalogue-last-fixes.patch", ".github/workflows/public-catalogues-check.yml"]
permissions:
  contents: read
concurrency:
  group: public-catalogues-check
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Floppa2003/key-privileges' && github.ref == 'refs/heads/loyalty/public-catalogues-release-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: loyalty/public-catalogues-release-20260923
      - id: apply
        name: Apply only the reviewed final patch on this feature branch
        run: |
          patch=diagnostics/catalogue-last-fixes.patch
          if git apply --check "$patch"; then
            git apply "$patch"
            git add loyalty
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply final reviewed catalogue correction [skip ci]'
            git push origin HEAD:refs/heads/loyalty/public-catalogues-release-20260923
          else
            git apply --reverse --check "$patch"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: integrate
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.integrate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Full real dependency regression
        run: |
          set -o pipefail
          mkdir -p public-catalogues-check
          python -m unittest discover -s loyalty/tests -v 2>&1 | tee public-catalogues-check/python-tests.log
          node --test key/refresh.test.mjs | tee public-catalogues-check/key-tests.log
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: python -m playwright install --with-deps chromium
      - name: Collect all four selected public sources with production entry point
        run: xvfb-run -a python loyalty/collect_normalized.py --limit 500 --sources x5_partners_public,magnit_partners_public,gorod_public,tsvetnoy_public --out public-catalogues-check/source
      - name: Verify payload and source completeness separately
        if: always()
        run: |
          if test -f public-catalogues-check/source/normalized.json; then
            python loyalty/sheets_normalized.py --input public-catalogues-check/source/normalized.json
            python loyalty/source_lifecycle.py --input public-catalogues-check/source/normalized.json --sources x5_partners_public,magnit_partners_public,gorod_public,tsvetnoy_public
          fi
      - name: Save exact reviewed public code and pinned local test dependency
        if: always()
        run: |
          mkdir -p public-catalogues-check
          git rev-parse HEAD > public-catalogues-check/revision.txt
          tar --exclude='__pycache__' -cf public-catalogues-check/code.tar loyalty key .github diagnostics
          python -m pip download --no-deps protego==0.6.2 -d public-catalogues-check/deps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-catalogues-check-${{ github.run_id }}
          path: public-catalogues-check/
          retention-days: 1
          if-no-files-found: error
