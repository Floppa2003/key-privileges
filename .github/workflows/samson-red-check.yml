name: Reproduce omitted pharmacy rules
on:
  push:
    branches: ['loyalty/samson-linked-20260918']
    paths: [.github/workflows/samson-red-check.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r loyalty/requirements.txt
      - name: Exercise actual collector with controlled public HTTP responses
        run: |
          mkdir -p samson-red
          set -o pipefail
          python -m unittest discover -s loyalty/tests -p test_samson_linked_rules.py -v 2>&1 | tee samson-red/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: samson-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: samson-red/
          retention-days: 7
