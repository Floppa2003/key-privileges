name: Kilo Qwen free one-shot JSON control
on:
  push:
    branches: [loyalty/general-merchant-research-20260925]
    paths: [.github/workflows/merchant-kilo-qwen-json.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: merchant-kilo-qwen-json
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing pinned test dependencies
        run: python -m pip install -r loyalty/requirements.txt Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
      - name: All regression suites, without model calls or provider secrets
        run: |
          set -uo pipefail
          mkdir -p regression-output
          git rev-parse HEAD > regression-output/commit.txt
          export PYTHONPATH="$GITHUB_WORKSPACE/loyalty/experiments/local_visual:$GITHUB_WORKSPACE/loyalty/experiments/simple_thinking"
          status=0
          for dir in loyalty/tests loyalty/experiments/prompt_ab loyalty/experiments/local_visual loyalty/experiments/resolution loyalty/experiments/simple_thinking loyalty/experiments/direct_think_json loyalty/experiments/cloud_json; do
            name=$(basename "$dir")
            if ! python -m unittest discover -s "$dir" -p 'test_*.py' -v > "regression-output/$name.log" 2>&1; then status=1; fi
          done
          if ! node --test key/refresh.test.mjs > regression-output/key.log 2>&1; then status=1; fi
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kilo-qwen-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: regression-output/
          retention-days: 14
  compare:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        provider: [kilo]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact experiment code
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p output/code
          git rev-parse HEAD > output/commit.txt
          cp loyalty/experiments/cloud_json/* output/code/
          cp loyalty/experiments/direct_think_json/direct_sampling.py loyalty/experiments/simple_thinking/plan.json loyalty/experiments/simple_thinking/probe.py output/code/
          cp loyalty/experiments/prompt_ab/practical_schema.json loyalty/experiments/prompt_ab/prompt_ab.py loyalty/experiments/local_visual/run_cpu.py loyalty/experiments/resolution/benchmark.py output/code/
          cp .github/workflows/merchant-kilo-qwen-json.yml output/workflow.yml
          python -m pip install requests==2.32.5 Pillow==12.3.0 PyMuPDF==1.26.7 jsonschema==4.26.0 psutil==7.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: '11092173951'
          github-token: ${{ github.token }}
          path: sources/muzcomedy
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: '11092462751'
          github-token: ${{ github.token }}
          path: sources/nevsky
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: '11092615920'
          github-token: ${{ github.token }}
          path: sources/rzd_museum
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Floppa2003/key-privileges
          run-id: '36705324742'
          artifact-ids: '11092032661'
          github-token: ${{ github.token }}
          path: sources/lavka
          merge-multiple: true
      - name: Bounded cloud calls with secrets only in this step
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          set -euo pipefail
          python loyalty/experiments/cloud_json/cloud_probe.py --provider kilo --model 'qwen/qwen3.8-27b:free' --source sources --out output/results > output/inference.log 2>&1
      - name: Hash artifacts without credentials
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('output'); root.mkdir(exist_ok=True)
          hashes = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(root.rglob('*')) if p.is_file()}
          (root / 'SHA256SUMS.json').write_text(json.dumps(hashes, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kilo-qwen-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 14
